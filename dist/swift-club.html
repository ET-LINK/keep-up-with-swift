evolution/blob/main/proposals/0530-async-result-support.md","title":"Async Result Support"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"func download() async throws -> Int { 512 }\n\nlet result = await Result { try await download() }\nswitch result {\ncase .success(let size): print(\"Downloaded \\(size) KB\")\ncase .failure(let error): print(\"Failed:\", error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Downloaded 512 KB","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"trivially-identical","release":"6.4","since":"6.4","title":"\u003ccode>isTriviallyIdentical(to:)\u003c/code>: tell in constant time whether it's “the same storage”","plainTitle":"isTriviallyIdentical(to:): tell in constant time whether it's “the same storage”","en":"","line":4,"level":"brief","short":"Fast identity","tags":"isTriviallyIdentical identical equality performance copy-on-write COW memoize cache","tldr":"\u003ccode>Array\u003c/code>, \u003ccode>String\u003c/code>, \u003ccode>Dictionary\u003c/code>, and other types gain \u003ccode>isTriviallyIdentical(to:)\u003c/code>: it only checks whether the underlying storage is the same one, in O(1). \u003ccode>true\u003c/code> guarantees they are equal; \u003ccode>false\u003c/code> guarantees nothing.","flag":"","se":[{"id":"SE-0494","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0494-add-is-identical-methods.md","title":"Add `isTriviallyIdentical(to:)` Methods for Quick Comparisons to Concrete Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let a = Array(1...100_000)\nlet b = a              // copy-on-write: shares the same storage as a\nvar c = a\nc[0] = 0               // after the mutation, c has its own storage\n\nprint(a.isTriviallyIdentical(to: b))    // true, constant time\nprint(a.isTriviallyIdentical(to: c))    // false","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true\nfalse","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"A typical use is the fast path for caching and UI refreshes: when the input is “obviously unchanged”, reuse the last result, and otherwise fall back to the full \u003ccode>==\u003c/code> comparison."}]},{"id":"observation-tracking","release":"6.4","since":"6.4","title":"Advanced observation tracking: \u003ccode>willSet\u003c/code>, \u003ccode>didSet\u003c/code>, and continuous tracking","plainTitle":"Advanced observation tracking: willSet, didSet, and continuous tracking","en":"","line":4,"level":"brief","short":"Observation options","tags":"Observation withObservationTracking options willSet didSet deinit continuous","tldr":"\u003ccode>withObservationTracking\u003c/code> gains an \u003ccode>options:\u003c/code> parameter, letting you choose to be notified before a property changes, after it changes, or when the object is destroyed; the new \u003ccode>withContinuousObservationTracking\u003c/code> re-registers automatically and keeps receiving changes.","flag":"","se":[{"id":"SE-0506","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0506-advanced-observation-tracking.md","title":"Advanced Observation Tracking"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Observation\n\n@Observable\nfinal class Player {\n    var hp = 100\n}\n\nlet player = Player()\nwithObservationTracking(options: [.willSet, .didSet]) {\n    _ = player.hp\n} onChange: { event in\n    print(event.kind == .willSet ? \"About to change\" : \"Changed\", \"hp\")\n}\nplayer.hp = 90","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"About to change hp\nChanged hp","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"stdlib-64","release":"6.4","since":"6.4","title":"More Hashable types, and \u003ccode>demangle\u003c/code>","plainTitle":"More Hashable types, and demangle","en":"","line":4,"level":"brief","short":"Hashable·demangle","tags":"Hashable Dictionary.Keys CollectionOfOne EmptyCollection demangle Runtime symbol","tldr":"\u003ccode>Dictionary.Keys\u003c/code> and \u003ccode>EmptyCollection\u003c/code> become \u003ccode>Hashable\u003c/code>, and \u003ccode>CollectionOfOne\u003c/code> conditionally conforms to \u003ccode>Equatable\u003c/code>/\u003ccode>Hashable\u003c/code>; the new \u003ccode>Runtime\u003c/code> module provides \u003ccode>demangle\u003c/code>, which turns compiled symbol names back into human-readable form.","flag":"","se":[{"id":"SE-0514","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0514-hashable-conformance-for-dictionarykeys-collectionofone-emptycollection.md","title":"`Hashable` Conformance for `Dictionary.Keys`, `CollectionOfOne` and `EmptyCollection`"},{"id":"SE-0498","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0498-runtime-demangle.md","title":"Expose demangle function in Runtime module"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Runtime\n\nlet keys = [\"a\": 1, \"b\": 2].keys\nlet seen: Set = [keys]                     // Dictionary.Keys can now go into a Set\nprint(seen.count)\n\nprint(try demangle(\"$sSaySiGD\"))           // turn the symbol name back into a readable type","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1\nSwift.Array\u003cSwift.Int>","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"swift-build","release":"6.4","since":"6.4","title":"Swift Build becomes the default build system, and can generate SBOMs","plainTitle":"Swift Build becomes the default build system, and can generate SBOMs","en":"","line":6,"level":"brief","short":"Swift Build","tags":"Swift Build SwiftPM build system SBOM software bill of materials CycloneDX SPDX supply chain","tldr":"SwiftPM now uses Swift Build as its default build backend, behaving the same on macOS, Linux, Windows, and in every editor; \u003ccode>swift build --sbom-spec\u003c/code> generates a software bill of materials in CycloneDX or SPDX format.","flag":"","se":[{"id":"SE-0509","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0509-swift-sboms-via-swiftpm.md","title":"Software Bill of Materials (SBOM) Generation for Swift Package Manager"}],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# generate a software bill of materials (SBOM) while building\nswift build --sbom-spec cyclonedx\nswift build --sbom-spec spdx","hl":"","check":"none"},{"type":"p","html":"Around the same time, the VS Code Swift extension was published on Open VSX, so VS Code–based editors such as Cursor can install it too; the extension also hooks into swiftly, making it easy to switch toolchain versions per project. Debug info now records module dependencies precisely, so debug builds and dSYMs on Linux and Windows got much smaller."}]},{"id":"testing-64","release":"6.4","since":"6.4","title":"Swift Testing and XCTest interoperability","plainTitle":"Swift Testing and XCTest interoperability","en":"","line":6,"level":"brief","short":"XCTest interop","tags":"Swift Testing XCTest migration XCTAssert #expect mix interop","tldr":"You can use \u003ccode>XCTAssert\u003c/code> in a Swift Testing test, and \u003ccode>#expect\u003c/code> in an XCTest test, so migrating old tests doesn't have to happen all at once.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\nimport XCTest\n\n@Test func newStyle() {\n    XCTAssertEqual(1 + 1, 2)            // using XCTAssert inside Swift Testing\n}\n\nfinal class LegacyTests: XCTestCase {\n    func testOldStyle() {\n        #expect(2 * 2 == 4)            // using #expect inside XCTest\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}},{"type":"p","html":"Also added: \u003ccode>CustomTestReflectable\u003c/code> (customize which values are shown when an assertion fails), repeating specified tests with \u003ccode>swift test\u003c/code>, and attachments that can conform to \u003ccode>Transferable\u003c/code> on Apple platforms."}]},{"id":"subprocess","release":"6.4","since":"6.4","title":"Subprocess 1.0","plainTitle":"Subprocess 1.0","en":"","line":4,"level":"brief","short":"Subprocess","tags":"Subprocess Process child process command line shell script async","tldr":"The cross-platform child-process package Subprocess reaches 1.0. Built on Swift concurrency, it makes launching external programs, reading their output, and long-running streaming interaction pleasant, so you can say goodbye to wiring up \u003ccode>Process\u003c/code> and pipes by hand.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Requires adding the swift-subprocess dependency in Package.swift","code":"import Subprocess\n\nlet result = try await Subprocess.run(\n    .name(\"ls\"),\n    arguments: [\"-la\"],\n    output: .string(limit: 4096)\n)\nprint(result.standardOutput)","hl":"","check":"none"}]},{"id":"interop-64","release":"6.4","since":"6.4","title":"Interop: C++ \u003ccode>std::span\u003c/code>, Java, WebAssembly, and Android","plainTitle":"Interop: C++ std::span, Java, WebAssembly, and Android","en":"","line":5,"level":"brief","short":"Interop","tags":"C++ std::span Java Kotlin WebAssembly Wasm JavaScriptKit Android NDK","tldr":"\u003ccode>Span\u003c/code> bridges both ways with C++20's \u003ccode>std::span\u003c/code>; Java can call Swift's async and throwing functions; JavaScriptKit's safe bridging in WebAssembly is up to 40× faster; and the Android SDK is built on an LTS NDK and can target Android directly through Swift Build.","flag":"","se":[],"links":[],"blocks":[{"type":"p","html":"What these improvements have in common is “less glue code”: when you cross a language boundary, you no longer convert between \u003ccode>std::span\u003c/code> and pointers by hand, or write callback wrappers on the Java side."}]},{"id":"embedded-64","release":"6.4","since":"6.4","title":"Embedded Swift: support for existentials \u003ccode>any\u003c/code>","plainTitle":"Embedded Swift: support for existentials any","en":"","line":5,"level":"brief","short":"Embedded","tags":"Embedded microcontroller existential any Error heterogeneous collection firmware","tldr":"Embedded Swift widens its support for existential types such as \u003ccode>any Protocol\u003c/code>, so heterogeneous collections work and you can throw and catch an arbitrary \u003ccode>Error\u003c/code>; the new \u003ccode>EmbeddedRestrictions\u003c/code> diagnostic group can be turned on for a whole target.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":".target(\n    name: \"FirmwareCore\",\n    swiftSettings: [\n        .treatWarning(\"EmbeddedRestrictions\", as: .warning)\n    ]\n)","hl":"","file":"Package.swift","check":"none"}]}],"challenges":[{"id":"ch-detached","title":"Hand the counter to a background task, then modify it yourself too","topic":"Swift 6 language mode","related":"swift6-mode","flags":"-swift-version 6","code":"final class Counter { var value = 0 }\n\nfunc race() {\n    let counter = Counter()\n    Task.detached { counter.value += 1 }\n    counter.value += 1\n}","answer":"error","diagnostics":"main.swift:5:10: error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n3 | func race() {\n4 |     let counter = Counter()\n5 |     Task.detached { counter.value += 1 }\n  |          |- error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n  |          `- note: Passing value of non-Sendable type '() async -> ()' as a 'sending' argument to static method 'detached(name:priority:operation:)' risks causing races in between local and caller code\n6 |     counter.value += 1\n  |     `- note: access can happen concurrently\n7 | }\n8 | \n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","explain":"The non-\u003ccode>Sendable\u003c/code> \u003ccode>counter\u003c/code> is handed to \u003ccode>Task.detached\u003c/code>, and then the current thread touches it again. The two accesses can happen at the same time, which is a data race. In Swift 6 mode that is a \u003cstrong>compile error\u003c/strong>."},{"id":"ch-region","title":"Create an object, hand it to a background task, and never touch it again","topic":"Region-based isolation","related":"region-sending","flags":"-swift-version 6","code":"final class Log { var lines: [String] = [] }\n\nfunc start() {\n    let log = Log()\n    log.lines.append(\"start\")\n    Task.detached { log.lines.append(\"background\") }\n}","answer":"ok","diagnostics":"","explain":"Region-based isolation (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md\" target=\"_blank\" rel=\"noopener\">SE-0414\u003c/a>) can prove that the whole region containing \u003ccode>log\u003c/code> was handed off and is never accessed afterwards, so even though \u003ccode>Log\u003c/code> is not \u003ccode>Sendable\u003c/code>, this \u003cstrong>compiles safely\u003c/strong>."},{"id":"ch-static-var","title":"An ordinary static variable","topic":"Global mutable state","related":"swift6-mode","flags":"-swift-version 6","code":"struct AppConfig {\n    static var shared = AppConfig()\n    var debug = false\n}","answer":"error","diagnostics":"main.swift:2:16: error: static property 'shared' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n1 | struct AppConfig {\n2 |     static var shared = AppConfig()\n  |                |- error: static property 'shared' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n  |                |- note: convert 'shared' to a 'let' constant to make 'Sendable' shared state immutable\n  |                |- note: add '@MainActor' to make static property 'shared' part of global actor 'MainActor'\n  |                `- note: disable concurrency-safety checks if accesses are protected by an external synchronization mechanism\n3 |     var debug = false\n4 | }\n\n[#MutableGlobalVariable]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/mutable-global-variable>","explain":"\u003ccode>static var\u003c/code> is global mutable state that any thread can read and write. Swift 6 mode asks you to say how it is kept safe: with \u003ccode>let\u003c/code>, with a global actor such as \u003ccode>@MainActor\u003c/code>, or with \u003ccode>nonisolated(unsafe)\u003c/code>."},{"id":"ch-typed-throws","title":"Typed throws, with no catch-all in the catch","topic":"Typed throws","related":"typed-throws","flags":"-swift-version 6","code":"enum NetworkError: Error { case offline, timeout }\n\nfunc ping() throws(NetworkError) { throw .timeout }\n\nfunc check() {\n    do {\n        try ping()\n    } catch {\n        switch error {\n        case .offline: print(\"offline\")\n        case .timeout: print(\"timeout\")\n        }\n    }\n}","answer":"ok","diagnostics":"","explain":"Because the function declares \u003ccode>throws(NetworkError)\u003c/code>, the static type of \u003ccode>error\u003c/code> in the \u003ccode>catch\u003c/code> is \u003ccode>NetworkError\u003c/code>, and the \u003ccode>switch\u003c/code> covers both cases. That is perfectly legal and needs no extra \u003ccode>catch\u003c/code> branch."},{"id":"ch-consume-twice","title":"Using a noncopyable value twice","topic":"~Copyable","related":"noncopyable-generics","flags":"-swift-version 6","code":"struct Envelope: ~Copyable {\n    consuming func seal() {}\n}\n\nfunc send() {\n    let envelope = Envelope()\n    envelope.seal()\n    envelope.seal()\n}","answer":"error","diagnostics":"main.swift:6:9: error: 'envelope' consumed more than once\n 4 | \n 5 | func send() {\n 6 |     let envelope = Envelope()\n   |         `- error: 'envelope' consumed more than once\n 7 |     envelope.seal()\n   |     `- note: consumed here\n 8 |     envelope.seal()\n   |     `- note: consumed again here\n 9 | }\n10 |","explain":"\u003ccode>seal()\u003c/code> is \u003ccode>consuming\u003c/code>: the first call takes ownership of \u003ccode>envelope\u003c/code>. By the second call it no longer exists, and the compiler reports “consumed more than once”."},{"id":"ch-inline-append","title":"Appending an element to an InlineArray","topic":"InlineArray","related":"inlinearray","flags":"-swift-version 6","code":"func grow() {\n    var rgb: [3 of UInt8] = [255, 128, 0]\n    rgb.append(64)\n}","answer":"error","diagnostics":"main.swift:3:9: error: value of type '[3 of UInt8]' has no member 'append'\n1 | func grow() {\n2 |     var rgb: [3 of UInt8] = [255, 128, 0]\n3 |     rgb.append(64)\n  |         `- error: value of type '[3 of UInt8]' has no member 'append'\n4 | }\n5 |","explain":"An \u003ccode>InlineArray\u003c/code>'s length is part of its type (3 here), so it simply has no \u003ccode>append\u003c/code> method. If you need a variable length, use \u003ccode>Array\u003c/code> or 6.4's \u003ccode>UniqueArray\u003c/code>."},{"id":"ch-trailing-call","title":"A comma after the last argument of a function call","topic":"Trailing commas","related":"trailing-commas","flags":"-swift-version 6","code":"func greet(_ name: String, times: Int) -> String {\n    String(repeating: \"Hello, \\(name)! \", count: times)\n}\n\nlet text = greet(\n    \"Swift\",\n    times: 2,\n)","answer":"ok","diagnostics":"","explain":"Since Swift 6.1 (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0439-trailing-comma-lists.md\" target=\"_blank\" rel=\"noopener\">SE-0439\u003c/a>), parameter lists, argument lists, tuples, generic parameter lists, and capture lists all allow a trailing comma."},{"id":"ch-trailing-if","title":"A comma at the end of an if condition list","topic":"Trailing commas","related":"trailing-commas","flags":"-swift-version 6","code":"func check(_ a: Bool, _ b: Bool) {\n    if a, b, {\n        print(\"both true\")\n    }\n}","answer":"error","diagnostics":"main.swift:4:6: error: expected '{' after 'if' condition\n2 |     if a, b, {\n3 |         print(\"both true\")\n4 |     }\n  |      `- error: expected '{' after 'if' condition\n5 | }\n6 | \n\nmain.swift:2:14: error: function produces expected type 'Bool'; did you mean to call it with '()'?\n1 | func check(_ a: Bool, _ b: Bool) {\n2 |     if a, b, {\n  |              `- error: function produces expected type 'Bool'; did you mean to call it with '()'?\n3 |         print(\"both true\")\n4 |     }\n\nmain.swift:3:9: error: cannot convert value of type '()' to closure result type 'Bool'\n1 | func check(_ a: Bool, _ b: Bool) {\n2 |     if a, b, {\n3 |         print(\"both true\")\n  |         `- error: cannot convert value of type '()' to closure result type 'Bool'\n4 |     }\n5 | }","explain":"Condition lists are the exception \u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0439-trailing-comma-lists.md\" target=\"_blank\" rel=\"noopener\">SE-0439\u003c/a> explicitly excludes: the last comma in \u003ccode>if a, b, {\u003c/code> makes the compiler treat \u003ccode>{\u003c/code> as the start of another condition, so it is still a syntax error."},{"id":"ch-weak-let","title":"A weak let in a Sendable class","topic":"weak let","related":"weak-let","flags":"-swift-version 6","code":"final class Comment: Sendable {\n    weak let replyTo: Comment?\n    init(replyTo: Comment?) { self.replyTo = replyTo }\n}","answer":"ok","diagnostics":"","explain":"Since Swift 6.3, \u003ccode>weak let\u003c/code> is a legal immutable weak reference. It cannot be reassigned, so it cannot cause a data race, and the class can safely be \u003ccode>Sendable\u003c/code>. With \u003ccode>weak var\u003c/code> you would get an error."},{"id":"ch-mainactor-eq","title":"A main-actor class conforming directly to Equatable","topic":"Isolated conformances","related":"isolated-conformances","flags":"-swift-version 6","code":"@MainActor\nfinal class Song: Equatable {\n    var title = \"\"\n    static func == (a: Song, b: Song) -> Bool { a.title == b.title }\n}","answer":"error","diagnostics":"main.swift:2:19: error: conformance of 'Song' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n1 | @MainActor\n2 | final class Song: Equatable {\n  |                   |- error: conformance of 'Song' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n  |                   |- note: isolate this conformance to the main actor with '@MainActor'\n  |                   `- note: turn data races into runtime errors with '@preconcurrency'\n3 |     var title = \"\"\n4 |     static func == (a: Song, b: Song) -> Bool { a.title == b.title }\n  |                 |- note: main actor-isolated operator function '==' cannot satisfy nonisolated requirement\n  |                 `- note: mark operator function '==' 'nonisolated'\n5 | }\n6 | \n\n[#ConformanceIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/conformance-isolation>","explain":"\u003ccode>Equatable\u003c/code>'s \u003ccode>==\u003c/code> is a nonisolated requirement, while this class's \u003ccode>==\u003c/code> is inferred to be main-actor isolated, so the two do not match. The fix is to write \u003ccode>@MainActor Equatable\u003c/code> (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0470-isolated-conformances.md\" target=\"_blank\" rel=\"noopener\">SE-0470\u003c/a>), or to turn on \u003ccode>InferIsolatedConformances\u003c/code> so the compiler infers it."},{"id":"ch-nonsending","title":"Main actor calling an async method on a non-Sendable object, with NonisolatedNonsendingByDefault on","topic":"nonisolated(nonsending)","related":"nonsending","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","code":"final class Store {\n    var saved = 0\n    func save() async { saved += 1 }\n}\n\n@MainActor\nfinal class Screen {\n    let store = Store()\n    func tap() async { await store.save() }\n}","answer":"ok","diagnostics":"","explain":"With it on, \u003ccode>Store.save()\u003c/code> runs on the caller (the main actor) and \u003ccode>store\u003c/code> never crosses an isolation boundary, so it \u003cstrong>compiles\u003c/strong>. Without this upcoming feature, the same code reports “sending 'self.store' risks causing data races”."},{"id":"ch-interp","title":"Using ?? to give an Int? a string default","topic":"String interpolation defaults","related":"interp-default","flags":"-swift-version 6","code":"func describe(_ age: Int?) -> String {\n    \"Age: \\(age ?? \"unknown\")\"\n}","answer":"error","diagnostics":"main.swift:2:13: error: cannot convert value of type 'Int?' to expected argument type 'String?'\n1 | func describe(_ age: Int?) -> String {\n2 |     \"Age: \\(age ?? \"unknown\")\"\n  |             `- error: cannot convert value of type 'Int?' to expected argument type 'String?'\n3 | }\n4 |","explain":"Both sides must have the same type. The left of \u003ccode>??\u003c/code> is \u003ccode>Int?\u003c/code> but the right is a string, hence the error. The Swift 6.2 way is \u003ccode>&quot;\\(age, default: &quot;unknown&quot;)&quot;\u003c/code>, where the default can be a literal of any type."},{"id":"ch-raw-id","title":"An enum case that starts with a digit","topic":"Raw identifiers","related":"raw-identifiers","flags":"-swift-version 6","code":"enum Resolution {\n    case `720p`, `1080p`, `4K`\n}\n\nlet best = Resolution.`4K`","answer":"ok","diagnostics":"","explain":"Raw identifiers in Swift 6.2 (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0451-escaped-identifiers.md\" target=\"_blank\" rel=\"noopener\">SE-0451\u003c/a>) allow spaces and punctuation inside backticks, and even a leading digit. You use them with backticks too: \u003ccode>Resolution.`4K`\u003c/code>."},{"id":"ch-task-unused","title":"Creating a throwing Task but not keeping it","topic":"Task warnings","related":"task-unused","flags":"-swift-version 6","code":"struct SyncError: Error {}\nfunc sync() async throws { throw SyncError() }\n\nfunc onLaunch() {\n    Task { try await sync() }\n}","answer":"warning","diagnostics":"main.swift:5:5: warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n3 | \n4 | func onLaunch() {\n5 |     Task { try await sync() }\n  |     |- warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n  |     `- note: to silence this warning, handle the error inside the task, or store/discard the task value explicitly\n6 | }\n7 | \n\n[#NoUseUnstructuredThrowingTask]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/no-use-throwing-unstructured-task>","explain":"Swift 6.4 (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0520-discardableresult-task-initializers.md\" target=\"_blank\" rel=\"noopener\">SE-0520\u003c/a>) emits a \u003cstrong>warning\u003c/strong> for an unstructured task that can throw but whose result nobody uses, because the error is silently swallowed. Handle the error inside the task, or write \u003ccode>_ = Task { … }\u003c/code> to discard it explicitly."},{"id":"ch-defer-await","title":"await inside a defer in a synchronous function","topic":"async defer","related":"async-defer","flags":"-swift-version 6","code":"func flush() async {}\n\nfunc close() {\n    defer { await flush() }\n    print(\"closing\")\n}","answer":"error","diagnostics":"main.swift:4:5: error: 'async' defer must appear within an 'async' context\n2 | \n3 | func close() {\n4 |     defer { await flush() }\n  |     `- error: 'async' defer must appear within an 'async' context\n5 |     print(\"closing\")\n6 | }","explain":"6.4 allows \u003ccode>await\u003c/code> inside \u003ccode>defer\u003c/code> as long as the enclosing function is itself \u003ccode>async\u003c/code>. A synchronous function cannot suspend, so this is still an error."},{"id":"ch-some-optional","title":"Returning some Shape? without parentheses","topic":"some P?","related":"optional-some","flags":"-swift-version 6","code":"protocol Shape {}\nstruct Dot: Shape {}\n\nfunc maybeShape(_ show: Bool) -> some Shape? {\n    show ? Dot() : nil\n}","answer":"ok","diagnostics":"","explain":"From Swift 6.4 (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0521-improved-optional-opaque-and-any.md\" target=\"_blank\" rel=\"noopener\">SE-0521\u003c/a>), \u003ccode>some P?\u003c/code> is equivalent to \u003ccode>(some P)?\u003c/code>, and \u003ccode>any P?\u003c/code> is equivalent to \u003ccode>(any P)?\u003c/code>."},{"id":"ch-diagnose","title":"Calling a deprecated API inside @diagnose(…, as: ignored)","topic":"@diagnose","related":"diagnose","flags":"-swift-version 6","code":"@available(*, deprecated)\nfunc legacy() {}\n\n@diagnose(DeprecatedDeclaration, as: ignored)\nfunc bridge() {\n    legacy()\n}","answer":"ok","diagnostics":"","explain":"\u003ccode>@diagnose(DeprecatedDeclaration, as: ignored)\u003c/code> silences the “deprecated” warning inside this function entirely, so there is neither an error nor a warning."}],"labs":{"concurrency-classic":{"id":"concurrency-classic","title":"Old rule (default in 6.0 / 6.1)","note":"A \u003ccode>nonisolated async\u003c/code> function always hops to the global concurrent pool.","cmp":"A non-Sendable \u003ccode>api\u003c/code> gets carried over to another thread","flags":"-swift-version 6","code":"final class APIClient {\n    func fetch() async -> String {\n        let raw = await download()        // ③\n        return parse(raw)                 // ④\n    }\n    func download() async -> [UInt8] { Array(\"Swift\".utf8) }\n    func parse(_ raw: [UInt8]) -> String { String(decoding: raw, as: UTF8.self) }\n}\n\n@MainActor\nfinal class ProfileModel {\n    var name = \"\"\n    let api = APIClient()\n\n    func refresh() async {\n        name = \"Loading…\"                 // ①\n        let result = await api.fetch()    // ②\n        name = result                     // ⑤\n    }\n}","result":{"status":"error","diagnostics":"main.swift:17:32: error: sending 'self.api' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n15 |     func refresh() async {\n16 |         name = \"Loading…\"                 // ①\n17 |         let result = await api.fetch()    // ②\n   |                                |- error: sending 'self.api' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |                                `- note: sending main actor-isolated 'self.api' to @concurrent instance method 'fetch()' risks causing data races between @concurrent and main actor-isolated uses\n18 |         name = result                     // ⑤\n19 |     }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"},"steps":[{"lane":"main","mark":"①","text":"Runs \u003ccode>name = &quot;Loading…&quot;\u003c/code> on the main actor"},{"lane":"out","mark":"②","text":"Calls \u003ccode>api.fetch()\u003c/code>: it is \u003ccode>nonisolated async\u003c/code>, so under the old rule it \u003cstrong>leaves the main actor\u003c/strong> and hops to the global concurrent pool"},{"lane":"pool","mark":"③","text":"\u003ccode>download()\u003c/code> also starts on the pool; while it waits for the network it suspends and holds no thread"},{"lane":"pool","mark":"④","text":"\u003ccode>parse(raw)\u003c/code> runs on the pool"},{"lane":"in","mark":"⑤","text":"The result comes back and execution \u003cstrong>hops back\u003c/strong> to the main actor"},{"lane":"main","mark":"⑤","text":"\u003ccode>name = result\u003c/code>"}]},"concurrency-nonsending":{"id":"concurrency-nonsending","title":"New rule: nonsending (from 6.2)","note":"With \u003ccode>NonisolatedNonsendingByDefault\u003c/code> on, async functions run on the caller's actor by default.","cmp":"Stays on the main actor throughout, but \u003ccode>parse\u003c/code> occupies the main thread","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","code":"final class APIClient {\n    func fetch() async -> String {\n        let raw = await download()        // ③\n        return parse(raw)                 // ④\n    }\n    func download() async -> [UInt8] { Array(\"Swift\".utf8) }\n    func parse(_ raw: [UInt8]) -> String { String(decoding: raw, as: UTF8.self) }\n}\n\n@MainActor\nfinal class ProfileModel {\n    var name = \"\"\n    let api = APIClient()\n\n    func refresh() async {\n        name = \"Loading…\"                 // ①\n        let result = await api.fetch()    // ②\n        name = result                     // ⑤\n    }\n}","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"},"steps":[{"lane":"main","mark":"①","text":"Runs \u003ccode>name = &quot;Loading…&quot;\u003c/code> on the main actor"},{"lane":"main","mark":"②","text":"Calls \u003ccode>api.fetch()\u003c/code>: nonsending, so it \u003cstrong>stays on the main actor\u003c/strong> with no thread hop"},{"lane":"wait","mark":"③","text":"\u003ccode>download()\u003c/code> starts on the main actor; while it waits for the network it suspends, the main thread is free, and the UI stays responsive"},{"lane":"main","mark":"④","text":"\u003ccode>parse(raw)\u003c/code> runs on the main actor. If parsing is slow, it freezes the UI!"},{"lane":"main","mark":"⑤","text":"\u003ccode>name = result\u003c/code>"}]},"concurrency-concurrent":{"id":"concurrency-concurrent","title":"New rule + @concurrent","note":"Stay put by default; only the genuinely expensive \u003ccode>parse\u003c/code> is explicitly handed to the pool.","cmp":"Only the expensive \u003ccode>parse\u003c/code> is explicitly sent to the background","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","code":"final class APIClient {\n    func fetch() async -> String {\n        let raw = await download()          // ③\n        return await Self.parse(raw)        // ④\n    }\n    func download() async -> [UInt8] { Array(\"Swift\".utf8) }\n\n    @concurrent\n    static func parse(_ raw: [UInt8]) async -> String {\n        String(decoding: raw, as: UTF8.self)\n    }\n}\n\n@MainActor\nfinal class ProfileModel {\n    var name = \"\"\n    let api = APIClient()\n\n    func refresh() async {\n        name = \"Loading…\"                   // ①\n        let result = await api.fetch()      // ②\n        name = result                       // ⑤\n    }\n}","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"},"steps":[{"lane":"main","mark":"①","text":"Runs \u003ccode>name = &quot;Loading…&quot;\u003c/code> on the main actor"},{"lane":"main","mark":"②","text":"Calls \u003ccode>api.fetch()\u003c/code>: nonsending, stays on the main actor"},{"lane":"wait","mark":"③","text":"\u003ccode>download()\u003c/code> suspends while it waits for the network; the main thread is free"},{"lane":"out","mark":"④","text":"\u003ccode>parse\u003c/code> is marked \u003ccode>@concurrent\u003c/code>: it \u003cstrong>explicitly\u003c/strong> hops to the global concurrent pool"},{"lane":"pool","mark":"④","text":"Parses on the pool; the main thread is completely unaffected"},{"lane":"in","mark":"④","text":"Parsing finishes and execution returns to \u003ccode>fetch()\u003c/code> on the main actor"},{"lane":"main","mark":"⑤","text":"\u003ccode>name = result\u003c/code>"}]},"ownership-move":{"id":"ownership-move","title":"Using it after a move","note":"","cmp":"","flags":"-swift-version 6","code":"struct Ticket: ~Copyable {\n    let id: Int\n    consuming func punch() {}\n}\nfunc inspect(_ t: borrowing Ticket) {}\n\nfunc demo() {\n    let a = Ticket(id: 1)\n    let b = a\n    inspect(a)\n    inspect(b)\n}","result":{"status":"error","diagnostics":"main.swift:8:9: error: 'a' used after consume\n 6 | \n 7 | func demo() {\n 8 |     let a = Ticket(id: 1)\n   |         `- error: 'a' used after consume\n 9 |     let b = a\n   |             `- note: consumed here\n10 |     inspect(a)\n   |             `- note: used here\n11 |     inspect(b)\n12 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},"ownership-twice":{"id":"ownership-twice","title":"Consuming twice","note":"","cmp":"","flags":"-swift-version 6","code":"struct Ticket: ~Copyable {\n    let id: Int\n    consuming func punch() {}\n}\n\nfunc demo() {\n    let a = Ticket(id: 1)\n    a.punch()\n    a.punch()\n}","result":{"status":"error","diagnostics":"main.swift:7:9: error: 'a' consumed more than once\n 5 | \n 6 | func demo() {\n 7 |     let a = Ticket(id: 1)\n   |         `- error: 'a' consumed more than once\n 8 |     a.punch()\n   |     `- note: consumed here\n 9 |     a.punch()\n   |     `- note: consumed again here\n10 | }\n11 |","output":"","command":"swiftc -sw ending","synchronization","nonisolated-types","default-isolation","nonsending","concurrent","isolated-conformances","task-immediate","async-defer","cancel-shield"]},{"id":"B","name":"性能直达快线","who":"关心性能、系统编程或嵌入式","time":"约 80 分钟","stops":["noncopyable-generics","typed-throws","inlinearray","integer-generics","span","memory-safety","borrow-mutate","unique-box-array","ref","iterable"]},{"id":"C","name":"语法观光快线","who":"30 分钟扫一遍日常写代码最常用的新语法","time":"约 30 分钟","stops":["count-where","trailing-commas","raw-identifiers","interp-default","enumerated","module-selectors","optional-some","async-defer","memberwise-private"]}],"releaseInfo":[{"version":"6.0","file":"6.0.md"},{"version":"6.1","file":"6.1.md"},{"version":"6.2","file":"6.2.md"},{"version":"6.3","file":"6.3.md"},{"version":"6.4","file":"6.4.md"}],"releases":[{"version":"6.0","id":"v60","date":"2024-09-17","title":"数据竞争安全，成为默认","subtitle":"起点站","summary":"Swift 6 带来全新的 \u003cstrong>Swift 6 语言模式\u003c/strong>：数据竞争从“偶发的线上崩溃”变成“编译期错误”。同时加入了类型化抛出、不可复制类型的泛型支持，\u003ccode>Mutex\u003c/code>、\u003ccode>Atomic\u003c/code>、\u003ccode>Int128\u003c/code> 等底层原语，以及全新的 Swift Testing 测试框架。后面四个版本的很多改进，都是在这块地基上展开的。","blog":"https://www.swift.org/blog/announcing-swift-6/","features":["swift6-mode","region-sending","synchronization","isolation-inherit","typed-throws","noncopyable-generics","count-where","rangeset","int128","pack-iteration","retroactive","import-access","swift-testing","debug-description","platform-60"]},{"version":"6.1","id":"v61","date":"2025-03-31","title":"打磨与减负","subtitle":"第二站","summary":"一个“让 Swift 6 更顺手”的版本：\u003ccode>nonisolated\u003c/code> 可以修饰整个类型和扩展，任务组能自动推断结果类型，尾随逗号几乎到处都能写。还新增了用 Swift 实现 Objective-C 类的 \u003ccode>@objc @implementation\u003c/code>，以及 SwiftPM 的包特性（traits）。随 Xcode 16.3 发布。","blog":"https://www.swift.org/blog/swift-6.1-released/","features":["nonisolated-types","taskgroup-infer","trailing-commas","metatype-keypaths","objc-implementation","member-import","warning-flags","package-traits","testing-61"]},{"version":"6.2","id":"v62","date":"2025-09-15","title":"平易近人的并发，安全的系统编程","subtitle":"换乘大站","summary":"两年里最重要的一个版本。\u003cstrong>平易近人的并发\u003c/strong>（Approachable Concurrency）让 Swift 6 模式不再处处报错：代码可以默认跑在主 actor 上，\u003ccode>nonisolated\u003c/code> 的异步函数默认留在调用者身边，需要并行时再显式写 \u003ccode>@concurrent\u003c/code>。另一条主线是安全、零开销的系统编程：\u003ccode>InlineArray\u003c/code>、\u003ccode>Span\u003c/code>、整数泛型参数与严格内存安全检查。随 Xcode 26 发布。","blog":"https://www.swift.org/blog/swift-6.2-released/","features":["default-isolation","nonsending","concurrent","isolated-conformances","task-immediate","task-naming","isolated-deinit","inlinearray","integer-generics","span","nonescapable","memory-safety","raw-identifiers","interp-default","enumerated","observations","nonexhaustive","swiftpm-62","testing-62","platform-62"]},{"version":"6.3","id":"v63","date":"2026-03-24","title":"跨越语言与平台的边界","subtitle":"第四站","summary":"6.3 的关键词是“边界”：\u003ccode>@c\u003c/code> 让 Swift 函数和枚举直接暴露给 C，模块选择器 \u003ccode>::\u003c/code> 解决同名 API 冲突，\u003ccode>@specialized\u003c/code>、\u003ccode>@inline(always)\u003c/code>、\u003ccode>@export\u003c/code> 让库作者精细地控制优化，\u003ccode>weak let\u003c/code> 让带弱引用的类也能成为 \u003ccode>Sendable\u003c/code>。平台方面，官方 Swift SDK for Android 正式发布。","blog":"https://www.swift.org/blog/swift-6.3-released/","features":["c-interop","module-selectors","perf-attrs","section","weak-let","clock-epochs","codable-errors","android","testing-63","swiftpm-63"]},{"version":"6.4","id":"v64","date":"2026-09-15","title":"更简洁、更快，依然安全","subtitle":"终点站（暂时）","summary":"6.4 一边让日常代码更简洁：\u003ccode>defer\u003c/code> 里可以 \u003ccode>await\u003c/code>，\u003ccode>some P?\u003c/code> 不用加括号，\u003ccode>@diagnose\u003c/code> 在源码里控制警告；一边继续推进“不复制也安全”：\u003ccode>borrow\u003c/code>/\u003ccode>mutate\u003c/code> 访问器、\u003ccode>UniqueBox\u003c/code>、\u003ccode>UniqueArray\u003c/code>、\u003ccode>Ref\u003c/code>、\u003ccode>Iterable\u003c/code>，以及基于 \u003ccode>Span\u003c/code> 的临时内存与字节读取。Swift Build 也成为 SwiftPM 的默认构建系统。","blog":"https://www.swift.org/blog/swift-6.4-released/","features":["async-defer","cancel-shield","task-unused","tilde-sendable","continuation","optional-some","diagnose","memberwise-private","array-trailing-closure","any-apple-os","borrow-mutate","noncopyable-protocols","unique-box-array","ref","iterable","temp-alloc","rawspan-load","async-result","trivially-identical","observation-tracking","stdlib-64","swift-build","testing-64","subprocess","interop-64","embedded-64"]}],"features":[{"id":"swift6-mode","release":"6.0","since":"6.0","title":"Swift 6 语言模式：数据竞争变成编译错误","plainTitle":"Swift 6 语言模式：数据竞争变成编译错误","en":"Swift 6 language mode & complete concurrency checking","line":1,"level":"core","short":"Swift 6 模式","tags":"数据竞争 data race Sendable strict concurrency 语言模式 language mode swiftLanguageModes 迁移","tldr":"在 Swift 6 语言模式下，编译器会对整个模块做完整的并发检查：任何\u003cstrong>可能\u003c/strong>发生的数据竞争都是编译错误，而不是上线后才偶尔出现的崩溃。","flag":"","se":[{"id":"SE-0337","url":"https://github.com/swiftlang/swift-evolution","title":""},{"id":"SE-0412","url":"https://github.com/swiftlang/swift-evolution","title":""},{"id":"SE-0414","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md","title":"Region based Isolation"}],"links":[],"blocks":[{"type":"p","html":"Swift 5.5 引入了 \u003ccode>async\u003c/code>/\u003ccode>await\u003c/code> 和 actor，但并发检查一直是“建议性”的：一段有数据竞争的代码，可以安安静静地通过编译。Swift 6 编译器新增了 \u003cstrong>Swift 6 语言模式\u003c/strong>（language mode），在这个模式下，\u003ccode>Sendable\u003c/code> 检查和 actor 隔离检查全部变成错误。"},{"type":"p","html":"先看一段典型的问题代码。一个普通的类被两个并发执行的地方同时修改："},{"type":"code","lang":"swift","title":"Swift 5 模式：顺利编译，但这里藏着数据竞争","code":"final class Counter {\n    var value = 0\n}\n\nfunc race() {\n    let counter = Counter()\n    Task.detached {\n        counter.value += 1      // 后台线程写入\n    }\n    counter.value += 1          // 同时在当前线程写入\n}","hl":"","check":"ok","flags":"-swift-version 5","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 5 main.swift"}},{"type":"p","html":"同一段代码，切到 Swift 6 模式，编译器会精确地指出冲突的两处访问："},{"type":"code","lang":"swift","title":"同一段代码，Swift 6 模式","code":"final class Counter {\n    var value = 0\n}\n\nfunc race() {\n    let counter = Counter()\n    Task.detached {\n        counter.value += 1      // 后台线程写入\n    }\n    counter.value += 1          // 同时在当前线程写入\n}","hl":"7,10","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:7:10: error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n 5 | func race() {\n 6 |     let counter = Counter()\n 7 |     Task.detached {\n   |          |- error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |          `- note: Passing value of non-Sendable type '() async -> ()' as a 'sending' argument to static method 'detached(name:priority:operation:)' risks causing races in between local and caller code\n 8 |         counter.value += 1      // 后台线程写入\n 9 |     }\n10 |     counter.value += 1          // 同时在当前线程写入\n   |     `- note: access can happen concurrently\n11 | }\n12 | \n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"全局可变状态是另一类常见问题：任何线程都可以随时读写一个 \u003ccode>static var\u003c/code>。Swift 6 模式要求你说清楚它由谁来保护："},{"type":"code","lang":"swift","title":"全局可变状态同样会被拦下","code":"struct Settings {\n    static var current = Settings()\n    var theme = \"light\"\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:16: error: static property 'current' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n1 | struct Settings {\n2 |     static var current = Settings()\n  |                |- error: static property 'current' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n  |                |- note: convert 'current' to a 'let' constant to make 'Sendable' shared state immutable\n  |                |- note: add '@MainActor' to make static property 'current' part of global actor 'MainActor'\n  |                `- note: disable concurrency-safety checks if accesses are protected by an external synchronization mechanism\n3 |     var theme = \"light\"\n4 | }\n\n[#MutableGlobalVariable]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/mutable-global-variable>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"三种修法，任选其一","code":"struct Settings {\n    static let standard = Settings()                    // ① 改成不可变的 let\n    @MainActor static var current = Settings()          // ② 交给主 actor 保护\n    nonisolated(unsafe) static var legacy = Settings()  // ③ 自己保证同步（慎用）\n    var theme = \"light\"\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"h","html":"如何开启、如何迁移"},{"type":"p","html":"语言模式和编译器版本是两回事：Swift 6.0 到 6.4 的编译器都同时支持 Swift 5 和 Swift 6 两种模式，你可以按 target 逐个迁移。"},{"type":"code","lang":"swift","title":"","code":"// swift-tools-version: 6.0\nimport PackageDescription\n\nlet package = Package(\n    name: \"MyApp\",\n    targets: [\n        .target(name: \"Core\"),                           // tools-version 6.0：默认 Swift 6 模式\n        .target(\n            name: \"Legacy\",\n            swiftSettings: [.swiftLanguageMode(.v5)]     // 这个 target 暂时留在 Swift 5 模式\n        ),\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"list","items":["迁移前，可以先在 Swift 5 模式下加上 \u003ccode>-strict-concurrency=complete\u003c/code>，把同样的问题以\u003cstrong>警告\u003c/strong>形式提前看到，逐个修掉再切换。","在 Xcode 中对应 Build Settings 里的 \u003cstrong>Swift Language Version\u003c/strong>。","不要一上来就到处加 \u003ccode>@unchecked Sendable\u003c/code> 或 \u003ccode>nonisolated(unsafe)\u003c/code>：它们只是让编译器闭嘴，问题还在。","后面几个版本的大量工作（尤其是 \u003ca href=\"#v62\">6.2 的“平易近人的并发”\u003c/a>）都是为了让 Swift 6 模式更好用、报错更少。"]},{"type":"quiz","question":"把一个 Swift 5 项目直接换到 Swift 6.0 编译器（Xcode 16）上编译，会发生什么？","options":["立刻出现大量数据竞争错误，必须全部修完才能编译","照常编译：项目的语言模式仍是 Swift 5，要主动切换到 Swift 6 模式才会启用完整检查","编译器不再支持 Swift 5 的语法"],"answer":1,"explain":"新编译器默认保持项目原来的语言模式。Swift 6 模式需要主动开启，而且可以按 target 分别开启。"}]},{"id":"region-sending","release":"6.0","since":"6.0","title":"区域隔离与 \u003ccode>sending\u003c/code>：编译器看懂了“交接”","plainTitle":"区域隔离与 sending：编译器看懂了“交接”","en":"Region-based isolation & sending","line":1,"level":"core","short":"sending","tags":"region isolation 区域 sending transferring Sendable 非Sendable 交接","tldr":"非 \u003ccode>Sendable\u003c/code> 的值也可以安全地交给另一个任务，只要编译器能证明你之后不会再碰它。\u003ccode>sending\u003c/code> 关键字把这种“交接”写进函数签名。","flag":"","se":[{"id":"SE-0414","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md","title":"Region based Isolation"},{"id":"SE-0430","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0430-transferring-parameters-and-results.md","title":"`sending` parameter and result values"}],"links":[],"blocks":[{"type":"p","html":"早期的严格并发检查规则很死板：只要一个类型不是 \u003ccode>Sendable\u003c/code>，它的值就不能跨越隔离边界，哪怕你只是新建了一个对象，然后把它整个交给后台任务。"},{"type":"p","html":"\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md\" target=\"_blank\" rel=\"noopener\">SE-0414\u003c/a> 引入了\u003cstrong>区域隔离\u003c/strong>（region-based isolation）。编译器会追踪每个值属于哪个“区域”：如果一个区域被整体交出去，并且之后再也不用，那么这次交接就是安全的。"},{"type":"code","lang":"swift","title":"新建的对象交给后台任务，之后不再碰它：没问题","code":"final class Report {\n    var lines: [String] = []\n}\n\nfunc generate() {\n    let report = Report()\n    report.lines.append(\"标题\")\n    Task.detached {\n        report.lines.append(\"正文\")    // report 所在的整个区域被交给了这个任务\n    }\n    // 之后不再访问 report → 编译通过\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"交出去之后又用了它：编译器精确指出冲突","code":"final class Report {\n    var lines: [String] = []\n}\n\nfunc generate() {\n    let report = Report()\n    report.lines.append(\"标题\")\n    Task.detached {\n        report.lines.append(\"正文\")\n    }\n    report.lines.append(\"结尾\")        // 和后台任务同时访问\n}","hl":"11","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:8:10: error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n 6 |     let report = Report()\n 7 |     report.lines.append(\"标题\")\n 8 |     Task.detached {\n   |          |- error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |          `- note: Passing value of non-Sendable type '() async -> ()' as a 'sending' argument to static method 'detached(name:priority:operation:)' risks causing races in between local and caller code\n 9 |         report.lines.append(\"正文\")\n10 |     }\n11 |     report.lines.append(\"结尾\")        // 和后台任务同时访问\n   |     `- note: access can happen concurrently\n12 | }\n13 | \n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"h","html":"用 \u003ccode>sending\u003c/code> 把交接写进 API"},{"type":"p","html":"\u003ccode>Task.detached\u003c/code> 能接收上面的闭包，是因为它的参数被标记为 \u003ccode>sending\u003c/code>：调用方承诺把这个值交出去、之后不再使用。你自己的函数也可以这样声明："},{"type":"code","lang":"swift","title":"普通参数属于调用方的区域，不能随手交给别的任务","code":"final class Photo {\n    var pixels: [UInt8] = []\n}\n\nfunc process(_ photo: Photo) {\n    Task.detached {\n        photo.pixels.append(0)\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:6:10: error: passing closure as a 'sending' parameter risks causing data races between code in the current isolation context and concurrent execution of the closure [#RegionIsolation::SendingClosureRisksDataRace]\n 4 | \n 5 | func process(_ photo: Photo) {\n 6 |     Task.detached {\n   |          `- error: passing closure as a 'sending' parameter risks causing data races between code in the current isolation context and concurrent execution of the closure [#RegionIsolation::SendingClosureRisksDataRace]\n 7 |         photo.pixels.append(0)\n   |         `- note: closure captures 'photo' which is accessible to code in the current isolation context\n 8 |     }\n 9 | }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingClosureRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-closure-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"标记为 sending：调用方负责交出所有权","code":"final class Photo {\n    var pixels: [UInt8] = []\n}\n\nfunc process(_ photo: sending Photo) {\n    Task.detached {\n        photo.pixels.append(0)        // ✅ photo 已经和调用方断开了\n    }\n}\n\nfunc makePhoto() -> sending Photo {   // 返回值也可以是 sending：一个与任何人都不共享的新值\n    Photo()\n}\n\nfunc upload() {\n    process(makePhoto())\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["区域隔离不需要你写任何代码，升级编译器就生效；很多以前要靠 \u003ccode>@unchecked Sendable\u003c/code> 绕过的地方，现在可以直接编译。","\u003ccode>sending\u003c/code> 参数：调用方交出值，被调用方可以把它再交给别的隔离域。\u003ccode>sending\u003c/code> 返回值：返回一个“干净的”新值。","提案早期叫 \u003ccode>transferring\u003c/code>，最终定名为 \u003ccode>sending\u003c/code>。"]}]},{"id":"synchronization","release":"6.0","since":"6.0","title":"\u003ccode>Mutex\u003c/code> 与 \u003ccode>Atomic\u003c/code>：标准库自带同步原语","plainTitle":"Mutex 与 Atomic：标准库自带同步原语","en":"Synchronization module","line":1,"level":"key","short":"Mutex·Atomic","tags":"Mutex Atomic 锁 lock Synchronization 原子 线程安全 Sendable","tldr":"新的 \u003ccode>Synchronization\u003c/code> 模块提供 \u003ccode>Mutex\u003c/code> 和 \u003ccode>Atomic\u003c/code>。用它们保护内部状态的类型，可以安全地声明为 \u003ccode>Sendable\u003c/code>，不再需要 \u003ccode>@unchecked\u003c/code>。","flag":"","se":[{"id":"SE-0410","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0410-atomics.md","title":"Low-Level Atomic Operations ⚛︎"},{"id":"SE-0433","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0433-mutex.md","title":"Synchronous Mutual Exclusion Lock 🔒"}],"links":[],"blocks":[{"type":"p","html":"以前要写一个线程安全的类，通常要用 \u003ccode>NSLock\u003c/code>、\u003ccode>os_unfair_lock\u003c/code> 或者 \u003ccode>DispatchQueue\u003c/code>，再给类型加上 \u003ccode>@unchecked Sendable\u003c/code>，告诉编译器“相信我”。现在标准库直接提供了锁和原子类型，编译器能理解它们的安全性："},{"type":"code","lang":"swift","title":"用 Mutex 保护缓存，类型可以诚实地声明 Sendable","code":"import Synchronization\n\nfinal class ImageCache: Sendable {\n    private let storage = Mutex\u003c[String: Int]>([:])\n\n    func insert(_ size: Int, for key: String) {\n        storage.withLock { $0[key] = size }\n    }\n\n    func size(for key: String) -> Int? {\n        storage.withLock { $0[key] }\n    }\n}\n\nlet cache = ImageCache()\ncache.insert(1024, for: \"avatar.png\")\nprint(cache.size(for: \"avatar.png\") ?? 0)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1024","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Atomic：无锁的计数器","code":"import Synchronization\n\nfinal class Stats: Sendable {\n    let visits = Atomic\u003cInt>(0)\n}\n\nlet stats = Stats()\nawait withTaskGroup { group in\n    for _ in 0..\u003c100 {\n        group.addTask { stats.visits.add(1, ordering: .relaxed) }\n    }\n}\nprint(stats.visits.load(ordering: .relaxed))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"100","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>Mutex\u003c/code> 和 \u003ccode>Atomic\u003c/code> 都是 \u003ccode>~Copyable\u003c/code>（不可复制）类型：存成 \u003ccode>let\u003c/code> 属性，通过借用访问，不会被意外复制出第二把锁。","需要 macOS 15、iOS 18 等系统版本对应的运行时。","多数情况下仍然优先考虑 actor；在同步代码、性能敏感的路径，或者不想引入 \u003ccode>await\u003c/code> 的地方，\u003ccode>Mutex\u003c/code> 更合适。"]}]},{"id":"isolation-inherit","release":"6.0","since":"6.0","title":"\u003ccode>#isolation\u003c/code>：让函数继承调用者的隔离","plainTitle":"#isolation：让函数继承调用者的隔离","en":"Inheritance of actor isolation","line":1,"level":"brief","short":"#isolation","tags":"isolation isolated 参数 继承 actor isolated(any)","tldr":"给异步函数加一个 \u003ccode>isolated (any Actor)? = #isolation\u003c/code> 参数，它就会在调用者所在的 actor 上运行，可以安全地操作调用者的非 \u003ccode>Sendable\u003c/code> 状态。","flag":"","se":[{"id":"SE-0420","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0420-inheritance-of-actor-isolation.md","title":"Inheritance of actor isolation"},{"id":"SE-0431","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0431-isolated-any-functions.md","title":"`@isolated(any)` Function Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"一个“跟着调用者走”的计时工具","code":"func measure\u003cT>(\n    _ label: String,\n    isolation: isolated (any Actor)? = #isolation,\n    _ body: () async throws -> T\n) async rethrows -> T {\n    let start = ContinuousClock.now\n    defer { print(label, ContinuousClock.now - start) }\n    return try await body()\n}\n\n@MainActor\nfinal class Feed {\n    var items: [String] = []\n\n    func reload() async {\n        await measure(\"reload\") {\n            items = [\"新闻 A\", \"新闻 B\"]   // measure 和闭包都运行在主 actor 上\n        }\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"这个写法有点啰嗦。到了 Swift 6.2，\u003ca href=\"#f-nonsending\">\u003ccode>nonisolated(nonsending)\u003c/code>\u003c/a> 让“异步函数继承调用者的隔离”变成了默认行为，大多数情况下不再需要手写这个参数。同一版本还加入了 \u003ccode>@isolated(any)\u003c/code> 函数类型，让持有闭包的一方可以查询它的隔离（\u003ccode>Task\u003c/code> 的初始化方法就用到了它）。"}]},{"id":"typed-throws","release":"6.0","since":"6.0","title":"类型化抛出 \u003ccode>throws(E)\u003c/code>","plainTitle":"类型化抛出 throws(E)","en":"Typed throws","line":3,"level":"core","short":"类型化抛出","tags":"typed throws 错误处理 error handling catch Never rethrows","tldr":"函数可以声明自己只会抛出某一种错误：\u003ccode>throws(ParseError)\u003c/code>。调用方 \u003ccode>catch\u003c/code> 到的直接就是 \u003ccode>ParseError\u003c/code>，可以穷尽地 \u003ccode>switch\u003c/code>，不用再 \u003ccode>as?\u003c/code> 猜类型。","flag":"","se":[{"id":"SE-0413","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0413-typed-throws.md","title":"Typed throws"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：catch 里只有 any Error","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws -> Int {\n    guard !text.isEmpty else { throw ParseError.empty }\n    guard let n = Int(text) else { throw ParseError.notANumber(text) }\n    return n\n}\n\ndo {\n    _ = try parseAge(\"十八\")\n} catch let error as ParseError {     // 需要自己转换类型\n    print(\"解析失败：\", error)\n} catch {\n    print(\"不会发生，但编译器要求兜底：\", error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"解析失败： notANumber(\"十八\")","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"现在：throws(ParseError)","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws(ParseError) -> Int {\n    guard !text.isEmpty else { throw .empty }        // 可以省略类型名\n    guard let n = Int(text) else { throw .notANumber(text) }\n    return n\n}\n\ndo throws(ParseError) {                              // 写明这个 do 块抛出的错误类型\n    _ = try parseAge(\"十八\")\n} catch {\n    switch error {                                   // error 的类型就是 ParseError\n    case .empty: print(\"请输入年龄\")\n    case .notANumber(let s): print(\"“\\(s)”不是数字\")\n    }\n}","hl":"6,12-13,15-18","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"“十八”不是数字","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"注意 \u003ccode>do throws(ParseError)\u003c/code>：它直接告诉编译器，这个 \u003ccode>do\u003c/code> 块抛出的错误类型是 \u003ccode>ParseError\u003c/code>。在普通函数和顶层代码里，只要 \u003ccode>do\u003c/code> 里抛出的只有 \u003ccode>ParseError\u003c/code> 一种错误，这个标注可以省略，编译器会自己推断。但\u003cstrong>在闭包里不会\u003c/strong>：\u003ccode>Task { }\u003c/code> 的花括号是闭包，Xcode Playground 里 \u003ccode>#Playground { }\u003c/code> 的花括号也是。漏写时，\u003ccode>catch\u003c/code> 里的 \u003ccode>error\u003c/code> 就退回成 \u003ccode>any Error\u003c/code>："},{"type":"code","lang":"swift","title":"闭包里漏写 throws(ParseError)","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws(ParseError) -> Int {\n    guard !text.isEmpty else { throw .empty }\n    guard let n = Int(text) else { throw .notANumber(text) }\n    return n\n}\n\nTask {\n    do {                                             // 少了 throws(ParseError)\n        _ = try parseAge(\"十八\")\n    } catch {\n        switch error {                               // 这里的 error 是 any Error\n        case .empty: print(\"请输入年龄\")\n        case .notANumber(let s): print(\"“\\(s)”不是数字\")\n        }\n    }\n}","hl":"13,16","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:17:15: error: type 'any Error' has no member 'empty'\n15 |     } catch {\n16 |         switch error {                               // 这里的 error 是 any Error\n17 |         case .empty: print(\"请输入年龄\")\n   |               `- error: type 'any Error' has no member 'empty'\n18 |         case .notANumber(let s): print(\"“\\(s)”不是数字\")\n19 |         }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"所以最稳妥的写法是总带上 \u003ccode>do throws(ParseError)\u003c/code>：放在函数里、闭包里、Playground 里都能编译。"},{"type":"p","html":"类型化抛出在泛型里尤其好用：错误类型可以作为泛型参数传递，比 \u003ccode>rethrows\u003c/code> 更精确。传入不抛错的闭包时，\u003ccode>E\u003c/code> 被推断为 \u003ccode>Never\u003c/code>，调用方连 \u003ccode>try\u003c/code> 都不用写："},{"type":"code","lang":"swift","title":"泛型里传递错误类型","code":"extension Sequence {\n    func myMap\u003cT, E: Error>(_ transform: (Element) throws(E) -> T) throws(E) -> [T] {\n        var result: [T] = []\n        for x in self { result.append(try transform(x)) }\n        return result\n    }\n}\n\nlet doubled = [1, 2, 3].myMap { $0 * 2 }   // E == Never：不需要 try\nprint(doubled)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[2, 4, 6]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>throws\u003c/code> 等价于 \u003ccode>throws(any Error)\u003c/code>；\u003ccode>throws(Never)\u003c/code> 等价于不抛出。","适合：模块内部的代码、嵌入式环境（避免存在类型的开销）、错误种类确实是封闭集合的场景。","公共 API 要慎用：错误类型会成为 API 契约的一部分，以后想加一种新错误就是破坏性改动。提案本身也建议多数情况继续使用普通的 \u003ccode>throws\u003c/code>。"]},{"type":"quiz","question":"\u003ccode>func load() throws(Never) -&gt; Data\u003c/code> 等价于下面哪个声明？","options":["\u003ccode>func load() throws -&gt; Data\u003c/code>","\u003ccode>func load() -&gt; Data\u003c/code>","\u003ccode>func load() rethrows -&gt; Data\u003c/code>"],"answer":1,"explain":"\u003ccode>Never\u003c/code> 没有任何值，函数永远不可能抛出错误，所以它就是一个普通的不抛错函数，调用时也不需要 \u003ccode>try\u003c/code>。"}]},{"id":"noncopyable-generics","release":"6.0","since":"6.0","title":"不可复制类型走进泛型：\u003ccode>~Copyable\u003c/code>","plainTitle":"不可复制类型走进泛型：~Copyable","en":"Noncopyable generics","line":2,"level":"core","short":"~Copyable 泛型","tags":"noncopyable move-only ~Copyable consuming borrowing 所有权 ownership deinit Optional","tldr":"Swift 5.9 就有了不可复制的结构体，但它们几乎不能和泛型、协议、\u003ccode>Optional\u003c/code> 一起用。Swift 6 让泛型参数、协议和扩展都可以去掉“默认可复制”的假设，标准库的 \u003ccode>Optional\u003c/code>、\u003ccode>Result\u003c/code>、指针类型也都支持了不可复制类型。","flag":"","se":[{"id":"SE-0427","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0427-noncopyable-generics.md","title":"Noncopyable Generics"},{"id":"SE-0429","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0429-partial-consumption.md","title":"Partial consumption of noncopyable values"},{"id":"SE-0432","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0432-noncopyable-switch.md","title":"Borrowing and consuming pattern matching for noncopyable types"},{"id":"SE-0437","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0437-noncopyable-stdlib-primitives.md","title":"Noncopyable Standard Library Primitives"}],"links":[],"blocks":[{"type":"p","html":"Swift 里每个类型默认都是 \u003ccode>Copyable\u003c/code> 的：赋值、传参时可以随意复制。写上 \u003ccode>~Copyable\u003c/code> 的意思是“不要假设我可以被复制”。这非常适合表达\u003cstrong>唯一的资源\u003c/strong>：一张车票只能检一次，一个文件句柄只能关闭一次。"},{"type":"code","lang":"swift","title":"一张不能复印的车票","code":"struct Ticket: ~Copyable {\n    let id: Int\n\n    consuming func punch() {          // consuming：调用之后，这张票就被“用掉”了\n        print(\"第 \\(id) 号票已检票\")\n    }\n\n    deinit { print(\"第 \\(id) 号票被回收\") }\n}\n\nfunc ride() {\n    let ticket = Ticket(id: 7)\n    ticket.punch()\n}\nride()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"第 7 号票已检票\n第 7 号票被回收","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"想用两次？编译器不答应","code":"struct Ticket: ~Copyable {\n    let id: Int\n    consuming func punch() {\n        print(\"第 \\(id) 号票已检票\")\n    }\n}\n\nfunc ride() {\n    let ticket = Ticket(id: 7)\n    ticket.punch()\n    ticket.punch()\n}","hl":"10,11","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:9: error: 'ticket' consumed more than once\n 7 | \n 8 | func ride() {\n 9 |     let ticket = Ticket(id: 7)\n   |         `- error: 'ticket' consumed more than once\n10 |     ticket.punch()\n   |     `- note: consumed here\n11 |     ticket.punch()\n   |     `- note: consumed again here\n12 | }\n13 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"Swift 6 的关键进步是：泛型也能接纳不可复制的类型了。下面的 \u003ccode>Wallet\u003c/code> 既能装普通值，也能装 \u003ccode>Ticket\u003c/code>："},{"type":"code","lang":"swift","title":"泛型容器装下不可复制的值","code":"struct Ticket: ~Copyable {\n    let id: Int\n}\n\nstruct Wallet\u003cItem: ~Copyable>: ~Copyable {\n    var item: Item?\n\n    mutating func take() -> Item? {\n        item.take()                      // Optional 现在也支持不可复制的 Wrapped\n    }\n}\n\nextension Wallet: Copyable where Item: Copyable {}   // 装可复制的东西时，钱包也可以复制\n\nvar wallet = Wallet(item: Ticket(id: 42))\nif let t = wallet.take() {\n    print(\"取出了 \\(t.id) 号票\")\n}\nprint(wallet.item == nil)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"取出了 42 号票\ntrue","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>~Copyable\u003c/code> 的含义是“\u003cstrong>不保证\u003c/strong>可复制”，而不是“保证不可复制”：\u003ccode>Wallet&lt;Int&gt;\u003c/code> 依然可以复制。","参数的所有权修饰：\u003ccode>borrowing\u003c/code>（只读借用）、\u003ccode>consuming\u003c/code>（拿走所有权）、\u003ccode>inout\u003c/code>（独占地修改）。","同一版本还支持了部分消耗（只拿走结构体里的某个字段）和对不可复制枚举的 \u003ccode>switch\u003c/code> 借用匹配。","这是后面 \u003ccode>Span\u003c/code>、\u003ccode>InlineArray\u003c/code>、\u003ccode>UniqueArray\u003c/code>、\u003ccode>Continuation\u003c/code> 等特性的地基。动手试试：\u003ca href=\"#lab-ownership\">所有权沙盒\u003c/a>。"]},{"type":"quiz","question":"下面关于 \u003ccode>struct Box&lt;T: ~Copyable&gt;: ~Copyable\u003c/code> 的说法，哪一个是对的？","options":["\u003ccode>Box&lt;Int&gt;\u003c/code> 也一定是不可复制的","\u003ccode>T\u003c/code> 可以是可复制的类型，也可以是不可复制的类型","\u003ccode>T\u003c/code> 必须是不可复制的类型"],"answer":1,"explain":"\u003ccode>~Copyable\u003c/code> 去掉的是“默认要求可复制”这个约束，并不要求类型一定不可复制。再配合 \u003ccode>extension Box: Copyable where T: Copyable {}\u003c/code>，\u003ccode>Box&lt;Int&gt;\u003c/code> 就能复制。"}]},{"id":"count-where","release":"6.0","since":"6.0","title":"\u003ccode>count(where:)\u003c/code>","plainTitle":"count(where:)","en":"count(where:)","line":4,"level":"brief","short":"count(where:)","tags":"count where filter 计数 序列","tldr":"统计满足条件的元素个数，不用再先 \u003ccode>filter\u003c/code> 出一个临时数组再取 \u003ccode>count\u003c/code>。","flag":"","se":[{"id":"SE-0220","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0220-count-where.md","title":"`count(where:)`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let scores = [88, 92, 59, 73, 100, 45]\n\nprint(scores.filter { $0 >= 60 }.count)     // 以前：会创建一个临时数组\nprint(scores.count(where: { $0 >= 60 }))    // 现在：一次遍历，不分配内存","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"4\n4","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"这个提案（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0220-count-where.md\" target=\"_blank\" rel=\"noopener\">SE-0220\u003c/a>）早在 2018 年就被接受了，但因为类型检查性能问题被搁置，直到 Swift 6.0 才真正落地。"}]},{"id":"rangeset","release":"6.0","since":"6.0","title":"\u003ccode>RangeSet\u003c/code>：操作不连续的一组元素","plainTitle":"RangeSet：操作不连续的一组元素","en":"RangeSet & noncontiguous collection operations","line":4,"level":"brief","short":"RangeSet","tags":"RangeSet indices subranges 不连续 批量 移动 删除","tldr":"\u003ccode>indices(where:)\u003c/code> 返回一个 \u003ccode>RangeSet\u003c/code>，代表一组不连续的下标。可以用它一次性读取、移动或删除这些元素。","flag":"","se":[{"id":"SE-0270","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0270-rangeset-and-collection-operations.md","title":"Add Collection Operations on Noncontiguous Elements"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"var todo = [\"写周报\", \"修 bug\", \"开会\", \"代码评审\", \"喝咖啡\", \"修 crash\"]\n\nlet urgent = todo.indices(where: { $0.hasPrefix(\"修\") })\nprint(todo[urgent].map { $0 })              // 不连续的“切片”\n\n_ = todo.moveSubranges(urgent, to: 0)       // 把它们一起挪到最前面\nprint(todo)\n\ntodo.removeSubranges(todo.indices(where: { $0 == \"喝咖啡\" }))\nprint(todo)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[\"修 bug\", \"修 crash\"]\n[\"修 bug\", \"修 crash\", \"写周报\", \"开会\", \"代码评审\", \"喝咖啡\"]\n[\"修 bug\", \"修 crash\", \"写周报\", \"开会\", \"代码评审\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"int128","release":"6.0","since":"6.0","title":"\u003ccode>Int128\u003c/code> 与 \u003ccode>UInt128\u003c/code>","plainTitle":"Int128 与 UInt128","en":"128-bit integer types","line":4,"level":"brief","short":"Int128","tags":"Int128 UInt128 整数 大数 128位","tldr":"标准库新增 128 位整数类型，四则运算、位运算、\u003ccode>Codable\u003c/code> 一应俱全，适合高精度计时、哈希和金融计算。","flag":"","se":[{"id":"SE-0425","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0425-int128.md","title":"128-bit Integer Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let nanosPerYear = Int128(365 * 24 * 3600) * 1_000_000_000\nprint(nanosPerYear * 10_000)          // 一万年的纳秒数，Int64 装不下\nprint(UInt128.max)\nprint(MemoryLayout\u003cInt128>.size)      // 16 字节","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"315360000000000000000\n340282366920938463463374607431768211455\n16","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"pack-iteration","release":"6.0","since":"6.0","title":"参数包遍历：\u003ccode>for … in repeat each\u003c/code>","plainTitle":"参数包遍历：for … in repeat each","en":"Pack iteration","line":3,"level":"brief","short":"参数包遍历","tags":"parameter pack variadic generics repeat each 可变参数 泛型","tldr":"Swift 5.9 引入了参数包（可变数量的泛型参数），但只能在表达式里“展开”。Swift 6.0 允许直接用 \u003ccode>for-in\u003c/code> 遍历一个参数包。","flag":"","se":[{"id":"SE-0408","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0408-pack-iteration.md","title":"Pack Iteration"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"func allEqual\u003ceach T: Equatable>(_ lhs: repeat each T, to rhs: repeat each T) -> Bool {\n    for (left, right) in repeat (each lhs, each rhs) {\n        guard left == right else { return false }\n    }\n    return true\n}\n\nprint(allEqual(1, \"a\", 2.5, to: 1, \"a\", 2.5))   // 三个参数，类型各不相同\nprint(allEqual(true, to: false))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true\nfalse","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"注意参数包之后的参数必须带标签（这里是 \u003ccode>to:\u003c/code>），否则编译器无法区分两个包的边界。"}]},{"id":"retroactive","release":"6.0","since":"6.0","title":"\u003ccode>@retroactive\u003c/code>：“别人的类型 + 别人的协议”要打个招呼","plainTitle":"@retroactive：“别人的类型 + 别人的协议”要打个招呼","en":"Warning for retroactive conformances","line":3,"level":"brief","short":"@retroactive","tags":"retroactive conformance extension 一致性 追溯","tldr":"给一个\u003cstrong>别的模块\u003c/strong>的类型添加对\u003cstrong>别的模块\u003c/strong>协议的遵循，以后对方自己也加上时就会冲突。Swift 6 会对此发出警告，要求你用 \u003ccode>@retroactive\u003c/code> 表明“我知道风险”。","flag":"","se":[{"id":"SE-0364","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0364-retroactive-conformance-warning.md","title":"Warning for Retroactive Conformances of External Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"给标准库的 Int 加上标准库的 Identifiable","code":"extension Int: Identifiable {\n    public var id: Int { self }\n}","hl":"","check":"warning","flags":"-swift-version 6","result":{"status":"warning","diagnostics":"main.swift:1:1: warning: extension declares a conformance of imported type 'Int' to imported protocol 'Identifiable'; this will not behave correctly if the owners of 'Swift' introduce this conformance in the future\n1 | extension Int: Identifiable {\n  | |- warning: extension declares a conformance of imported type 'Int' to imported protocol 'Identifiable'; this will not behave correctly if the owners of 'Swift' introduce this conformance in the future\n  | `- note: add '@retroactive' to silence this warning\n2 |     public var id: Int { self }\n3 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"明确表示这是有意为之","code":"extension Int: @retroactive Identifiable {\n    public var id: Int { self }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"import-access","release":"6.0","since":"6.0","title":"\u003ccode>import\u003c/code> 也能写访问级别","plainTitle":"import 也能写访问级别","en":"Access-level modifiers on import declarations","line":3,"level":"brief","short":"internal import","tags":"import access level internal public private 依赖 模块","tldr":"\u003ccode>internal import Foo\u003c/code> 表示 Foo 只是本模块的实现细节，不会泄露给使用者；如果 public API 用到了它的类型，编译器会报错提醒。","flag":"InternalImportsByDefault","se":[{"id":"SE-0409","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0409-access-level-on-imports.md","title":"Access-level modifiers on import declarations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"内部导入的类型不能出现在 public API 里","code":"internal import Foundation\n\npublic func today() -> Date {\n    Date()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:3:13: error: function cannot be declared public because its result uses an internal type\n1 | internal import Foundation\n  |          `- note: struct 'Date' imported as 'internal' from 'Foundation' here\n2 | \n3 | public func today() -> Date {\n  |             |- error: function cannot be declared public because its result uses an internal type\n  |             `- note: struct 'Date' is imported by this file as 'internal' from 'Foundation'\n4 |     Date()\n5 | }\n\nFoundation.Date:2:15: note: type declared here\n 1 | @available(macOS 10.10, iOS 8.0, watchOS 2.0, tvOS 9.0, *)\n 2 | public struct Date : Comparable, Hashable, Equatable, Sendable {\n   |               `- note: type declared here\n 3 |     public static let timeIntervalBetween1970AndReferenceDate: Double\n 4 |     public static var timeIntervalSinceReferenceDate: TimeInterval { get }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"在 Swift 6 模式下，\u003ccode>import\u003c/code> 默认仍然相当于 \u003ccode>public import\u003c/code>。开启 upcoming feature \u003ccode>InternalImportsByDefault\u003c/code> 后，默认会变成 \u003ccode>internal\u003c/code>，这是未来语言模式的方向。"}]},{"id":"swift-testing","release":"6.0","since":"6.0","title":"Swift Testing：新一代测试框架","plainTitle":"Swift Testing：新一代测试框架","en":"Swift Testing","line":6,"level":"key","short":"Swift Testing","tags":"Swift Testing @Test #expect #require 单元测试 unit test 参数化 parameterized XCTest","tldr":"随 Swift 6 工具链发布的开源测试框架：用 \u003ccode>@Test\u003c/code> 标记测试、用 \u003ccode>#expect\u003c/code> 断言，原生支持参数化测试、并行执行和标签，可以和 XCTest 在同一个 target 里共存。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"@Test、#expect 与参数化测试","code":"import Testing\n\nstruct Calculator {\n    func add(_ a: Int, _ b: Int) -> Int { a + b }\n}\n\n@Suite(\"计算器\")\nstruct CalculatorTests {\n    let calc = Calculator()\n\n    @Test(\"两个正数相加\")\n    func addPositive() {\n        #expect(calc.add(2, 3) == 5)\n    }\n\n    @Test(\"加法满足交换律\", arguments: [(1, 2), (10, -3), (0, 0)])\n    func commutative(a: Int, b: Int) {\n        #expect(calc.add(a, b) == calc.add(b, a))\n    }\n\n    @Test func parse() throws {\n        let n = try #require(Int(\"42\"))     // 失败就立即结束这个测试\n        #expect(n == 42)\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}},{"type":"list","items":["\u003ccode>#expect\u003c/code> 失败时，会展示表达式里每个子表达式的值，比 \u003ccode>XCTAssertEqual\u003c/code> 直观得多。","参数化测试的每组参数都是独立的测试用例，可以单独重跑。","后续版本一路增强：\u003ca href=\"#f-testing-61\">6.1\u003c/a> 的作用域特性、\u003ca href=\"#f-testing-62\">6.2\u003c/a> 的退出测试与附件、\u003ca href=\"#f-testing-63\">6.3\u003c/a> 的警告和取消、\u003ca href=\"#f-testing-64\">6.4\u003c/a> 与 XCTest 互通。"]}]},{"id":"debug-description","release":"6.0","since":"6.0","title":"\u003ccode>@DebugDescription\u003c/code>：让调试器显示你想看的摘要","plainTitle":"@DebugDescription：让调试器显示你想看的摘要","en":"DebugDescription macro","line":6,"level":"brief","short":"@DebugDescription","tags":"debug LLDB 调试 debugDescription macro 宏","tldr":"给类型加上 \u003ccode>@DebugDescription\u003c/code> 宏，LLDB 在变量窗口和崩溃报告里就会直接显示你定义的摘要，不需要运行代码。","flag":"","se":[{"id":"SE-0440","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0440-debug-description-macro.md","title":"DebugDescription Macro"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@DebugDescription\nstruct Order: CustomDebugStringConvertible {\n    var id: Int\n    var total: Double\n\n    var debugDescription: String { \"订单 #\\(id)：¥\\(total)\" }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"宏会把 \u003ccode>debugDescription\u003c/code> 编译成 LLDB 的摘要格式并嵌入二进制，所以它只能使用简单的字符串插值（存储属性），不能调用任意函数。"}]},{"id":"platform-60","release":"6.0","since":"6.0","title":"统一的 Foundation、静态 Linux SDK 与 Embedded Swift","plainTitle":"统一的 Foundation、静态 Linux SDK 与 Embedded Swift","en":"Foundation, Static Linux SDK & Embedded Swift","line":5,"level":"brief","short":"跨平台基础","tags":"Foundation Linux static Embedded 嵌入式 跨平台 musl","tldr":"Swift 6 起，所有平台共用同一套用 Swift 重写的 Foundation；新的静态 Linux SDK 可以构建完全静态链接、无依赖的可执行文件；实验性的 Embedded Swift 能为微控制器生成很小的二进制。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# 用静态 Linux SDK 构建一个不依赖任何系统库的可执行文件\nswift build --swift-sdk x86_64-swift-linux-musl","hl":"","check":"none"},{"type":"p","html":"这三件事看起来零散，却奠定了后两年“Swift 到处跑”的基础：6.2 的 WebAssembly、6.3 的官方 Android SDK，以及 6.4 的嵌入式存在类型支持。"}]},{"id":"nonisolated-types","release":"6.1","since":"6.1","title":"\u003ccode>nonisolated\u003c/code> 可以修饰类型与扩展","plainTitle":"nonisolated 可以修饰类型与扩展","en":"Allow nonisolated to prevent global actor inference","line":1,"level":"key","short":"nonisolated 类型","tags":"nonisolated extension 扩展 MainActor 推断 inference 协议一致性","tldr":"以前 \u003ccode>nonisolated\u003c/code> 只能写在单个属性或方法上。现在可以写在整个 \u003ccode>extension\u003c/code> 上，一次让里面所有成员都不受 actor 隔离；写在类型上，还能阻止编译器自动推断出全局 actor。","flag":"","se":[{"id":"SE-0449","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0449-nonisolated-for-global-actor-cutoff.md","title":"Allow `nonisolated` to prevent global actor inference"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：每个成员都要单独写一遍 nonisolated","code":"@MainActor\nstruct Product {\n    var name: String\n    var price: Double\n}\n\nextension Product: CustomStringConvertible, Equatable {\n    nonisolated var description: String { \"\\(name) ¥\\(price)\" }\n    nonisolated static func == (a: Product, b: Product) -> Bool { a.name == b.name }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.1：一个 nonisolated extension 搞定","code":"@MainActor\nstruct Product {\n    var name: S
