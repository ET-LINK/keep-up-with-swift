contiguous memory","en":"","line":2,"level":"core","short":"Span","tags":"Span MutableSpan RawSpan OutputSpan UTF8Span contiguous memory pointer memory safety lifetime","tldr":"\u003ccode>Span&lt;T&gt;\u003c/code> is a read-only view over a run of contiguous memory (\u003ccode>MutableSpan\u003c/code> is writable). It is as fast as \u003ccode>UnsafeBufferPointer\u003c/code>, but the compiler guarantees it can't outlive the original data: dangling pointers and use-after-free are ruled out at compile time.","flag":"","se":[{"id":"SE-0447","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0447-span-access-shared-contiguous-storage.md","title":"Span: Safe Access to Contiguous Storage"},{"id":"SE-0456","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0456-stdlib-span-properties.md","title":"Add `Span`-providing Properties to Standard Library Types"},{"id":"SE-0467","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0467-MutableSpan.md","title":"MutableSpan and MutableRawSpan: delegate mutations of contiguous memory"},{"id":"SE-0485","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0485-outputspan.md","title":"OutputSpan: delegate initialization of contiguous memory"},{"id":"SE-0464","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0464-utf8span-safe-utf8-processing.md","title":"UTF8Span: Safe UTF-8 Processing Over Contiguous Bytes"}],"links":[],"blocks":[{"type":"p","html":"To process “a run of contiguous elements” efficiently you used to either accept an \u003ccode>Array\u003c/code> (which may trigger a copy) or grab a pointer with \u003ccode>withUnsafeBufferPointer\u003c/code> (unsafe). \u003ccode>Span\u003c/code> is the third way:"},{"type":"code","lang":"swift","title":"A function that takes a Span: both Array and InlineArray can be passed","code":"func checksum(_ bytes: Span\u003cUInt8>) -> UInt8 {\n    var sum: UInt8 = 0\n    for i in bytes.indices {\n        sum &+= bytes[i]\n    }\n    return sum\n}\n\nlet packet: [UInt8] = [0x12, 0x34, 0x56]\nlet header: [4 of UInt8] = [1, 2, 3, 4]\n\nprint(checksum(packet.span))\nprint(checksum(header.span))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"156\n10","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"MutableSpan: modify in place","code":"func amplify(_ samples: inout [Float]) {\n    var view = samples.mutableSpan       // borrows samples exclusively\n    for i in view.indices {\n        view[i] *= 2\n    }\n}\n\nvar samples: [Float] = [0.5, -1.2, 3.3]\namplify(&samples)\nprint(samples)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[1.0, -2.4, 6.6]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Note that the \u003ccode>mutableSpan\u003c/code> above is used inside a function: variables declared at the top level of \u003ccode>main.swift\u003c/code> are actually globals, and globals can't hold nonescapable values like \u003ccode>Span\u003c/code>."},{"type":"p","html":"\u003ccode>Span\u003c/code> is \u003ccode>~Escapable\u003c/code>: its lifetime depends on the data that provides it. Trying to make it live longer than the source data is a compile error, not a runtime crash:"},{"type":"code","lang":"swift","title":"A Span can't escape the scope of its source data","code":"func leak() -> Int {\n    var escaped: Span\u003cUInt8>\n    do {\n        let data: [UInt8] = [1, 2, 3]\n        escaped = data.span\n    }\n    return escaped.count\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:9: error: lifetime-dependent variable 'escaped' escapes its scope\n1 | func leak() -> Int {\n2 |     var escaped: Span\u003cUInt8>\n  |         `- error: lifetime-dependent variable 'escaped' escapes its scope\n3 |     do {\n4 |         let data: [UInt8] = [1, 2, 3]\n  |             `- note: it depends on the lifetime of variable 'data'\n5 |         escaped = data.span\n6 |     }\n7 |     return escaped.count\n  |            `- note: this use of the lifetime-dependent value is out of scope\n8 | }\n9 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["\u003ccode>Array\u003c/code>, \u003ccode>ContiguousArray\u003c/code>, \u003ccode>ArraySlice\u003c/code>, \u003ccode>InlineArray\u003c/code>, \u003ccode>String.UTF8View\u003c/code>, and others all provide a \u003ccode>.span\u003c/code> property (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0456-stdlib-span-properties.md\" target=\"_blank\" rel=\"noopener\">SE-0456\u003c/a>).","A \u003ccode>Span\u003c/code> can't be stored in a global variable, a class property, or an escaping closure; it fits as a function parameter, saying “I only need to look at these elements temporarily”.","Out-of-bounds accesses are still checked at runtime, so safety isn't reduced, but there is no reference counting or exclusivity-checking overhead.","The same family: \u003ccode>RawSpan\u003c/code> (raw bytes), \u003ccode>MutableSpan\u003c/code>, \u003ccode>OutputSpan\u003c/code> (initializing uninitialized memory), and \u003ccode>UTF8Span\u003c/code> (safe handling of UTF-8).","Follow-ups: 6.4's \u003ca href=\"#f-temp-alloc\">\u003ccode>withTemporaryAllocation\u003c/code>\u003c/a>, \u003ca href=\"#f-rawspan-load\">safe \u003ccode>RawSpan\u003c/code> loading\u003c/a>, and two-way bridging with C++ \u003ccode>std::span\u003c/code>."]}]},{"id":"nonescapable","release":"6.2","since":"6.2","title":"\u003ccode>~Escapable\u003c/code>: types that can't escape","plainTitle":"~Escapable: types that can't escape","en":"","line":2,"level":"brief","short":"~Escapable","tags":"Escapable nonescapable escape lifetime dependency","tldr":"The language capability behind \u003ccode>Span\u003c/code>. Ordinary types are \u003ccode>Escapable\u003c/code> by default, so their values can be stored and passed around freely; a value of a \u003ccode>~Escapable\u003c/code> type can only be used while the thing it depends on is still alive.","flag":"","se":[{"id":"SE-0446","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0446-non-escapable.md","title":"Nonescapable Types"},{"id":"SE-0465","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0465-nonescapable-stdlib-primitives.md","title":"Standard Library Primitives for Nonescapable Types"}],"links":[],"blocks":[{"type":"p","html":"\u003ccode>~Escapable\u003c/code> and \u003ccode>~Copyable\u003c/code> are siblings: one removes the default ability to be copied, the other removes the default ability to escape. The standard library filled in the infrastructure for them in 6.2 (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0465-nonescapable-stdlib-primitives.md\" target=\"_blank\" rel=\"noopener\">SE-0465\u003c/a>); for example, \u003ccode>Optional\u003c/code> can wrap a nonescapable value."},{"type":"p","html":"When you define a \u003ccode>~Escapable\u003c/code> type yourself you need a lifetime dependency to say “who does this value depend on”. As of 6.4 that annotation is still experimental (\u003ccode>@_lifetime\u003c/code>), and the compiler flatly rejects code that doesn't state the dependency:"},{"type":"code","lang":"swift","title":"Without a lifetime annotation, the compiler can't confirm safety","code":"struct Window: ~Escapable {\n    let items: Span\u003cInt>\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:9: error: the 'get' accessor cannot return a ~Escapable result\n1 | struct Window: ~Escapable {\n2 |     let items: Span\u003cInt>\n  |         `- error: the 'get' accessor cannot return a ~Escapable result\n3 | }\n4 | \n\nmain.swift:1:8: error: an implicit initializer cannot return a ~Escapable result\n1 | struct Window: ~Escapable {\n  |        `- error: an implicit initializer cannot return a ~Escapable result\n2 |     let items: Span\u003cInt>\n3 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"In everyday development you will most likely just \u003cstrong>use\u003c/strong> ready-made nonescapable types like \u003ccode>Span\u003c/code>, rather than define your own."}]},{"id":"memory-safety","release":"6.2","since":"6.2","title":"Strict memory-safety checking","plainTitle":"Strict memory-safety checking","en":"","line":2,"level":"key","short":"Memory safety","tags":"strict memory safety unsafe pointer audit -strict-memory-safety","tldr":"With \u003ccode>-strict-memory-safety\u003c/code> on, every place that uses an unsafe construct (pointers, \u003ccode>unsafe\u003c/code> APIs) gets flagged. You can switch to a safe alternative, or use an \u003ccode>unsafe\u003c/code> expression to say clearly “this is intentional”.","flag":"","se":[{"id":"SE-0458","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0458-strict-memory-safety.md","title":"Opt-in Strict Memory Safety Checking"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"With it on, unsafe usages are flagged one by one","code":"func sum(_ p: UnsafePointer\u003cInt>, count: Int) -> Int {\n    var total = 0\n    for i in 0..\u003ccount {\n        total += p[i]\n    }\n    return total\n}","hl":"","check":"warning","flags":"-swift-version 6 -strict-memory-safety","result":{"status":"warning","diagnostics":"main.swift:4:9: warning: expression uses unsafe constructs but is not marked with 'unsafe' [#StrictMemorySafety]\n2 |     var total = 0\n3 |     for i in 0..\u003ccount {\n4 |         total += p[i]\n  |         |        `- note: reference to parameter 'p' involves unsafe type 'UnsafePointer\u003cInt>'\n  |         `- warning: expression uses unsafe constructs but is not marked with 'unsafe' [#StrictMemorySafety]\n5 |     }\n6 |     return total\n\n[#StrictMemorySafety]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/strict-memory-safety>","output":"","command":"swiftc -swift-version 6 -strict-memory-safety main.swift"}},{"type":"code","lang":"swift","title":"Option 1: mark it with unsafe, which makes code audits easier","code":"func sum(_ p: UnsafePointer\u003cInt>, count: Int) -> Int {\n    var total = 0\n    for i in 0..\u003ccount {\n        total += unsafe p[i]\n    }\n    return total\n}","hl":"","check":"ok","flags":"-swift-version 6 -strict-memory-safety","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -strict-memory-safety main.swift"}},{"type":"code","lang":"swift","title":"Option 2 (better): switch to Span and the warning goes away on its own","code":"func sum(_ values: Span\u003cInt>) -> Int {\n    var total = 0\n    for i in values.indices {\n        total += values[i]\n    }\n    return total\n}","hl":"","check":"ok","flags":"-swift-version 6 -strict-memory-safety","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -strict-memory-safety main.swift"}},{"type":"p","html":"This is an opt-in mode, and the official position is that most projects don't need it. It suits code with the highest safety requirements: components that parse untrusted input, cryptography libraries, and system services. Like \u003ccode>try\u003c/code> and \u003ccode>await\u003c/code>, \u003ccode>unsafe\u003c/code> is only a marker and doesn't change runtime behavior."}]},{"id":"raw-identifiers","release":"6.2","since":"6.2","title":"Raw identifiers: any name you like inside backticks","plainTitle":"Raw identifiers: any name you like inside backticks","en":"","line":3,"level":"key","short":"Raw identifiers","tags":"raw identifiers backtick test name enum naming identifier","tldr":"A name wrapped in backticks can contain spaces and punctuation, and can even start with a digit. The most common use is making a test function's name a complete description.","flag":"","se":[{"id":"SE-0451","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0451-escaped-identifiers.md","title":"Raw identifiers"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"enum VideoQuality {\n    case `480p`, `720p`, `1080p`, `4K`        // cases that start with a digit\n}\n\nfunc `format duration`(_ seconds: Int) -> String {\n    \"\\(seconds / 60) min \\(seconds % 60) sec\"\n}\n\nlet q = VideoQuality.`1080p`\nprint(q, `format duration`(135))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"`1080p` 2 min 15 sec","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"The test name is the description; no separate display name needed","code":"import Testing\n\n@Test func `empty string parses as nil`() {\n    #expect(Int(\"\") == nil)\n}\n\n@Test func `square() returns x * x`() {\n    #expect(4 * 4 == 16)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}},{"type":"p","html":"Look at the run output: when an enum value is printed, Swift prints such names with their backticks (\u003ccode>`1080p`\u003c/code>). Almost any character except the backtick itself and newlines can appear in a raw identifier. Show some restraint, though: for ordinary functions in application code, normal names read better."}]},{"id":"interp-default","release":"6.2","since":"6.2","title":"Default values in string interpolation","plainTitle":"Default values in string interpolation","en":"","line":3,"level":"key","short":"Interpolation default","tags":"string interpolation optional default ??","tldr":"When interpolating an optional, write the default right there: \u003ccode>&quot;\\(age, default: &quot;unknown&quot;)&quot;\u003c/code>. Unlike \u003ccode>??\u003c/code>, the default doesn't have to be the same type as the optional.","flag":"","se":[{"id":"SE-0477","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0477-default-interpolation-values.md","title":"Default Value in String Interpolations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let nickname: String? = nil\nlet age: Int? = nil\n\nprint(\"Nickname: \\(nickname ?? \"not set\")\")       // ?? is fine for String?\nprint(\"Age: \\(age, default: \"unknown\")\")          // an Int? can have a String default","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Nickname: not set\nAge: unknown","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"If you use \u003ccode>??\u003c/code> on an \u003ccode>Int?\u003c/code> with a string default, the types don't match:"},{"type":"code","lang":"swift","title":"Both sides of ?? must have the same type","code":"let age: Int? = nil\nprint(\"Age: \\(age ?? \"unknown\")\")","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:15: error: cannot convert value of type 'Int?' to expected argument type 'String?'\n1 | let age: Int? = nil\n2 | print(\"Age: \\(age ?? \"unknown\")\")\n  |               `- error: cannot convert value of type 'Int?' to expected argument type 'String?'\n3 |","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"enumerated","release":"6.2","since":"6.2","title":"\u003ccode>enumerated()\u003c/code> becomes a Collection","plainTitle":"enumerated() becomes a Collection","en":"","line":4,"level":"brief","short":"enumerated","tags":"enumerated Collection SwiftUI ForEach List offset index","tldr":"The result of \u003ccode>enumerated()\u003c/code> is now a \u003ccode>Collection\u003c/code> (and random-access when the base collection is), so you can call \u003ccode>count\u003c/code> and take \u003ccode>last\u003c/code> directly, and use it in SwiftUI's \u003ccode>List\u003c/code> and \u003ccode>ForEach\u003c/code> without wrapping it in \u003ccode>Array(…)\u003c/code>.","flag":"","se":[{"id":"SE-0459","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0459-enumerated-collection.md","title":"Add `Collection` conformances for `enumerated()`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let medals = [\"Gold\", \"Silver\", \"Bronze\"].enumerated()\nprint(medals.count)                        // the count is known without iterating\nprint(medals.last!)                        // take the last one directly\nprint(medals.reversed().map(\\.element))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"3\n(offset: 2, element: \"Bronze\")\n[\"Bronze\", \"Silver\", \"Gold\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"SwiftUI: hand enumerated() straight to List","code":"import SwiftUI\n\nstruct Leaderboard: View {\n    let players = [\"Ada\", \"Grace\", \"Linus\"]\n\n    var body: some View {\n        List(players.enumerated(), id: \\.offset) { item in\n            Text(\"No. \\(item.offset + 1): \\(item.element)\")\n        }\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"observations","release":"6.2","since":"6.2","title":"\u003ccode>Observations\u003c/code>: observe @Observable with an async sequence","plainTitle":"Observations: observe @Observable with an async sequence","en":"","line":4,"level":"key","short":"Observations","tags":"Observation Observable Observations async sequence observe transaction SwiftUI","tldr":"\u003ccode>Observations { … }\u003c/code> turns changes to an \u003ccode>@Observable\u003c/code> object into an async sequence. Several modifications inside one transaction produce just one update, and what you receive is always a consistent snapshot.","flag":"","se":[{"id":"SE-0475","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0475-observed.md","title":"Transactional Observation of Values"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Modify two properties at once and receive just one update","code":"import Observation\n\n@Observable\nfinal class Cart {\n    var count = 0\n    var total = 0.0\n}\n\n@MainActor\nfunc watch() async {\n    let cart = Cart()\n    let summaries = Observations { \"Items: \\(cart.count), total: $\\(cart.total)\" }\n\n    Task {\n        for price in [12.5, 30.0] {\n            cart.count += 1            // two modifications in the same transaction…\n            cart.total += price        // …produce only one update\n            try? await Task.sleep(for: .milliseconds(20))\n        }\n    }\n\n    var received = 0\n    for await summary in summaries {\n        print(summary)\n        received += 1\n        if received == 3 { break }\n    }\n}\n\nawait watch()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Items: 0, total: $0.0\nItems: 1, total: $12.5\nItems: 2, total: $42.5","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Outside SwiftUI, observing an \u003ccode>@Observable\u003c/code> used to require \u003ccode>withObservationTracking\u003c/code>, which notifies only once and has to be re-registered by hand. \u003ccode>Observations\u003c/code> solves that. 6.4 adds finer-grained control; see \u003ca href=\"#f-observation-tracking\">advanced observation tracking\u003c/a>."}]},{"id":"nonexhaustive","release":"6.2","since":"6.2.3","title":"\u003ccode>@nonexhaustive\u003c/code>: declare “more cases may be added later”","plainTitle":"@nonexhaustive: declare “more cases may be added later”","en":"","line":3,"level":"brief","short":"@nonexhaustive","tags":"enum nonexhaustive exhaustive unknown default package API evolution","tldr":"In an ordinary Swift package, adding a case to a public enum breaks the \u003ccode>switch\u003c/code> of every client. Mark it \u003ccode>@nonexhaustive\u003c/code> and other modules must write \u003ccode>@unknown default\u003c/code>, so adding cases later is no longer a breaking change.","flag":"","se":[{"id":"SE-0487","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0487-extensible-enums.md","title":"Nonexhaustive enums"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@nonexhaustive\npublic enum PaymentMethod {\n    case card\n    case cash\n}\n\n// Within the same module (or the same package) you can still switch exhaustively, with no @unknown default\nfunc label(for method: PaymentMethod) -> String {\n    switch method {\n    case .card: \"Card\"\n    case .cash: \"Cash\"\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"Previously only binary frameworks with library evolution turned on had this kind of “non-frozen enum”. This feature arrived in Swift 6.2.3."}]},{"id":"swiftpm-62","release":"6.2","since":"6.2","title":"Per-group warning control and automatic migration tooling","plainTitle":"Per-group warning control and automatic migration tooling","en":"","line":6,"level":"key","short":"Migration tooling","tags":"SwiftPM warnings treatWarning treatAllWarnings migrate migration upcoming feature fix-it","tldr":"SwiftPM can set warning levels per diagnostic group; \u003ccode>swift package migrate\u003c/code> analyzes which code turning on an upcoming feature would affect, and offers the changes directly.","flag":"","se":[{"id":"SE-0480","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0480-swiftpm-warning-control.md","title":"Warning Control Settings for SwiftPM"},{"id":"SE-0486","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0486-adoption-tooling-for-swift-features.md","title":"Migration tooling for Swift features"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":".target(\n    name: \"Core\",\n    swiftSettings: [\n        .treatAllWarnings(as: .error),                       // treat all warnings as errors…\n        .treatWarning(\"DeprecatedDeclaration\", as: .warning), // …except “deprecated API”\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"code","lang":"shell","title":"","code":"# analyze what enabling ExistentialAny would change, and apply the edits automatically\nswift package migrate --to-feature ExistentialAny","hl":"","check":"none"},{"type":"p","html":"The migration tool is especially useful for \u003ccode>NonisolatedNonsendingByDefault\u003c/code>: it automatically adds \u003ccode>@concurrent\u003c/code> to functions that need to keep the old behavior, so semantics are unchanged before and after you turn it on."}]},{"id":"testing-62","release":"6.2","since":"6.2","title":"Swift Testing: exit tests and attachments","plainTitle":"Swift Testing: exit tests and attachments","en":"","line":6,"level":"brief","short":"Exit tests","tags":"Swift Testing exit test precondition fatalError attachment","tldr":"An exit test can verify that “this code crashes the process” (for example by triggering a \u003ccode>precondition\u003c/code>); it runs in a separate child process. Attachments let you hang logs, screenshots, and other evidence on a test result.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\n\nfunc withdraw(_ amount: Int, from balance: Int) -> Int {\n    precondition(amount \u003c= balance, \"Insufficient balance\")\n    return balance - amount\n}\n\n@Test func overdraftStopsTheProcess() async {\n    await #expect(processExitsWith: .failure) {\n        _ = withdraw(100, from: 10)       // runs in a separate child process\n    }\n}\n\n@Test func attachServerLog() {\n    let log = \"GET /profile → 500\"\n    Attachment.record(log, named: \"server.log\")\n    #expect(log.contains(\"500\"))\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}}]},{"id":"platform-62","release":"6.2","since":"6.2","title":"WebAssembly, Embedded Swift, and the official VS Code extension","plainTitle":"WebAssembly, Embedded Swift, and the official VS Code extension","en":"","line":5,"level":"brief","short":"Wasm·VS Code","tags":"WebAssembly Wasm browser Embedded embedded VS Code editor Subprocess","tldr":"Swift 6.2 officially supports WebAssembly; Embedded Swift gets a complete \u003ccode>String\u003c/code> API, \u003ccode>InlineArray\u003c/code>, and \u003ccode>Span\u003c/code>; and swift.org starts publishing an official VS Code extension with background indexing, LLDB debugging, and live DocC preview.","flag":"","se":[],"links":[],"blocks":[{"type":"p","html":"Two more new packages are worth noting from the same period: \u003cstrong>Subprocess\u003c/strong> (version 0.1, launching and controlling child processes with async/await, reaching 1.0 around 6.4; see \u003ca href=\"#f-subprocess\">Subprocess 1.0\u003c/a>), and the new \u003cstrong>typed \u003ccode>NotificationCenter\u003c/code> messages\u003c/strong> in Foundation, which use concrete message types in place of string names and \u003ccode>userInfo\u003c/code> dictionaries."}]},{"id":"c-interop","release":"6.3","since":"6.3","title":"\u003ccode>@c\u003c/code>: let C call Swift directly","plainTitle":"@c: let C call Swift directly","en":"","line":5,"level":"core","short":"@c","tags":"C interop cdecl @_cdecl header embedded FFI @implementation","tldr":"Add \u003ccode>@c\u003c/code> to a global function or enum and the compiler generates it with the C calling convention and writes its declaration into the generated header, so C/C++ code can simply \u003ccode>#include\u003c/code> it and call it. It replaces the long-“unofficial” \u003ccode>@_cdecl\u003c/code>.","flag":"","se":[{"id":"SE-0495","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0495-cdecl.md","title":"C compatible functions and enums"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"MathKit.swift","code":"@c(MathKit_clamp)                       // you can pick the name on the C side\npublic func clamp(_ value: CInt, _ low: CInt, _ high: CInt) -> CInt {\n    min(max(value, low), high)\n}\n\n@c\npublic enum Direction: CInt {           // must have a C-compatible integer raw value type\n    case north, south\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"c","title":"The header the compiler generates (an excerpt of real output, from swiftc -emit-clang-header-path)","code":"typedef SWIFT_ENUM(int, Direction, closed) {\n  DirectionNorth = 0,\n  DirectionSouth = 1,\n};\n\nSWIFT_EXTERN int MathKit_clamp(int value, int low, int high) SWIFT_NOEXCEPT SWIFT_WARN_UNUSED_RESULT;","hl":"","check":"none"},{"type":"p","html":"In the other direction, if a C header \u003cstrong>already has\u003c/strong> a function declaration, you can write its implementation in Swift with \u003ccode>@c @implementation\u003c/code>. The compiler checks that the signatures on both sides match:"},{"type":"code","lang":"c","title":"geometry.h: an existing C declaration","code":"double area_of_circle(double radius);","hl":"","check":"none"},{"type":"code","lang":"swift","title":"geometry.swift: implemented in Swift","code":"@c @implementation\nfunc area_of_circle(_ radius: Double) -> Double {\n    .pi * radius * radius\n}","hl":"","check":"none"},{"type":"list","items":["An enum case becomes “type name + capitalized case name” on the C side, such as \u003ccode>DirectionNorth\u003c/code>.","The same release also allows \u003ccode>@objc\u003c/code> on global functions, whose signatures can use Objective-C types.","Recommended pattern: wrap a safe Swift API around the \u003ccode>@c\u003c/code> function, for example taking a \u003ccode>Span\u003c/code> instead of a pointer plus a length (the 6.4 release notes specifically recommend this)."]}]},{"id":"module-selectors","release":"6.3","since":"6.3","title":"Module selectors \u003ccode>Module::name\u003c/code>","plainTitle":"Module selectors Module::name","en":"","line":3,"level":"key","short":"Module selectors","tags":"module selector module name clash :: same name ambiguity disambiguation","tldr":"Two imported modules both have an API with the same name? Write \u003ccode>ModuleA::getValue()\u003c/code> to say exactly which module to look in. When your own type shares a name with a standard library one, \u003ccode>Swift::\u003c/code> gets you the standard library's.","flag":"","se":[{"id":"SE-0491","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0491-module-selectors.md","title":"Module selectors for name disambiguation"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Your own Task has the same name as the standard library's","code":"struct Task {\n    var title: String\n}\n\nlet todo = Task(title: \"Write weekly report\")      // our own Task\n\nlet job = Swift::Task {                            // the standard library's concurrency Task\n    print(\"Working in the background:\", todo.title)\n}\nawait job.value","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Working in the background: Write weekly report","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Before, the only way out of such a clash was \u003ccode>Swift.Task\u003c/code>. But if some module happens to have a type called \u003ccode>Swift\u003c/code>, or a module has the same name as one of its types (such as \u003ccode>XCTest.XCTest\u003c/code>), dot syntax breaks down. \u003ccode>::\u003c/code> always and only means “module”, so there is no ambiguity:"},{"type":"code","lang":"swift","title":"","code":"import ModuleA\nimport ModuleB\n\nlet x = ModuleA::getValue()     // calls ModuleA's getValue\nlet y = ModuleB::getValue()     // calls ModuleB's getValue","hl":"","check":"none"}]},{"id":"perf-attrs","release":"6.3","since":"6.3","title":"Three optimization wrenches for library authors: \u003ccode>@specialized\u003c/code>, \u003ccode>@inline(always)\u003c/code>, \u003ccode>@export\u003c/code>","plainTitle":"Three optimization wrenches for library authors: @specialized, @inline(always), @export","en":"","line":2,"level":"key","short":"Optimization control","tags":"specialize specialized inline always export implementation interface optimization generics library performance","tldr":"Three attributes that let a library's author control how the compiler optimizes “code that calls me”: pre-generate specialized versions of generics, guarantee inlining, and expose a function's implementation to callers.","flag":"","se":[{"id":"SE-0460","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0460-specialized.md","title":"Explicit Specialization"},{"id":"SE-0496","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0496-inline-always.md","title":"`@inline(always)` attribute"},{"id":"SE-0497","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0497-definition-visibility.md","title":"Controlling function definition visibility in clients"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"extension Sequence where Element: BinaryInteger {\n    @specialized(where Self == [Int])        // pre-generate a specialization for [Int]\n    @specialized(where Self == [UInt8])\n    public func total() -> Int {\n        reduce(0) { $0 + Int($1) }\n    }\n}\n\n@inline(always)                              // guarantee that every direct call site is inlined\npublic func fastAbs(_ x: Int) -> Int {\n    x \u003c 0 ? -x : x\n}\n\n@export(implementation)                      // provide the body to callers, enabling cross-module optimization\npublic func clampPercent(_ x: Double) -> Double {\n    min(max(x, 0), 100)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"table","head":["Attribute","What it does","Replaces"],"rows":[["\u003ccode>@specialized(where …)\u003c/code>","Pre-generates generic specializations for common types in the library; the generic version checks the type at its entry and forwards to the specialization","\u003ccode>@_specialize\u003c/code>"],["\u003ccode>@inline(always)\u003c/code>","Guarantees a direct call is inlined; if it can't be done, it's an error rather than silently ignored","\u003ccode>@inline(__always)\u003c/code>"],["\u003ccode>@export(implementation)\u003c/code>","The function body is visible to callers, which can inline and specialize it","\u003ccode>@_alwaysEmitIntoClient\u003c/code>"],["\u003ccode>@export(interface)\u003c/code>","Exports only a callable symbol and hides the implementation","\u003ccode>@_neverEmitIntoClient\u003c/code>"]]},{"type":"p","html":"These attributes mainly target authors of libraries that ship binary frameworks and chase peak performance. Application developers usually don't need to touch them; overusing \u003ccode>@inline(always)\u003c/code> only bloats code size."}]},{"id":"section","release":"6.3","since":"6.3","title":"\u003ccode>@section\u003c/code> and \u003ccode>@used\u003c/code>: put data into a specific section","plainTitle":"@section and @used: put data into a specific section","en":"","line":2,"level":"brief","short":"@section","tags":"section linker used embedded plugin static initialization constant","tldr":"Place a global variable in a named section of the object file, and use \u003ccode>@used\u003c/code> to stop the linker from deleting it as “unused”. Common in embedded development and “linker collection” style plugin registration.","flag":"","se":[{"id":"SE-0492","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0492-section-control.md","title":"Section Placement Control"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"#if objectFormat(MachO)\n@section(\"__DATA,plugins\")\n#else\n@section(\"plugins\")\n#endif\n@used\nlet pluginVersion: Int = 3        // the initial value must be a compile-time constant","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"The new conditions \u003ccode>#if objectFormat(MachO)\u003c/code>, \u003ccode>objectFormat(ELF)\u003c/code>, and \u003ccode>objectFormat(COFF)\u003c/code> handle the different rules each object file format has for section names."}]},{"id":"weak-let","release":"6.3","since":"6.3","title":"\u003ccode>weak let\u003c/code>: immutable weak references","plainTitle":"weak let: immutable weak references","en":"","line":1,"level":"key","short":"weak let","tags":"weak let weak reference Sendable immutable retain cycle capture","tldr":"Until now \u003ccode>weak\u003c/code> could only be paired with \u003ccode>var\u003c/code>, so a class with a weak property could never be \u003ccode>Sendable\u003c/code>. Now you can write \u003ccode>weak let\u003c/code>: it can't be changed after initialization, but it still becomes \u003ccode>nil\u003c/code> automatically when the object is released.","flag":"ImmutableWeakCaptures","se":[{"id":"SE-0481","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0481-weak-let.md","title":"`weak let`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Before: a weak var in a Sendable class is always an error","code":"final class TreeNode: Sendable {\n    weak var parent: TreeNode?\n\n    init(parent: TreeNode?) {\n        self.parent = parent\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:14: error: stored property 'parent' of 'Sendable'-conforming class 'TreeNode' is mutable\n1 | final class TreeNode: Sendable {\n2 |     weak var parent: TreeNode?\n  |              `- error: stored property 'parent' of 'Sendable'-conforming class 'TreeNode' is mutable\n3 | \n4 |     init(parent: TreeNode?) {","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.3: weak let","code":"final class TreeNode: Sendable {\n    weak let parent: TreeNode?        // assigned only during initialization\n    let name: String\n\n    init(name: String, parent: TreeNode?) {\n        self.name = name\n        self.parent = parent\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"The upcoming feature \u003ccode>ImmutableWeakCaptures\u003c/code> applies the same idea to closure captures: variables captured with \u003ccode>[weak self]\u003c/code> become immutable, so such closures can be \u003ccode>@Sendable\u003c/code>."}]},{"id":"clock-epochs","release":"6.3","since":"6.3","title":"Clock epochs with \u003ccode>systemEpoch\u003c/code>","plainTitle":"Clock epochs with systemEpoch","en":"","line":4,"level":"brief","short":"Clock epochs","tags":"Clock ContinuousClock SuspendingClock epoch time Instant","tldr":"\u003ccode>ContinuousClock\u003c/code> and \u003ccode>SuspendingClock\u003c/code> gain a \u003ccode>systemEpoch\u003c/code> property, the “zero point” of that clock on this machine.","flag":"","se":[{"id":"SE-0473","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0473-clock-epochs.md","title":"Clock Epochs"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let clock = ContinuousClock()\nlet sinceEpoch = clock.now - clock.systemEpoch\nprint(sinceEpoch > .zero)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"The epoch is “system-dependent” and not comparable across machines, so it isn't suitable for serialization. It's useful for converting to and from other timing APIs on the system (such as kernel timestamps)."}]},{"id":"codable-errors","release":"6.3","since":"6.3","title":"A \u003ccode>DecodingError\u003c/code> that's easier to read","plainTitle":"A DecodingError that's easier to read","en":"","line":4,"level":"brief","short":"Decoding errors","tags":"Codable Decodable JSONDecoder DecodingError EncodingError error message debugging JSON","tldr":"\u003ccode>EncodingError\u003c/code> and \u003ccode>DecodingError\u003c/code> now conform to \u003ccode>CustomDebugStringConvertible\u003c/code>, and the message they print says clearly which field, what type was expected, and what was actually found.","flag":"","se":[{"id":"SE-0489","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0489-codable-error-printing.md","title":"Improve `EncodingError` and `DecodingError`'s printed descriptions"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Below is the real printed result from Swift 6.4.2","code":"import Foundation\n\nstruct User: Decodable {\n    let name: String\n    let age: Int\n}\n\nlet json = Data(#\"{\"name\": \"Lin\", \"age\": \"eighteen\"}\"#.utf8)\ndo {\n    _ = try JSONDecoder().decode(User.self, from: json)\n} catch {\n    print(error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"DecodingError.typeMismatch: Expected value of type Int. Path: age. Debug description: Expected to decode Int but found a string instead.","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"The proposal makes a point of saying that the output format is not stable API: don't use string matching to tell kinds of errors apart; inspect the error's properties directly when you need to."}]},{"id":"android","release":"6.3","since":"6.3","title":"The official Swift SDK for Android","plainTitle":"The official Swift SDK for Android","en":"","line":5,"level":"key","short":"Android","tags":"Android SDK cross-compilation Kotlin Java JNI cross-platform","tldr":"Swift 6.3 ships the first official Android SDK. You can write native Android apps in Swift, compile an existing Swift package for Android, or plug Swift code into an existing Kotlin/Java app through Swift Java and JNI.","flag":"","se":[],"links":[],"blocks":[{"type":"p","html":"This is the result of the Android workgroup moving the SDK from “nightly builds” to a proper release. Together with \u003ca href=\"#f-package-traits\">6.1's package traits\u003c/a>, one Swift package can turn features on or trim them depending on the platform. By \u003ca href=\"#f-interop-64\">6.4\u003c/a>, the Android SDK is built on an LTS NDK, and SwiftPM can build directly for Android through Swift Build."},{"type":"p","html":"In the same release, Embedded Swift improved its C interop and debugging support, and made progress on its linking model."}]},{"id":"testing-63","release":"6.3","since":"6.3","title":"Swift Testing: warning-level issues, test cancellation, and image attachments","plainTitle":"Swift Testing: warning-level issues, test cancellation, and image attachments","en":"","line":6,"level":"brief","short":"Warnings & cancel","tags":"Swift Testing Issue severity warning cancel cancellation attachment image","tldr":"\u003ccode>Issue.record(…, severity: .warning)\u003c/code> records a problem without failing the test; \u003ccode>try Test.cancel()\u003c/code> can cancel a running test midway; attachments support common image formats.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\n\n@Test func slowButAcceptable() {\n    Issue.record(\"Response took 1.8 s, a bit slow\", severity: .warning)   // on record, but the test still passes\n}\n\n@Test(arguments: [\"zh\", \"en\", \"ja\"])\nfunc localizedStrings(language: String) throws {\n    if language == \"ja\" {\n        try Test.cancel(\"Japanese resources aren't ready yet\")    // cancels just this one argument case\n    }\n    #expect(!language.isEmpty)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}}]},{"id":"swiftpm-63","release":"6.3","since":"6.3","title":"SwiftPM: viewing package traits, and the Swift Build preview","plainTitle":"SwiftPM: viewing package traits, and the Swift Build preview","en":"","line":6,"level":"brief","short":"show-traits","tags":"SwiftPM traits show-traits Swift Build swift-syntax macro build","tldr":"\u003ccode>swift package show-traits\u003c/code> lists every trait a package supports; the new cross-platform build engine Swift Build is integrated into SwiftPM as a preview; and shared libraries that only macros depend on can use a prebuilt swift-syntax.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# see which traits this package offers\nswift package show-traits\n\n# try the new build system (the default since 6.4)\nswift build --build-system swiftbuild","hl":"","check":"none"}]},{"id":"async-defer","release":"6.4","since":"6.4","title":"\u003ccode>defer\u003c/code> can \u003ccode>await\u003c/code> now","plainTitle":"defer can await now","en":"","line":1,"level":"core","short":"async defer","tags":"defer async await cleanup resource close asynchronous","tldr":"In an async function, a \u003ccode>defer\u003c/code> block can now contain \u003ccode>await\u003c/code>. When the scope exits, the async cleanup is waited for in full before the function actually returns.","flag":"","se":[{"id":"SE-0493","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0493-defer-async.md","title":"Support `async` calls in `defer` bodies"}],"links":[],"blocks":[{"type":"p","html":"To do async cleanup before, you had to write it by hand ahead of every \u003ccode>return\u003c/code> and \u003ccode>catch\u003c/code>, or start a \u003ccode>Task { }\u003c/code> inside \u003ccode>defer\u003c/code>, which guarantees neither the execution order nor that it finishes before the function returns."},{"type":"code","lang":"swift","title":"Async cleanup is guaranteed to run too","code":"struct Connection {\n    func send(_ message: String) async throws { print(\"Sending:\", message) }\n    func close() async { print(\"Connection closed\") }\n}\n\nfunc sync(over connection: Connection) async throws {\n    defer { await connection.close() }\n    try await connection.send(\"Hello\")\n    try await connection.send(\"Goodbye\")\n}\n\ntry await sync(over: Connection())","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Sending: Hello\nSending: Goodbye\nConnection closed","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"\u003ccode>await\u003c/code> can only appear in a context that is itself \u003ccode>async\u003c/code>; the \u003ccode>defer\u003c/code> of a synchronous function still can't suspend:"},{"type":"code","lang":"swift","title":"Not in a synchronous function","code":"func cleanup() async {}\n\nfunc work() {\n    defer { await cleanup() }\n    print(\"Working\")\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:4:5: error: 'async' defer must appear within an 'async' context\n2 | \n3 | func work() {\n4 |     defer { await cleanup() }\n  |     `- error: 'async' defer must appear within an 'async' context\n5 |     print(\"Working\")\n6 | }","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"cancel-shield","release":"6.4","since":"6.4","title":"Cancellation shields: \u003ccode>withTaskCancellationShield\u003c/code>","plainTitle":"Cancellation shields: withTaskCancellationShield","en":"","line":1,"level":"core","short":"Cancellation shield","tags":"cancellation shield Task isCancelled cleanup defer","tldr":"After a task is cancelled, network requests and file writes in its cleanup code often give up early because they “see the cancellation”. Wrap them in \u003ccode>withTaskCancellationShield { }\u003c/code> and the code inside runs to completion as if the task had not been cancelled.","flag":"","se":[{"id":"SE-0504","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0504-task-cancellation-shields.md","title":"Task Cancellation Shields"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"func flushLogs() async {\n    print(\"  Cancellation state seen while uploading logs:\", Task.isCancelled)\n}\n\nlet task = Task {\n    try? await Task.sleep(for: .seconds(10))      // wakes up immediately once cancelled\n    print(\"Was the task cancelled?\", Task.isCancelled)\n    await withTaskCancellationShield {\n        await flushLogs()                           // inside the shield, the cancellation is “invisible”\n    }\n}\ntask.cancel()\nawait task.value","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Was the task cancelled? true\n  Cancellation state seen while uploading logs: false","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"It pairs perfectly with \u003ca href=\"#f-async-defer\">\u003ccode>async defer\u003c/code>\u003c/a>, and that is exactly how the official release notes use it:"},{"type":"code","lang":"swift","title":"However you exit, finish reporting the metrics","code":"func uploadMetrics(for path: String) async {}\nfunc parse(_ path: String) async throws {}\n\nfunc processFile(at path: String) async throws {\n    defer {\n        await withTaskCancellationShield {\n            await uploadMetrics(for: path)     // runs to completion even if the task has been cancelled\n        }\n    }\n    try await parse(path)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["The shield does \u003cstrong>not\u003c/strong> stop the task from being cancelled; it only makes the code inside the shield unable to observe the cancellation. After you leave the shield, \u003ccode>Task.isCancelled\u003c/code> is still \u003ccode>true\u003c/code>.","Child tasks created inside the shield (\u003ccode>async let\u003c/code>, task groups) aren't automatically cancelled either.","Put only cleanup that truly must finish in there; don't use it to “ignore cancellation”."]}]},{"id":"task-unused","release":"6.4","since":"6.4","title":"A discarded “throwing Task” gets a warning","plainTitle":"A discarded “throwing Task” gets a warning","en":"","line":1,"level":"brief","short":"Task warning","tags":"Task warning error swallow discardableResult throws unused","tldr":"If nobody keeps the return value of \u003ccode>Task { try await … }\u003c/code>, any error thrown inside it is silently swallowed. 6.4 warns about this; a \u003ccode>Task\u003c/code> that doesn't throw is unaffected.","flag":"","se":[{"id":"SE-0520","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0520-discardableresult-task-initializers.md","title":"Discardable result use in Task initializers"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"The error is silently swallowed","code":"struct UploadError: Error {}\nfunc upload() async throws { throw UploadError() }\n\nfunc start() {\n    Task {\n        try await upload()\n    }\n}","hl":"","check":"warning","flags":"-swift-version 6","result":{"status":"warning","diagnostics":"main.swift:5:5: warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n3 | \n4 | func start() {\n5 |     Task {\n  |     |- warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n  |     `- note: to silence this warning, handle the error inside the task, or store/discard the task value explicitly\n6 |         try await upload()\n7 |     }\n\n[#NoUseUnstructuredThrowingTask]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/no-use-throwing-unstructured-task>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Handle the error inside the task, or discard it explicitly","code":"struct UploadError: Error {}\nfunc upload() async throws { throw UploadError() }\n\nfunc start() {\n    Task {\n        do { try await upload() } catch { print(\"Upload failed:\", error) }\n    }\n    _ = Task { try await upload() }      // explicitly say “I don't care about the result”\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"tilde-sendable","release":"6.4","since":"6.4","title":"\u003ccode>~Sendable\u003c/code>: explicitly declare “I am not Sendable”","plainTitle":"~Sendable: explicitly declare “I am not Sendable”","en":"","line":1,"level":"brief","short":"~Sendable","tags":"Sendable ~Sendable non-Sendable audit subclass unchecked","tldr":"Until now, “not \u003ccode>Sendable\u003c/code>” could only be expressed by writing nothing, so you couldn't tell an audited, deliberate choice from a forgotten annotation. Now you can write \u003ccode>~Sendable\u003c/code> to say explicitly “this type isn't thread-safe”.","flag":"","se":[{"id":"SE-0518","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0518-tilde-sendable.md","title":"`~Sendable` for explicitly marking non-`Sendable` types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"public class Pipeline: ~Sendable {          // audited: the base class itself is not thread-safe\n    var stages: [String] = []\n}\n\nfinal class LockedPipeline: Pipeline, @unchecked Sendable {\n    // the subclass protects its state with a lock itself, so it may be declared Sendable\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"\u003ccode>~Sendable\u003c/code> also stops the compiler from inferring \u003ccode>Sendable\u003c/code> automatically for structs and enums, and it silences false positives from checks that require “every public type to declare Sendable explicitly”."}]},{"id":"continuation","release":"6.4","since":"6.4","title":"The new \u003ccode>Continuation\u003c/code>: a continuation that can't be resumed twice","plainTitle":"The new Continuation: a continuation that can't be resumed twice","en":"","line":1,"level":"key","short":"Continuation","tags":"Continuation withContinuation CheckedContinuation UnsafeContinuation callback bridging resume ~Copyable","tldr":"The \u003ccode>Continuation\u003c/code> that \u003ccode>withContinuation\u003c/code> provides is \u003ccode>~Copyable\u003c/code>, and \u003ccode>resume\u003c/code> consumes it. “Resuming twice” is a compile-time error, with none of \u003ccode>CheckedContinuation\u003c/code>'s runtime overhead.","flag":"","se":[{"id":"SE-0528","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0528-noncopyable-continuation.md","title":"`Continuation` — Safe and Performant Async Continuations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Store a waiter and resume it later","code":"actor Doorbell {\n    private var waiter: Continuation\u003cString, Never>?\n\n    func wait() async -> String {\n        await withContinuation(of: String.self) { continuation in\n            waiter = consume continuation           // move it into the stored property\n        }\n    }\n\n    func ring(_ visitor: String) {\n        waiter.take()?.resume(returning: visitor)   // take() removes it and leaves nil, so it is resumed at most once\n    }\n}\n\nlet bell = Doorbell()\nasync let visitor = bell.wait()\ntry? await Task.sleep(for: .milliseconds(50))\nawait bell.ring(\"Courier\")\nprint(await visitor)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Courier","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Resume twice? A compile-time error","code":"func twice() async -> Int {\n    await withContinuation(of: Int.self) { continuation in\n        continuation.resume(returning: 1)\n        continuation.resume(returning: 2)\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:44: error: 'continuation' consumed more than once\n1 | func twice() async -> Int {\n2 |     await withContinuation(of: Int.self) { continuation in\n  |                                            `- error: 'continuation' consumed more than once\n3 |         continuation.resume(returning: 1)\n  |         `- note: consumed here\n4 |         continuation.resume(returning: 2)\n  |         `- note: consumed again here\n5 |     }\n6 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"However, a typical “callback-style API” takes an escaping closure, and the compiler can't guarantee that an escaping closure runs exactly once, so a noncopyable continuation can't be consumed inside one:"},{"type":"code","lang":"swift","title":"It can't be consumed inside an escaping closure","code":"func legacyFetch(_ done: @escaping @Sendable (String) -> Void) { done(\"data\") }\n\nfunc fetch() async -> String {\n    await withContinuation(of: String.self) { continuation in\n        legacyFetch { value in continuation.resume(returning: value) }\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:5:32: error: noncopyable 'continuation' cannot be consumed when captured by an escaping closure or borrowed by a non-Escapable type\n3 | func fetch() async -> String {\n4 |     await withContinuation(of: String.self) { continuation in\n5 |         legacyFetch { value in continuation.resume(returning: value) }\n  |                                `- error: noncopyable 'continuation' cannot be consumed when captured by an escaping closure or borrowed by a non-Escapable type\n6 |     }\n7 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"In that situation you can convert it to a \u003ccode>CheckedContinuation(continuation)\u003c/code>, with runtime checks as the safety net. If the new type is destroyed without having been resumed, it triggers a \u003ccode>fatalError\u003c/code> directly, instead of leaving the task that is waiting on it suspended forever."}]},{"id":"optional-some","release":"6.4","since":"6.4","title":"\u003ccode>some P?\u003c/code>: optional opaque and existential types without parentheses","plainTitle":"some P?: optional opaque and existential types without parentheses","en":"","line":3,"level":"key","short":"some P?","tags":"some any opaque existential optional parentheses","tldr":"You used to have to write \u003ccode>(some Shape)?\u003c/code> and \u003ccode>(any Shape)?\u003c/code>; now \u003ccode>some Shape?\u003c/code> and \u003ccode>any Shape?\u003c/code> mean the same thing.","flag":"","se":[{"id":"SE-0521","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0521-improved-optional-opaque-and-any.md","title":"Improved Syntax for Optionals of Opaque and Existential Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"protocol Shape {\n    var area: Double { get }\n}\n\nstruct Square: Shape {\n    var side: Double\n    var area: Double { side * side }\n}\n\nfunc largest(_ sides: [Double]) -> some Shape? {     // before: (some Shape)?\n    sides.max().map { Square(side: $0) }\n}\n\nlet shape: any Shape? = largest([2, 5, 3])           // before: (any Shape)?\nprint(shape?.area ?? 0)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"25.0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Composition types still need parentheses to remove ambiguity: write \u003ccode>any (P &amp; Q)?\u003c/code>, while \u003ccode>any P &amp; Q?\u003c/code> is still an error."}]},{"id":"diagnose","release":"6.4","since":"6.4","title":"\u003ccode>@diagnose\u003c/code>: control one class of warnings in source","plainTitle":"@diagnose: control one class of warnings in source","en":"","line":6,"level":"key","short":"@diagnose","tags":"diagnose warning diagnostic group ignored error deprecated","tldr":"\u003ccode>@diagnose(group, as: ignored/warning/error)\u003c/code> changes the level of one group of warnings only within the annotated declaration: silence it in legacy code that is mid-migration, or upgrade a warning to an error on a critical path.","flag":"","se":[{"id":"SE-0522","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0522-source-warning-control.md","title":"Source-Level Control Over Compiler Warnings"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Ignore “deprecated” warnings in this function only","code":"@available(*, deprecated, message: \"Use newAPI() instead\")\nfunc oldAPI() {}\n\n@diagnose(DeprecatedDeclaration, as: ignored, reason: \"Being migrated; removed in the next release\")\nfunc legacyBridge() {\n    oldAPI()          // no warning here anymore\n}\n\nfunc elsewhere() {\n    oldAPI()          // everywhere else still warns as usual\n}","hl":"","check":"warning","flags":"-swift-version 6","result":{"status":"warning","diagnostics":"main.swift:10:5: warning: 'oldAPI()' is deprecated: Use newAPI() instead [#DeprecatedDeclaration]\n 8 | \n 9 | func elsewhere() {\n10 |     oldAPI()          // everywhere else still warns as usual\n   |     `- warning: 'oldAPI()' is deprecated: Use newAPI() instead [#DeprecatedDeclaration]\n11 | }\n12 | \n\n[#DeprecatedDeclaration]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/deprecated-declaration>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"The other way around: upgrade a warning to an error in critical code","code":"@available(*, deprecated)\nfunc oldAPI() {}\n\n@diagnose(DeprecatedDeclaration, as: error)\nfunc paymentFlow() {\n    oldAPI()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:6:5: error: 'oldAPI()' is deprecated [#DeprecatedDeclaration]\n4 | @diagnose(DeprecatedDeclaration, as: error)\n5 | func paymentFlow() {\n6 |     oldAPI()\n  |     `- error: 'oldAPI()' is deprecated [#DeprecatedDeclaration]\n7 | }\n8 | \n\n[#DeprecatedDeclaration]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/deprecated-declaration>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"A group's name is the name in square brackets at the end of a diagnostic (for example the \u003ccode>[#DeprecatedDeclaration]\u003c/code> in the output above). The command-line \u003ccode>-Werror\u003c/code> / \u003ccode>-Wwarning\u003c/code> (\u003ca href=\"#f-warning-flags\">6.1\u003c/a>) set the global default; \u003ccode>@diagnose\u003c/code> overrides it locally on top of that, and nested declarations can override again."}]},{"id":"memberwise-private","release":"6.4","since":"6.4","title":"The memberwise initializer is no longer held hostage by private properties","plainTitle":"The memberwise initializer is no longer held hostage by private properties","en":"","line":3,"level":"brief","short":"Memberwise init","tags":"memberwise init initializer private struct default value","tldr":"As soon as a struct has one \u003ccode>private\u003c/code> property with a default value, the compiler-generated memberwise initializer becomes entirely \u003ccode>private\u003c/code> and unusable from outside. From 6.4 such properties are excluded from the initializer's parameters.","flag":"","se":[{"id":"SE-0502","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0502-exclude-private-from-memberwise-init.md","title":"Exclude private initialized properties from memberwise initializer"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Article {\n    var title: String\n    var author: String\n    private var viewCount = 0           // a private property with a default value\n\n    var summary: String { \"\\(title) / \\(author) / views \\(viewCount)\" }\n}\n\n// Before 6.4: the generated init(title:author:viewCount:) is private, and this line is an error\nlet article = Article(title: \"What's new in Swift 6.4\", author: \"Swift Club\")\nprint(article.summary)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"What's new in Swift 6.4 / Swift Club / views 0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"For compatibility, the old initializer signature that includes every property is still available in existing language modes (where it was already accessible)."}]},{"id":"array-trailing-closure","release":"6.4","since":"6.4","title":"Array and dictionary types can be followed by a trailing closure","plainTitle":"Array and dictionary types can be followed by a trailing closure","en":"","line":3,"level":"brief","short":"[T] { }","tags":"trailing closure result builder array dictionary DSL","tldr":"\u003ccode>[String] { … }\u003c/code> used to be parsed as something else and was an error; now it's treated as a call to \u003ccode>init(_:)\u003c/code> with a trailing closure, which makes DSLs built with result builders more natural.","flag":"","se":[{"id":"SE-0508","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0508-array-expression-trailing-closures.md","title":"Array expression trailing closures"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@resultBuilder\nenum ListBuilder\u003cElement> {\n    static func buildBlock(_ items: Element...) -> [Element] { items }\n}\n\nextension Array {\n    init(@ListBuilder\u003cElement> _ make: () -> [Element]) {\n        self = make()\n    }\n}\n\nlet fruits = [String] {\n    \"Apple\"\n    \"Banana\"\n    \"Cherry\"\n}\nprint(fruits)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[\"Apple\", \"Banana\", \"Cherry\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"any-apple-os","release":"6.4","since":"6.4","title":"\u003ccode>anyAppleOS\u003c/code>: write availability for all Apple platforms at once","plainTitle":"anyAppleOS: write availability for all Apple platforms at once","en":"","line":5,"level":"brief","short":"anyAppleOS","tags":"availability available anyAppleOS iOS macOS watchOS visionOS platform","tldr":"Now that Apple's platforms share a unified OS version number, one line \u003ccode>@available(anyAppleOS 26, *)\u003c/code> replaces the long list \u003ccode>iOS 26, macOS 26, watchOS 26, tvOS 26, visionOS 26\u003c/code>.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@available(anyAppleOS 26, *)\nfunc newFeature() -> String { \"New API is available\" }\n\nif #available(anyAppleOS 26, *) {\n    print(newFeature())\n} else {\n    print(\"Using the old implementation\")\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"New API is available","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"borrow-mutate","release":"6.4","since":"6.4","title":"\u003ccode>borrow\u003c/code> / \u003ccode>mutate\u003c/code> accessors: read and write properties without copying","plainTitle":"borrow / mutate accessors: read and write properties without copying","en":"","line":2,"level":"core","short":"borrow·mutate","tags":"borrow mutate accessor get set _read _modify copy ~Copyable performance","tldr":"A computed property's \u003ccode>get\u003c/code> always returns a \u003cstrong>copy\u003c/strong>: wasteful for big values and flatly impossible for noncopyable ones. A \u003ccode>borrow\u003c/code> accessor lends out the storage directly, and a \u003ccode>mutate\u003c/code> accessor hands out a mutable reference directly.","flag":"","se":[{"id":"SE-0507","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0507-borrow-accessors.md","title":"Borrow and Mutate Accessors"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Sensor: ~Copyable {\n    var readings: [4 of Double] = [0, 0, 0, 0]\n}\n\nstruct Station: ~Copyable {\n    private var _sensor = Sensor()\n\n    var sensor: Sensor {\n        borrow { return _sensor }        // lend it out read-only, no copy\n        mutate { return &_sensor }       // hand out a mutable reference to modify in place\n    }\n}\n\nvar station = Station()\nstation.sensor.readings[2] = 36.6       // goes through mutate\nprint(station.sensor.readings[2])       // goes through borrow","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"36.6","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["Before, the standard library used underscored \u003ccode>_read\u003c/code> / \u003ccode>_modify\u003c/code> coroutine accessors internally; \u003ccode>borrow\u003c/code> / \u003ccode>mutate\u003c/code> need no coroutine and cost less.","For cases where you need to run code before and after the access (such as taking a lock), there are \u003ccode>yielding borrow\u003c/code> / \u003ccode>yielding mutate\u003c/code> from another proposal.","The 6.4 release notes specifically mention that a property can use these to expose a \u003ccode>Span\u003c/code> or \u003ccode>InlineArray\u003c/code> directly for reading and modification."]}]},{"id":"noncopyable-protocols","release":"6.4","since":"6.4","title":"Noncopyable types can be \u003ccode>Equatable\u003c/code>, \u003ccode>Comparable\u003c/code>, and \u003ccode>Hashable\u003c/code> too","plainTitle":"Noncopyable types can be Equatable, Comparable, and Hashable too","en":"","line":2,"level":"brief","short":"~Copyable protocols","tags":"Equatable Hashable Comparable ~Copyable ~Escapable protocol borrowing","tldr":"The standard library changed the requirements of \u003ccode>Equatable\u003c/code>, \u003ccode>Comparable\u003c/code>, and \u003ccode>Hashable\u003c/code> to use \u003ccode>borrowing\u003c/code> parameters, so noncopyable and nonescapable types can conform to them.","flag":"","se":[{"id":"SE-0499","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0499-support-non-copyable-simple-protocols.md","title":"Support ~Copyable, ~Escapable in simple standard library protocols"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct AccessKey: ~Copyable, Hashable {\n    let raw: UInt64\n\n    static func == (a: borrowing AccessKey, b: borrowing AccessKey) -> Bool {\n        a.raw == b.raw\n    }\n\n    func hash(into hasher: inout Hasher) {\n        hasher.combine(raw)\n    }\n}\n\nlet k1 = AccessKey(raw: 42)\nlet k2 = AccessKey(raw: 42)\nprint(k1 == k2, k1 != AccessKey(raw: 7))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true true","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Note: \u003ccode>Set\u003c/code> and \u003ccode>Dictionary\u003c/code> still require copyable elements, so noncopyable types can't go in them yet."}]},{"id":"unique-box-array","release":"6.4","since":"6.4","title":"\u003ccode>UniqueBox\u003c/code> and \u003ccode>UniqueArray\u003c/code>: heap memory with a single owner","plainTitle":"UniqueBox and UniqueArray: heap memory with a single owner","en":"","line":2,"level":"core","short":"UniqueArray","tags":"UniqueArray UniqueBox Box heap ownership ~Copyable copy-on-write COW vector Vec unique_ptr","tldr":"\u003ccode>UniqueArray\u003c/code> is a dynamic array with no copy-on-write and no reference counting, whose elements may be noncopyable; \u003ccode>UniqueBox\u003c/code> puts a value on the heap and owns it exclusively. Both are \u003ccode>~Copyable\u003c/code>, so assignment is a \u003cstrong>move\u003c/strong>.","flag":"","se":[{"id":"SE-0517","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0517-uniquebox.md","title":"UniqueBox"},{"id":"SE-0527","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0527-rigidarray-uniquearray.md","title":"UniqueArray"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Frame: ~Copyable {\n    let index: Int\n    deinit { print(\"Freed frame \\(index)\") }\n}\n\nfunc render() {\n    var frames = UniqueArray\u003cFrame>()         // elements may be noncopyable\n    frames.append(Frame(index: 1))\n    frames.append(Frame(index: 2))\n    print(\"\\(frames.count) frames in total\")\n\n    var buffer = UniqueBox\u003c[1024 of UInt8]>(.init(repeating: 0))   // put 1 KB on the heap\n    buffer.value[0] = 0xFF\n    print(\"First byte:\", buffer.value[0])\n}                                              // leaving the scope: freed automatically\n\nrender()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"2 frames in total\nFirst byte: 255\nFreed frame 1\nFreed frame 2","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>UniqueArray\u003c/code> is like C++'s \u003ccode>std::vector\u003c/code> and Rust's \u003ccode>Vec\u003c/code>: it grows automatically but always has exactly one owner, and \u003ccode>let b = a\u003c/code> invalidates \u003ccode>a\u003c/code>.","\u003ccode>UniqueBox\u003c/code> is like \u003ccode>unique_ptr\u003c/code> / \u003ccode>Box&lt;T&gt;\u003c/code>: good for very large values (avoiding stack copies) or recursive data structures.","For ordinary business code, \u003ccode>Array\u003c/code> is still the first choice; these two types target performance-sensitive code that needs determinism."]}]},{"id":"ref","release":"6.4","since":"6.4","title":"\u003ccode>Ref\u003c/code> and \u003ccode>MutableRef\u003c/code>: first-class references","plainTitle":"Ref and MutableRef: first-class references","en":"","line":2,"level":"key","short":"Ref","tags":"Ref MutableRef reference borrow inout ~Escapable lifetime","tldr":"\u003ccode>borrowing\u003c/code> and \u003ccode>inout\u003c/code> can only appear on parameters. \u003ccode>Ref\u003c/code> / \u003ccode>MutableRef\u003c/code> turn “borrowing” into a value you can store in a local variable and pass around, with its lifetime checked by the compiler.","flag":"","se":[{"id":"SE-0519","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0519-ref-mutableref-types.md","title":"`Ref` and `MutableRef` types for safe, first-class references"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Settings: ~Copyable {\n    var volume = 50\n}\n\nfunc demo() {\n    var settings = Settings()\n\n    do {\n        var editor = MutableRef(&settings)   // borrows settings exclusively\n        editor.value.volume += 10\n        // while editor is alive, settings can't be accessed directly\n    }\n    print(settings.volume)\n\n    let viewer = Ref(settings)               // shared borrow: read-only\n    print(viewer.value.volume)\n}\n\ndemo()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"60\n60","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Both are \u003ccode>~Escapable\u003c/code> and can't outlive the value they refer to. Think of them as a safe version of pointers: “dangling” and “aliasing conflicts” are both ruled out at compile time."}]},{"id":"iterable","release":"6.4","since":"6.4","title":"\u003ccode>Iterable\u003c/code>: borrowing iteration","plainTitle":"Iterable: borrowing iteration","en":"","line":2,"level":"key","short":"Iterable","tags":"Iterable Sequence for-in iteration borrowing iterator ~Copyable InlineArray UniqueArray Span","tldr":"A \u003ccode>Sequence\u003c/code>'s iterator has to \u003cstrong>copy\u003c/strong> each element out, so noncopyable elements can't be iterated. The new \u003ccode>Iterable\u003c/code> protocol lends out elements a \u003ccode>Span\u003c/code> at a time, so \u003ccode>for-in\u003c/code> neither copies nor consumes.","flag":"","se":[{"id":"SE-0516","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0516-borrowing-sequence.md","title":"`Iterable`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Ticket: ~Copyable {\n    let seat: String\n}\n\nvar tickets = UniqueArray\u003cTicket>()\ntickets.append(Ticket(seat: \"3A\"))\ntickets.append(Ticket(seat: \"7C\"))\n\nfor ticket in tickets {          // borrow one at a time: no copy, no consumption\n    print(\"Seat\", ticket.seat)\n}\n\nlet rgb: [3 of UInt8] = [255, 128, 0]\nfor channel in rgb {             // not possible in 6.2; now InlineArray can be iterated with for-in directly\n    print(channel)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Seat 3A\nSeat 7C\n255\n128\n0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"An \u003ccode>Iterable\u003c/code>'s iterator hands out a run of contiguous elements at a time through \u003ccode>nextSpan()\u003c/code>, which is also easier to optimize for types backed by contiguous memory (arrays, \u003ccode>InlineArray\u003c/code>). It also supports typed-throws iteration through the \u003ccode>Failure\u003c/code> type."}]},{"id":"temp-alloc","release":"6.4","since":"6.4","title":"\u003ccode>withTemporaryAllocation\u003c/code>: temporary memory without touching pointers","plainTitle":"withTemporaryAllocation: temporary memory without touching pointers","en":"","line":2,"level":"brief","short":"Temp memory","tags":"withTemporaryAllocation OutputSpan temporary stack scratch buffer pointer unsafe","tldr":"To get a temporary buffer you used to have to use \u003ccode>withUnsafeTemporaryAllocation\u003c/code> and raw pointers. The new function gives you an \u003ccode>OutputSpan\u003c/code>: just \u003ccode>append\u003c/code> elements, and it is cleaned up automatically afterwards.","flag":"","se":[{"id":"SE-0524","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0524-span-temporary-allocation.md","title":"Add `withTemporaryAllocation` using `Output(Raw)Span`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let total = withTemporaryAllocation(of: Int.self, capacity: 4) { output in\n    for i in 1...4 {\n        output.append(i * 10)            // append only; out-of-bounds is checked\n    }\n    var sum = 0\n    for i in output.span.indices { sum += output.span[i] }\n    return sum\n}                                         // after the closure returns, the memory is destroyed and freed automatically\nprint(total)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"100","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"rawspan-load","release":"6.4","since":"6.4","title":"\u003ccode>RawSpan\u003c/code>: read bytes as typed values, safely","plainTitle":"RawSpan: read bytes as typed values, safely","en":"","line":2,"level":"brief","short":"Reading bytes","tags":"RawSpan bytes load parsing binary ConvertibleFromBytes","tldr":"Read a \u003ccode>UInt16\u003c/code> or \u003ccode>UInt32\u003c/code> out of a run of raw bytes without any unsafe pointer API. Only types for which “any bit pattern is valid” (such as integers) may be read this way.","flag":"","se":[{"id":"SE-0525","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0525-rawspan-safe-loading-api.md","title":"Safe loading API for `RawSpan`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"// A simple binary header: version (UInt16), flags (UInt16), length (UInt32), little-endian\nfunc parseHeader(_ packet: [UInt8]) -> (UInt16, UInt16, UInt32) {\n    let bytes = packet.span.bytes                           // RawSpan\n    return (\n        bytes.load(fromByteOffset: 0, as: UInt16.self),\n        bytes.load(fromByteOffset: 2, as: UInt16.self),\n        bytes.load(fromByteOffset: 4, as: UInt32.self),\n    )\n}\n\nprint(parseHeader([0x01, 0x00, 0x03, 0x00, 0x2A, 0x00, 0x00, 0x00]))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"(1, 3, 42)","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Behind it are two new marker protocols: \u003ccode>ConvertibleFromBytes\u003c/code> (every bit pattern is a valid value, such as integers) and \u003ccode>ConvertibleToBytes\u003c/code> (no padding bytes, so it can safely be viewed as bytes). Types with “invalid bit patterns” or semantic constraints, such as \u003ccode>Bool\u003c/code>, pointers, and \u003ccode>Range\u003c/code>, don't conform to them."}]},{"id":"async-result","release":"6.4","since":"6.4","title":"\u003ccode>Result\u003c/code> supports async initialization","plainTitle":"Result supports async initialization","en":"","line":4,"level":"brief","short":"Result async","tags":"Result async error catching initialization","tldr":"\u003ccode>Result { try await … }\u003c/code> can now wrap an async call directly, turning “an async operation that may throw” into a value.","flag":"","se":[{"id":"SE-0530","url":"https://github.com/swiftlang/swift-
