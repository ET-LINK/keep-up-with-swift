structured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n3 | \n4 | func start() {\n5 |     Task {\n  |     |- warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n  |     `- note: to silence this warning, handle the error inside the task, or store/discard the task value explicitly\n6 |         try await upload()\n7 |     }\n\n[#NoUseUnstructuredThrowingTask]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/no-use-throwing-unstructured-task>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"在任务内部处理错误，或者明确丢弃","code":"struct UploadError: Error {}\nfunc upload() async throws { throw UploadError() }\n\nfunc start() {\n    Task {\n        do { try await upload() } catch { print(\"上传失败：\", error) }\n    }\n    _ = Task { try await upload() }      // 明确表示“我不关心结果”\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"tilde-sendable","release":"6.4","since":"6.4","title":"\u003ccode>~Sendable\u003c/code>：明确声明“我不是 Sendable”","plainTitle":"~Sendable：明确声明“我不是 Sendable”","en":"~Sendable for explicitly marking non-Sendable types","line":1,"level":"brief","short":"~Sendable","tags":"Sendable ~Sendable 非 Sendable 审计 audit 子类 unchecked","tldr":"以前“不是 \u003ccode>Sendable\u003c/code>”只能靠“没写”来表达，看不出是审计过有意为之，还是忘了写。现在可以写 \u003ccode>~Sendable\u003c/code>，明确表示“这个类型不是线程安全的”。","flag":"","se":[{"id":"SE-0518","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0518-tilde-sendable.md","title":"`~Sendable` for explicitly marking non-`Sendable` types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"public class Pipeline: ~Sendable {          // 审计过：基类本身不是线程安全的\n    var stages: [String] = []\n}\n\nfinal class LockedPipeline: Pipeline, @unchecked Sendable {\n    // 子类自己用锁保护了状态，可以声明为 Sendable\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"\u003ccode>~Sendable\u003c/code> 还会阻止编译器为结构体、枚举自动推断 \u003ccode>Sendable\u003c/code>，也能让“要求所有公开类型显式声明 Sendable”的检查不再误报。"}]},{"id":"continuation","release":"6.4","since":"6.4","title":"新的 \u003ccode>Continuation\u003c/code>：不可能恢复两次的续体","plainTitle":"新的 Continuation：不可能恢复两次的续体","en":"Continuation, safe and performant async continuations","line":1,"level":"key","short":"Continuation","tags":"Continuation withContinuation CheckedContinuation UnsafeContinuation 回调 callback 桥接 resume ~Copyable","tldr":"\u003ccode>withContinuation\u003c/code> 提供的 \u003ccode>Continuation\u003c/code> 是 \u003ccode>~Copyable\u003c/code> 的，\u003ccode>resume\u003c/code> 会消耗它。“恢复两次”在编译期就会报错，而且没有 \u003ccode>CheckedContinuation\u003c/code> 的运行时开销。","flag":"","se":[{"id":"SE-0528","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0528-noncopyable-continuation.md","title":"`Continuation` — Safe and Performant Async Continuations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"把一个等待者存起来，稍后再恢复","code":"actor Doorbell {\n    private var waiter: Continuation\u003cString, Never>?\n\n    func wait() async -> String {\n        await withContinuation(of: String.self) { continuation in\n            waiter = consume continuation           // 移动进存储属性\n        }\n    }\n\n    func ring(_ visitor: String) {\n        waiter.take()?.resume(returning: visitor)   // take() 取出并置空，最多恢复一次\n    }\n}\n\nlet bell = Doorbell()\nasync let visitor = bell.wait()\ntry? await Task.sleep(for: .milliseconds(50))\nawait bell.ring(\"快递员\")\nprint(await visitor)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"快递员","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"恢复两次？编译期错误","code":"func twice() async -> Int {\n    await withContinuation(of: Int.self) { continuation in\n        continuation.resume(returning: 1)\n        continuation.resume(returning: 2)\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:44: error: 'continuation' consumed more than once\n1 | func twice() async -> Int {\n2 |     await withContinuation(of: Int.self) { continuation in\n  |                                            `- error: 'continuation' consumed more than once\n3 |         continuation.resume(returning: 1)\n  |         `- note: consumed here\n4 |         continuation.resume(returning: 2)\n  |         `- note: consumed again here\n5 |     }\n6 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"不过，典型的“回调式 API”往往是逃逸闭包，而编译器无法保证逃逸闭包恰好执行一次，所以不可复制的续体不能在里面被消耗："},{"type":"code","lang":"swift","title":"逃逸闭包里不能消耗它","code":"func legacyFetch(_ done: @escaping @Sendable (String) -> Void) { done(\"数据\") }\n\nfunc fetch() async -> String {\n    await withContinuation(of: String.self) { continuation in\n        legacyFetch { value in continuation.resume(returning: value) }\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:5:32: error: noncopyable 'continuation' cannot be consumed when captured by an escaping closure or borrowed by a non-Escapable type\n3 | func fetch() async -> String {\n4 |     await withContinuation(of: String.self) { continuation in\n5 |         legacyFetch { value in continuation.resume(returning: value) }\n  |                                `- error: noncopyable 'continuation' cannot be consumed when captured by an escaping closure or borrowed by a non-Escapable type\n6 |     }\n7 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"这种场景可以把它转换成 \u003ccode>CheckedContinuation(continuation)\u003c/code>，由运行时检查来兜底。新类型如果在没被恢复的情况下就被销毁，会直接触发 \u003ccode>fatalError\u003c/code>，而不是让等待它的任务永远挂起。"}]},{"id":"optional-some","release":"6.4","since":"6.4","title":"\u003ccode>some P?\u003c/code>：可选的不透明类型、存在类型不用加括号","plainTitle":"some P?：可选的不透明类型、存在类型不用加括号","en":"Improved syntax for optionals of opaque and existential types","line":3,"level":"key","short":"some P?","tags":"some any opaque existential 不透明 存在类型 optional 可选 括号","tldr":"以前必须写 \u003ccode>(some Shape)?\u003c/code> 和 \u003ccode>(any Shape)?\u003c/code>，现在 \u003ccode>some Shape?\u003c/code>、\u003ccode>any Shape?\u003c/code> 就是同样的意思。","flag":"","se":[{"id":"SE-0521","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0521-improved-optional-opaque-and-any.md","title":"Improved Syntax for Optionals of Opaque and Existential Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"protocol Shape {\n    var area: Double { get }\n}\n\nstruct Square: Shape {\n    var side: Double\n    var area: Double { side * side }\n}\n\nfunc largest(_ sides: [Double]) -> some Shape? {     // 以前：(some Shape)?\n    sides.max().map { Square(side: $0) }\n}\n\nlet shape: any Shape? = largest([2, 5, 3])           // 以前：(any Shape)?\nprint(shape?.area ?? 0)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"25.0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"组合类型仍然需要括号来消除歧义：写 \u003ccode>any (P &amp; Q)?\u003c/code>，而 \u003ccode>any P &amp; Q?\u003c/code> 依然是错误。"}]},{"id":"diagnose","release":"6.4","since":"6.4","title":"\u003ccode>@diagnose\u003c/code>：在源码里控制某一类警告","plainTitle":"@diagnose：在源码里控制某一类警告","en":"Source-level control over compiler warnings","line":6,"level":"key","short":"@diagnose","tags":"diagnose 警告 warning 诊断分组 diagnostic group ignored error 废弃 deprecated","tldr":"\u003ccode>@diagnose(分组名, as: ignored/warning/error)\u003c/code> 只在被标注的声明范围内改变某组警告的级别：可以在迁移中的旧代码里静音，也可以在关键路径上把警告升级为错误。","flag":"","se":[{"id":"SE-0522","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0522-source-warning-control.md","title":"Source-Level Control Over Compiler Warnings"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"只在这个函数里忽略“已废弃”警告","code":"@available(*, deprecated, message: \"请改用 newAPI()\")\nfunc oldAPI() {}\n\n@diagnose(DeprecatedDeclaration, as: ignored, reason: \"迁移中，下个版本删除\")\nfunc legacyBridge() {\n    oldAPI()          // 这里不再警告\n}\n\nfunc elsewhere() {\n    oldAPI()          // 其他地方照常警告\n}","hl":"","check":"warning","flags":"-swift-version 6","result":{"status":"warning","diagnostics":"main.swift:10:5: warning: 'oldAPI()' is deprecated: 请改用 newAPI() [#DeprecatedDeclaration]\n 8 | \n 9 | func elsewhere() {\n10 |     oldAPI()          // 其他地方照常警告\n   |     `- warning: 'oldAPI()' is deprecated: 请改用 newAPI() [#DeprecatedDeclaration]\n11 | }\n12 | \n\n[#DeprecatedDeclaration]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/deprecated-declaration>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"反过来：在关键代码里把警告升级为错误","code":"@available(*, deprecated)\nfunc oldAPI() {}\n\n@diagnose(DeprecatedDeclaration, as: error)\nfunc paymentFlow() {\n    oldAPI()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:6:5: error: 'oldAPI()' is deprecated [#DeprecatedDeclaration]\n4 | @diagnose(DeprecatedDeclaration, as: error)\n5 | func paymentFlow() {\n6 |     oldAPI()\n  |     `- error: 'oldAPI()' is deprecated [#DeprecatedDeclaration]\n7 | }\n8 | \n\n[#DeprecatedDeclaration]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/deprecated-declaration>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"分组名就是诊断末尾方括号里的名字（例如上面输出中的 \u003ccode>[#DeprecatedDeclaration]\u003c/code>）。命令行的 \u003ccode>-Werror\u003c/code> / \u003ccode>-Wwarning\u003c/code>（\u003ca href=\"#f-warning-flags\">6.1\u003c/a>）设置的是全局默认，\u003ccode>@diagnose\u003c/code> 在此基础上做局部覆盖，嵌套的声明还可以再次覆盖。"}]},{"id":"memberwise-private","release":"6.4","since":"6.4","title":"成员逐一初始化器不再被 private 属性“绑架”","plainTitle":"成员逐一初始化器不再被 private 属性“绑架”","en":"Exclude private initialized properties from memberwise initializer","line":3,"level":"brief","short":"逐一初始化器","tags":"memberwise init 初始化器 private 结构体 struct 默认值","tldr":"结构体里只要有一个带默认值的 \u003ccode>private\u003c/code> 属性，编译器生成的成员逐一初始化器就会整个变成 \u003ccode>private\u003c/code>，外面根本用不了。6.4 起这类属性会被排除在初始化器参数之外。","flag":"","se":[{"id":"SE-0502","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0502-exclude-private-from-memberwise-init.md","title":"Exclude private initialized properties from memberwise initializer"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Article {\n    var title: String\n    var author: String\n    private var viewCount = 0           // 带默认值的 private 属性\n\n    var summary: String { \"\\(title) / \\(author) / 阅读 \\(viewCount)\" }\n}\n\n// 6.4 之前：生成的 init(title:author:viewCount:) 是 private 的，这一行会报错\nlet article = Article(title: \"Swift 6.4 新特性\", author: \"Swift Club\")\nprint(article.summary)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Swift 6.4 新特性 / Swift Club / 阅读 0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"为了兼容，旧的包含全部属性的初始化器签名在现有语言模式中依然可用（在原本就能访问的地方）。"}]},{"id":"array-trailing-closure","release":"6.4","since":"6.4","title":"数组、字典类型后面可以直接跟尾随闭包","plainTitle":"数组、字典类型后面可以直接跟尾随闭包","en":"Array expression trailing closures","line":3,"level":"brief","short":"[T] { }","tags":"trailing closure 尾随闭包 result builder 结果构建器 数组 字典 DSL","tldr":"\u003ccode>[String] { … }\u003c/code> 以前会被解析成别的东西而报错，现在会被当作调用 \u003ccode>init(_:)\u003c/code> 并传入尾随闭包，配合结果构建器写 DSL 更自然。","flag":"","se":[{"id":"SE-0508","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0508-array-expression-trailing-closures.md","title":"Array expression trailing closures"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@resultBuilder\nenum ListBuilder\u003cElement> {\n    static func buildBlock(_ items: Element...) -> [Element] { items }\n}\n\nextension Array {\n    init(@ListBuilder\u003cElement> _ make: () -> [Element]) {\n        self = make()\n    }\n}\n\nlet fruits = [String] {\n    \"苹果\"\n    \"香蕉\"\n    \"樱桃\"\n}\nprint(fruits)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[\"苹果\", \"香蕉\", \"樱桃\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"any-apple-os","release":"6.4","since":"6.4","title":"\u003ccode>anyAppleOS\u003c/code>：一次写完所有 Apple 平台的可用性","plainTitle":"anyAppleOS：一次写完所有 Apple 平台的可用性","en":"anyAppleOS availability","line":5,"level":"brief","short":"anyAppleOS","tags":"availability 可用性 available anyAppleOS iOS macOS watchOS visionOS 平台","tldr":"Apple 各平台的系统版本号统一以后，\u003ccode>@available(anyAppleOS 26, *)\u003c/code> 一行就能代替 \u003ccode>iOS 26, macOS 26, watchOS 26, tvOS 26, visionOS 26\u003c/code> 一长串。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@available(anyAppleOS 26, *)\nfunc newFeature() -> String { \"可以使用新 API\" }\n\nif #available(anyAppleOS 26, *) {\n    print(newFeature())\n} else {\n    print(\"使用旧的实现\")\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"可以使用新 API","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"borrow-mutate","release":"6.4","since":"6.4","title":"\u003ccode>borrow\u003c/code> / \u003ccode>mutate\u003c/code> 访问器：不复制地读写属性","plainTitle":"borrow / mutate 访问器：不复制地读写属性","en":"Borrow and mutate accessors","line":2,"level":"core","short":"borrow·mutate","tags":"borrow mutate accessor 访问器 get set _read _modify 复制 copy ~Copyable 性能","tldr":"计算属性的 \u003ccode>get\u003c/code> 总是返回一份\u003cstrong>副本\u003c/strong>：对大值很浪费，对不可复制的值根本做不到。\u003ccode>borrow\u003c/code> 访问器直接借出存储，\u003ccode>mutate\u003c/code> 访问器直接交出可修改的引用。","flag":"","se":[{"id":"SE-0507","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0507-borrow-accessors.md","title":"Borrow and Mutate Accessors"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Sensor: ~Copyable {\n    var readings: [4 of Double] = [0, 0, 0, 0]\n}\n\nstruct Station: ~Copyable {\n    private var _sensor = Sensor()\n\n    var sensor: Sensor {\n        borrow { return _sensor }        // 只读地借出，不复制\n        mutate { return &_sensor }       // 交出可修改的引用，原地修改\n    }\n}\n\nvar station = Station()\nstation.sensor.readings[2] = 36.6       // 通过 mutate\nprint(station.sensor.readings[2])       // 通过 borrow","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"36.6","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["以前标准库内部用的是带下划线的 \u003ccode>_read\u003c/code> / \u003ccode>_modify\u003c/code> 协程访问器；\u003ccode>borrow\u003c/code> / \u003ccode>mutate\u003c/code> 不需要协程，开销更低。","需要在访问前后执行代码的场景（比如加锁），可以用另一个提案中的 \u003ccode>yielding borrow\u003c/code> / \u003ccode>yielding mutate\u003c/code>。","6.4 的发布说明特别提到：属性可以借此直接暴露 \u003ccode>Span\u003c/code> 或 \u003ccode>InlineArray\u003c/code> 供读取和修改。"]}]},{"id":"noncopyable-protocols","release":"6.4","since":"6.4","title":"不可复制类型也能 \u003ccode>Equatable\u003c/code>、\u003ccode>Comparable\u003c/code>、\u003ccode>Hashable\u003c/code>","plainTitle":"不可复制类型也能 Equatable、Comparable、Hashable","en":"Support ~Copyable, ~Escapable in simple standard library protocols","line":2,"level":"brief","short":"~Copyable 协议","tags":"Equatable Hashable Comparable ~Copyable ~Escapable 协议 protocol borrowing","tldr":"标准库把 \u003ccode>Equatable\u003c/code>、\u003ccode>Comparable\u003c/code>、\u003ccode>Hashable\u003c/code> 的要求改成了 \u003ccode>borrowing\u003c/code> 参数，不可复制、不可逃逸的类型也能遵循它们了。","flag":"","se":[{"id":"SE-0499","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0499-support-non-copyable-simple-protocols.md","title":"Support ~Copyable, ~Escapable in simple standard library protocols"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct AccessKey: ~Copyable, Hashable {\n    let raw: UInt64\n\n    static func == (a: borrowing AccessKey, b: borrowing AccessKey) -> Bool {\n        a.raw == b.raw\n    }\n\n    func hash(into hasher: inout Hasher) {\n        hasher.combine(raw)\n    }\n}\n\nlet k1 = AccessKey(raw: 42)\nlet k2 = AccessKey(raw: 42)\nprint(k1 == k2, k1 != AccessKey(raw: 7))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true true","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"注意：\u003ccode>Set\u003c/code> 和 \u003ccode>Dictionary\u003c/code> 仍然要求元素可复制，所以不可复制的类型目前还不能放进去。"}]},{"id":"unique-box-array","release":"6.4","since":"6.4","title":"\u003ccode>UniqueBox\u003c/code> 与 \u003ccode>UniqueArray\u003c/code>：只有一个主人的堆内存","plainTitle":"UniqueBox 与 UniqueArray：只有一个主人的堆内存","en":"UniqueBox & UniqueArray","line":2,"level":"core","short":"UniqueArray","tags":"UniqueArray UniqueBox Box 堆 heap 所有权 ~Copyable 写时复制 COW vector Vec unique_ptr","tldr":"\u003ccode>UniqueArray\u003c/code> 是没有写时复制、没有引用计数的动态数组，元素可以是不可复制的；\u003ccode>UniqueBox\u003c/code> 把一个值放到堆上并独占它。两者都是 \u003ccode>~Copyable\u003c/code>，赋值就是\u003cstrong>移动\u003c/strong>。","flag":"","se":[{"id":"SE-0517","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0517-uniquebox.md","title":"UniqueBox"},{"id":"SE-0527","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0527-rigidarray-uniquearray.md","title":"UniqueArray"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Frame: ~Copyable {\n    let index: Int\n    deinit { print(\"释放第 \\(index) 帧\") }\n}\n\nfunc render() {\n    var frames = UniqueArray\u003cFrame>()         // 元素可以是不可复制的\n    frames.append(Frame(index: 1))\n    frames.append(Frame(index: 2))\n    print(\"共 \\(frames.count) 帧\")\n\n    var buffer = UniqueBox\u003c[1024 of UInt8]>(.init(repeating: 0))   // 1 KB 放到堆上\n    buffer.value[0] = 0xFF\n    print(\"首字节：\", buffer.value[0])\n}                                              // 离开作用域：自动释放\n\nrender()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"共 2 帧\n首字节： 255\n释放第 1 帧\n释放第 2 帧","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>UniqueArray\u003c/code> 类似 C++ 的 \u003ccode>std::vector\u003c/code> 和 Rust 的 \u003ccode>Vec\u003c/code>：自动扩容，但永远只有一个所有者，\u003ccode>let b = a\u003c/code> 会让 \u003ccode>a\u003c/code> 失效。","\u003ccode>UniqueBox\u003c/code> 类似 \u003ccode>unique_ptr\u003c/code> / \u003ccode>Box&lt;T&gt;\u003c/code>：适合很大的值（避免栈上复制），或递归的数据结构。","写普通业务代码时，\u003ccode>Array\u003c/code> 依然是首选；这两个类型面向性能敏感、需要确定性的场景。"]}]},{"id":"ref","release":"6.4","since":"6.4","title":"\u003ccode>Ref\u003c/code> 与 \u003ccode>MutableRef\u003c/code>：一等公民的引用","plainTitle":"Ref 与 MutableRef：一等公民的引用","en":"Ref and MutableRef","line":2,"level":"key","short":"Ref","tags":"Ref MutableRef 引用 reference borrow 借用 inout ~Escapable lifetime","tldr":"\u003ccode>borrowing\u003c/code> 和 \u003ccode>inout\u003c/code> 只能出现在参数上。\u003ccode>Ref\u003c/code> / \u003ccode>MutableRef\u003c/code> 把“借用”变成了一个可以存进局部变量、传来传去的值，生命周期由编译器检查。","flag":"","se":[{"id":"SE-0519","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0519-ref-mutableref-types.md","title":"`Ref` and `MutableRef` types for safe, first-class references"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Settings: ~Copyable {\n    var volume = 50\n}\n\nfunc demo() {\n    var settings = Settings()\n\n    do {\n        var editor = MutableRef(&settings)   // 独占地借用 settings\n        editor.value.volume += 10\n        // editor 存活期间，不能再直接访问 settings\n    }\n    print(settings.volume)\n\n    let viewer = Ref(settings)               // 共享借用：只读\n    print(viewer.value.volume)\n}\n\ndemo()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"60\n60","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"两者都是 \u003ccode>~Escapable\u003c/code> 的，不能比被引用的值活得更久。可以把它们理解为：安全版本的指针，“悬垂”和“别名冲突”都在编译期被排除。"}]},{"id":"iterable","release":"6.4","since":"6.4","title":"\u003ccode>Iterable\u003c/code>：借用式遍历","plainTitle":"Iterable：借用式遍历","en":"Iterable","line":2,"level":"key","short":"Iterable","tags":"Iterable Sequence for-in 遍历 borrowing iterator ~Copyable InlineArray UniqueArray Span","tldr":"\u003ccode>Sequence\u003c/code> 的迭代器要把每个元素\u003cstrong>复制\u003c/strong>出来，不可复制的元素因此没法遍历。新的 \u003ccode>Iterable\u003c/code> 协议按 \u003ccode>Span\u003c/code> 一段一段地借出元素，\u003ccode>for-in\u003c/code> 不复制也不消耗。","flag":"","se":[{"id":"SE-0516","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0516-borrowing-sequence.md","title":"`Iterable`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Ticket: ~Copyable {\n    let seat: String\n}\n\nvar tickets = UniqueArray\u003cTicket>()\ntickets.append(Ticket(seat: \"3A\"))\ntickets.append(Ticket(seat: \"7C\"))\n\nfor ticket in tickets {          // 逐个借用：不复制，也不消耗\n    print(\"座位\", ticket.seat)\n}\n\nlet rgb: [3 of UInt8] = [255, 128, 0]\nfor channel in rgb {             // 6.2 里做不到，现在 InlineArray 可以直接 for-in\n    print(channel)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"座位 3A\n座位 7C\n255\n128\n0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"\u003ccode>Iterable\u003c/code> 的迭代器通过 \u003ccode>nextSpan()\u003c/code> 一次交出一段连续的元素，对于底层是连续内存的类型（数组、\u003ccode>InlineArray\u003c/code>），这也更容易被优化。它还支持通过 \u003ccode>Failure\u003c/code> 类型实现类型化抛出的遍历。"}]},{"id":"temp-alloc","release":"6.4","since":"6.4","title":"\u003ccode>withTemporaryAllocation\u003c/code>：不碰指针的临时内存","plainTitle":"withTemporaryAllocation：不碰指针的临时内存","en":"withTemporaryAllocation using OutputSpan","line":2,"level":"brief","short":"临时内存","tags":"withTemporaryAllocation OutputSpan 临时 栈 scratch buffer 指针 unsafe","tldr":"以前要拿一块临时缓冲区，只能用 \u003ccode>withUnsafeTemporaryAllocation\u003c/code> 和裸指针。新函数交给你一个 \u003ccode>OutputSpan\u003c/code>，逐个 \u003ccode>append\u003c/code> 元素即可，结束后自动清理。","flag":"","se":[{"id":"SE-0524","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0524-span-temporary-allocation.md","title":"Add `withTemporaryAllocation` using `Output(Raw)Span`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let total = withTemporaryAllocation(of: Int.self, capacity: 4) { output in\n    for i in 1...4 {\n        output.append(i * 10)            // 只能追加，越界会被检查\n    }\n    var sum = 0\n    for i in output.span.indices { sum += output.span[i] }\n    return sum\n}                                         // 闭包返回后，内存自动销毁、释放\nprint(total)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"100","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"rawspan-load","release":"6.4","since":"6.4","title":"\u003ccode>RawSpan\u003c/code>：安全地按类型读取字节","plainTitle":"RawSpan：安全地按类型读取字节","en":"Safe loading API for RawSpan","line":2,"level":"brief","short":"读取字节","tags":"RawSpan bytes 字节 load 解析 parsing 二进制 binary ConvertibleFromBytes","tldr":"从一段原始字节里读出 \u003ccode>UInt16\u003c/code>、\u003ccode>UInt32\u003c/code>，不再需要不安全的指针 API。只有“任意比特都合法”的类型（例如整数）才允许这样读取。","flag":"","se":[{"id":"SE-0525","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0525-rawspan-safe-loading-api.md","title":"Safe loading API for `RawSpan`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"// 一个简单的二进制头部：版本(UInt16) 标志(UInt16) 长度(UInt32)，小端序\nfunc parseHeader(_ packet: [UInt8]) -> (UInt16, UInt16, UInt32) {\n    let bytes = packet.span.bytes                           // RawSpan\n    return (\n        bytes.load(fromByteOffset: 0, as: UInt16.self),\n        bytes.load(fromByteOffset: 2, as: UInt16.self),\n        bytes.load(fromByteOffset: 4, as: UInt32.self),\n    )\n}\n\nprint(parseHeader([0x01, 0x00, 0x03, 0x00, 0x2A, 0x00, 0x00, 0x00]))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"(1, 3, 42)","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"背后是两个新的标记协议：\u003ccode>ConvertibleFromBytes\u003c/code>（任何比特组合都是合法值，比如整数）和 \u003ccode>ConvertibleToBytes\u003c/code>（没有填充字节，可以安全地看作字节）。\u003ccode>Bool\u003c/code>、指针、\u003ccode>Range\u003c/code> 这样有“非法比特组合”或语义约束的类型都不会遵循它们。"}]},{"id":"async-result","release":"6.4","since":"6.4","title":"\u003ccode>Result\u003c/code> 支持 async 初始化","plainTitle":"Result 支持 async 初始化","en":"Async Result support","line":4,"level":"brief","short":"Result async","tags":"Result async 错误 catching 初始化","tldr":"\u003ccode>Result { try await … }\u003c/code> 现在可以直接包住异步调用，把“可能抛错的异步操作”转换成一个值。","flag":"","se":[{"id":"SE-0530","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0530-async-result-support.md","title":"Async Result Support"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"func download() async throws -> Int { 512 }\n\nlet result = await Result { try await download() }\nswitch result {\ncase .success(let size): print(\"下载了 \\(size) KB\")\ncase .failure(let error): print(\"失败：\", error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"下载了 512 KB","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"trivially-identical","release":"6.4","since":"6.4","title":"\u003ccode>isTriviallyIdentical(to:)\u003c/code>：常数时间判断“是不是同一份存储”","plainTitle":"isTriviallyIdentical(to:)：常数时间判断“是不是同一份存储”","en":"isTriviallyIdentical(to:)","line":4,"level":"brief","short":"快速判同","tags":"isTriviallyIdentical identical 相等 equality 性能 写时复制 COW memoize 缓存","tldr":"\u003ccode>Array\u003c/code>、\u003ccode>String\u003c/code>、\u003ccode>Dictionary\u003c/code> 等类型新增 \u003ccode>isTriviallyIdentical(to:)\u003c/code>：只比较底层存储是否是同一份，O(1) 完成。返回 \u003ccode>true\u003c/code> 必然相等，返回 \u003ccode>false\u003c/code> 则什么也不保证。","flag":"","se":[{"id":"SE-0494","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0494-add-is-identical-methods.md","title":"Add `isTriviallyIdentical(to:)` Methods for Quick Comparisons to Concrete Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let a = Array(1...100_000)\nlet b = a              // 写时复制：和 a 共享同一块存储\nvar c = a\nc[0] = 0               // 修改后，c 有了自己的存储\n\nprint(a.isTriviallyIdentical(to: b))    // true，常数时间\nprint(a.isTriviallyIdentical(to: c))    // false","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true\nfalse","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"典型用途是缓存和界面刷新的快速路径：输入“明显没变”时直接复用上次的结果，否则再走完整的 \u003ccode>==\u003c/code> 比较。"}]},{"id":"observation-tracking","release":"6.4","since":"6.4","title":"高级观察追踪：\u003ccode>willSet\u003c/code>、\u003ccode>didSet\u003c/code> 与持续追踪","plainTitle":"高级观察追踪：willSet、didSet 与持续追踪","en":"Advanced observation tracking","line":4,"level":"brief","short":"观察选项","tags":"Observation withObservationTracking options willSet didSet deinit 持续 continuous","tldr":"\u003ccode>withObservationTracking\u003c/code> 新增 \u003ccode>options:\u003c/code> 参数，可以选择在属性变化前、变化后或对象销毁时得到通知；新的 \u003ccode>withContinuousObservationTracking\u003c/code> 会自动重新注册，持续接收变化。","flag":"","se":[{"id":"SE-0506","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0506-advanced-observation-tracking.md","title":"Advanced Observation Tracking"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Observation\n\n@Observable\nfinal class Player {\n    var hp = 100\n}\n\nlet player = Player()\nwithObservationTracking(options: [.willSet, .didSet]) {\n    _ = player.hp\n} onChange: { event in\n    print(event.kind == .willSet ? \"即将修改\" : \"修改完成\", \"hp\")\n}\nplayer.hp = 90","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"即将修改 hp\n修改完成 hp","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"stdlib-64","release":"6.4","since":"6.4","title":"更多可哈希的类型，以及 \u003ccode>demangle\u003c/code>","plainTitle":"更多可哈希的类型，以及 demangle","en":"More Hashable conformances & runtime demangle","line":4,"level":"brief","short":"Hashable·demangle","tags":"Hashable Dictionary.Keys CollectionOfOne EmptyCollection demangle Runtime 符号","tldr":"\u003ccode>Dictionary.Keys\u003c/code>、\u003ccode>EmptyCollection\u003c/code> 成为 \u003ccode>Hashable\u003c/code>，\u003ccode>CollectionOfOne\u003c/code> 有条件地遵循 \u003ccode>Equatable\u003c/code>/\u003ccode>Hashable\u003c/code>；新的 \u003ccode>Runtime\u003c/code> 模块提供 \u003ccode>demangle\u003c/code>，可以把编译后的符号名还原成人类可读的形式。","flag":"","se":[{"id":"SE-0514","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0514-hashable-conformance-for-dictionarykeys-collectionofone-emptycollection.md","title":"`Hashable` Conformance for `Dictionary.Keys`, `CollectionOfOne` and `EmptyCollection`"},{"id":"SE-0498","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0498-runtime-demangle.md","title":"Expose demangle function in Runtime module"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Runtime\n\nlet keys = [\"a\": 1, \"b\": 2].keys\nlet seen: Set = [keys]                     // Dictionary.Keys 现在可以放进 Set\nprint(seen.count)\n\nprint(try demangle(\"$sSaySiGD\"))           // 把符号名还原成可读的类型","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1\nSwift.Array\u003cSwift.Int>","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"swift-build","release":"6.4","since":"6.4","title":"Swift Build 成为默认构建系统，并能生成 SBOM","plainTitle":"Swift Build 成为默认构建系统，并能生成 SBOM","en":"Swift Build by default & SBOM generation","line":6,"level":"brief","short":"Swift Build","tags":"Swift Build SwiftPM 构建系统 SBOM 物料清单 CycloneDX SPDX 供应链","tldr":"SwiftPM 默认改用 Swift Build 作为构建后端，在 macOS、Linux、Windows 和各个编辑器里行为一致；\u003ccode>swift build --sbom-spec\u003c/code> 可以生成 CycloneDX 或 SPDX 格式的软件物料清单。","flag":"","se":[{"id":"SE-0509","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0509-swift-sboms-via-swiftpm.md","title":"Software Bill of Materials (SBOM) Generation for Swift Package Manager"}],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# 构建的同时生成软件物料清单（SBOM）\nswift build --sbom-spec cyclonedx\nswift build --sbom-spec spdx","hl":"","check":"none"},{"type":"p","html":"同一时期，VS Code 的 Swift 扩展上架了 Open VSX，Cursor 等基于 VS Code 的编辑器也能安装；扩展还接入了 swiftly，方便按项目切换工具链版本。调试信息改为精确记录模块依赖，Linux/Windows 的调试构建和 dSYM 因此小了很多。"}]},{"id":"testing-64","release":"6.4","since":"6.4","title":"Swift Testing 与 XCTest 互通","plainTitle":"Swift Testing 与 XCTest 互通","en":"Swift Testing & XCTest interoperability","line":6,"level":"brief","short":"XCTest 互通","tags":"Swift Testing XCTest 迁移 XCTAssert #expect 混用 interop","tldr":"在 Swift Testing 的测试里可以用 \u003ccode>XCTAssert\u003c/code>，在 XCTest 的测试里也可以用 \u003ccode>#expect\u003c/code>，迁移老测试时不必一次改完。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\nimport XCTest\n\n@Test func newStyle() {\n    XCTAssertEqual(1 + 1, 2)            // Swift Testing 里使用 XCTAssert\n}\n\nfinal class LegacyTests: XCTestCase {\n    func testOldStyle() {\n        #expect(2 * 2 == 4)            // XCTest 里使用 #expect\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}},{"type":"p","html":"同时还加入了：\u003ccode>CustomTestReflectable\u003c/code>（自定义断言失败时显示哪些值）、\u003ccode>swift test\u003c/code> 重复运行指定用例，以及在 Apple 平台上可以遵循 \u003ccode>Transferable\u003c/code> 的附件。"}]},{"id":"subprocess","release":"6.4","since":"6.4","title":"Subprocess 1.0","plainTitle":"Subprocess 1.0","en":"Subprocess","line":4,"level":"brief","short":"Subprocess","tags":"Subprocess Process 子进程 命令行 shell 脚本 async","tldr":"跨平台的子进程包 Subprocess 发布 1.0：基于 Swift 并发，启动外部程序、读取输出、长时间流式交互都很顺手，可以告别 \u003ccode>Process\u003c/code> 和管道的手工拼装。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"需要在 Package.swift 中添加 swift-subprocess 依赖","code":"import Subprocess\n\nlet result = try await Subprocess.run(\n    .name(\"ls\"),\n    arguments: [\"-la\"],\n    output: .string(limit: 4096)\n)\nprint(result.standardOutput)","hl":"","check":"none"}]},{"id":"interop-64","release":"6.4","since":"6.4","title":"互操作：C++ \u003ccode>std::span\u003c/code>、Java、WebAssembly 与 Android","plainTitle":"互操作：C++ std::span、Java、WebAssembly 与 Android","en":"Interoperability & platforms in 6.4","line":5,"level":"brief","short":"互操作","tags":"C++ std::span Java Kotlin WebAssembly Wasm JavaScriptKit Android NDK","tldr":"\u003ccode>Span\u003c/code> 与 C++20 的 \u003ccode>std::span\u003c/code> 双向桥接；Java 可以调用 Swift 的 async 和 throwing 函数；WebAssembly 中 JavaScriptKit 的安全桥接最多快了 40 倍；Android SDK 基于 LTS 版 NDK 构建，并可通过 Swift Build 直接面向 Android 构建。","flag":"","se":[],"links":[],"blocks":[{"type":"p","html":"这些改进的共同点是“少写胶水代码”：跨语言边界时，不必再手工在 \u003ccode>std::span\u003c/code> 与指针之间转换，也不必为 Java 侧写回调包装。"}]},{"id":"embedded-64","release":"6.4","since":"6.4","title":"Embedded Swift：支持存在类型 \u003ccode>any\u003c/code>","plainTitle":"Embedded Swift：支持存在类型 any","en":"Embedded Swift improvements","line":5,"level":"brief","short":"Embedded","tags":"Embedded 嵌入式 微控制器 existential any Error 异构集合 固件 firmware","tldr":"Embedded Swift 扩大了对存在类型的支持，例如 \u003ccode>any Protocol\u003c/code>，因此可以使用异构集合，抛出和捕获任意 \u003ccode>Error\u003c/code>；新的 \u003ccode>EmbeddedRestrictions\u003c/code> 诊断分组可以对整个 target 开启。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":".target(\n    name: \"FirmwareCore\",\n    swiftSettings: [\n        .treatWarning(\"EmbeddedRestrictions\", as: .warning)\n    ]\n)","hl":"","file":"Package.swift","check":"none"}]}],"challenges":[{"id":"ch-detached","title":"把计数器交给后台任务，然后自己也改一下","topic":"Swift 6 语言模式","related":"swift6-mode","flags":"-swift-version 6","code":"final class Counter { var value = 0 }\n\nfunc race() {\n    let counter = Counter()\n    Task.detached { counter.value += 1 }\n    counter.value += 1\n}","answer":"error","diagnostics":"main.swift:5:10: error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n3 | func race() {\n4 |     let counter = Counter()\n5 |     Task.detached { counter.value += 1 }\n  |          |- error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n  |          `- note: Passing value of non-Sendable type '() async -> ()' as a 'sending' argument to static method 'detached(name:priority:operation:)' risks causing races in between local and caller code\n6 |     counter.value += 1\n  |     `- note: access can happen concurrently\n7 | }\n8 | \n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","explain":"非 \u003ccode>Sendable\u003c/code> 的 \u003ccode>counter\u003c/code> 被交给了 \u003ccode>Task.detached\u003c/code>，之后当前线程又访问了它。两处访问可能同时发生，这就是数据竞争。Swift 6 模式下这是\u003cstrong>编译错误\u003c/strong>。"},{"id":"ch-region","title":"新建一个对象交给后台任务，之后再也不碰","topic":"区域隔离","related":"region-sending","flags":"-swift-version 6","code":"final class Log { var lines: [String] = [] }\n\nfunc start() {\n    let log = Log()\n    log.lines.append(\"启动\")\n    Task.detached { log.lines.append(\"后台\") }\n}","answer":"ok","diagnostics":"","explain":"区域隔离（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md\" target=\"_blank\" rel=\"noopener\">SE-0414\u003c/a>）能证明 \u003ccode>log\u003c/code> 所在的区域被整体交了出去，之后没有任何访问，所以即使 \u003ccode>Log\u003c/code> 不是 \u003ccode>Sendable\u003c/code> 也能\u003cstrong>安全编译\u003c/strong>。"},{"id":"ch-static-var","title":"一个普通的静态变量","topic":"全局可变状态","related":"swift6-mode","flags":"-swift-version 6","code":"struct AppConfig {\n    static var shared = AppConfig()\n    var debug = false\n}","answer":"error","diagnostics":"main.swift:2:16: error: static property 'shared' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n1 | struct AppConfig {\n2 |     static var shared = AppConfig()\n  |                |- error: static property 'shared' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n  |                |- note: convert 'shared' to a 'let' constant to make 'Sendable' shared state immutable\n  |                |- note: add '@MainActor' to make static property 'shared' part of global actor 'MainActor'\n  |                `- note: disable concurrency-safety checks if accesses are protected by an external synchronization mechanism\n3 |     var debug = false\n4 | }\n\n[#MutableGlobalVariable]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/mutable-global-variable>","explain":"\u003ccode>static var\u003c/code> 是任何线程都能读写的全局可变状态。Swift 6 模式要求你用 \u003ccode>let\u003c/code>、全局 actor（如 \u003ccode>@MainActor\u003c/code>）或 \u003ccode>nonisolated(unsafe)\u003c/code> 说明它如何保证安全。"},{"id":"ch-typed-throws","title":"类型化抛出，catch 里不写兜底","topic":"类型化抛出","related":"typed-throws","flags":"-swift-version 6","code":"enum NetworkError: Error { case offline, timeout }\n\nfunc ping() throws(NetworkError) { throw .timeout }\n\nfunc check() {\n    do {\n        try ping()\n    } catch {\n        switch error {\n        case .offline: print(\"离线\")\n        case .timeout: print(\"超时\")\n        }\n    }\n}","answer":"ok","diagnostics":"","explain":"因为函数声明了 \u003ccode>throws(NetworkError)\u003c/code>，\u003ccode>catch\u003c/code> 里的 \u003ccode>error\u003c/code> 静态类型就是 \u003ccode>NetworkError\u003c/code>，\u003ccode>switch\u003c/code> 覆盖了全部两个 case，完全合法，也不需要额外的 \u003ccode>catch\u003c/code> 分支。"},{"id":"ch-consume-twice","title":"不可复制的值，用了两次","topic":"~Copyable","related":"noncopyable-generics","flags":"-swift-version 6","code":"struct Envelope: ~Copyable {\n    consuming func seal() {}\n}\n\nfunc send() {\n    let envelope = Envelope()\n    envelope.seal()\n    envelope.seal()\n}","answer":"error","diagnostics":"main.swift:6:9: error: 'envelope' consumed more than once\n 4 | \n 5 | func send() {\n 6 |     let envelope = Envelope()\n   |         `- error: 'envelope' consumed more than once\n 7 |     envelope.seal()\n   |     `- note: consumed here\n 8 |     envelope.seal()\n   |     `- note: consumed again here\n 9 | }\n10 |","explain":"\u003ccode>seal()\u003c/code> 是 \u003ccode>consuming\u003c/code> 的：第一次调用就把 \u003ccode>envelope\u003c/code> 的所有权拿走了。第二次调用时它已经不存在，编译器会报“consumed more than once”。"},{"id":"ch-inline-append","title":"往 InlineArray 里追加一个元素","topic":"InlineArray","related":"inlinearray","flags":"-swift-version 6","code":"func grow() {\n    var rgb: [3 of UInt8] = [255, 128, 0]\n    rgb.append(64)\n}","answer":"error","diagnostics":"main.swift:3:9: error: value of type '[3 of UInt8]' has no member 'append'\n1 | func grow() {\n2 |     var rgb: [3 of UInt8] = [255, 128, 0]\n3 |     rgb.append(64)\n  |         `- error: value of type '[3 of UInt8]' has no member 'append'\n4 | }\n5 |","explain":"\u003ccode>InlineArray\u003c/code> 的长度是类型的一部分（这里是 3），它根本没有 \u003ccode>append\u003c/code> 方法。需要可变长度，请用 \u003ccode>Array\u003c/code> 或 6.4 的 \u003ccode>UniqueArray\u003c/code>。"},{"id":"ch-trailing-call","title":"函数调用的最后一个实参后面多一个逗号","topic":"尾随逗号","related":"trailing-commas","flags":"-swift-version 6","code":"func greet(_ name: String, times: Int) -> String {\n    String(repeating: \"你好，\\(name)！\", count: times)\n}\n\nlet text = greet(\n    \"Swift\",\n    times: 2,\n)","answer":"ok","diagnostics":"","explain":"Swift 6.1（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0439-trailing-comma-lists.md\" target=\"_blank\" rel=\"noopener\">SE-0439\u003c/a>）起，形参列表、实参列表、元组、泛型参数列表和捕获列表都允许尾随逗号。"},{"id":"ch-trailing-if","title":"if 条件列表末尾多一个逗号","topic":"尾随逗号","related":"trailing-commas","flags":"-swift-version 6","code":"func check(_ a: Bool, _ b: Bool) {\n    if a, b, {\n        print(\"都成立\")\n    }\n}","answer":"error","diagnostics":"main.swift:4:6: error: expected '{' after 'if' condition\n2 |     if a, b, {\n3 |         print(\"都成立\")\n4 |     }\n  |      `- error: expected '{' after 'if' condition\n5 | }\n6 | \n\nmain.swift:2:14: error: function produces expected type 'Bool'; did you mean to call it with '()'?\n1 | func check(_ a: Bool, _ b: Bool) {\n2 |     if a, b, {\n  |              `- error: function produces expected type 'Bool'; did you mean to call it with '()'?\n3 |         print(\"都成立\")\n4 |     }\n\nmain.swift:3:9: error: cannot convert value of type '()' to closure result type 'Bool'\n1 | func check(_ a: Bool, _ b: Bool) {\n2 |     if a, b, {\n3 |         print(\"都成立\")\n  |         `- error: cannot convert value of type '()' to closure result type 'Bool'\n4 |     }\n5 | }","explain":"条件列表是 \u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0439-trailing-comma-lists.md\" target=\"_blank\" rel=\"noopener\">SE-0439\u003c/a> 明确排除的例外：\u003ccode>if a, b, {\u003c/code> 中最后的逗号会让编译器把 \u003ccode>{\u003c/code> 当成下一个条件的开始，所以依然是语法错误。"},{"id":"ch-weak-let","title":"Sendable 类里放一个 weak let","topic":"weak let","related":"weak-let","flags":"-swift-version 6","code":"final class Comment: Sendable {\n    weak let replyTo: Comment?\n    init(replyTo: Comment?) { self.replyTo = replyTo }\n}","answer":"ok","diagnostics":"","explain":"Swift 6.3 起 \u003ccode>weak let\u003c/code> 是合法的不可变弱引用。它不能被重新赋值，所以不会引起数据竞争，类可以安全地声明为 \u003ccode>Sendable\u003c/code>。如果写成 \u003ccode>weak var\u003c/code>，就会报错。"},{"id":"ch-mainactor-eq","title":"主 actor 类直接遵循 Equatable","topic":"隔离一致性","related":"isolated-conformances","flags":"-swift-version 6","code":"@MainActor\nfinal class Song: Equatable {\n    var title = \"\"\n    static func == (a: Song, b: Song) -> Bool { a.title == b.title }\n}","answer":"error","diagnostics":"main.swift:2:19: error: conformance of 'Song' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n1 | @MainActor\n2 | final class Song: Equatable {\n  |                   |- error: conformance of 'Song' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n  |                   |- note: isolate this conformance to the main actor with '@MainActor'\n  |                   `- note: turn data races into runtime errors with '@preconcurrency'\n3 |     var title = \"\"\n4 |     static func == (a: Song, b: Song) -> Bool { a.title == b.title }\n  |                 |- note: main actor-isolated operator function '==' cannot satisfy nonisolated requirement\n  |                 `- note: mark operator function '==' 'nonisolated'\n5 | }\n6 | \n\n[#ConformanceIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/conformance-isolation>","explain":"\u003ccode>Equatable\u003c/code> 的 \u003ccode>==\u003c/code> 是非隔离的要求，而这个类的 \u003ccode>==\u003c/code> 被推断为主 actor 隔离，二者不匹配。修法是写成 \u003ccode>@MainActor Equatable\u003c/code>（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0470-isolated-conformances.md\" target=\"_blank\" rel=\"noopener\">SE-0470\u003c/a>），或者开启 \u003ccode>InferIsolatedConformances\u003c/code> 让编译器自动推断。"},{"id":"ch-nonsending","title":"开启 NonisolatedNonsendingByDefault 后，主 actor 调用非 Sendable 对象的异步方法","topic":"nonisolated(nonsending)","related":"nonsending","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","code":"final class Store {\n    var saved = 0\n    func save() async { saved += 1 }\n}\n\n@MainActor\nfinal class Screen {\n    let store = Store()\n    func tap() async { await store.save() }\n}","answer":"ok","diagnostics":"","explain":"开启后，\u003ccode>Store.save()\u003c/code> 在调用者（主 actor）上运行，\u003ccode>store\u003c/code> 没有跨越任何隔离边界，所以\u003cstrong>编译通过\u003c/strong>。如果去掉这个 upcoming feature，同样的代码会报 “sending 'self.store' risks causing data races”。"},{"id":"ch-interp","title":"用 ?? 给 Int? 一个字符串默认值","topic":"字符串插值默认值","related":"interp-default","flags":"-swift-version 6","code":"func describe(_ age: Int?) -> String {\n    \"年龄：\\(age ?? \"未知\")\"\n}","answer":"error","diagnostics":"main.swift:2:17: error: cannot convert value of type 'Int?' to expected argument type 'String?'\n1 | func describe(_ age: Int?) -> String {\n2 |     \"年龄：\\(age ?? \"未知\")\"\n  |           `- error: cannot convert value of type 'Int?' to expected argument type 'String?'\n3 | }\n4 |","explain":"两边类型必须一致：\u003ccode>??\u003c/code> 左边是 \u003ccode>Int?\u003c/code>，右边却是字符串，所以报错。Swift 6.2 的写法是 \u003ccode>&quot;\\(age, default: &quot;未知&quot;)&quot;\u003c/code>，默认值可以是任意类型的文字。"},{"id":"ch-raw-id","title":"以数字开头的枚举 case","topic":"原始标识符","related":"raw-identifiers","flags":"-swift-version 6","code":"enum Resolution {\n    case `720p`, `1080p`, `4K`\n}\n\nlet best = Resolution.`4K`","answer":"ok","diagnostics":"","explain":"Swift 6.2（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0451-escaped-identifiers.md\" target=\"_blank\" rel=\"noopener\">SE-0451\u003c/a>）的原始标识符允许反引号里出现空格、标点，也可以以数字开头。使用时同样要加反引号：\u003ccode>Resolution.`4K`\u003c/code>。"},{"id":"ch-task-unused","title":"创建一个会抛错的 Task，但不保存它","topic":"Task 警告","related":"task-unused","flags":"-swift-version 6","code":"struct SyncError: Error {}\nfunc sync() async throws { throw SyncError() }\n\nfunc onLaunch() {\n    Task { try await sync() }\n}","answer":"warning","diagnostics":"main.swift:5:5: warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n3 | \n4 | func onLaunch() {\n5 |     Task { try await sync() }\n  |     |- warning: unstructured throwing task created by 'init(name:priority:operation:)' is not used, which may accidentally ignore errors thrown inside the task [#NoUseUnstructuredThrowingTask]\n  |     `- note: to silence this warning, handle the error inside the task, or store/discard the task value explicitly\n6 | }\n7 | \n\n[#NoUseUnstructuredThrowingTask]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/no-use-throwing-unstructured-task>","explain":"Swift 6.4（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0520-discardableresult-task-initializers.md\" target=\"_blank\" rel=\"noopener\">SE-0520\u003c/a>）会对“会抛错、但返回值没人使用”的非结构化任务发出\u003cstrong>警告\u003c/strong>：里面的错误会被悄悄吞掉。可以在任务内部处理错误，或者写 \u003ccode>_ = Task { … }\u003c/code> 明确丢弃。"},{"id":"ch-defer-await","title":"在同步函数的 defer 里 await","topic":"async defer","related":"async-defer","flags":"-swift-version 6","code":"func flush() async {}\n\nfunc close() {\n    defer { await flush() }\n    print(\"关闭\")\n}","answer":"error","diagnostics":"main.swift:4:5: error: 'async' defer must appear within an 'async' context\n2 | \n3 | func close() {\n4 |     defer { await flush() }\n  |     `- error: 'async' defer must appear within an 'async' context\n5 |     print(\"关闭\")\n6 | }","explain":"6.4 允许 \u003ccode>defer\u003c/code> 里出现 \u003ccode>await\u003c/code>，前提是所在的函数本身是 \u003ccode>async\u003c/code> 的。同步函数无法挂起，所以这里依然是错误。"},{"id":"ch-some-optional","title":"返回 some Shape?，不加括号","topic":"some P?","related":"optional-some","flags":"-swift-version 6","code":"protocol Shape {}\nstruct Dot: Shape {}\n\nfunc maybeShape(_ show: Bool) -> some Shape? {\n    show ? Dot() : nil\n}","answer":"ok","diagnostics":"","explain":"Swift 6.4（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0521-improved-optional-opaque-and-any.md\" target=\"_blank\" rel=\"noopener\">SE-0521\u003c/a>）起，\u003ccode>some P?\u003c/code> 等价于 \u003ccode>(some P)?\u003c/code>，\u003ccode>any P?\u003c/code> 等价于 \u003ccode>(any P)?\u003c/code>。"},{"id":"ch-diagnose","title":"在 @diagnose(…, as: ignored) 里调用废弃 API","topic":"@diagnose","related":"diagnose","flags":"-swift-version 6","code":"@available(*, deprecated)\nfunc legacy() {}\n\n@diagnose(DeprecatedDeclaration, as: ignored)\nfunc bridge() {\n    legacy()\n}","answer":"ok","diagnostics":"","explain":"\u003ccode>@diagnose(DeprecatedDeclaration, as: ignored)\u003c/code> 让这个函数范围内的“已废弃”警告完全静音，所以既没有错误也没有警告。"}],"labs":{"concurrency-classic":{"id":"concurrency-classic","title":"旧规则（6.0 / 6.1 默认）","note":"\u003ccode>nonisolated async\u003c/code> 函数总是跑到全局并发线程池上。","cmp":"非 Sendable 的 \u003ccode>api\u003c/code> 被带去了别的线程","flags":"-swift-version 6","code":"final class APIClient {\n    func fetch() async -> String {\n        let raw = await download()        // ③\n        return parse(raw)                 // ④\n    }\n    func download() async -> [UInt8] { Array(\"Swift\".utf8) }\n    func parse(_ raw: [UInt8]) -> String { String(decoding: raw, as: UTF8.self) }\n}\n\n@MainActor\nfinal class ProfileModel {\n    var name = \"\"\n    let api = APIClient()\n\n    func refresh() async {\n        name = \"加载中…\"                   // ①\n        let result = await api.fetch()    // ②\n        name = result                     // ⑤\n    }\n}","result":{"status":"error","diagnostics":"main.swift:17:32: error: sending 'self.api' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n15 |     func refresh() async {\n16 |         name = \"加载中…\"                   // ①\n17 |         let result = await api.fetch()    // ②\n   |                                |- error: sending 'self.api' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |                                `- note: sending main actor-isolated 'self.api' to @concurrent instance method 'fetch()' risks causing data races between @concurrent and main actor-isolated uses\n18 |         name = result                     // ⑤\n19 |     }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"},"steps":[{"lane":"main","mark":"①","text":"在主 actor 上执行 \u003ccode>name = &quot;加载中…&quot;\u003c/code>"},{"lane":"out","mark":"②","text":"调用 \u003ccode>api.fetch()\u003c/code>：它是 \u003ccode>nonisolated async\u003c/code>，按旧规则\u003cstrong>离开主 actor\u003c/strong>，切换到全局并发线程池"},{"lane":"pool","mark":"③","text":"\u003ccode>download()\u003c/code> 也在线程池上发起；等待网络时挂起，不占用线程"},{"lane":"pool","mark":"④","text":"\u003ccode>parse(raw)\u003c/code> 在线程池上执行"},{"lane":"in","mark":"⑤","text":"结果返回，\u003cstrong>切回\u003c/strong>主 actor"},{"lane":"main","mark":"⑤","text":"\u003ccode>name = result\u003c/code>"}]},"concurrency-nonsending":{"id":"concurrency-nonsending","title":"新规则：nonsending（6.2 起）","note":"开启 \u003ccode>NonisolatedNonsendingByDefault\u003c/code> 后，异步函数默认在调用者的 actor 上运行。","cmp":"全程在主 actor 上，但 \u003ccode>parse\u003c/code> 会占用主线程","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","code":"final class APIClient {\n    func fetch() async -> String {\n        let raw = await download()        // ③\n        return parse(raw)                 // ④\n    }\n    func download() async -> [UInt8] { Array(\"Swift\".utf8) }\n    func parse(_ raw: [UInt8]) -> String { String(decoding: raw, as: UTF8.self) }\n}\n\n@MainActor\nfinal class ProfileModel {\n    var name = \"\"\n    let api = APIClient()\n\n    func refresh() async {\n        name = \"加载中…\"                   // ①\n        let result = await api.fetch()    // ②\n        name = result                     // ⑤\n    }\n}","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"},"steps":[{"lane":"main","mark":"①","text":"在主 actor 上执行 \u003ccode>name = &quot;加载中…&quot;\u003c/code>"},{"lane":"main","mark":"②","text":"调用 \u003ccode>api.fetch()\u003c/code>：nonsending，\u003cstrong>留在主 actor\u003c/strong>，没有线程切换"},{"lane":"wait","mark":"③","text":"\u003ccode>download()\u003c/code> 在主 actor 上发起；等待网络时挂起，主线程空闲，可以继续响应界面"},{"lane":"main","mark":"④","text":"\u003ccode>parse(raw)\u003c/code> 在主 actor 上执行。如果解析很耗时，会卡住界面！"},{"lane":"main","mark":"⑤","text":"\u003ccode>name = result\u003c/code>"}]},"concurrency-concurrent":{"id":"concurrency-concurrent","title":"新规则 + @concurrent","note":"默认留在原地，只把真正耗时的 \u003ccode>parse\u003c/code> 显式交给线程池。","cmp":"只有耗时的 \u003ccode>parse\u003c/code> 被显式送去后台","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","code":"final class APIClient {\n    func fetch() async -> String {\n        let raw = await download()          // ③\n        return await Self.parse(raw)        // ④\n    }\n    func download() async -> [UInt8] { Array(\"Swift\".utf8) }\n\n    @concurrent\n    static func parse(_ raw: [UInt8]) async -> String {\n        String(decoding: raw, as: UTF8.self)\n    }\n}\n\n@MainActor\nfinal class ProfileModel {\n    var name = \"\"\n    let api = APIClient()\n\n    func refresh() async {\n        name = \"加载中…\"                     // ①\n        let result = await api.fetch()      // ②\n        name = result                       // ⑤\n    }\n}","result":{   const first = Object.values(BUNDLES)[0];
