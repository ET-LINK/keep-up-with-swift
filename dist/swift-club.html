escription","tags":"debug LLDB 调试 debugDescription macro 宏","tldr":"给类型加上 \u003ccode>@DebugDescription\u003c/code> 宏，LLDB 在变量窗口和崩溃报告里就会直接显示你定义的摘要，不需要运行代码。","flag":"","se":[{"id":"SE-0440","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0440-debug-description-macro.md","title":"DebugDescription Macro"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@DebugDescription\nstruct Order: CustomDebugStringConvertible {\n    var id: Int\n    var total: Double\n\n    var debugDescription: String { \"订单 #\\(id)：¥\\(total)\" }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"宏会把 \u003ccode>debugDescription\u003c/code> 编译成 LLDB 的摘要格式并嵌入二进制，所以它只能使用简单的字符串插值（存储属性），不能调用任意函数。"}]},{"id":"platform-60","release":"6.0","since":"6.0","title":"统一的 Foundation、静态 Linux SDK 与 Embedded Swift","plainTitle":"统一的 Foundation、静态 Linux SDK 与 Embedded Swift","en":"Foundation, Static Linux SDK & Embedded Swift","line":5,"level":"brief","short":"跨平台基础","tags":"Foundation Linux static Embedded 嵌入式 跨平台 musl","tldr":"Swift 6 起，所有平台共用同一套用 Swift 重写的 Foundation；新的静态 Linux SDK 可以构建完全静态链接、无依赖的可执行文件；实验性的 Embedded Swift 能为微控制器生成很小的二进制。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# 用静态 Linux SDK 构建一个不依赖任何系统库的可执行文件\nswift build --swift-sdk x86_64-swift-linux-musl","hl":"","check":"none"},{"type":"p","html":"这三件事看起来零散，却奠定了后两年“Swift 到处跑”的基础：6.2 的 WebAssembly、6.3 的官方 Android SDK，以及 6.4 的嵌入式存在类型支持。"}]},{"id":"nonisolated-types","release":"6.1","since":"6.1","title":"\u003ccode>nonisolated\u003c/code> 可以修饰类型与扩展","plainTitle":"nonisolated 可以修饰类型与扩展","en":"Allow nonisolated to prevent global actor inference","line":1,"level":"key","short":"nonisolated 类型","tags":"nonisolated extension 扩展 MainActor 推断 inference 协议一致性","tldr":"以前 \u003ccode>nonisolated\u003c/code> 只能写在单个属性或方法上。现在可以写在整个 \u003ccode>extension\u003c/code> 上，一次让里面所有成员都不受 actor 隔离；写在类型上，还能阻止编译器自动推断出全局 actor。","flag":"","se":[{"id":"SE-0449","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0449-nonisolated-for-global-actor-cutoff.md","title":"Allow `nonisolated` to prevent global actor inference"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：每个成员都要单独写一遍 nonisolated","code":"@MainActor\nstruct Product {\n    var name: String\n    var price: Double\n}\n\nextension Product: CustomStringConvertible, Equatable {\n    nonisolated var description: String { \"\\(name) ¥\\(price)\" }\n    nonisolated static func == (a: Product, b: Product) -> Bool { a.name == b.name }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.1：一个 nonisolated extension 搞定","code":"@MainActor\nstruct Product {\n    var name: String\n    var price: Double\n}\n\nnonisolated extension Product: CustomStringConvertible, Equatable {\n    var description: String { \"\\(name) ¥\\(price)\" }\n    static func == (a: Product, b: Product) -> Bool { a.name == b.name }\n}","hl":"7","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"另一个用途是阻止“隔离推断”。遵循一个 \u003ccode>@MainActor\u003c/code> 协议的类型，会被自动推断成 \u003ccode>@MainActor\u003c/code>，于是在其他地方用它就处处要 \u003ccode>await\u003c/code>："},{"type":"code","lang":"swift","title":"遵循了 @MainActor 协议，类型被悄悄推断成主 actor 隔离","code":"@MainActor protocol Screen {}\n\nstruct Settings: Screen {\n    var theme = \"dark\"\n    func export() -> String { theme }\n}\n\nfunc backup(_ s: Settings) -> String {\n    s.export()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:7: error: call to main actor-isolated instance method 'export()' in a synchronous nonisolated context [#ActorIsolatedCall]\n 3 | struct Settings: Screen {\n 4 |     var theme = \"dark\"\n 5 |     func export() -> String { theme }\n   |          |- note: calls to instance method 'export()' from outside of its actor context are implicitly asynchronous\n   |          `- note: main actor isolation inferred from conformance to protocol 'Screen'\n 6 | }\n 7 | \n 8 | func backup(_ s: Settings) -> String {\n   |      `- note: add '@MainActor' to make global function 'backup' part of global actor 'MainActor'\n 9 |     s.export()\n   |       `- error: call to main actor-isolated instance method 'export()' in a synchronous nonisolated context [#ActorIsolatedCall]\n10 | }\n11 | \n\n[#ActorIsolatedCall]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/actor-isolated-call>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"用 nonisolated struct 明确拒绝推断","code":"@MainActor protocol Screen {}\n\nnonisolated struct Settings: Screen {\n    var theme = \"dark\"\n    func export() -> String { theme }\n}\n\nfunc backup(_ s: Settings) -> String {\n    s.export()\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"taskgroup-infer","release":"6.1","since":"6.1","title":"任务组自动推断结果类型","plainTitle":"任务组自动推断结果类型","en":"Allow TaskGroup's ChildTaskResult type to be inferred","line":1,"level":"brief","short":"任务组推断","tags":"withTaskGroup TaskGroup 推断 inference of: 子任务","tldr":"\u003ccode>withTaskGroup(of: Int.self)\u003c/code> 里的 \u003ccode>of:\u003c/code> 现在可以省略，编译器会根据 \u003ccode>addTask\u003c/code> 的闭包推断子任务的结果类型。","flag":"","se":[{"id":"SE-0442","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0442-allow-taskgroup-childtaskresult-type-to-be-inferred.md","title":"Allow TaskGroup's ChildTaskResult Type To Be Inferred"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：必须写 of:","code":"let total = await withTaskGroup(of: Int.self) { group in\n    for n in 1...5 { group.addTask { n * n } }\n    var sum = 0\n    for await square in group { sum += square }\n    return sum\n}\nprint(total)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"55","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"现在：省略 of:","code":"let total = await withTaskGroup { group in\n    for n in 1...5 { group.addTask { n * n } }\n    var sum = 0\n    for await square in group { sum += square }\n    return sum\n}\nprint(total)","hl":"1","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"55","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"顺带一提：这里用 \u003ccode>for await\u003c/code> 而不是 \u003ccode>group.reduce(0, +)\u003c/code>。在主 actor 上直接调用 \u003ccode>reduce\u003c/code> 这类 \u003ccode>nonisolated async\u003c/code> 方法，会把任务组“送”到别的线程，Swift 6 模式下会报 \u003ccode>sending 'group' risks causing data races\u003c/code>。这正是 \u003ca href=\"#f-nonsending\">6.2 的 nonsending\u003c/a> 要解决的问题。"}]},{"id":"trailing-commas","release":"6.1","since":"6.1","title":"尾随逗号几乎到处都能写","plainTitle":"尾随逗号几乎到处都能写","en":"Allow trailing comma in comma-separated lists","line":3,"level":"key","short":"尾随逗号","tags":"trailing comma 逗号 参数列表 元组 泛型 捕获列表 diff","tldr":"数组和字典字面量一直允许最后多一个逗号。Swift 6.1 把它扩展到参数列表、实参列表、元组、泛型参数列表、闭包捕获列表和字符串插值。","flag":"","se":[{"id":"SE-0439","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0439-trailing-comma-lists.md","title":"Allow trailing comma in comma-separated lists"}],"links":[],"blocks":[{"type":"p","html":"最大的好处是 diff 更干净：增删最后一个参数时，只改一行。代码生成工具（宏、插件）也不用再特殊处理最后一项。"},{"type":"code","lang":"swift","title":"","code":"func makeLabel(\n    text: String,\n    size: Double,\n    bold: Bool,          // ← 形参列表\n) -> String {\n    \"\\(text)·\\(size)·\\(bold)\"\n}\n\nlet label = makeLabel(\n    text: \"Swift\",\n    size: 17,\n    bold: true,          // ← 实参列表\n)\n\nlet point = (\n    x: 1,\n    y: 2,                // ← 元组\n)\n\nstruct Pair\u003c\n    First,\n    Second,              // ← 泛型参数列表\n> {}\n\nlet show = { [label, point,] in    // ← 捕获列表\n    print(label, point)\n}\nshow()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Swift·17.0·true (x: 1, y: 2)","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"条件列表是个例外：\u003ccode>if a, b, { }\u003c/code> 依然不允许，因为尾随的逗号会让 \u003ccode>{\u003c/code> 产生歧义。"},{"type":"code","lang":"swift","title":"if 的条件列表不能有尾随逗号","code":"let a = true, b = false\nif a, b, {\n    print(\"不行\")\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:4:2: error: expected '{' after 'if' condition\n2 | if a, b, {\n3 |     print(\"不行\")\n4 | }\n  |  `- error: expected '{' after 'if' condition\n5 | \n\nmain.swift:2:10: error: function produces expected type 'Bool'; did you mean to call it with '()'?\n1 | let a = true, b = false\n2 | if a, b, {\n  |          `- error: function produces expected type 'Bool'; did you mean to call it with '()'?\n3 |     print(\"不行\")\n4 | }\n\nmain.swift:3:5: error: cannot convert value of type '()' to closure result type 'Bool'\n1 | let a = true, b = false\n2 | if a, b, {\n3 |     print(\"不行\")\n  |     `- error: cannot convert value of type '()' to closure result type 'Bool'\n4 | }\n5 |","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"metatype-keypaths","release":"6.1","since":"6.1","title":"元类型键路径：键路径可以指向静态属性","plainTitle":"元类型键路径：键路径可以指向静态属性","en":"Metatype keypaths","line":3,"level":"brief","short":"静态键路径","tags":"keypath 键路径 static 静态属性 metatype 元类型","tldr":"写 \u003ccode>\\Theme.Type.accent\u003c/code> 就能得到指向静态属性的键路径，和实例属性的键路径用法一致。","flag":"","se":[{"id":"SE-0438","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0438-metatype-keypath.md","title":"Metatype Keypaths"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Theme {\n    static let accent = \"orange\"\n    static let font = \"SF Pro\"\n}\n\nlet accentPath = \\Theme.Type.accent\nprint(Theme.self[keyPath: accentPath])\n\nlet all: [KeyPath\u003cTheme.Type, String>] = [\\.accent, \\.font]\nprint(all.map { Theme.self[keyPath: $0] })","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"orange\n[\"orange\", \"SF Pro\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"objc-implementation","release":"6.1","since":"6.1","title":"\u003ccode>@objc @implementation\u003c/code>：用 Swift 实现 Objective-C 类","plainTitle":"@objc @implementation：用 Swift 实现 Objective-C 类","en":"Objective-C implementations in Swift","line":5,"level":"key","short":"@implementation","tags":"Objective-C objc implementation 混编 迁移 头文件 category","tldr":"头文件保持不变，用一个带 \u003ccode>@objc @implementation\u003c/code> 的 Swift 扩展替代 \u003ccode>.m\u003c/code> 文件里的 \u003ccode>@implementation\u003c/code>。老项目可以一个类、一个 category 地逐步迁移到 Swift。","flag":"","se":[{"id":"SE-0436","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0436-objc-implementation.md","title":"Objective-C implementations in Swift"}],"links":[],"blocks":[{"type":"code","lang":"objc","title":"","code":"// 头文件不变，Objective-C 和 Swift 的调用方都照常使用\n@interface MyView : NSView\n- (void)reload;\n@end","hl":"","file":"MyView.h","check":"none"},{"type":"code","lang":"swift","title":"MyView.swift：在 Swift 里写实现","code":"@objc @implementation\nextension MyView {\n    func reload() {\n        print(\"用 Swift 实现的 reload\")\n    }\n}","hl":"","check":"none"},{"type":"p","html":"编译器会检查 Swift 实现和头文件里的声明是否一一对应：漏实现、多实现、签名不匹配都会报错。实现 category 时写 \u003ccode>@objc(CategoryName) @implementation extension MyView\u003c/code>。"}]},{"id":"member-import","release":"6.1","since":"6.1","title":"成员导入可见性","plainTitle":"成员导入可见性","en":"Member import visibility","line":3,"level":"brief","short":"成员导入","tags":"import 可见性 visibility extension 扩展 MemberImportVisibility","tldr":"以前只要模块里\u003cstrong>任意一个文件\u003c/strong>导入了某个模块，它通过扩展添加的方法在\u003cstrong>所有文件\u003c/strong>里都能用。开启 \u003ccode>MemberImportVisibility\u003c/code> 后，只有真正写了 \u003ccode>import\u003c/code> 的文件才能看到这些成员。","flag":"MemberImportVisibility","se":[{"id":"SE-0444","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0444-member-import-visibility.md","title":"Member import visibility"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"// 另一个文件 A.swift 写了 import FancyStrings（它给 String 扩展了 shout()）\n\n// Report.swift 没有 import FancyStrings：\nlet title = \"hello\".shout()\n// 以前：可以编译（悄悄依赖了别的文件的 import）\n// 开启 MemberImportVisibility 后：报错，并提示你加上 import FancyStrings","hl":"","file":"Report.swift","check":"none"},{"type":"p","html":"这让依赖关系变得诚实：删除一个文件不会莫名其妙地让另一个文件编译失败，也避免了不同模块同名扩展方法的歧义。"}]},{"id":"warning-flags","release":"6.1","since":"6.1","title":"精确控制警告：\u003ccode>-Werror\u003c/code> 与诊断分组","plainTitle":"精确控制警告：-Werror 与诊断分组","en":"Precise control flags over compiler warnings","line":6,"level":"brief","short":"警告分组","tags":"warnings 警告 -Werror -Wwarning warnings-as-errors 诊断分组 diagnostic group","tldr":"以前只能“全部警告当错误”或者“全部不当”。现在可以按\u003cstrong>诊断分组\u003c/strong>单独控制，例如所有警告都升级为错误，唯独“已废弃 API”保持为警告。","flag":"","se":[{"id":"SE-0443","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0443-warning-control-flags.md","title":"Precise Control Flags over Compiler Warnings"}],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# 所有警告视为错误，但“使用了已废弃的 API”保持为警告\nswiftc -warnings-as-errors -Wwarning DeprecatedDeclaration main.swift\n\n# 只把某一组警告升级为错误\nswiftc -Werror DeprecatedDeclaration main.swift","hl":"","check":"none"},{"type":"p","html":"分组名就是编译器诊断末尾方括号里的名字。本站展示的真实编译输出里随处可见，比如 \u003ccode>[#DeprecatedDeclaration]\u003c/code>、\u003ccode>[#RegionIsolation]\u003c/code>，每个分组都有一篇官方文档。6.2 起 SwiftPM 也能这样设置（见 \u003ca href=\"#f-swiftpm-62\">6.2\u003c/a>），6.4 更是可以直接在源码里用 \u003ca href=\"#f-diagnose\">undefined\u003c/a> 控制。"}]},{"id":"package-traits","release":"6.1","since":"6.1","title":"SwiftPM 包特性（Package Traits）","plainTitle":"SwiftPM 包特性（Package Traits）","en":"Package traits","line":6,"level":"key","short":"包特性","tags":"SwiftPM package traits 特性 条件编译 可选依赖 Embedded WebAssembly","tldr":"一个包可以声明若干“特性”（trait），使用者按需开启或关闭。特性可以控制条件编译和可选依赖，让同一个包在服务器、嵌入式、WebAssembly 等环境里提供不同的功能。","flag":"","se":[{"id":"SE-0450","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0450-swiftpm-package-traits.md","title":"Package traits"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"// swift-tools-version: 6.1\nimport PackageDescription\n\nlet package = Package(\n    name: \"Logging\",\n    traits: [\n        .trait(name: \"JSON\", description: \"输出 JSON 格式的日志\"),\n        .trait(name: \"Embedded\", description: \"为嵌入式环境裁剪功能\"),\n        .default(enabledTraits: [\"JSON\"]),       // 默认开启 JSON\n    ],\n    targets: [\n        .target(name: \"Logging\"),\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"code","lang":"swift","title":"使用方：只开启需要的特性","code":".package(url: \"https://github.com/example/logging\", from: \"1.0.0\", traits: [\"Embedded\"])","hl":"","check":"none"},{"type":"code","lang":"swift","title":"包内代码：特性就是编译条件","code":"#if JSON\nfunc format(_ message: String) -> String { #\"{\"msg\": \"\\#(message)\"}\"# }\n#else\nfunc format(_ message: String) -> String { message }\n#endif","hl":"","check":"none"}]},{"id":"testing-61","release":"6.1","since":"6.1","title":"Swift Testing：作用域特性与可检查的错误","plainTitle":"Swift Testing：作用域特性与可检查的错误","en":"Test scoping traits & returned errors","line":6,"level":"brief","short":"测试作用域","tags":"Swift Testing TestScoping trait #expect throws 错误 setUp tearDown","tldr":"\u003ccode>#expect(throws:)\u003c/code> 和 \u003ccode>#require(throws:)\u003c/code> 现在会返回捕获到的错误，方便进一步检查；遵循 \u003ccode>TestScoping\u003c/code> 的自定义特性可以在测试前后执行准备和清理逻辑。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\n\nenum LoginError: Error, Equatable {\n    case wrongPassword(attemptsLeft: Int)\n}\n\nfunc login(_ password: String) throws(LoginError) {\n    throw .wrongPassword(attemptsLeft: 2)\n}\n\n@Test func reportsAttemptsLeft() {\n    let error = #expect(throws: LoginError.self) {\n        try login(\"123456\")\n    }\n    #expect(error == .wrongPassword(attemptsLeft: 2))   // 返回值就是那个错误\n}\n\nstruct MockServer: TestTrait, TestScoping {\n    func provideScope(\n        for test: Test,\n        testCase: Test.Case?,\n        performing function: @Sendable () async throws -> Void\n    ) async throws {\n        print(\"启动模拟服务器\")\n        try await function()\n        print(\"关闭模拟服务器\")\n    }\n}\n\nextension Trait where Self == MockServer {\n    static var mockServer: Self { Self() }\n}\n\n@Test(.mockServer) func fetchProfile() async {\n    #expect(true)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 （链接 Swift Testing） main.swift"}}]},{"id":"default-isolation","release":"6.2","since":"6.2","title":"默认隔离到主 actor","plainTitle":"默认隔离到主 actor","en":"Control default actor isolation inference","line":1,"level":"core","short":"默认 MainActor","tags":"default isolation MainActor 主线程 主actor 单线程 App 脚本 -default-isolation defaultIsolation Approachable Concurrency","tldr":"一个编译选项，把模块里所有“没写隔离”的代码默认推断为 \u003ccode>@MainActor\u003c/code>。对 App 和脚本来说，大部分代码天然就是单线程的，不用再到处补 \u003ccode>@MainActor\u003c/code>。","flag":"","se":[{"id":"SE-0466","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0466-control-default-actor-isolation.md","title":"Control default actor isolation inference"}],"links":[],"blocks":[{"type":"p","html":"Swift 6 模式的一个痛点是：UI 相关的类型大多需要 \u003ccode>@MainActor\u003c/code>，漏写一个，报错就会沿着调用链蔓延。下面的 \u003ccode>ProfilePresenter\u003c/code> 只是忘了标注："},{"type":"code","lang":"swift","title":"没有标注：编译器不知道 Presenter 运行在哪里","code":"@MainActor\nfinal class ProfileView {\n    func show(_ text: String) { print(\"显示：\", text) }\n}\n\nfinal class ProfilePresenter {\n    let view = ProfileView()\n    func present(name: String) {\n        view.show(\"你好，\\(name)\")\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:14: error: call to main actor-isolated instance method 'show' in a synchronous nonisolated context [#ActorIsolatedCall]\n 1 | @MainActor\n 2 | final class ProfileView {\n 3 |     func show(_ text: String) { print(\"显示：\", text) }\n   |          `- note: calls to instance method 'show' from outside of its actor context are implicitly asynchronous\n 4 | }\n 5 | \n 6 | final class ProfilePresenter {\n 7 |     let view = ProfileView()\n 8 |     func present(name: String) {\n   |          `- note: add '@MainActor' to make instance method 'present(name:)' part of global actor 'MainActor'\n 9 |         view.show(\"你好，\\(name)\")\n   |              `- error: call to main actor-isolated instance method 'show' in a synchronous nonisolated context [#ActorIsolatedCall]\n10 |     }\n11 | }\n\n[#ActorIsolatedCall]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/actor-isolated-call>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"加上 -default-isolation MainActor：同一段代码直接通过","code":"@MainActor\nfinal class ProfileView {\n    func show(_ text: String) { print(\"显示：\", text) }\n}\n\nfinal class ProfilePresenter {\n    let view = ProfileView()\n    func present(name: String) {\n        view.show(\"你好，\\(name)\")\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6 -default-isolation MainActor","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -default-isolation MainActor main.swift"}},{"type":"code","lang":"swift","title":"","code":".executableTarget(\n    name: \"MyApp\",\n    swiftSettings: [\n        .defaultIsolation(MainActor.self),\n        .enableUpcomingFeature(\"NonisolatedNonsendingByDefault\"),\n        .enableUpcomingFeature(\"InferIsolatedConformances\"),\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"list","items":["只影响\u003cstrong>没有显式写隔离\u003c/strong>的声明；明确写了 \u003ccode>nonisolated\u003c/code>、\u003ccode>@concurrent\u003c/code> 或其他 actor 的代码不受影响。","适合 App、命令行工具、脚本这类以主流程为中心的 target；被很多人复用的库（library）通常保持默认的 \u003ccode>nonisolated\u003c/code>。","Xcode 26 新建的 App 工程默认开启 \u003cstrong>Default Actor Isolation = MainActor\u003c/strong> 和 \u003cstrong>Approachable Concurrency\u003c/strong>，后者包含本页的 \u003ccode>NonisolatedNonsendingByDefault\u003c/code> 与 \u003ccode>InferIsolatedConformances\u003c/code>。","需要后台工作时，再用 \u003ca href=\"#f-concurrent\">undefined\u003c/a> 显式标出来。"]},{"type":"quiz","question":"开启 \u003ccode>-default-isolation MainActor\u003c/code> 后，一个显式写了 \u003ccode>nonisolated\u003c/code> 的函数会怎样？","options":["也会被改成 \u003ccode>@MainActor\u003c/code>","保持 \u003ccode>nonisolated\u003c/code>，默认值只作用于没有写隔离的声明","编译报错，两者冲突"],"answer":1,"explain":"默认隔离只是“没写时的默认值”。显式写出的隔离（\u003ccode>nonisolated\u003c/code>、\u003ccode>@concurrent\u003c/code>、\u003ccode>@SomeActor\u003c/code>）永远优先。"}]},{"id":"nonsending","release":"6.2","since":"6.2","title":"\u003ccode>nonisolated(nonsending)\u003c/code>：异步函数默认留在调用者身边","plainTitle":"nonisolated(nonsending)：异步函数默认留在调用者身边","en":"Run nonisolated async functions on the caller's actor by default","line":1,"level":"core","short":"nonsending","tags":"nonisolated nonsending async 异步 调用者 caller actor 执行器 executor 全局并发 线程池 hop","tldr":"以前 \u003ccode>nonisolated\u003c/code> 的 \u003ccode>async\u003c/code> 函数总是跳到全局并发线程池执行，一调用就“跨了线程”，于是到处是 \u003ccode>Sendable\u003c/code> 报错。现在它默认在\u003cstrong>调用者所在的 actor\u003c/strong> 上运行，和同步函数的直觉一致。","flag":"NonisolatedNonsendingByDefault","se":[{"id":"SE-0461","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md","title":"Run nonisolated async functions on the caller's actor by default"}],"links":[],"blocks":[{"type":"p","html":"Swift 5.7 起有一条容易让人困惑的规则：一个不属于任何 actor 的 \u003ccode>async\u003c/code> 函数，被调用时会离开调用者，切换到全局并发执行器（线程池）上运行。所以下面这段再普通不过的代码，在 Swift 6 模式下会报错。\u003ccode>Model\u003c/code> 不是 \u003ccode>Sendable\u003c/code> 的，而调用 \u003ccode>load()\u003c/code> 时它被“带”到了另一个线程："},{"type":"code","lang":"swift","title":"旧规则：nonisolated async 会离开主 actor","code":"final class Model {\n    var items: [String] = []\n    func load() async { items.append(\"新数据\") }\n}\n\n@MainActor\nfinal class ViewModel {\n    let model = Model()\n    func refresh() async {\n        await model.load()\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:10:21: error: sending 'self.model' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n 8 |     let model = Model()\n 9 |     func refresh() async {\n10 |         await model.load()\n   |                     |- error: sending 'self.model' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |                     `- note: sending main actor-isolated 'self.model' to @concurrent instance method 'load()' risks causing data races between @concurrent and main actor-isolated uses\n11 |     }\n12 | }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"注意编译器诊断里的措辞：它已经把旧行为称为 \u003ccode>@concurrent\u003c/code>。开启 upcoming feature 之后，同样的代码直接编译通过，因为 \u003ccode>load()\u003c/code> 现在就在主 actor 上执行，没有任何东西跨越线程："},{"type":"code","lang":"swift","title":"开启 NonisolatedNonsendingByDefault 后","code":"final class Model {\n    var items: [String] = []\n    func load() async { items.append(\"新数据\") }\n}\n\n@MainActor\nfinal class ViewModel {\n    let model = Model()\n    func refresh() async {\n        await model.load()\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"}},{"type":"p","html":"不想整体开启的话，也可以逐个函数显式写出新行为："},{"type":"code","lang":"swift","title":"不开 upcoming feature，逐个函数写 nonisolated(nonsending)","code":"final class Model {\n    var items: [String] = []\n    nonisolated(nonsending) func load() async { items.append(\"新数据\") }\n}\n\n@MainActor\nfinal class ViewModel {\n    let model = Model()\n    func refresh() async {\n        await model.load()\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["同步函数一直是“在调用者的线程上执行”。现在异步函数也一样了，两者的心智模型终于统一。","遇到 \u003ccode>await\u003c/code> 挂起时，主线程照样是空闲的，并不会被“卡住”；只是函数的\u003cstrong>同步部分\u003c/strong>在调用者的 actor 上执行。","迁移：\u003ccode>swift package migrate --to-feature NonisolatedNonsendingByDefault\u003c/code> 会给需要保持旧行为的函数自动加上 \u003ccode>@concurrent\u003c/code>。","用动画看清两种规则的区别：\u003ca href=\"#lab-concurrency\">并发执行轨迹实验室\u003c/a>。"]},{"type":"quiz","question":"开启 \u003ccode>NonisolatedNonsendingByDefault\u003c/code> 后，在 \u003ccode>@MainActor\u003c/code> 方法里 \u003ccode>await\u003c/code> 一个普通的 \u003ccode>nonisolated async\u003c/code> 函数，它的同步代码在哪里执行？","options":["全局并发线程池","主 actor，也就是调用者所在的隔离域","一个新创建的线程"],"answer":1,"explain":"nonsending 的意思是“不把调用交给别的隔离域”，函数继承调用者的隔离。想去后台，就显式写 \u003ccode>@concurrent\u003c/code>。"}]},{"id":"concurrent","release":"6.2","since":"6.2","title":"\u003ccode>@concurrent\u003c/code>：需要并行时，明确说出来","plainTitle":"@concurrent：需要并行时，明确说出来","en":"The @concurrent attribute","line":1,"level":"core","short":"@concurrent","tags":"concurrent 并行 后台 background 线程池 耗时 解码 主线程","tldr":"想把耗时的工作放到后台线程池？给 \u003ccode>async\u003c/code> 函数加上 \u003ccode>@concurrent\u003c/code>。它总是在全局并发执行器上运行，让主 actor 保持空闲。","flag":"","se":[{"id":"SE-0461","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md","title":"Run nonisolated async functions on the caller's actor by default"}],"links":[],"blocks":[{"type":"p","html":"新规则一句话：\u003cstrong>默认留在原地（nonsending），并行请显式（@concurrent）\u003c/strong>。"},{"type":"code","lang":"swift","title":"把解码这种重活交给后台","code":"struct Photo: Sendable {\n    let pixels: [UInt8]\n}\n\nenum PhotoDecoder {\n    @concurrent\n    static func decode(_ data: [UInt8]) async -> Photo {\n        // 想象这里是一段很耗时的解码\n        Photo(pixels: data.map { 255 - $0 })\n    }\n}\n\n@MainActor\nfinal class PhotoViewModel {\n    var photo: Photo?\n\n    func load(_ data: [UInt8]) async {\n        photo = await PhotoDecoder.decode(data)    // 解码在后台进行，主线程不被阻塞\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"}},{"type":"p","html":"既然 \u003ccode>@concurrent\u003c/code> 函数真的会切换到另一个线程，传给它的参数就必须能安全地跨越隔离边界："},{"type":"code","lang":"swift","title":"@concurrent 跨越了隔离边界，参数必须能安全传递","code":"final class Draft {               // 不是 Sendable\n    var text = \"\"\n}\n\n@concurrent\nfunc save(_ draft: Draft) async {\n    print(draft.text)\n}\n\n@MainActor\nfinal class Editor {\n    let draft = Draft()\n    func autosave() async {\n        await save(draft)\n    }\n}","hl":"","check":"error","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","result":{"status":"error","diagnostics":"main.swift:14:15: error: sending 'self.draft' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n12 |     let draft = Draft()\n13 |     func autosave() async {\n14 |         await save(draft)\n   |               |- error: sending 'self.draft' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |               `- note: sending main actor-isolated 'self.draft' to @concurrent global function 'save' risks causing data races between @concurrent and main actor-isolated uses\n15 |     }\n16 | }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"}},{"type":"list","items":["\u003ccode>@concurrent\u003c/code> 只能用于 \u003ccode>async\u003c/code> 函数，并且隐含 \u003ccode>nonisolated\u003c/code>。","不要把所有函数都标成 \u003ccode>@concurrent\u003c/code>：线程切换本身有成本，而且会带来 \u003ccode>Sendable\u003c/code> 的要求。只给真正耗时的计算加。"]}]},{"id":"isolated-conformances","release":"6.2","since":"6.2","title":"隔离一致性：主 actor 类型也能遵守普通协议","plainTitle":"隔离一致性：主 actor 类型也能遵守普通协议","en":"Global-actor isolated conformances","line":1,"level":"key","short":"隔离一致性","tags":"isolated conformance 协议 一致性 Equatable MainActor protocol 遵循","tldr":"写 \u003ccode>@MainActor Equatable\u003c/code> 表示“这份遵循只在主 actor 上有效”。\u003ccode>@MainActor\u003c/code> 的类型终于可以正常实现 \u003ccode>Equatable\u003c/code>、\u003ccode>Hashable\u003c/code> 这类普通协议，编译器负责保证它不会在别的线程上被调用。","flag":"InferIsolatedConformances","se":[{"id":"SE-0470","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0470-isolated-conformances.md","title":"Global-actor isolated conformances"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：主 actor 类型实现 Equatable 会报错","code":"@MainActor\nfinal class Contact: Equatable {\n    var name = \"\"\n\n    static func == (a: Contact, b: Contact) -> Bool {\n        a.name == b.name\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:22: error: conformance of 'Contact' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n1 | @MainActor\n2 | final class Contact: Equatable {\n  |                      |- error: conformance of 'Contact' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n  |                      |- note: isolate this conformance to the main actor with '@MainActor'\n  |                      `- note: turn data races into runtime errors with '@preconcurrency'\n3 |     var name = \"\"\n4 | \n5 |     static func == (a: Contact, b: Contact) -> Bool {\n  |                 |- note: main actor-isolated operator function '==' cannot satisfy nonisolated requirement\n  |                 `- note: mark operator function '==' 'nonisolated'\n6 |         a.name == b.name\n7 |     }\n\n[#ConformanceIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/conformance-isolation>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.2：@MainActor Equatable","code":"@MainActor\nfinal class Contact: @MainActor Equatable {\n    var name = \"\"\n\n    static func == (a: Contact, b: Contact) -> Bool {\n        a.name == b.name\n    }\n}","hl":"2","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"开启 \u003ccode>InferIsolatedConformances\u003c/code> 后，主 actor 类型的协议遵循会自动推断为隔离的，连 \u003ccode>@MainActor\u003c/code> 都不用写。安全性由编译器保证：如果你试图把这份遵循带到主 actor 之外使用，会直接报错。"},{"type":"code","lang":"swift","title":"编译器保证：隔离的遵循不会被带去后台","code":"protocol Describable {\n    func describe() -> String\n}\n\n@MainActor\nfinal class Label: @MainActor Describable {\n    var text = \"你好\"\n    func describe() -> String { text }\n}\n\n@concurrent\nfunc log\u003cT: Describable>(_ value: T) async {\n    print(value.describe())\n}\n\n@MainActor\nfunc run() async {\n    await log(Label())\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:18:11: error: main actor-isolated conformance of 'Label' to 'Describable' cannot be used in @concurrent context [#IsolatedConformances]\n16 | @MainActor\n17 | func run() async {\n18 |     await log(Label())\n   |           `- error: main actor-isolated conformance of 'Label' to 'Describable' cannot be used in @concurrent context [#IsolatedConformances]\n19 | }\n20 | \n\n[#IsolatedConformances]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/isolated-conformances>","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"task-immediate","release":"6.2","since":"6.2","title":"\u003ccode>Task.immediate\u003c/code>：立即在当前上下文开跑","plainTitle":"Task.immediate：立即在当前上下文开跑","en":"Starting tasks synchronously from caller context","line":1,"level":"key","short":"Task.immediate","tags":"Task immediate 立即 同步 启动 调度 顺序 UI 事件","tldr":"普通的 \u003ccode>Task { }\u003c/code> 只是把任务放进队列，稍后才执行。\u003ccode>Task.immediate { }\u003c/code> 会在当前线程上\u003cstrong>立刻\u003c/strong>同步执行，直到第一个真正的挂起点。","flag":"","se":[{"id":"SE-0472","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0472-task-start-synchronously-on-caller-context.md","title":"Starting tasks synchronously from caller context"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"对比执行顺序","code":"@MainActor\nfunc demo() async {\n    print(\"1. 开始\")\n    Task {\n        print(\"4. 普通 Task：等当前代码让出主线程后才执行\")\n    }\n    Task.immediate {\n        print(\"2. Task.immediate：立刻同步执行\")\n    }\n    print(\"3. 回到调用者\")\n    try? await Task.sleep(for: .milliseconds(50))\n}\n\nawait demo()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1. 开始\n2. Task.immediate：立刻同步执行\n3. 回到调用者\n4. 普通 Task：等当前代码让出主线程后才执行","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"适合 UI 事件处理：点击按钮后要立刻更新界面状态（比如显示加载指示），然后再去做异步工作。用普通 \u003ccode>Task\u003c/code> 时，界面可能先渲染一帧旧状态。"}]},{"id":"task-naming","release":"6.2","since":"6.2","title":"给任务起个名字","plainTitle":"给任务起个名字","en":"Task naming","line":1,"level":"brief","short":"任务命名","tags":"Task name 名字 调试 debug Instruments LLDB 任务组","tldr":"创建任务时可以传 \u003ccode>name:\u003c/code>，名字会出现在 LLDB、Instruments 和日志里，调试并发代码时终于知道“这是哪个任务”。","flag":"","se":[{"id":"SE-0469","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0469-task-names.md","title":"Task Naming"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let task = Task(name: \"同步通讯录\") {\n    print(\"当前任务：\", Task.name ?? \"无名\")\n}\nawait task.value\n\nlet names = await withTaskGroup { group in\n    for id in 1...3 {\n        group.addTask(name: \"下载图片-\\(id)\") {\n            Task.name ?? \"\"\n        }\n    }\n    var collected: [String] = []\n    for await name in group { collected.append(name) }\n    return collected\n}\nprint(names.sorted())","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"当前任务： 同步通讯录\n[\"下载图片-1\", \"下载图片-2\", \"下载图片-3\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"isolated-deinit","release":"6.2","since":"6.2","title":"\u003ccode>isolated deinit\u003c/code>：在 actor 上执行析构","plainTitle":"isolated deinit：在 actor 上执行析构","en":"Isolated synchronous deinit","line":1,"level":"brief","short":"isolated deinit","tags":"deinit 析构 isolated MainActor 清理 cleanup","tldr":"\u003ccode>@MainActor\u003c/code> 类的 \u003ccode>deinit\u003c/code> 默认是非隔离的，不能调用主 actor 的方法。写成 \u003ccode>isolated deinit\u003c/code>，析构就会在主 actor 上执行。","flag":"","se":[{"id":"SE-0371","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0371-isolated-synchronous-deinit.md","title":"Isolated synchronous deinit"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"普通 deinit 不能调用主 actor 方法","code":"@MainActor\nfinal class SessionController {\n    func stopTimers() { print(\"停止计时器\") }\n\n    deinit {\n        stopTimers()\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:6:9: error: call to main actor-isolated instance method 'stopTimers()' in a synchronous nonisolated context [#ActorIsolatedCall]\n1 | @MainActor\n2 | final class SessionController {\n3 |     func stopTimers() { print(\"停止计时器\") }\n  |          `- note: calls to instance method 'stopTimers()' from outside of its actor context are implicitly asynchronous\n4 | \n5 |     deinit {\n  |     `- note: add 'isolated' to run isolated to 'MainActor', which may be later than 'nonisolated deinit'\n6 |         stopTimers()\n  |         `- error: call to main actor-isolated instance method 'stopTimers()' in a synchronous nonisolated context [#ActorIsolatedCall]\n7 |     }\n8 | }\n\n[#ActorIsolatedCall]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/actor-isolated-call>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"isolated deinit","code":"@MainActor\nfinal class SessionController {\n    func stopTimers() { print(\"停止计时器\") }\n\n    isolated deinit {\n        stopTimers()\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"如果对象最后一次释放发生在别的线程，运行时会把析构安排到主 actor 上执行，所以析构的时机可能稍晚一些。"}]},{"id":"inlinearray","release":"6.2","since":"6.2","title":"\u003ccode>InlineArray\u003c/code> 与 \u003ccode>[N of T]\u003c/code>：固定长度、不上堆的数组","plainTitle":"InlineArray 与 [N of T]：固定长度、不上堆的数组","en":"InlineArray & type sugar","line":2,"level":"core","short":"InlineArray","tags":"InlineArray 固定大小 fixed-size 数组 栈 stack 堆分配 heap 性能 [N of T]","tldr":"\u003ccode>InlineArray&lt;4, Int&gt;\u003c/code>（简写 \u003ccode>[4 of Int]\u003c/code>）是长度写在类型里的数组：元素直接内联存放在栈上或所属的结构体里，没有堆分配、没有引用计数、没有写时复制。","flag":"","se":[{"id":"SE-0453","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0453-vector.md","title":"InlineArray, a fixed-size array"},{"id":"SE-0483","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0483-inline-array-sugar.md","title":"`InlineArray` Type Sugar"}],"links":[],"blocks":[{"type":"p","html":"\u003ccode>Array\u003c/code> 本身只是一个指针，真正的元素存放在堆上，还附带引用计数和写时复制。对于“长度永远是 4”的数据，这些开销是浪费："},{"type":"code","lang":"swift","title":"和 Array 对比内存布局","code":"let dynamic: [Int] = [1, 2, 3, 4]\nlet fixed: [4 of Int] = [1, 2, 3, 4]          // InlineArray\u003c4, Int> 的简写\n\nprint(MemoryLayout.size(ofValue: dynamic))     // 只是一个指向堆的指针\nprint(MemoryLayout.size(ofValue: fixed))       // 四个 Int 就地存放","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"8\n32","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"基本用法","code":"var rgb: [3 of UInt8] = [255, 128, 0]\nrgb[1] = 200                                   // 可以修改元素\nprint(rgb.count, rgb[1])\n\nlet board = [9 of Character](repeating: \"·\")  // 用重复值初始化\nprint(board.count)\n\nfor i in rgb.indices {                         // 6.2 中它不是 Sequence，用 indices 遍历\n    print(i, rgb[i])\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"3 200\n9\n0 255\n1 200\n2 0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"长度是类型的一部分，所以不能 \u003ccode>append\u003c/code>、不能 \u003ccode>remove\u003c/code>，字面量的元素个数也必须完全一致："},{"type":"code","lang":"swift","title":"元素个数必须和类型一致","code":"let rgb: [3 of UInt8] = [255, 128]","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:1:25: error: expected '3' elements in inline array literal, but got '2'\n1 | let rgb: [3 of UInt8] = [255, 128]\n  |                         `- error: expected '3' elements in inline array literal, but got '2'\n2 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["适合：小而固定的缓冲区、坐标/颜色/矩阵、嵌入式开发、性能热点。","不适合：长度会变化的集合，或者 N 很大的情况（会占用大量栈空间，复制成本也高）。","元素可复制时，\u003ccode>InlineArray\u003c/code> 也可复制，而且复制会\u003cstrong>真的复制全部元素\u003c/strong>，不像 \u003ccode>Array\u003c/code> 那样写时复制。","Swift 6.4 引入 \u003ca href=\"#f-iterable\">undefined\u003c/a> 后，\u003ccode>InlineArray\u003c/code> 可以直接用 \u003ccode>for-in\u003c/code> 遍历。","动手看看不同元素类型的布局：\u003ca href=\"#lab-memory\">内存布局实验室\u003c/a>。"]},{"type":"quiz","question":"\u003ccode>MemoryLayout&lt;[5 of Int]&gt;.size\u003c/code> 在 64 位平台上是多少？","options":["8，和 \u003ccode>Array\u003c/code> 一样只是一个指针","40，五个 \u003ccode>Int\u003c/code> 全部内联存放","48，还要加上一个长度字段"],"answer":1,"explain":"长度写在类型里，不需要在运行时存储，所以 \u003ccode>InlineArray\u003c/code> 的大小就是 N × 元素的 stride：5 × 8 = 40。"}]},{"id":"integer-generics","release":"6.2","since":"6.2","title":"整数泛型参数：\u003ccode>&lt;let N: Int&gt;\u003c/code>","plainTitle":"整数泛型参数：\u003clet N: Int>","en":"Integer generic parameters","line":2,"level":"key","short":"整数泛型","tags":"integer generic 整数泛型 let N value generics 矩阵 matrix 编译期","tldr":"泛型参数不仅可以是类型，还可以是整数：\u003ccode>struct Matrix&lt;let rows: Int, let columns: Int&gt;\u003c/code>。\u003ccode>InlineArray\u003c/code> 的长度参数就是这样实现的。","flag":"","se":[{"id":"SE-0452","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0452-integer-generic-parameters.md","title":"Integer Generic Parameters"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Matrix\u003clet rows: Int, let columns: Int> {\n    var storage: [rows of [columns of Double]]\n\n    init(repeating value: Double) {\n        storage = .init(repeating: .init(repeating: value))\n    }\n\n    var shape: String { \"\\(rows)×\\(columns)\" }    // 在代码里可以像值一样读取\n}\n\nlet m = Matrix\u003c2, 3>(repeating: 0)\nprint(m.shape)\nprint(MemoryLayout\u003cMatrix\u003c2, 3>>.size)    // 6 个 Double，全部内联","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"2×3\n48","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"\u003ccode>Matrix&lt;2, 3&gt;\u003c/code> 和 \u003ccode>Matrix&lt;3, 2&gt;\u003c/code> 是两个不同的类型，所以“形状不匹配”的错误可以在编译期发现。目前整数泛型参数只能是 \u003ccode>Int\u003c/code> 类型的字面量或其他整数泛型参数，还不支持 \u003ccode>N + 1\u003c/code> 这样的计算。"}]},{"id":"span","release":"6.2","since":"6.2","title":"\u003ccode>Span\u003c/code>：安全、零开销地访问连续内存","plainTitle":"Span：安全、零开销地访问连续内存","en":"Span, MutableSpan, RawSpan & friends","line":2,"level":"core","short":"Span","tags":"Span MutableSpan RawSpan OutputSpan UTF8Span 连续内存 contiguous 指针 pointer 内存安全 lifetime 生命周期","tldr":"\u003ccode>Span&lt;T&gt;\u003c/code> 是一段连续内存的只读视图（\u003ccode>MutableSpan\u003c/code> 可写）。它和 \u003ccode>UnsafeBufferPointer\u003c/code> 一样快，但编译器保证它不会比原始数据活得更久：悬垂指针和释放后使用在编译期就被排除。","flag":"","se":[{"id":"SE-0447","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0447-span-access-shared-contiguous-storage.md","title":"Span: Safe Access to Contiguous Storage"},{"id":"SE-0456","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0456-stdlib-span-properties.md","title":"Add `Span`-providing Properties to Standard Library Types"},{"id":"SE-0467","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0467-MutableSpan.md","title":"MutableSpan and MutableRawSpan: delegate mutations of contiguous memory"},{"id":"SE-0485","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0485-outputspan.md","title":"OutputSpan: delegate initialization of contiguous memory"},{"id":"SE-0464","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0464-utf8span-safe-utf8-processing.md","title":"UTF8Span: Safe UTF-8 Processing Over Contiguous Bytes"}],"links":[],"blocks":[{"type":"p","html":"以前，想高效地处理“一段连续的元素”，要么接受 \u003ccode>Array\u003c/code>（可能触发复制），要么用 \u003ccode>withUnsafeBufferPointer\u003c/code> 拿指针（不安全）。\u003ccode>Span\u003c/code> 是第三条路："},{"type":"code","lang":"swift","title":"接受 Span 的函数：Array 和 InlineArray 都能传","code":"func checksum(_ bytes: Span\u003cUInt8>) -> UInt8 {\n    var sum: UInt8 = 0\n    for i in bytes.indices {\n        sum &+= bytes[i]\n    }\n    return sum\n}\n\nlet packet: [UInt8] = [0x12, 0x34, 0x56]\nlet header: [4 of UInt8] = [1, 2, 3, 4]\n\nprint(checksum(packet.span))\nprint(checksum(header.span))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"156\n10","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"MutableSpan：原地修改","code":"func amplify(_ samples: inout [Float]) {\n    var view = samples.mutableSpan       // 独占地借用 samples\n    for i in view.indices {\n        view[i] *= 2\n    }\n}\n\nvar samples: [Float] = [0.5, -1.2, 3.3]\namplify(&samples)\nprint(samples)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[1.0, -2.4, 6.6]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"注意上面把 \u003ccode>mutableSpan\u003c/code> 放在函数里使用：\u003ccode>main.swift\u003c/code> 顶层声明的变量其实是全局变量，而全局变量不能持有 \u003ccode>Span\u003c/code> 这类不可逃逸的值。"},{"type":"p","html":"\u003ccode>Span\u003c/code> 是 \u003ccode>~Escapable\u003c/code> 的：它的生命周期依赖于提供它的数据。试图让它活得比源数据更久，是编译错误，而不是运行时崩溃："},{"type":"code","lang":"swift","title":"Span 不能逃出源数据的作用域","code":"func leak() -> Int {\n    var escaped: Span\u003cUInt8>\n    do {\n        let data: [UInt8] = [1, 2, 3]\n        escaped = data.span\n    }\n    return escaped.count\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:9: error: lifetime-dependent variable 'escaped' escapes its scope\n1 | func leak() -> Int {\n2 |     var escaped: Span\u003cUInt8>\n  |         `- error: lifetime-dependent variable 'escaped' escapes its scope\n3 |     do {\n4 |         let data: [UInt8] = [1, 2, 3]\n  |             `- note: it depends on the lifetime of variable 'data'\n5 |         escaped = data.span\n6 |     }\n7 |     return escaped.count\n  |            `- note: this use of the lifetime-dependent value is out of scope\n8 | }\n9 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["\u003ccode>Array\u003c/code>、\u003ccode>ContiguousArray\u003c/code>、\u003ccode>ArraySlice\u003c/code>、\u003ccode>InlineArray\u003c/code>、\u003ccode>String.UTF8View\u003c/code> 等都提供 \u003ccode>.span\u003c/code> 属性（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0456-stdlib-span-properties.md\" target=\"_blank\" rel=\"noopener\">SE-0456\u003c/a>）。","\u003ccode>Span\u003c/code> 不能存进全局变量、类的属性或逃逸闭包里；它适合作为函数参数，描述“我只需要临时读一下这些元素”。","越界访问依然会在运行时检查，安全性不打折，但没有引用计数和独占性检查的开销。","同一家族：\u003ccode>RawSpan\u003c/code>（原始字节）、\u003ccode>MutableSpan\u003c/code>、\u003ccode>OutputSpan\u003c/code>（初始化未初始化的内存）、\u003ccode>UTF8Span\u003c/code>（安全处理 UTF-8）。","后续：6.4 的 \u003ca href=\"#f-temp-alloc\">undefined\u003c/a>、\u003ca href=\"#f-rawspan-load\">undefined 安全读取\u003c/a>，以及与 C++ \u003ccode>std::span\u003c/code> 的双向桥接。"]}]},{"id":"nonescapable","release":"6.2","since":"6.2","title":"\u003ccode>~Escapable\u003c/code>：不能逃逸的类型","plainTitle":"~Escapable：不能逃逸的类型","en":"Nonescapable types","line":2,"level":"brief","short":"~Escapable","tags":"Escapable nonescapable 逃逸 lifetime 生命周期 依赖","tldr":"\u003ccode>Span\u003c/code> 背后的语言能力。普通类型默认是 \u003ccode>Escapable\u003c/code> 的，值可以被任意保存和传递；\u003ccode>~Escapable\u003c/code> 类型的值只能在它所依赖的东西还活着的时候使用。","flag":"","se":[{"id":"SE-0446","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0446-non-escapable.md","title":"Nonescapable Types"},{"id":"SE-0465","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0465-nonescapable-stdlib-primitives.md","title":"Standard Library Primitives for Nonescapable Types"}],"links":[],"blocks":[{"type":"p","html":"\u003ccode>~Escapable\u003c/code> 和 \u003ccode>~Copyable\u003c/code> 是一对兄弟：一个去掉“可以复制”的默认能力，一个去掉“可以逃逸”的默认能力。标准库在 6.2 中为它们补齐了基础设施（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0465-nonescapable-stdlib-primitives.md\" target=\"_blank\" rel=\"noopener\">SE-0465\u003c/a>），例如 \u003ccode>Optional\u003c/code> 可以包装不可逃逸的值。"},{"type":"p","html":"自己定义 \u003ccode>~Escapable\u003c/code> 类型时，需要用生命周期依赖说明“这个值依赖谁”。到 6.4 为止，这部分标注仍然是实验性的（\u003ccode>@_lifetime\u003c/code>），编译器会直接拒绝没有说明依赖关系的写法："},{"type":"code","lang":"swift","title":"没有生命周期标注，编译器无法确认安全","code":"struct Window: ~Escapable {\n    let items: Span\u003cInt>\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:9: error: the 'get' accessor cannot return a ~Escapable result\n1 | struct Window: ~Escapable {\n2 |     let items: Span\u003cInt>\n  |         `- error: the 'get' accessor cannot return a ~Escapable result\n3 | }\n4 | \n\nmain.swift:1:8: error: an implicit initializer cannot return a ~Escapable result\n1 | struct Window: ~Escapable {\n  |        `- error: an implicit initializer cannot return a ~Escapable result\n2 |     let items: Span\u003cInt>\n3 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"日常开发中你多半只会\u003cstrong>使用\u003c/strong> \u003ccode>Span\u003c/code> 这类现成的不可逃逸类型，而不需要自己定义。"}]},{"id":"memory-safety","release":"6.2","since":"6.2","title":"严格内存安全检查","plainTitle":"严格内存安全检查","en":"Opt-in strict memory safety checking","line":2,"level":"key","short":"内存安全","tags":"strict memory safety unsafe 内存安全 指针 pointer 审计 -strict-memory-safety","tldr":"开启 \u003ccode>-strict-memory-safety\u003c/code> 后，所有用到不安全构造（指针、\u003ccode>unsafe\u003c/code> API）的地方都会被标记出来。你可以换成安全的写法，或者用 \u003ccode>unsafe\u003c/code> 表达式明确标注“这里是有意为之”。","flag":"","se":[{"id":"SE-0458","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0458-strict-memory-safety.md","title":"Opt-in Strict Memory Safety Checking"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"开启后，不安全的用法会被逐一标记","code":"func sum(_ p: UnsafePointer\u003cInt>, count: Int) -> Int {\n    var total = 0\n    for i in 0..\u003ccount {\n        total += p[i]\n    }\n    return total\n}","hl":"","check":"warning","flags":"-swift-version 6 -strict-memory-safety","result":{"status":"warning","diagnostics":"main.swift:4:9: warning: expression uses unsafe constructs but is not marked with 'unsafe' [#StrictMemorySafety]\n2 |     var total = 0\n3 |     for i in 0..\u003ccount {\n4 |         total += p[i]\n  |         |        `- note: reference to parameter 'p' involves unsafe type 'UnsafePointer\u003cInt>'\n  |         `- warning: expression uses unsafe constructs but is not marked with 'unsafe' [#StrictMemorySafety]\n5 |     }\n6 |     return total\n\n[#StrictMemorySafety]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/strict-memory-safety>","output":"","command":"swiftc -swift-version 6 -strict-memory-safety main.swift"}},{"type":"code","lang":"swift","title":"方案一：用 unsafe 明确标注，便于代码审计","code":"func sum(_ p: UnsafePointer\u003cInt>, count: Int) -> Int {\n    var total = 0\n    for i in 0..\u003ccount {\n        total += unsafe p[i]\n    }\n    return total\n}","hl":"","check":"ok","flags":"-swift-version 6 -strict-memory-safety","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -strict-memory-safety main.swift"}},{"type":"code","lang":"swift","title":"方案二（更好）：换成 Span，警告自然消失","code":"func sum(_ values: Span\u003cInt>) -> Int {\n    var total = 0\n    for i in values.indices {\n        total += values[i]\n    }\n    return total\n}","hl":"","check":"ok","flags":"-swift-version 6 -strict-memory-safety","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -strict-memory-safety main.swift"}},{"type":"p","html":"这是一个“选择加入”的模式，官方明确表示大多数项目不需要它。它适合安全要求最高的代码：解析不可信输入的组件、加密库、系统服务。\u003ccode>unsafe\u003c/code> 和 \u003ccode>try\u003c/code>、\u003ccode>await\u003c/code> 一样只是标记，不改变运行时行为。"}]},{"id":"raw-identifiers","release":"6.2","since":"6.2","title":"原始标识符：反引号里什么名字都能写","plainTitle":"原始标识符：反引号里什么名字都能写","en":"Raw identifiers","line":3,"level":"key","short":"原始标识符","tags":"raw identifiers 反引号 backtick 测试名 枚举 命名 标识符","tldr":"用反引号包起来的名字，可以包含空格、标点，甚至以数字开头。最常见的用途是让测试函数的名字就是一句完整的描述。","flag":"","se":[{"id":"SE-0451","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0451-escaped-identifiers.md","title":"Raw identifiers"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"enum VideoQuality {\n    case `480p`, `720p`, `1080p`, `4K`        // 以数字开头的 case\n}\n\nfunc `格式化 时长`(_ seconds: Int) -> String {\n    \"\\(seconds / 60) 分 \\(seconds % 60) 秒\"\n}\n\nlet q = VideoQuality.`1080p`\nprint(q, `格式化 时长`(135))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"`1080p` 2 分 15 秒","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"测试名本身就是描述，不用再单独写显示名","code":"import Testing\n\n@Test func `空字符串解析为 nil`() {\n    #expect(Int(\"\") == nil)\n}\n\n@Test func `square() 返回 x * x`() {\n    #expect(4 * 4 == 16)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 （链接 Swift Testing） main.swift"}},{"type":"p","html":"留意运行输出：打印枚举值时，Swift 会把这种名字连同反引号一起打印出来（\u003ccode>`1080p`\u003c/code>）。除了反引号本身和换行，几乎任何字符都可以出现在原始标识符里。不过请克制：业务代码里的普通函数，还是用正常的名字更好读。"}]},{"id":"interp-default","release":"6.2","since":"6.2","title":"字符串插值的默认值","plainTitle":"字符串插值的默认值","en":"Default value in string interpolations","line":3,"level":"key","short":"插值默认值","tags":"string interpolation 字符串插值 optional 可选 default 默认值 ??","tldr":"插值一个可选值时，直接写上默认值：\u003ccode>&quot;\\(age, default: &quot;未知&quot;)&quot;\u003c/code>。和 \u003ccode>??\u003c/code> 不同，默认值不必与可选值是同一种类型。","flag":"","se":[{"id":"SE-0477","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0477-default-interpolation-values.md","title":"Default Value in String Interpolations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let nickname: String? = nil\nlet age: Int? = nil\n\nprint(\"昵称：\\(nickname ?? \"未设置\")\")       // String? 用 ?? 没问题\nprint(\"年龄：\\(age, default: \"未知\")\")       // Int? 的默认值可以是字符串","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"昵称：未设置\n年龄：未知","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"如果对 \u003ccode>Int?\u003c/code> 用 \u003ccode>??\u003c/code> 给一个字符串默认值，类型对不上："},{"type":"code","lang":"swift","title":"?? 两边的类型必须一致","code":"let age: Int? = nil\nprint(\"年龄：\\(age ?? \"未知\")\")","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:19: error: cannot convert value of type 'Int?' to expected argument type 'String?'\n1 | let age: Int? = nil\n2 | print(\"年龄：\\(age ?? \"未知\")\")\n  |             `- error: cannot convert value of type 'Int?' to expected argument type 'String?'\n3 |","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"enumerated","release":"6.2","since":"6.2","title":"\u003ccode>enumerated()\u003c/code> 成为 Collection","plainTitle":"enumerated() 成为 Collection","en":"Collection conformances for enumerated()","line":4,"level":"brief","short":"enumerated","tags":"enumerated Collection SwiftUI ForEach List offset 下标","tldr":"\u003ccode>enumerated()\u003c/code> 的结果现在是 \u003ccode>Collection\u003c/code>（基础集合支持时还是随机访问的），可以直接 \u003ccode>count\u003c/code>、取 \u003ccode>last\u003c/code>，SwiftUI 的 \u003ccode>List\u003c/code>、\u003ccode>ForEach\u003c/code> 也能直接用，不用再包一层 \u003ccode>Array(…)\u003c/code>。","flag":"","se":[{"id":"SE-0459","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0459-enumerated-collection.md","title":"Add `Collection` conformances for `enumerated()`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let medals = [\"金\", \"银\", \"铜\"].enumerated()\nprint(medals.count)                        // 不必遍历就能知道个数\nprint(medals.last!)                        // 直接取最后一个\nprint(medals.reversed().map(\\.element))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"3\n(offset: 2, element: \"铜\")\n[\"铜\", \"银\", \"金\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"SwiftUI：直接把 enumerated() 交给 List","code":"import SwiftUI\n\nstruct Leaderboard: View {\n    let players = [\"Ada\", \"Grace\", \"Linus\"]\n\n    var body: some View {\n        List(players.enumerated(), id: \\.offset) { item in\n            Text(\"第 \\(item.offset + 1) 名：\\(item.element)\")\n        }\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"observations","release":"6.2","since":"6.2","title":"\u003ccode>Observations\u003c/code>：用异步序列观察 @Observable","plainTitle":"Observations：用异步序列观察 @Observable","en":"Transactional observation of values","line":4,"level":"key","short":"Observations","tags":"Observation Observable Observations async sequence 异步序列 观察 事务 transaction SwiftUI","tldr":"\u003ccode>Observations { … }\u003c/code> 把 \u003ccode>@Observable\u003c/code> 对象的变化变成一个异步序列。同一个事务里的多次修改只产生一次更新，你拿到的始终是一份前后一致的快照。","flag":"","se":[{"id":"SE-0475","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0475-observed.md","title":"Transactional Observation of Values"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"同时修改两个属性，只收到一次更新","code":"import Observation\n\n@Observable\nfinal class Cart {\n    var count = 0\n    var total = 0.0\n}\n\n@MainActor\nfunc watch() async {\n    let cart = Cart()\n    let summaries = Observations { \"\\(cart.count) 件，共 ¥\\(cart.total)\" }\n\n    Task {\n        for price in [12.5, 30.0] {\n            cart.count += 1            // 同一个事务里的两次修改……\n            cart.total += price        // ……只会产生一次更新\n            try? await Task.sleep(for: .milliseconds(20))\n        }\n    }\n\n    var received = 0\n    for await summary in summaries {\n        print(summary)\n        received += 1\n        if received == 3 { break }\n    }\n}\n\nawait watch()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"0 件，共 ¥0.0\n1 件，共 ¥12.5\n2 件，共 ¥42.5","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"以前在 SwiftUI 之外观察 \u003ccode>@Observable\u003c/code> 只能用 \u003ccode>withObservationTracking\u003c/code>，而且它只通知一次，需要手动重新注册。\u003ccode>Observations\u003c/code> 解决了这个问题。6.4 又补充了更细粒度的控制，见 \u003ca href=\"#f-observation-tracking\">高级观察追踪\u003c/a>。"}]},{"id":"nonexhaustive","release":"6.2","since":"6.2.3","title":"\u003ccode>@nonexhaustive\u003c/code>：声明“以后可能还会加 case”","plainTitle":"@nonexhaustive：声明“以后可能还会加 case”","en":"Nonexhaustive enums","line":3,"level":"brief","short":"@nonexhaustive","tags":"enum 枚举 nonexhaustive 穷尽 unknown default 包 package API 演进","tldr":"普通的 Swift 包里，公开枚举加一个 case 就会让所有使用方的 \u003ccode>switch\u003c/code> 编译失败。标记 \u003ccode>@nonexhaustive\u003c/code> 后，其他模块必须写 \u003ccode>@unknown default\u003c/code>，以后加 case 就不再是破坏性改动。","flag":"","se":[{"id":"SE-0487","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0487-extensible-enums.md","title":"Nonexhaustive enums"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@nonexhaustive\npublic enum PaymentMethod {\n    case card\n    case cash\n}\n\n// 同一个模块（或同一个包）里，依然可以穷尽 switch，不需要 @unknown default\nfunc label(for method: PaymentMethod) -> String {\n    switch method {\n    case .card: \"刷卡\"\n    case .cash: \"现金\"\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"以前只有开启了库演进（library evolution）的二进制框架才有这种“非冻结枚举”。这个特性在 Swift 6.2.3 中加入。"}]},{"id":"swiftpm-62","release":"6.2","since":"6.2","title":"按分组控制警告，与自动迁移工具","plainTitle":"按分组控制警告，与自动迁移工具","en":"Warning control settings & migration tooling","line":6,"level":"key","short":"迁移工具","tags":"SwiftPM warnings treatWarning treatAllWarnings migrate 迁移 upcoming feature fix-it","tldr":"SwiftPM 可以按诊断分组设置警告级别；\u003ccode>swift package migrate\u003c/code> 能自动分析开启某个 upcoming feature 会影响哪些代码，并直接给出修改。","flag":"","se":[{"id":"SE-0480","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0480-swiftpm-warning-control.md","title":"Warning Control Settings for SwiftPM"},{"id":"SE-0486","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0486-adoption-tooling-for-swift-features.md","title":"Migration tooling for Swift features"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":".target(\n    name: \"Core\",\n    swiftSettings: [\n        .treatAllWarnings(as: .error),                       // 所有警告当作错误……\n        .treatWarning(\"DeprecatedDeclaration\", as: .warning), // ……除了“已废弃 API”\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"code","lang":"shell","title":"","code":"# 分析开启 ExistentialAny 需要改哪些代码，并自动应用修改\nswift package migrate --to-feature ExistentialAny","hl":"","check":"none"},{"type":"p","html":"迁移工具对 \u003ccode>NonisolatedNonsendingByDefault\u003c/code> 尤其有用：它会给需要保留旧行为的函数自动加上 \u003ccode>@concurrent\u003c/code>，保证开启前后语义不变。"}]},{"id":"testing-62","release":"6.2","since":"6.2","title":"Swift Testing：退出测试与附件","plainTitle":"Swift Testing：退出测试与附件","en":"Exit tests & attachments","line":6,"level":"brief","short":"退出测试","tags":"Swift Testing exit test 退出测试 precondition fatalError attachment 附件","tldr":"退出测试可以验证“这段代码会让进程崩溃”（比如触发 \u003ccode>precondition\u003c/code>），它在独立的子进程里运行；附件让你把日志、截图等证据挂到测试结果上。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\n\nfunc withdraw(_ amount: Int, from balance: Int) -> Int {\n    precondition(amount \u003c= balance, \"余额不足\")\n    return balance - amount\n}\n\n@Test func overdraftStopsTheProcess() async {\n    await #expect(processExitsWith: .failure) {\n        _ = withdraw(100, from: 10)       // 在独立的子进程中执行\n    }\n}\n\n@Test func attachServerLog() {\n    let log = \"GET /profile → 500\"\n    Attachment.record(log, named: \"server.log\")\n    #expect(log.contains(\"500\"))\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 （链接 Swift Testing） main.swift"}}]},{"id":"platform-62","release":"6.2","since":"6.2","title":"WebAssembly、Embedded Swift 与官方 VS Code 扩展","plainTitle":"WebAssembly、Embedded Swift 与官方 VS Code 扩展","en":"WebAssembly, Embedded Swift & VS Code","line":5,"level":"brief","short":"Wasm·VS Code","tags":"WebAssembly Wasm 浏览器 Embedded 嵌入式 VS Code 编辑器 Subprocess","tldr":"Swift 6.2 正式支持 WebAssembly；Embedded Swift 获得完整的 \u003ccode>String\u003c/code> API、\u003ccode>InlineArray\u003c/code> 和 \u003ccode>Span\u003c/code>；swift.org 开始官方发布 VS Code 扩展，支持后台索引、LLDB 调试和 DocC 实时预览。","flag":"","se":[],"links":[],"blocks":[{"type":"p","html":"同一时期还有两个值得关注的新包：\u003cstrong>Subprocess\u003c/strong>（0.1 版，用 async/await 启动和控制子进程，6.4 时期发布 1.0，见 \u003ca href=\"#f-subprocess\">Subprocess 1.0\u003c/a>），以及 Foundation 中新的\u003cstrong>类型化 \u003ccode>NotificationCenter\u003c/code> 消息\u003c/strong>，用具体的消息类型代替字符串名字和 \u003ccode>userInfo\u003c/code> 字典。"}]},{"id":"c-interop","release":"6.3","since":"6.3","title":"\u003ccode>@c\u003c/code>：让 C 直接调用 Swift","plainTitle":"@c：让 C 直接调用 Swift","en":"C compatible functions and enums","line":5,"level":"core","short":"@c","tags":"C interop 互操作 cdecl @_cdecl 头文件 header 嵌入式 FFI @implementation","tldr":"给全局函数或枚举加上 \u003ccode>@c\u003c/code>，编译器就会按 C 的调用约定生成它，并把声明写进生成的头文件，C/C++ 代码直接 \u003ccode>#include\u003c/code> 就能调用。它取代了长期“非官方”的 \u003ccode>@_cdecl\u003c/code>。","flag":"","se":[{"id":"SE-0495","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0495-cdecl.md","title":"C compatible functions and enums"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"MathKit.swift","code":"@c(MathKit_clamp)                       // 可以指定 C 侧的名字\npublic func clamp(_ value: CInt, _ low: CInt, _ high: CInt) -> CInt {\n    min(max(value, low), high)\n}\n\n@c\npublic enum Direction: CInt {           // 必须有 C 兼容的整数原始值类型\n    case north, south\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"c","title":"编译器生成的头文件（真实输出节选，来自 swiftc -emit-clang-header-path）","code":"typedef SWIFT_ENUM(int, Direction, closed) {\n  DirectionNorth = 0,\n  DirectionSouth = 1,\n};\n\nSWIFT_EXTERN int MathKit_clamp(int value, int low, int high) SWIFT_NOEXCEPT SWIFT_WARN_UNUSED_RESULT;","hl":"","check":"none"},{"type":"p","html":"反过来，如果 C 头文件里\u003cstrong>已经有\u003c/strong>一个函数声明，可以用 \u003ccode>@c @implementation\u003c/code> 在 Swift 里写它的实现。编译器会核对两边的签名是否一致："},{"type":"code","lang":"c","title":"geometry.h：已有的 C 声明","code":"double area_of_circle(double radius);","hl":"","check":"none"},{"type":"code","lang":"swift","title":"geometry.swift：用 Swift 实现","code":"@c @implementation\nfunc area_of_circle(_ radius: Double) -> Double {\n    .pi * radius * radius\n}","hl":"","check":"none"},{"type":"list","items":["枚举的 case 在 C 侧会变成“类型名 + 首字母大写的 case 名”，比如 \u003ccode>DirectionNorth\u003c/code>。","同一版本还允许 \u003ccode>@objc\u003c/code> 用在全局函数上，签名可以使用 Objective-C 类型。","推荐模式：在 \u003ccode>@c\u003c/code> 函数外面再包一层安全的 Swift API，例如接受 \u003ccode>Span\u003c/code> 而不是指针加长度（6.4 的发布说明专门推荐了这种做法）。"]}]},{"id":"module-selectors","release":"6.3","since":"6.3","title":"模块选择器 \u003ccode>Module::name\u003c/code>","plainTitle":"模块选择器 Module::name","en":"Module selectors for name disambiguation","line":3,"level":"key","short":"模块选择器","tags":"module selector 模块 命名冲突 :: 同名 歧义 disambiguation","tldr":"两个导入的模块都有同名 API？写 \u003ccode>ModuleA::getValue()\u003c/code> 明确指定从哪个模块查找。自己的类型和标准库重名时，用 \u003ccode>Swift::\u003c/code> 就能拿到标准库的那个。","flag":"","se":[{"id":"SE-0491","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0491-module-selectors.md","title":"Module selectors for name disambiguation"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"自己定义的 Task 和标准库重名了","code":"struct Task {\n    var title: String\n}\n\nlet todo = Task(title: \"写周报\")            // 我们自己的 Task\n\nlet job = Swift::Task {                     // 标准库的并发 Task\n    print(\"后台处理：\", todo.title)\n}\nawait job.value","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"后台处理： 写周报","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"以前遇到这种冲突，只能写 \u003ccode>Swift.Task\u003c/code>。但如果某个模块恰好有一个叫 \u003ccode>Swift\u003c/code> 的类型，或者模块名和其中的类型同名（比如 \u003ccode>XCTest.XCTest\u003c/code>），点语法就会失效。\u003ccode>::\u003c/code> 永远只表示“模块”，没有歧义："},{"type":"code","lang":"swift","title":"","code":"import ModuleA\nimport ModuleB\n\nlet x = ModuleA::getValue()     // 调用 ModuleA 的 getValue\nlet y = ModuleB::getValue()     // 调用 ModuleB 的 getValue","hl":"","check":"none"}]},{"id":"perf-attrs","release":"6.3","since":"6.3","title":"库作者的三把优化扳手：\u003ccode>@specialized\u003c/code>、\u003ccode>@inline(always)\u003c/code>、\u003ccode>@export\u003c/code>","plainTitle":"库作者的三把优化扳手：@specialized、@inline(always)、@export","en":"Explicit specialization, inline(always) & definition visibility","line":2,"level":"key","short":"优化控制","tags":"specialize specialized inline always export implementation interface 优化 optimization 泛型 库 library 性能","tldr":"三个属性，让库的作者控制编译器如何优化“调用我的代码”：为泛型预生成特化版本、保证内联、把函数实现暴露给调用方。","flag":"","se":[{"id":"SE-0460","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0460-specialized.md","title":"Explicit Specialization"},{"id":"SE-0496","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0496-inline-always.md","title":"`@inline(always)` attribute"},{"id":"SE-0497","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0497-definition-visibility.md","title":"Controlling function definition visibility in clients"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"extension Sequence where Element: BinaryInteger {\n    @specialized(where Self == [Int])        // 为 [Int] 预先生成特化版本\n    @specialized(where Self == [UInt8])\n    public func total() -> Int {\n        reduce(0) { $0 + Int($1) }\n    }\n}\n\n@inline(always)                              // 保证每个直接调用点都被内联\npublic func fastAbs(_ x: Int) -> Int {\n    x \u003c 0 ? -x : x\n}\n\n@export(implementation)                      // 把函数体提供给调用方，便于跨模块优化\npublic func clampPercent(_ x: Double) -> Double {\n    min(max(x, 0), 100)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"table","head":["属性","作用","取代"],"rows":[["\u003ccode>@specialized(where …)\u003c/code>","在库里为常用类型预先生成泛型特化；通用版本在入口处检查类型并转发到特化版本","\u003ccode>@_specialize\u003c/code>"],["\u003ccode>@inline(always)\u003c/code>","保证直接调用会被内联；做不到时报错，而不是悄悄忽略","\u003ccode>@inline(__always)\u003c/code>"],["\u003ccode>@export(implementation)\u003c/code>","函数体对调用方可见，调用方可以内联、特化","\u003ccode>@_alwaysEmitIntoClient\u003c/code>"],["\u003ccode>@export(interface)\u003c/code>","只导出可调用的符号，隐藏实现","\u003ccode>@_neverEmitIntoClient\u003c/code>"]]},{"type":"p","html":"这些属性主要面向发布二进制框架、追求极致性能的库作者。应用开发者通常不需要碰它们；滥用 \u003ccode>@inline(always)\u003c/code> 只会让代码体积膨胀。"}]},{"id":"section","release":"6.3","since":"6.3","title":"\u003ccode>@section\u003c/code> 与 \u003ccode>@used\u003c/code>：把数据放进指定的段","plainTitle":"@section 与 @used：把数据放进指定的段","en":"Section placement control","line":2,"level":"brief","short":"@section","tags":"section 段 linker 链接器 used 嵌入式 插件 静态初始化 constant","tldr":"把全局变量放进目标文件里指定名字的段（section），并用 \u003ccode>@used\u003c/code> 防止它被链接器当作“没人用”而删掉。常用于嵌入式开发和“链接器集合”式的插件注册。","flag":"","se":[{"id":"SE-0492","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0492-section-control.md","title":"Section Placement Control"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"#if objectFormat(MachO)\n@section(\"__DATA,plugins\")\n#else\n@section(\"plugins\")\n#endif\n@used\nlet pluginVersion: Int = 3        // 初始值必须是编译期常量","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"新的 \u003ccode>#if objectFormat(MachO)\u003c/code>、\u003ccode>objectFormat(ELF)\u003c/code>、\u003ccode>objectFormat(COFF)\u003c/code> 条件用来处理不同目标文件格式对段名的不同规定。"}]},{"id":"weak-let","release":"6.3","since":"6.3","title":"\u003ccode>weak let\u003c/code>：不可变的弱引用","plainTitle":"weak let：不可变的弱引用","en":"weak let","line":1,"level":"key","short":"weak let","tags":"weak let 弱引用 Sendable 不可变 immutable 循环引用 capture 捕获","tldr":"以前 \u003ccode>weak\u003c/code> 只能配 \u003ccode>var\u003c/code>，于是带弱引用属性的类永远无法成为 \u003ccode>Sendable\u003c/code>。现在可以写 \u003ccode>weak let\u003c/code>：初始化之后不能再改，但对象释放后依然会自动变成 \u003ccode>nil\u003c/code>。","flag":"ImmutableWeakCaptures","se":[{"id":"SE-0481","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0481-weak-let.md","title":"`weak let`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：Sendable 类里的 weak var 必然报错","code":"final class TreeNode: Sendable {\n    weak var parent: TreeNode?\n\n    init(parent: TreeNode?) {\n        self.parent = parent\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:14: error: stored property 'parent' of 'Sendable'-conforming class 'TreeNode' is mutable\n1 | final class TreeNode: Sendable {\n2 |     weak var parent: TreeNode?\n  |              `- error: stored property 'parent' of 'Sendable'-conforming class 'TreeNode' is mutable\n3 | \n4 |     init(parent: TreeNode?) {","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.3：weak let","code":"final class TreeNode: Sendable {\n    weak let parent: TreeNode?        // 只在初始化时赋值\n    let name: String\n\n    init(name: String, parent: TreeNode?) {\n        self.name = name\n        self.parent = parent\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"upcoming feature \u003ccode>ImmutableWeakCaptures\u003c/code> 把同样的思路用在闭包捕获上：\u003ccode>[weak self]\u003c/code> 捕获的变量变成不可变的，这样的闭包就可以是 \u003ccode>@Sendable\u003c/code> 的。"}]},{"id":"clock-epochs","release":"6.3","since":"6.3","title":"时钟纪元 \u003ccode>systemEpoch\u003c/code>","plainTitle":"时钟纪元 systemEpoch","en":"Clock epochs","line":4,"level":"brief","short":"时钟纪元","tags":"Clock ContinuousClock SuspendingClock epoch 纪元 时间 Instant","tldr":"\u003ccode>ContinuousClock\u003c/code> 和 \u003ccode>SuspendingClock\u003c/code> 新增 \u003ccode>systemEpoch\u003c/code> 属性，表示这台机器上该时钟的“零点”。","flag":"","se":[{"id":"SE-0473","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0473-clock-epochs.md","title":"Clock Epochs"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let clock = ContinuousClock()\nlet sinceEpoch = clock.now - clock.systemEpoch\nprint(sinceEpoch > .zero)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"纪元是“系统相关”的，在不同机器之间没有可比性，不适合序列化保存；它适合和系统其他计时 API（例如内核时间戳）做换算。"}]},{"id":"codable-errors","release":"6.3","since":"6.3","title":"更容易读懂的 \u003ccode>DecodingError\u003c/code>","plainTitle":"更容易读懂的 DecodingError","en":"Improved EncodingError & DecodingError descriptions","line":4,"level":"brief","short":"解码错误","tags":"Codable Decodable JSONDecoder DecodingError EncodingError 错误信息 调试 JSON","tldr":"\u003ccode>EncodingError\u003c/code> 和 \u003ccode>DecodingError\u003c/code> 遵循了 \u003ccode>CustomDebugStringConvertible\u003c/code>，打印出来的信息清楚地写明了哪个字段、期望什么类型、实际是什么。","flag":"","se":[{"id":"SE-0489","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0489-codable-error-printing.md","title":"Improve `EncodingError` and `DecodingError`'s printed descriptions"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"下面是 Swift 6.4.2 的真实打印结果","code":"import Foundation\n\nstruct User: Decodable {\n    let name: String\n    let age: Int\n}\n\nlet json = Data(#\"{\"name\": \"林\", \"age\": \"十八\"}\"#.utf8)\ndo {\n    _ = try JSONDecoder().decode(User.self, from: json)\n} catch {\n    print(error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"DecodingError.typeMismatch: Expected value of type Int. Path: age. Debug description: Expected to decode Int but found a string instead.","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"提案特别说明：输出格式不是稳定的 API，不要用字符串匹配来判断错误种类，需要时请直接检查错误的各个属性。"}]},{"id":"android","release":"6.3","since":"6.3","title":"官方 Swift SDK for Android","plainTitle":"官方 Swift SDK for Android","en":"Swift SDK for Android","line":5,"level":"key","short":"Android","tags":"Android 安卓 SDK 交叉编译 Kotlin Java JNI 跨平台","tldr":"Swift 6.3 首次发布官方的 Android SDK：可以用 Swift 写原生 Android 应用，把现有的 Swift 包编译到 Android，或者通过 Swift Java 和 JNI 把 Swift 代码接入已有的 Kotlin/Java 应用。","flag":"","se":[],"links":[],"blocks":[{"type":"p","html":"这是 Android 工作组把 SDK 从“每夜构建”推进到正式版的成果。配合 \u003ca href=\"#f-package-traits\">6.1 的包特性\u003c/a>，一个 Swift 包可以根据平台开启或裁剪功能。到了 \u003ca href=\"#f-interop-64\">6.4\u003c/a>，Android SDK 基于 LTS 版的 NDK 构建，SwiftPM 还能通过 Swift Build 直接面向 Android 构建。"},{"type":"p","html":"同一版本中，Embedded Swift 改进了 C 互操作和调试支持，并在链接模型上取得了进展。"}]},{"id":"testing-63","release":"6.3","since":"6.3","title":"Swift Testing：警告级问题、取消测试与图片附件","plainTitle":"Swift Testing：警告级问题、取消测试与图片附件","en":"Warning issues, test cancellation & image attachments","line":6,"level":"brief","short":"警告与取消","tags":"Swift Testing Issue severity warning 警告 cancel 取消 attachment 图片 image","tldr":"\u003ccode>Issue.record(…, severity: .warning)\u003c/code> 记录一个问题但不判定失败；\u003ccode>try Test.cancel()\u003c/code> 可以中途取消正在运行的测试；附件支持常见图片格式。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\n\n@Test func slowButAcceptable() {\n    Issue.record(\"响应时间 1.8 秒，偏慢\", severity: .warning)   // 记录在案，但测试仍然通过\n}\n\n@Test(arguments: [\"zh\", \"en\", \"ja\"])\nfunc localizedStrings(language: String) throws {\n    if language == \"ja\" {\n        try Test.cancel(\"日语资源还没准备好\")    // 只取消这一个参数用例\n    }\n    #expect(!language.isEmpty)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 （链接 Swift Testing） main.swift"}}]},{"id":"swiftpm-63","release":"6.3","since":"6.3","title":"SwiftPM：查看包特性、Swift Build 预览","plainTitle":"SwiftPM：查看包特性、Swift Build 预览","en":"SwiftPM 6.3","line":6,"level":"brief","short":"show-traits","tags":"SwiftPM traits show-traits Swift Build swift-syntax 宏 macro 构建","tldr":"\u003ccode>swift package show-traits\u003c/code> 列出一个包支持的所有特性；新的跨平台构建引擎 Swift Build 以预览形式集成进 SwiftPM；只被宏依赖的共享库也能使用预编译的 swift-syntax。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# 看看这个包提供了哪些特性\nswift package show-traits\n\n# 试用新的构建系统（6.4 起已是默认）\nswift build --build-system swiftbuild","hl":"","check":"none"}]},{"id":"async-defer","release":"6.4","since":"6.4","title":"\u003ccode>defer\u003c/code> 里可以 \u003ccode>await\u003c/code> 了","plainTitle":"defer 里可以 await 了","en":"Support async calls in defer bodies","line":1,"level":"core","short":"async defer","tags":"defer async await 清理 cleanup 资源 关闭 close 异步","tldr":"在异步函数里，\u003ccode>defer\u003c/code> 块现在可以包含 \u003ccode>await\u003c/code>。离开作用域时，异步清理会被完整地等待执行完，再真正返回。","flag":"","se":[{"id":"SE-0493","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0493-defer-async.md","title":"Support `async` calls in `defer` bodies"}],"links":[],"blocks":[{"type":"p","html":"以前想做异步清理，只能在每个 \u003ccode>return\u003c/code> 和 \u003ccode>catch\u003c/code> 前面手动写一遍，或者在 \u003ccode>defer\u003c/code> 里开一个 \u003ccode>Task { }\u003c/code>，后者既不保证执行顺序，也不保证在函数返回前完成。"},{"type":"code","lang":"swift","title":"异步清理也能被保证执行","code":"struct Connection {\n    func send(_ message: String) async throws { print(\"发送：\", message) }\n    func close() async { print(\"连接已关闭\") }\n}\n\nfunc sync(over connection: Connection) async throws {\n    defer { await connection.close() }\n    try await connection.send(\"你好\")\n    try await connection.send(\"再见\")\n}\n\ntry await sync(over: Connection())","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"发送： 你好\n发送： 再见\n连接已关闭","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"\u003ccode>await\u003c/code> 只能出现在本身就是 \u003ccode>async\u003c/code> 的上下文里，同步函数的 \u003ccode>defer\u003c/code> 依然不能挂起："},{"type":"code","lang":"swift","title":"同步函数里不行","code":"func cleanup() async {}\n\nfunc work() {\n    defer { await cleanup() }\n    print(\"工作中\")\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:4:5: error: 'async' defer must appear within an 'async' context\n2 | \n3 | func work() {\n4 |     defer { await cleanup() }\n  |     `- error: 'async' defer must appear within an 'async' context\n5 |     print(\"工作中\")\n6 | }","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"cancel-shield","release":"6.4","since":"6.4","title":"取消屏蔽：\u003ccode>withTaskCancellationShield\u003c/code>","plainTitle":"取消屏蔽：withTaskCancellationShield","en":"Task cancellation shields","line":1,"level":"core","short":"取消屏蔽","tags":"cancellation 取消
