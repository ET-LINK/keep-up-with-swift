<title>Swift 进化线路图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Swift 6.0 到 6.4 两年新特性的互动学习站：线路图、真实编译器输出、并发与所有权实验室。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Overpass:wght@600;700;800;900&display=swap">
<style>
/* Swift Club · 进化线路图
   布局概念：首页是一张横向的地铁线路图（6 条主题线 × 5 个版本“票价区”）；
   版本页是车厢内部：左侧是吸顶的“本车线路屏”，右侧是一站一课的课程栏。 */

:root {
  /* 纸面与墨色（冷调中性色，偏向线路蓝） */
  --bg: #f3f5f7;
  --surface: #ffffff;
  --sunk: #e9edf1;
  --zone: #eceff3;
  --ink: #12161c;
  --ink-2: #454e5a;
  --ink-3: #6b7482;
  --rule: #d5dbe2;
  --rule-2: #e5e9ee;
  --brand: #f05138;
  --brand-on: #ffffff;
  --brand-ink: #b23a12;
  --focus: #2f64dd;
  --shadow: 0 1px 2px rgba(18, 22, 28, .06), 0 8px 24px rgba(18, 22, 28, .06);

  /* 六条线路 */
  --l1: #e8492e; --l1-on: #ffffff;
  --l2: #2f64dd; --l2-on: #ffffff;
  --l3: #17905a; --l3-on: #ffffff;
  --l4: #e0a10a; --l4-on: #2a1f00;
  --l5: #8a4fd6; --l5-on: #ffffff;
  --l6: #0e8c9d; --l6-on: #ffffff;

  /* 状态色 */
  --ok: #1b8a4c;  --ok-soft: #e4f4ea;
  --warn: #a5650b; --warn-soft: #fbf0d9;
  --err: #cc3326; --err-soft: #fce8e5;

  /* 代码：Xcode 默认浅色主题的配色 */
  --code-bg: #ffffff;
  --code-fg: #1f2328;
  --code-gutter: #a3abb6;
  --code-hl: #fff6d6;
  --code-hl-edge: #e9b949;
  --tok-kw: #9b2393;
  --tok-str: #c41a16;
  --tok-com: #5d6c79;
  --tok-num: #1c00cf;
  --tok-type: #3900a0;
  --tok-fn: #326d74;
  --tok-decl: #0f68a0;
  --tok-attr: #815f03;
  --tok-pound: #643820;

  /* 终端（编译器输出），两种主题都用深色底 */
  --term-bg: #16191f;
  --term-fg: #d5dae1;
  --term-dim: #7d8794;
  --term-err: #ff6f61;
  --term-warn: #f1c25a;
  --term-note: #7db6ff;
  --term-ok: #5ad38f;

  /* 字体 */
  --font-display: "Overpass", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "PingFang SC", monospace;

  /* 字号 */
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15.5px;
  --fs-lg: 18px;
  --fs-xl: 23px;
  --fs-2xl: 30px;
  --fs-3xl: clamp(34px, 5.2vw, 54px);

  --radius: 10px;
  --c: var(--l1);
  --on: var(--l1-on);
  --wrap: 1240px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --sunk: #1c212a; --zone: #131820;
    --ink: #e8ecf1; --ink-2: #aab3bf; --ink-3: #808a97; --rule: #2a313c; --rule-2: #212731;
    --brand: #ff6a4d; --brand-on: #1a0904; --brand-ink: #ff8f74; --focus: #7aa2ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    --l1: #ff6a4d; --l1-on: #1a0904; --l2: #6e98ff; --l2-on: #07122b; --l3: #3fca85; --l3-on: #04170d;
    --l4: #f3bd3b; --l4-on: #241900; --l5: #b68cff; --l5-on: #190a33; --l6: #35c4d4; --l6-on: #03191c;
    --ok: #4fd18e; --ok-soft: #10261a; --warn: #f1c25a; --warn-soft: #2b2311; --err: #ff6f61; --err-soft: #2f1614;
    --code-bg: #1f1f24; --code-fg: #e6e6e6; --code-gutter: #5c6370; --code-hl: #33301f; --code-hl-edge: #c9a440;
    --tok-kw: #ff7ab2; --tok-str: #ff8170; --tok-com: #7f8c98; --tok-num: #d9c97c; --tok-type: #dabaff;
    --tok-fn: #67b7a4; --tok-decl: #41a1c0; --tok-attr: #cc9768; --tok-pound: #ffa14f;
    --term-bg: #0a0c10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --sunk: #1c212a; --zone: #131820;
  --ink: #e8ecf1; --ink-2: #aab3bf; --ink-3: #808a97; --rule: #2a313c; --rule-2: #212731;
  --brand: #ff6a4d; --brand-on: #1a0904; --brand-ink: #ff8f74; --focus: #7aa2ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  --l1: #ff6a4d; --l1-on: #1a0904; --l2: #6e98ff; --l2-on: #07122b; --l3: #3fca85; --l3-on: #04170d;
  --l4: #f3bd3b; --l4-on: #241900; --l5: #b68cff; --l5-on: #190a33; --l6: #35c4d4; --l6-on: #03191c;
  --ok: #4fd18e; --ok-soft: #10261a; --warn: #f1c25a; --warn-soft: #2b2311; --err: #ff6f61; --err-soft: #2f1614;
  --code-bg: #1f1f24; --code-fg: #e6e6e6; --code-gutter: #5c6370; --code-hl: #33301f; --code-hl-edge: #c9a440;
  --tok-kw: #ff7ab2; --tok-str: #ff8170; --tok-com: #7f8c98; --tok-num: #d9c97c; --tok-type: #dabaff;
  --tok-fn: #67b7a4; --tok-decl: #41a1c0; --tok-attr: #cc9768; --tok-pound: #ffa14f;
  --term-bg: #0a0c10;
  color-scheme: dark;
}

/* ───────── 基础 ───────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.75;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--surface);
}
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
a { color: var(--brand-ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.25; }
p { margin: 0; }
code, kbd, pre { font-family: var(--font-mono); font-variant-ligatures: none; }
::selection { background: color-mix(in srgb, var(--brand) 30%, transparent); }

.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--surface); padding: 8px 12px; border-radius: 6px; }
.skip:focus { left: 16px; }

.wrap {
  max-width: var(--wrap);
  margin-inline: auto;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
}
.eyebrow {
  font-family: var(--font-display);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* 行内代码 */
:not(pre) > code {
  font-size: .88em;
  background: var(--sunk);
  border: 1px solid var(--rule-2);
  padding: .08em .38em;
  border-radius: 5px;
  white-space: break-spaces;
  overflow-wrap: anywhere;
  color: var(--ink);
}

/* ───────── 顶栏 ───────── */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.topbar-in {
  max-width: var(--wrap);
  margin-inline: auto;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 60px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-text b { font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing: .06em; }
.brand-text span { font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em; }
.nav {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1 1 auto;
  min-width: 0;
  mask-image: linear-gradient(90deg, #000 92%, transparent);
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  flex: none;
  text-decoration: none;
  color: var(--ink-2);
  font-size: 14px;
  padding: 6px 11px;
  border-radius: 999px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--surface); }
.nav a .v { font-family: var(--font-display); font-weight: 800; letter-spacing: .02em; }
.nav .sep { width: 1px; background: var(--rule); margin: 6px 6px; flex: none; }
.tools { display: flex; gap: 6px; flex: none; }
.tool-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--surface);
  cursor: pointer; color: var(--ink-2);
}
.tool-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.tool-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.tool-btn svg .fill { fill: currentColor; stroke: none; }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; line-height: 17px; color: var(--ink-3); }

/* ───────── 通用组件 ───────── */
.bullet {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); color: var(--on);
  font-family: var(--font-display); font-weight: 800; font-size: 12.5px; line-height: 1;
  flex: none;
}
.bullet.lg { width: 30px; height: 30px; font-size: 16px; }
.bullet.sm { width: 17px; height: 17px; font-size: 10px; }
[data-line="1"] { --c: var(--l1); --on: var(--l1-on); }
[data-line="2"] { --c: var(--l2); --on: var(--l2-on); }
[data-line="3"] { --c: var(--l3); --on: var(--l3-on); }
[data-line="4"] { --c: var(--l4); --on: var(--l4-on); }
[data-line="5"] { --c: var(--l5); --on: var(--l5-on); }
[data-line="6"] { --c: var(--l6); --on: var(--l6-on); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-xs); line-height: 1; white-space: nowrap;
  padding: 5px 9px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2);
  text-decoration: none;
}
a.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip.mono { font-family: var(--font-mono); font-size: 11.5px; }
.chip.flag { font-family: var(--font-mono); font-size: 11px; background: var(--sunk); border-style: dashed; }
.chip.level-core { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.chip.level-key { border-color: var(--ink-3); color: var(--ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  text-decoration: none; cursor: pointer; font-size: 14.5px; font-weight: 500;
  transition: border-color .15s, background .15s, transform .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--brand)); }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.seg {
  display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px;
  background: var(--sunk); border-radius: 12px; border: 1px solid var(--rule-2);
}
.seg button {
  border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer;
  font-size: 13.5px; color: var(--ink-2); line-height: 1.3; text-align: left;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.seg button small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; }

.section { padding-block: 56px 8px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 22px; }
.section-head h2 { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.01em; }
.section-head p { color: var(--ink-2); max-width: 46em; }

/* ───────── 首页：抬头 ───────── */
.hero { padding-block: 44px 10px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px 48px; align-items: end; }
.hero h1 {
  font-family: var(--font-display); font-size: var(--fs-3xl); font-weight: 900; letter-spacing: -.02em; line-height: 1.04;
  margin-top: 10px;
}
.hero h1 .ver { color: var(--brand); }
.hero-lead { font-size: var(--fs-lg); color: var(--ink-2); margin-top: 16px; max-width: 34em; line-height: 1.7; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--fs-sm); color: var(--ink-3); }
.verify-note { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: var(--fs-sm); color: var(--ink-2); }
.verify-note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-top: 7px; flex: none; box-shadow: 0 0 0 4px var(--ok-soft); }

/* ───────── 首页：线路图 ───────── */
.map-band { margin-top: 26px; border-block: 1px solid var(--rule); background: var(--surface); }
.map-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 14px 0; }
.map-tools .hint { font-size: var(--fs-sm); color: var(--ink-3); }
.hint-touch { display: none; }
@media (hover: none) { .hint-mouse { display: none; } .hint-touch { display: inline; } }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.map-legend button {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer; font-size: 13px; color: var(--ink-2);
}
.map-legend button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.map-scroll { overflow-x: auto; overflow-y: hidden; position: relative; padding-bottom: 6px; scrollbar-width: thin; }
.map-svg { display: block; max-width: none; }
.map-svg text { font-family: var(--font-body); fill: var(--ink); }
.map-svg .zone { fill: var(--zone); }
.map-svg .zone-line { stroke: var(--rule); stroke-dasharray: 3 5; }
.map-svg .ver-label { font-family: var(--font-display); font-weight: 900; font-size: 26px; fill: var(--ink); }
.map-svg .ver-date { font-size: 11.5px; fill: var(--ink-3); letter-spacing: .04em; }
.map-svg .ver-link:hover .ver-label { fill: var(--brand); }
.map-svg .track { fill: none; stroke-width: 7; stroke-linecap: round; }
.map-svg .station circle { fill: var(--surface); stroke-width: 3.4; transform-box: fill-box; transform-origin: center; transition: transform .15s; }
.map-svg .station.done circle { fill: var(--c); }
.map-svg .station .label { font-size: 12.5px; }
.map-svg .station.core .label { font-weight: 600; }
.map-svg .station.brief .label { fill: var(--ink-2); font-size: 12px; }
.map-svg .station:hover circle, .map-svg .station:focus-visible circle { transform: scale(1.32); }
.map-svg .station:focus { outline: none; }
.map-svg .station:focus-visible .label { text-decoration: underline; }
.map-svg .line-name { font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.map-svg .line-en { font-size: 11px; fill: var(--ink-3); }
.map-svg .line-num { font-family: var(--font-display); font-weight: 900; font-size: 14px; }
.map-svg .line-group { cursor: pointer; }
.map-svg.dimmed .row:not(.on) { opacity: .16; }
.map-svg .row { transition: opacity .2s; }
.map-svg .here { font-size: 11px; font-weight: 700; fill: var(--brand-on); }
.map-svg .here-bg { fill: var(--brand); }

.tip {
  position: fixed; z-index: 50; pointer-events: none;
  max-width: 300px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); padding: 10px 12px; font-size: 13px; line-height: 1.6;
}
.tip .tip-head { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; }
.tip b { display: block; font-size: 14px; margin-bottom: 2px; }
.tip p { color: var(--ink-2); }

/* 快线 */
.routes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.route {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.route-head { display: flex; align-items: center; gap: 10px; }
.route-badge {
  font-family: var(--font-display); font-weight: 900; font-size: 15px;
  width: 34px; height: 26px; border-radius: 6px; display: grid; place-items: center;
  background: var(--ink); color: var(--surface);
}
.route h3 { font-size: 17px; }
.route .who { font-size: var(--fs-sm); color: var(--ink-2); }
.route-stops { list-style: none; margin: 4px 0 0; padding: 0; position: relative; }
.route-stops li { position: relative; padding-left: 22px; font-size: 13.5px; line-height: 1.5; padding-block: 3px; }
.route-stops li::before {
  content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 3px; background: var(--rule);
}
.route-stops li:first-child::before { top: 50%; }
.route-stops li:last-child::before { bottom: 50%; }
.route-stops li a { color: var(--ink); text-decoration: none; }
.route-stops li a:hover { text-decoration: underline; }
.route-stops .stop-dot {
  position: absolute; left: 1px; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 50%;
  background: var(--surface); border: 3px solid var(--c);
}
.route-stops li.done .stop-dot { background: var(--c); }
.route-stops .stop-ver { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-left: 6px; }
.route-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; font-size: var(--fs-sm); color: var(--ink-3); }

/* 发车时刻表 */
.board { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.board-row {
  display: grid; grid-template-columns: 92px 112px minmax(0, 1fr) 170px 24px; gap: 16px; align-items: center;
  padding: 16px 20px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--rule-2);
}
.board-row:first-child { border-top: 0; }
.board-row:hover { background: var(--sunk); }
.board-ver { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: -.02em; }
.board-date { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); }
.board-date span { display: block; font-family: var(--font-body); font-size: 12px; }
.board-title b { display: block; font-size: 16.5px; }
.board-title span { display: block; font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.6; }
.board-lines { display: flex; flex-wrap: wrap; gap: 4px; }
.board-prog { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-3); }
.meter { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
.board-go { color: var(--ink-3); font-size: 20px; }

/* 实验室入口 */
.lab-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.lab-card {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 18px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.lab-card:hover { border-color: var(--ink-3); transform: translateY(-2px); }
.lab-card .lab-art { height: 86px; border-radius: 8px; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.lab-card h3 { font-size: 16.5px; }
.lab-card p { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.65; }
.lab-card .go { margin-top: auto; font-size: 13px; color: var(--brand-ink); font-weight: 600; }

/* ───────── 版本页 ───────── */
.rel-head { padding-block: 40px 30px; border-bottom: 1px solid var(--rule); background: var(--surface); }
.rel-head-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 32px; align-items: start; }
.rel-ver {
  font-family: var(--font-display); font-weight: 900; font-size: clamp(64px, 11vw, 128px);
  line-height: .86; letter-spacing: -.045em; color: var(--ink);
}
.rel-ver small { display: block; font-size: 13px; letter-spacing: .14em; color: var(--ink-3); font-weight: 700; margin-top: 14px; text-transform: uppercase; }
.rel-meta { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; min-width: 0; }
.rel-meta h1 { font-family: var(--font-display); font-size: var(--fs-2xl); font-weight: 800; }
.rel-meta .summary { color: var(--ink-2); max-width: 44em; }
.rel-facts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.rel-body { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 44px; padding-block: 32px 40px; }
.strip { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; padding: 4px 8px 12px 0; scrollbar-width: thin; }
.strip-title { font-size: 12px; color: var(--ink-3); margin: 0 0 10px; display: flex; justify-content: space-between; }
.strip ol { list-style: none; margin: 0; padding: 0; }
.strip li { position: relative; }
.strip li::before {
  content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 4px; background: var(--c); opacity: .9;
}
.strip li:first-child::before { top: 16px; }
.strip li:last-child::before { bottom: calc(100% - 16px); }
.strip a {
  position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 6px 6px 6px 0;
  text-decoration: none; color: var(--ink-2); font-size: 13.5px; line-height: 1.4; border-radius: 6px;
}
.strip a:hover { color: var(--ink); }
.strip .sdot {
  flex: none; width: 22px; height: 22px; display: grid; place-items: center; position: relative; z-index: 1;
}
.strip .sdot::after {
  content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c);
}
.strip li.done .sdot::after { background: var(--c); }
.strip li.brief .sdot::after { width: 9px; height: 9px; border-width: 2.5px; }
.strip li.current a { color: var(--ink); font-weight: 600; }
.strip li.current .sdot::after { width: 16px; height: 16px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
.strip .here-tag { font-size: 10.5px; font-weight: 700; color: var(--brand-on); background: var(--brand); border-radius: 4px; padding: 0 5px; margin-left: 2px; line-height: 17px; }
.strip .s-name { padding-top: 1px; min-width: 0; overflow-wrap: anywhere; }

.feature { padding-bottom: 46px; margin-bottom: 46px; border-bottom: 1px solid var(--rule); min-width: 0; }
.feature:last-of-type { border-bottom: 0; }
.f-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.f-line { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); margin-right: 4px; }
.feature h2 { font-family: var(--font-display); font-size: clamp(23px, 3vw, 29px); font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
.feature h2 code { font-size: .9em; background: none; border: 0; padding: 0; color: inherit; }
.f-en { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.f-tldr { font-size: 17.5px; line-height: 1.75; color: var(--ink); margin-top: 16px; max-width: 40em; }
.f-body { margin-top: 18px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; }
.f-body > p, .f-body > ul, .f-body > ol, .f-body > h4 { max-width: 42em; }
.f-body h4 { font-size: 17px; margin-top: 10px; font-family: var(--font-display); font-weight: 800; }
.f-body ul, .f-body ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.f-body li::marker { color: var(--ink-3); }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
.table-wrap th, .table-wrap td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--rule-2); vertical-align: top; line-height: 1.6; }
.table-wrap thead th { border-top: 0; background: var(--sunk); font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.callout { border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); }

.f-foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-top: 26px; }
.punch {
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  border: 1.5px dashed var(--ink-3); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 8px 14px 8px 10px; font-size: 14px; font-weight: 500;
}
.punch .hole { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink-3); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.punch:hover { border-color: var(--ink); }
.punch[aria-pressed="true"] { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.punch[aria-pressed="true"] .hole { background: var(--ok); border-color: var(--ok); }
.punch[aria-pressed="true"] .hole::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok-soft); }
.f-links { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.next-rel { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 22px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }

/* 代码块 */
.code { margin: 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--code-bg); overflow: hidden; min-width: 0; }
.code-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--rule-2); background: color-mix(in srgb, var(--code-bg) 92%, var(--ink));
  font-size: 13px;
}
.code-title { color: var(--ink-2); flex: 1 1 200px; min-width: 0; line-height: 1.5; }
.code-title code { font-size: .92em; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; line-height: 1;
  padding: 5px 9px; border-radius: 999px; white-space: nowrap;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok { color: var(--ok); background: var(--ok-soft); }
.badge.warning { color: var(--warn); background: var(--warn-soft); }
.badge.error { color: var(--err); background: var(--err-soft); }
.badge.none { color: var(--ink-3); background: var(--sunk); }
.badge.none::before { background: transparent; border: 1.5px solid currentColor; }
.copy-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; font-size: 12px; padding: 3px 8px; cursor: pointer; color: var(--ink-2); }
.copy-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.code pre.src {
  margin: 0; padding: 12px 0; overflow-x: auto; font-size: 13.5px; line-height: 1.68; color: var(--code-fg);
  tab-size: 4; counter-reset: ln;
}
.code pre.src code { display: block; min-width: max-content; }
.code .ln { display: block; padding: 0 18px 0 0; position: relative; }
.code .ln::before {
  counter-increment: ln; content: counter(ln);
  display: inline-block; width: 3.2em; padding-right: 1.1em; text-align: right;
  color: var(--code-gutter); user-select: none; -webkit-user-select: none;
}
.code .ln.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--code-hl-edge); }
.code.bare { border: 0; border-radius: 0; }
.code.bare .code-head { display: none; }
.code.nolines .ln::before { display: none; }
.code.nolines .ln { padding-left: 16px; }
.code-file { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.code-cmd {
  font-family: var(--font-mono); font-size: 12px; color: var(--term-dim); background: var(--term-bg);
  padding: 10px 16px 0; overflow-x: auto; white-space: pre;
}
.code-cmd b { color: var(--term-ok); font-weight: 500; }
.term {
  margin: 0; background: var(--term-bg); color: var(--term-fg);
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; padding: 8px 16px 14px;
  overflow-x: auto; white-space: pre;
}
.term .t-loc { color: var(--term-dim); }
.term .t-err { color: var(--term-err); font-weight: 700; }
.term .t-warn { color: var(--term-warn); font-weight: 700; }
.term .t-note { color: var(--term-note); font-weight: 700; }
.term .t-gut { color: var(--term-dim); }
.term .t-group { color: var(--term-dim); }
.term a { color: var(--term-note); }
.term .t-ok { color: var(--term-ok); }
.term-label { display: block; font-family: var(--font-body); font-size: 11.5px; color: var(--term-dim); margin-bottom: 4px; letter-spacing: .06em; }
.term-docs { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 8px; font-family: var(--font-body); font-size: 12px; white-space: normal; }
.k { color: var(--tok-kw); font-weight: 600; }
.s { color: var(--tok-str); }
.c { color: var(--tok-com); }
.n { color: var(--tok-num); }
.t { color: var(--tok-type); }
.f { color: var(--tok-fn); }
.d { color: var(--tok-decl); }
.a { color: var(--tok-attr); }
.p { color: var(--tok-pound); }

/* 小测 */
.quiz { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 16px 18px; }
.quiz-q { display: flex; gap: 10px; font-weight: 600; }
.quiz-q .qmark { font-family: var(--font-display); font-weight: 900; color: var(--brand); flex: none; }
.quiz-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.quiz-opts button {
  text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 9px; padding: 9px 12px;
  cursor: pointer; display: flex; gap: 10px; align-items: baseline; line-height: 1.55; font-size: 14.5px;
}
.quiz-opts button:hover:not([disabled]) { border-color: var(--ink-3); }
.quiz-opts button .opt-key { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); flex: none; }
.quiz-opts button.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz-opts button.wrong { border-color: var(--err); background: var(--err-soft); }
.quiz-opts button[disabled] { cursor: default; }
.quiz-explain { margin-top: 12px; font-size: 14px; color: var(--ink-2); padding-top: 12px; border-top: 1px dashed var(--rule); }

/* ───────── 实验室 ───────── */
.page-head { padding-block: 40px 26px; }
.page-head h1 { font-family: var(--font-display); font-size: clamp(30px, 4.4vw, 44px); font-weight: 900; letter-spacing: -.015em; margin-top: 8px; }
.page-head p { color: var(--ink-2); margin-top: 12px; max-width: 46em; font-size: 16.5px; }
.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule-2); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.panel-body { padding: 14px; }
.lab-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; position: relative; }
.lane-head { font-size: 12.5px; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--rule-2); display: flex; align-items: center; gap: 8px; }
.lane-head i { width: 10px; height: 10px; border-radius: 50%; }
.lane-head.main i { background: var(--l1); }
.lane-head.pool i { background: var(--l2); }
.lane-col { border-right: 1px dashed var(--rule); }
.trace { display: grid; grid-template-columns: 1fr 1fr; padding: 10px 0; }
.trace-row { display: contents; }
.cell { padding: 5px 10px; min-height: 46px; display: flex; align-items: center; }
.cell.main-col { border-right: 1px dashed var(--rule); }
.step-chip {
  width: 100%; border-radius: 9px; padding: 7px 10px; font-size: 13px; line-height: 1.45; border: 1.5px solid var(--rule);
  background: var(--surface); transition: opacity .25s, transform .25s, border-color .25s, background .25s;
}
.step-chip code { background: none; border: 0; padding: 0; font-size: 12.5px; }
.step-chip .mk { font-family: var(--font-mono); font-weight: 700; margin-right: 6px; }
.step-chip.main { border-color: color-mix(in srgb, var(--l1) 55%, var(--rule)); }
.step-chip.pool { border-color: color-mix(in srgb, var(--l2) 55%, var(--rule)); }
.step-chip.wait { border-style: dashed; color: var(--ink-2); }
.step-chip.hop { text-align: center; font-weight: 600; background: var(--sunk); }
.trace.playing .step-chip.future { opacity: .22; }
.step-chip.now { transform: scale(1.02); box-shadow: var(--shadow); }
.step-chip.now.main { background: color-mix(in srgb, var(--l1) 12%, var(--surface)); border-color: var(--l1); }
.step-chip.now.pool { background: color-mix(in srgb, var(--l2) 12%, var(--surface)); border-color: var(--l2); }
.step-chip.now.hop { border-color: var(--ink); }
.cell.span2 { grid-column: 1 / -1; }
.step-say { min-height: 3.4em; padding: 12px 14px; border-top: 1px solid var(--rule-2); font-size: 14.5px; }
.verdict { margin-top: 20px; }
.verdict-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.verdict-head h3 { font-size: 16px; }
.verdict .term { border-radius: var(--radius); }
.cmp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.cmp div { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 12px 14px; font-size: 13.5px; }
.cmp b { display: block; font-size: 14.5px; margin-bottom: 4px; }

/* 所有权沙盒 */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.slot { border: 1.5px dashed var(--rule); border-radius: 12px; padding: 10px; min-height: 148px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); min-width: 0; }
.slot-name { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; }
.slot.declared { border-style: solid; background: var(--surface); }
.slot .ghost { margin: auto; text-align: center; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.ticket {
  position: relative; margin: auto 0; border-radius: 10px; padding: 10px 12px 10px 16px;
  background: color-mix(in srgb, var(--l4) 22%, var(--surface)); border: 1.5px solid var(--l4);
  font-size: 12.5px; line-height: 1.4; animation: slide-in .35s ease;
}
.ticket::before, .ticket::after {
  content: ""; position: absolute; left: -8px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--l4);
  clip-path: inset(0 0 0 50%);
}
.ticket::before { top: 8px; }
.ticket::after { bottom: 8px; }
.ticket b { font-family: var(--font-display); font-size: 15px; display: block; }
.ticket.punched { background: var(--sunk); border-color: var(--ink-3); color: var(--ink-3); }
.ticket.punched b { text-decoration: line-through; }
.ticket.flash { animation: flash .6s ease; }
.ticket.dup { border-color: var(--err); background: var(--err-soft); }
@keyframes slide-in { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flash { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--l2) 30%, transparent); } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button { font-family: var(--font-mono); font-size: 12.5px; }
.code-log { min-height: 120px; }
.code-log .ln.rejected { text-decoration: line-through; text-decoration-color: var(--err); text-decoration-thickness: 2px; background: var(--err-soft); }
.code-log .ln.copied { background: var(--warn-soft); }
.sandbox-msg { margin-top: 12px; }
.sandbox-msg .callout { font-size: 14px; }
.sandbox-msg .callout.bad { border-color: var(--err); background: var(--err-soft); }
.sandbox-msg .callout.warnish { border-color: var(--warn); background: var(--warn-soft); }

/* 内存布局 */
.mem-controls { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
.mem-controls label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.mem-controls input[type="range"] { width: 180px; accent-color: var(--brand); }
.mem-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.mem-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.mem-card h3 { font-family: var(--font-mono); font-size: 15px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.mem-card h3 span { font-family: var(--font-body); font-size: 12px; color: var(--ink-3); font-weight: 400; }
.mem-area { font-size: 11.5px; color: var(--ink-3); letter-spacing: .06em; display: flex; justify-content: space-between; gap: 6px; }
.hexdump { display: grid; grid-template-columns: 34px repeat(16, minmax(0, 1fr)); gap: 2px; align-items: center; }
.hexdump .off { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
.byte { aspect-ratio: 1; max-width: 100%; border-radius: 2px; background: var(--sunk); }
.byte.ptr { background: color-mix(in srgb, var(--ink) 55%, var(--surface)); }
.byte.hdr { background: color-mix(in srgb, var(--ink-3) 45%, var(--surface)); }
.byte.el { background: color-mix(in srgb, var(--c) 80%, var(--surface)); }
.byte.el.alt { background: color-mix(in srgb, var(--c) 50%, var(--surface)); }
.byte.pad { background: repeating-linear-gradient(135deg, var(--rule) 0 2px, transparent 2px 4px); }
.byte.cnt { background: color-mix(in srgb, var(--l6) 70%, var(--surface)); }
.mem-facts { list-style: none; padding: 0; margin: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.mem-facts li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--rule-2); padding-top: 4px; }
.mem-facts b { font-variant-numeric: tabular-nums; }
.mem-arrow { font-size: 12px; color: var(--ink-3); text-align: center; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 14px; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row .byte { width: 12px; height: 12px; display: inline-block; }

/* ───────── 猜猜看 ───────── */
.quiz-stage { max-width: 860px; }
.qhud { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-size: 13.5px; color: var(--ink-2); }

}

/* ───────── 总表 ───────── */

/* ───────── 通行卡 ───────── */

.card {
  aspect-ratio: 1.586; max-width: 100%; border-radius: 18px; padding: 22px 22px 58px; position: relative; overflow: hidden;

.card-bottom { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: 11.5px; opacity: .8; position: relative; }
.lines-prog { display: flex; flex-direction: column; gap: 10px; }
.lp-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13.5px; }

.lp-row .num { text-align: right; color: var(--ink-3); font-size: 12.5px; }
.punch-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
.pg-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.pg-ver { font-family: var(--font-display); font-weight: 900; font-size: 22px; }
.pg-holes { display: flex; flex-wrap: wrap; gap: 6px; }
.pg-holes a { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--c); background: var(--surface); display: block; }
.pg-holes a.done { background: var(--c); }

/* ───────── 搜索 ───────── */
.search { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: calc(10vh + env(safe-area-inset-top, 0px)) var(--gutter-r) 20px var(--gutter-l); }

lized\u003c/code>、\u003ccode>@inline(always)\u003c/code>、\u003ccode>@export\u003c/code> 让库作者精细地控制优化，\u003ccode>weak let\u003c/code> 让带弱引用的类也能成为 \u003ccode>Sendable\u003c/code>。平台方面，官方 Swift SDK for Android 正式发布。","blog":"https://www.swift.org/blog/swift-6.3-released/","features":["c-interop","module-selectors","perf-attrs","section","weak-let","clock-epochs","codable-errors","android","testing-63","swiftpm-63"]},{"version":"6.4","id":"v64","date":"2026-09-15","title":"更简洁、更快，依然安全","subtitle":"终点站（暂时）","summary":"6.4 一边让日常代码更简洁：\u003ccode>defer\u003c/code> 里可以 \u003ccode>await\u003c/code>，\u003ccode>some P?\u003c/code> 不用加括号，\u003ccode>@diagnose\u003c/code> 在源码里控制警告；一边继续推进“不复制也安全”：\u003ccode>borrow\u003c/code>/\u003ccode>mutate\u003c/code> 访问器、\u003ccode>UniqueBox\u003c/code>、\u003ccode>UniqueArray\u003c/code>、\u003ccode>Ref\u003c/code>、\u003ccode>Iterable\u003c/code>，以及基于 \u003ccode>Span\u003c/code> 的临时内存与字节读取。Swift Build 也成为 SwiftPM 的默认构建系统。","blog":"https://www.swift.org/blog/swift-6.4-released/","features":["async-defer","cancel-shield","task-unused","tilde-sendable","continuation","optional-some","diagnose","memberwise-private","array-trailing-closure","any-apple-os","borrow-mutate","noncopyable-protocols","unique-box-array","ref","iterable","temp-alloc","rawspan-load","async-result","trivially-identical","observation-tracking","stdlib-64","swift-build","testing-64","subprocess","interop-64","embedded-64"]}],"features":[{"id":"swift6-mode","release":"6.0","since":"6.0","title":"Swift 6 语言模式：数据竞争变成编译错误","plainTitle":"Swift 6 语言模式：数据竞争变成编译错误","en":"Swift 6 language mode & complete concurrency checking","line":1,"level":"core","short":"Swift 6 模式","tags":"数据竞争 data race Sendable strict concurrency 语言模式 language mode swiftLanguageModes 迁移","tldr":"在 Swift 6 语言模式下，编译器会对整个模块做完整的并发检查：任何\u003cstrong>可能\u003c/strong>发生的数据竞争都是编译错误，而不是上线后才偶尔出现的崩溃。","flag":"","se":[{"id":"SE-0337","url":"https://github.com/swiftlang/swift-evolution","title":""},{"id":"SE-0412","url":"https://github.com/swiftlang/swift-evolution","title":""},{"id":"SE-0414","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md","title":"Region based Isolation"}],"links":[],"blocks":[{"type":"p","html":"Swift 5.5 引入了 \u003ccode>async\u003c/code>/\u003ccode>await\u003c/code> 和 actor，但并发检查一直是“建议性”的：一段有数据竞争的代码，可以安安静静地通过编译。Swift 6 编译器新增了 \u003cstrong>Swift 6 语言模式\u003c/strong>（language mode），在这个模式下，\u003ccode>Sendable\u003c/code> 检查和 actor 隔离检查全部变成错误。"},{"type":"p","html":"先看一段典型的问题代码。一个普通的类被两个并发执行的地方同时修改："},{"type":"code","lang":"swift","title":"Swift 5 模式：顺利编译，但这里藏着数据竞争","code":"final class Counter {\n    var value = 0\n}\n\nfunc race() {\n    let counter = Counter()\n    Task.detached {\n        counter.value += 1      // 后台线程写入\n    }\n    counter.value += 1          // 同时在当前线程写入\n}","hl":"","check":"ok","flags":"-swift-version 5","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 5 main.swift"}},{"type":"p","html":"同一段代码，切到 Swift 6 模式，编译器会精确地指出冲突的两处访问："},{"type":"code","lang":"swift","title":"同一段代码，Swift 6 模式","code":"final class Counter {\n    var value = 0\n}\n\nfunc race() {\n    let counter = Counter()\n    Task.detached {\n        counter.value += 1      // 后台线程写入\n    }\n    counter.value += 1          // 同时在当前线程写入\n}","hl":"7,10","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:7:10: error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n 5 | func race() {\n 6 |     let counter = Counter()\n 7 |     Task.detached {\n   |          |- error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |          `- note: Passing value of non-Sendable type '() async -> ()' as a 'sending' argument to static method 'detached(name:priority:operation:)' risks causing races in between local and caller code\n 8 |         counter.value += 1      // 后台线程写入\n 9 |     }\n10 |     counter.value += 1          // 同时在当前线程写入\n   |     `- note: access can happen concurrently\n11 | }\n12 | \n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"全局可变状态是另一类常见问题：任何线程都可以随时读写一个 \u003ccode>static var\u003c/code>。Swift 6 模式要求你说清楚它由谁来保护："},{"type":"code","lang":"swift","title":"全局可变状态同样会被拦下","code":"struct Settings {\n    static var current = Settings()\n    var theme = \"light\"\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:16: error: static property 'current' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n1 | struct Settings {\n2 |     static var current = Settings()\n  |                |- error: static property 'current' is not concurrency-safe because it is nonisolated global shared mutable state [#MutableGlobalVariable]\n  |                |- note: convert 'current' to a 'let' constant to make 'Sendable' shared state immutable\n  |                |- note: add '@MainActor' to make static property 'current' part of global actor 'MainActor'\n  |                `- note: disable concurrency-safety checks if accesses are protected by an external synchronization mechanism\n3 |     var theme = \"light\"\n4 | }\n\n[#MutableGlobalVariable]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/mutable-global-variable>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"三种修法，任选其一","code":"struct Settings {\n    static let standard = Settings()                    // ① 改成不可变的 let\n    @MainActor static var current = Settings()          // ② 交给主 actor 保护\n    nonisolated(unsafe) static var legacy = Settings()  // ③ 自己保证同步（慎用）\n    var theme = \"light\"\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"h","html":"如何开启、如何迁移"},{"type":"p","html":"语言模式和编译器版本是两回事：Swift 6.0 到 6.4 的编译器都同时支持 Swift 5 和 Swift 6 两种模式，你可以按 target 逐个迁移。"},{"type":"code","lang":"swift","title":"","code":"// swift-tools-version: 6.0\nimport PackageDescription\n\nlet package = Package(\n    name: \"MyApp\",\n    targets: [\n        .target(name: \"Core\"),                           // tools-version 6.0：默认 Swift 6 模式\n        .target(\n            name: \"Legacy\",\n            swiftSettings: [.swiftLanguageMode(.v5)]     // 这个 target 暂时留在 Swift 5 模式\n        ),\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"list","items":["迁移前，可以先在 Swift 5 模式下加上 \u003ccode>-strict-concurrency=complete\u003c/code>，把同样的问题以\u003cstrong>警告\u003c/strong>形式提前看到，逐个修掉再切换。","在 Xcode 中对应 Build Settings 里的 \u003cstrong>Swift Language Version\u003c/strong>。","不要一上来就到处加 \u003ccode>@unchecked Sendable\u003c/code> 或 \u003ccode>nonisolated(unsafe)\u003c/code>：它们只是让编译器闭嘴，问题还在。","后面几个版本的大量工作（尤其是 \u003ca href=\"#v62\">6.2 的“平易近人的并发”\u003c/a>）都是为了让 Swift 6 模式更好用、报错更少。"]},{"type":"quiz","question":"把一个 Swift 5 项目直接换到 Swift 6.0 编译器（Xcode 16）上编译，会发生什么？","options":["立刻出现大量数据竞争错误，必须全部修完才能编译","照常编译：项目的语言模式仍是 Swift 5，要主动切换到 Swift 6 模式才会启用完整检查","编译器不再支持 Swift 5 的语法"],"answer":1,"explain":"新编译器默认保持项目原来的语言模式。Swift 6 模式需要主动开启，而且可以按 target 分别开启。"}]},{"id":"region-sending","release":"6.0","since":"6.0","title":"区域隔离与 \u003ccode>sending\u003c/code>：编译器看懂了“交接”","plainTitle":"区域隔离与 sending：编译器看懂了“交接”","en":"Region-based isolation & sending","line":1,"level":"core","short":"sending","tags":"region isolation 区域 sending transferring Sendable 非Sendable 交接","tldr":"非 \u003ccode>Sendable\u003c/code> 的值也可以安全地交给另一个任务，只要编译器能证明你之后不会再碰它。\u003ccode>sending\u003c/code> 关键字把这种“交接”写进函数签名。","flag":"","se":[{"id":"SE-0414","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md","title":"Region based Isolation"},{"id":"SE-0430","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0430-transferring-parameters-and-results.md","title":"`sending` parameter and result values"}],"links":[],"blocks":[{"type":"p","html":"早期的严格并发检查规则很死板：只要一个类型不是 \u003ccode>Sendable\u003c/code>，它的值就不能跨越隔离边界，哪怕你只是新建了一个对象，然后把它整个交给后台任务。"},{"type":"p","html":"\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0414-region-based-isolation.md\" target=\"_blank\" rel=\"noopener\">SE-0414\u003c/a> 引入了\u003cstrong>区域隔离\u003c/strong>（region-based isolation）。编译器会追踪每个值属于哪个“区域”：如果一个区域被整体交出去，并且之后再也不用，那么这次交接就是安全的。"},{"type":"code","lang":"swift","title":"新建的对象交给后台任务，之后不再碰它：没问题","code":"final class Report {\n    var lines: [String] = []\n}\n\nfunc generate() {\n    let report = Report()\n    report.lines.append(\"标题\")\n    Task.detached {\n        report.lines.append(\"正文\")    // report 所在的整个区域被交给了这个任务\n    }\n    // 之后不再访问 report → 编译通过\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"交出去之后又用了它：编译器精确指出冲突","code":"final class Report {\n    var lines: [String] = []\n}\n\nfunc generate() {\n    let report = Report()\n    report.lines.append(\"标题\")\n    Task.detached {\n        report.lines.append(\"正文\")\n    }\n    report.lines.append(\"结尾\")        // 和后台任务同时访问\n}","hl":"11","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:8:10: error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n 6 |     let report = Report()\n 7 |     report.lines.append(\"标题\")\n 8 |     Task.detached {\n   |          |- error: sending value of non-Sendable type '() async -> ()' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |          `- note: Passing value of non-Sendable type '() async -> ()' as a 'sending' argument to static method 'detached(name:priority:operation:)' risks causing races in between local and caller code\n 9 |         report.lines.append(\"正文\")\n10 |     }\n11 |     report.lines.append(\"结尾\")        // 和后台任务同时访问\n   |     `- note: access can happen concurrently\n12 | }\n13 | \n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"h","html":"用 \u003ccode>sending\u003c/code> 把交接写进 API"},{"type":"p","html":"\u003ccode>Task.detached\u003c/code> 能接收上面的闭包，是因为它的参数被标记为 \u003ccode>sending\u003c/code>：调用方承诺把这个值交出去、之后不再使用。你自己的函数也可以这样声明："},{"type":"code","lang":"swift","title":"普通参数属于调用方的区域，不能随手交给别的任务","code":"final class Photo {\n    var pixels: [UInt8] = []\n}\n\nfunc process(_ photo: Photo) {\n    Task.detached {\n        photo.pixels.append(0)\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:6:10: error: passing closure as a 'sending' parameter risks causing data races between code in the current isolation context and concurrent execution of the closure [#RegionIsolation::SendingClosureRisksDataRace]\n 4 | \n 5 | func process(_ photo: Photo) {\n 6 |     Task.detached {\n   |          `- error: passing closure as a 'sending' parameter risks causing data races between code in the current isolation context and concurrent execution of the closure [#RegionIsolation::SendingClosureRisksDataRace]\n 7 |         photo.pixels.append(0)\n   |         `- note: closure captures 'photo' which is accessible to code in the current isolation context\n 8 |     }\n 9 | }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingClosureRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-closure-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"标记为 sending：调用方负责交出所有权","code":"final class Photo {\n    var pixels: [UInt8] = []\n}\n\nfunc process(_ photo: sending Photo) {\n    Task.detached {\n        photo.pixels.append(0)        // ✅ photo 已经和调用方断开了\n    }\n}\n\nfunc makePhoto() -> sending Photo {   // 返回值也可以是 sending：一个与任何人都不共享的新值\n    Photo()\n}\n\nfunc upload() {\n    process(makePhoto())\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["区域隔离不需要你写任何代码，升级编译器就生效；很多以前要靠 \u003ccode>@unchecked Sendable\u003c/code> 绕过的地方，现在可以直接编译。","\u003ccode>sending\u003c/code> 参数：调用方交出值，被调用方可以把它再交给别的隔离域。\u003ccode>sending\u003c/code> 返回值：返回一个“干净的”新值。","提案早期叫 \u003ccode>transferring\u003c/code>，最终定名为 \u003ccode>sending\u003c/code>。"]}]},{"id":"synchronization","release":"6.0","since":"6.0","title":"\u003ccode>Mutex\u003c/code> 与 \u003ccode>Atomic\u003c/code>：标准库自带同步原语","plainTitle":"Mutex 与 Atomic：标准库自带同步原语","en":"Synchronization module","line":1,"level":"key","short":"Mutex·Atomic","tags":"Mutex Atomic 锁 lock Synchronization 原子 线程安全 Sendable","tldr":"新的 \u003ccode>Synchronization\u003c/code> 模块提供 \u003ccode>Mutex\u003c/code> 和 \u003ccode>Atomic\u003c/code>。用它们保护内部状态的类型，可以安全地声明为 \u003ccode>Sendable\u003c/code>，不再需要 \u003ccode>@unchecked\u003c/code>。","flag":"","se":[{"id":"SE-0410","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0410-atomics.md","title":"Low-Level Atomic Operations ⚛︎"},{"id":"SE-0433","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0433-mutex.md","title":"Synchronous Mutual Exclusion Lock 🔒"}],"links":[],"blocks":[{"type":"p","html":"以前要写一个线程安全的类，通常要用 \u003ccode>NSLock\u003c/code>、\u003ccode>os_unfair_lock\u003c/code> 或者 \u003ccode>DispatchQueue\u003c/code>，再给类型加上 \u003ccode>@unchecked Sendable\u003c/code>，告诉编译器“相信我”。现在标准库直接提供了锁和原子类型，编译器能理解它们的安全性："},{"type":"code","lang":"swift","title":"用 Mutex 保护缓存，类型可以诚实地声明 Sendable","code":"import Synchronization\n\nfinal class ImageCache: Sendable {\n    private let storage = Mutex\u003c[String: Int]>([:])\n\n    func insert(_ size: Int, for key: String) {\n        storage.withLock { $0[key] = size }\n    }\n\n    func size(for key: String) -> Int? {\n        storage.withLock { $0[key] }\n    }\n}\n\nlet cache = ImageCache()\ncache.insert(1024, for: \"avatar.png\")\nprint(cache.size(for: \"avatar.png\") ?? 0)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1024","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Atomic：无锁的计数器","code":"import Synchronization\n\nfinal class Stats: Sendable {\n    let visits = Atomic\u003cInt>(0)\n}\n\nlet stats = Stats()\nawait withTaskGroup { group in\n    for _ in 0..\u003c100 {\n        group.addTask { stats.visits.add(1, ordering: .relaxed) }\n    }\n}\nprint(stats.visits.load(ordering: .relaxed))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"100","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>Mutex\u003c/code> 和 \u003ccode>Atomic\u003c/code> 都是 \u003ccode>~Copyable\u003c/code>（不可复制）类型：存成 \u003ccode>let\u003c/code> 属性，通过借用访问，不会被意外复制出第二把锁。","需要 macOS 15、iOS 18 等系统版本对应的运行时。","多数情况下仍然优先考虑 actor；在同步代码、性能敏感的路径，或者不想引入 \u003ccode>await\u003c/code> 的地方，\u003ccode>Mutex\u003c/code> 更合适。"]}]},{"id":"isolation-inherit","release":"6.0","since":"6.0","title":"\u003ccode>#isolation\u003c/code>：让函数继承调用者的隔离","plainTitle":"#isolation：让函数继承调用者的隔离","en":"Inheritance of actor isolation","line":1,"level":"brief","short":"#isolation","tags":"isolation isolated 参数 继承 actor isolated(any)","tldr":"给异步函数加一个 \u003ccode>isolated (any Actor)? = #isolation\u003c/code> 参数，它就会在调用者所在的 actor 上运行，可以安全地操作调用者的非 \u003ccode>Sendable\u003c/code> 状态。","flag":"","se":[{"id":"SE-0420","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0420-inheritance-of-actor-isolation.md","title":"Inheritance of actor isolation"},{"id":"SE-0431","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0431-isolated-any-functions.md","title":"`@isolated(any)` Function Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"一个“跟着调用者走”的计时工具","code":"func measure\u003cT>(\n    _ label: String,\n    isolation: isolated (any Actor)? = #isolation,\n    _ body: () async throws -> T\n) async rethrows -> T {\n    let start = ContinuousClock.now\n    defer { print(label, ContinuousClock.now - start) }\n    return try await body()\n}\n\n@MainActor\nfinal class Feed {\n    var items: [String] = []\n\n    func reload() async {\n        await measure(\"reload\") {\n            items = [\"新闻 A\", \"新闻 B\"]   // measure 和闭包都运行在主 actor 上\n        }\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"这个写法有点啰嗦。到了 Swift 6.2，\u003ca href=\"#f-nonsending\">undefined\u003c/a> 让“异步函数继承调用者的隔离”变成了默认行为，大多数情况下不再需要手写这个参数。同一版本还加入了 \u003ccode>@isolated(any)\u003c/code> 函数类型，让持有闭包的一方可以查询它的隔离（\u003ccode>Task\u003c/code> 的初始化方法就用到了它）。"}]},{"id":"typed-throws","release":"6.0","since":"6.0","title":"类型化抛出 \u003ccode>throws(E)\u003c/code>","plainTitle":"类型化抛出 throws(E)","en":"Typed throws","line":3,"level":"core","short":"类型化抛出","tags":"typed throws 错误处理 error handling catch Never rethrows","tldr":"函数可以声明自己只会抛出某一种错误：\u003ccode>throws(ParseError)\u003c/code>。调用方 \u003ccode>catch\u003c/code> 到的直接就是 \u003ccode>ParseError\u003c/code>，可以穷尽地 \u003ccode>switch\u003c/code>，不用再 \u003ccode>as?\u003c/code> 猜类型。","flag":"","se":[{"id":"SE-0413","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0413-typed-throws.md","title":"Typed throws"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"以前：catch 里只有 any Error","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws -> Int {\n    guard !text.isEmpty else { throw ParseError.empty }\n    guard let n = Int(text) else { throw ParseError.notANumber(text) }\n    return n\n}\n\ndo {\n    _ = try parseAge(\"十八\")\n} catch let error as ParseError {     // 需要自己转换类型\n    print(\"解析失败：\", error)\n} catch {\n    print(\"不会发生，但编译器要求兜底：\", error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"解析失败： notANumber(\"十八\")","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"现在：throws(ParseError)","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws(ParseError) -> Int {\n    guard !text.isEmpty else { throw .empty }        // 可以省略类型名\n    guard let n = Int(text) else { throw .notANumber(text) }\n    return n\n}\n\ndo throws(ParseError) {                              // 写明这个 do 块抛出的错误类型\n    _ = try parseAge(\"十八\")\n} catch {\n    switch error {                                   // error 的类型就是 ParseError\n    case .empty: print(\"请输入年龄\")\n    case .notANumber(let s): print(\"“\\(s)”不是数字\")\n    }\n}","hl":"6,12-13,15-18","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"“十八”不是数字","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"注意 \u003ccode>do throws(ParseError)\u003c/code>：它直接告诉编译器，这个 \u003ccode>do\u003c/code> 块抛出的错误类型是 \u003ccode>ParseError\u003c/code>。在普通函数和顶层代码里，只要 \u003ccode>do\u003c/code> 里抛出的只有 \u003ccode>ParseError\u003c/code> 一种错误，这个标注可以省略，编译器会自己推断。但\u003cstrong>在闭包里不会\u003c/strong>：\u003ccode>Task { }\u003c/code> 的花括号是闭包，Xcode Playground 里 \u003ccode>#Playground { }\u003c/code> 的花括号也是。漏写时，\u003ccode>catch\u003c/code> 里的 \u003ccode>error\u003c/code> 就退回成 \u003ccode>any Error\u003c/code>："},{"type":"code","lang":"swift","title":"闭包里漏写 throws(ParseError)","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws(ParseError) -> Int {\n    guard !text.isEmpty else { throw .empty }\n    guard let n = Int(text) else { throw .notANumber(text) }\n    return n\n}\n\nTask {\n    do {                                             // 少了 throws(ParseError)\n        _ = try parseAge(\"十八\")\n    } catch {\n        switch error {                               // 这里的 error 是 any Error\n        case .empty: print(\"请输入年龄\")\n        case .notANumber(let s): print(\"“\\(s)”不是数字\")\n        }\n    }\n}","hl":"13,16","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:17:15: error: type 'any Error' has no member 'empty'\n15 |     } catch {\n16 |         switch error {                               // 这里的 error 是 any Error\n17 |         case .empty: print(\"请输入年龄\")\n   |               `- error: type 'any Error' has no member 'empty'\n18 |         case .notANumber(let s): print(\"“\\(s)”不是数字\")\n19 |         }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"所以最稳妥的写法是总带上 \u003ccode>do throws(ParseError)\u003c/code>：放在函数里、闭包里、Playground 里都能编译。"},{"type":"p","html":"类型化抛出在泛型里尤其好用：错误类型可以作为泛型参数传递，比 \u003ccode>rethrows\u003c/code> 更精确。传入不抛错的闭包时，\u003ccode>E\u003c/code> 被推断为 \u003ccode>Never\u003c/code>，调用方连 \u003ccode>try\u003c/code> 都不用写："},{"type":"code","lang":"swift","title":"泛型里传递错误类型","code":"extension Sequence {\n    func myMap\u003cT, E: Error>(_ transform: (Element) throws(E) -> T) throws(E) -> [T] {\n        var result: [T] = []\n        for x in self { result.append(try transform(x)) }\n        return result\n    }\n}\n\nlet doubled = [1, 2, 3].myMap { $0 * 2 }   // E == Never：不需要 try\nprint(doubled)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[2, 4, 6]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>throws\u003c/code> 等价于 \u003ccode>throws(any Error)\u003c/code>；\u003ccode>throws(Never)\u003c/code> 等价于不抛出。","适合：模块内部的代码、嵌入式环境（避免存在类型的开销）、错误种类确实是封闭集合的场景。","公共 API 要慎用：错误类型会成为 API 契约的一部分，以后想加一种新错误就是破坏性改动。提案本身也建议多数情况继续使用普通的 \u003ccode>throws\u003c/code>。"]},{"type":"quiz","question":"\u003ccode>func load() throws(Never) -&gt; Data\u003c/code> 等价于下面哪个声明？","options":["\u003ccode>func load() throws -&gt; Data\u003c/code>","\u003ccode>func load() -&gt; Data\u003c/code>","\u003ccode>func load() rethrows -&gt; Data\u003c/code>"],"answer":1,"explain":"\u003ccode>Never\u003c/code> 没有任何值，函数永远不可能抛出错误，所以它就是一个普通的不抛错函数，调用时也不需要 \u003ccode>try\u003c/code>。"}]},{"id":"noncopyable-generics","release":"6.0","since":"6.0","title":"不可复制类型走进泛型：\u003ccode>~Copyable\u003c/code>","plainTitle":"不可复制类型走进泛型：~Copyable","en":"Noncopyable generics","line":2,"level":"core","short":"~Copyable 泛型","tags":"noncopyable move-only ~Copyable consuming borrowing 所有权 ownership deinit Optional","tldr":"Swift 5.9 就有了不可复制的结构体，但它们几乎不能和泛型、协议、\u003ccode>Optional\u003c/code> 一起用。Swift 6 让泛型参数、协议和扩展都可以去掉“默认可复制”的假设，标准库的 \u003ccode>Optional\u003c/code>、\u003ccode>Result\u003c/code>、指针类型也都支持了不可复制类型。","flag":"","se":[{"id":"SE-0427","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0427-noncopyable-generics.md","title":"Noncopyable Generics"},{"id":"SE-0429","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0429-partial-consumption.md","title":"Partial consumption of noncopyable values"},{"id":"SE-0432","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0432-noncopyable-switch.md","title":"Borrowing and consuming pattern matching for noncopyable types"},{"id":"SE-0437","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0437-noncopyable-stdlib-primitives.md","title":"Noncopyable Standard Library Primitives"}],"links":[],"blocks":[{"type":"p","html":"Swift 里每个类型默认都是 \u003ccode>Copyable\u003c/code> 的：赋值、传参时可以随意复制。写上 \u003ccode>~Copyable\u003c/code> 的意思是“不要假设我可以被复制”。这非常适合表达\u003cstrong>唯一的资源\u003c/strong>：一张车票只能检一次，一个文件句柄只能关闭一次。"},{"type":"code","lang":"swift","title":"一张不能复印的车票","code":"struct Ticket: ~Copyable {\n    let id: Int\n\n    consuming func punch() {          // consuming：调用之后，这张票就被“用掉”了\n        print(\"第 \\(id) 号票已检票\")\n    }\n\n    deinit { print(\"第 \\(id) 号票被回收\") }\n}\n\nfunc ride() {\n    let ticket = Ticket(id: 7)\n    ticket.punch()\n}\nride()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"第 7 号票已检票\n第 7 号票被回收","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"想用两次？编译器不答应","code":"struct Ticket: ~Copyable {\n    let id: Int\n    consuming func punch() {\n        print(\"第 \\(id) 号票已检票\")\n    }\n}\n\nfunc ride() {\n    let ticket = Ticket(id: 7)\n    ticket.punch()\n    ticket.punch()\n}","hl":"10,11","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:9: error: 'ticket' consumed more than once\n 7 | \n 8 | func ride() {\n 9 |     let ticket = Ticket(id: 7)\n   |         `- error: 'ticket' consumed more than once\n10 |     ticket.punch()\n   |     `- note: consumed here\n11 |     ticket.punch()\n   |     `- note: consumed again here\n12 | }\n13 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"Swift 6 的关键进步是：泛型也能接纳不可复制的类型了。下面的 \u003ccode>Wallet\u003c/code> 既能装普通值，也能装 \u003ccode>Ticket\u003c/code>："},{"type":"code","lang":"swift","title":"泛型容器装下不可复制的值","code":"struct Ticket: ~Copyable {\n    let id: Int\n}\n\nstruct Wallet\u003cItem: ~Copyable>: ~Copyable {\n    var item: Item?\n\n    mutating func take() -> Item? {\n        item.take()                      // Optional 现在也支持不可复制的 Wrapped\n    }\n}\n\nextension Wallet: Copyable where Item: Copyable {}   // 装可复制的东西时，钱包也可以复制\n\nvar wallet = Wallet(item: Ticket(id: 42))\nif let t = wallet.take() {\n    print(\"取出了 \\(t.id) 号票\")\n}\nprint(wallet.item == nil)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"取出了 42 号票\ntrue","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>~Copyable\u003c/code> 的含义是“\u003cstrong>不保证\u003c/strong>可复制”，而不是“保证不可复制”：\u003ccode>Wallet&lt;Int&gt;\u003c/code> 依然可以复制。","参数的所有权修饰：\u003ccode>borrowing\u003c/code>（只读借用）、\u003ccode>consuming\u003c/code>（拿走所有权）、\u003ccode>inout\u003c/code>（独占地修改）。","同一版本还支持了部分消耗（只拿走结构体里的某个字段）和对不可复制枚举的 \u003ccode>switch\u003c/code> 借用匹配。","这是后面 \u003ccode>Span\u003c/code>、\u003ccode>InlineArray\u003c/code>、\u003ccode>UniqueArray\u003c/code>、\u003ccode>Continuation\u003c/code> 等特性的地基。动手试试：\u003ca href=\"#lab-ownership\">所有权沙盒\u003c/a>。"]},{"type":"quiz","question":"下面关于 \u003ccode>struct Box&lt;T: ~Copyable&gt;: ~Copyable\u003c/code> 的说法，哪一个是对的？","options":["\u003ccode>Box&lt;Int&gt;\u003c/code> 也一定是不可复制的","\u003ccode>T\u003c/code> 可以是可复制的类型，也可以是不可复制的类型","\u003ccode>T\u003c/code> 必须是不可复制的类型"],"answer":1,"explain":"\u003ccode>~Copyable\u003c/code> 去掉的是“默认要求可复制”这个约束，并不要求类型一定不可复制。再配合 \u003ccode>extension Box: Copyable where T: Copyable {}\u003c/code>，\u003ccode>Box&lt;Int&gt;\u003c/code> 就能复制。"}]},{"id":"count-where","release":"6.0","since":"6.0","title":"\u003ccode>count(where:)\u003c/code>","plainTitle":"count(where:)","en":"count(where:)","line":4,"level":"brief","short":"count(where:)","tags":"count where filter 计数 序列","tldr":"统计满足条件的元素个数，不用再先 \u003ccode>filter\u003c/code> 出一个临时数组再取 \u003ccode>count\u003c/code>。","flag":"","se":[{"id":"SE-0220","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0220-count-where.md","title":"`count(where:)`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let scores = [88, 92, 59, 73, 100, 45]\n\nprint(scores.filter { $0 >= 60 }.count)     // 以前：会创建一个临时数组\nprint(scores.count(where: { $0 >= 60 }))    // 现在：一次遍历，不分配内存","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"4\n4","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"这个提案（\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0220-count-where.md\" target=\"_blank\" rel=\"noopener\">SE-0220\u003c/a>）早在 2018 年就被接受了，但因为类型检查性能问题被搁置，直到 Swift 6.0 才真正落地。"}]},{"id":"rangeset","release":"6.0","since":"6.0","title":"\u003ccode>RangeSet\u003c/code>：操作不连续的一组元素","plainTitle":"RangeSet：操作不连续的一组元素","en":"RangeSet & noncontiguous collection operations","line":4,"level":"brief","short":"RangeSet","tags":"RangeSet indices subranges 不连续 批量 移动 删除","tldr":"\u003ccode>indices(where:)\u003c/code> 返回一个 \u003ccode>RangeSet\u003c/code>，代表一组不连续的下标。可以用它一次性读取、移动或删除这些元素。","flag":"","se":[{"id":"SE-0270","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0270-rangeset-and-collection-operations.md","title":"Add Collection Operations on Noncontiguous Elements"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"var todo = [\"写周报\", \"修 bug\", \"开会\", \"代码评审\", \"喝咖啡\", \"修 crash\"]\n\nlet urgent = todo.indices(where: { $0.hasPrefix(\"修\") })\nprint(todo[urgent].map { $0 })              // 不连续的“切片”\n\n_ = todo.moveSubranges(urgent, to: 0)       // 把它们一起挪到最前面\nprint(todo)\n\ntodo.removeSubranges(todo.indices(where: { $0 == \"喝咖啡\" }))\nprint(todo)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[\"修 bug\", \"修 crash\"]\n[\"修 bug\", \"修 crash\", \"写周报\", \"开会\", \"代码评审\", \"喝咖啡\"]\n[\"修 bug\", \"修 crash\", \"写周报\", \"开会\", \"代码评审\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"int128","release":"6.0","since":"6.0","title":"\u003ccode>Int128\u003c/code> 与 \u003ccode>UInt128\u003c/code>","plainTitle":"Int128 与 UInt128","en":"128-bit integer types","line":4,"level":"brief","short":"Int128","tags":"Int128 UInt128 整数 大数 128位","tldr":"标准库新增 128 位整数类型，四则运算、位运算、\u003ccode>Codable\u003c/code> 一应俱全，适合高精度计时、哈希和金融计算。","flag":"","se":[{"id":"SE-0425","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0425-int128.md","title":"128-bit Integer Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let nanosPerYear = Int128(365 * 24 * 3600) * 1_000_000_000\nprint(nanosPerYear * 10_000)          // 一万年的纳秒数，Int64 装不下\nprint(UInt128.max)\nprint(MemoryLayout\u003cInt128>.size)      // 16 字节","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"315360000000000000000\n340282366920938463463374607431768211455\n16","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"pack-iteration","release":"6.0","since":"6.0","title":"参数包遍历：\u003ccode>for … in repeat each\u003c/code>","plainTitle":"参数包遍历：for … in repeat each","en":"Pack iteration","line":3,"level":"brief","short":"参数包遍历","tags":"parameter pack variadic generics repeat each 可变参数 泛型","tldr":"Swift 5.9 引入了参数包（可变数量的泛型参数），但只能在表达式里“展开”。Swift 6.0 允许直接用 \u003ccode>for-in\u003c/code> 遍历一个参数包。","flag":"","se":[{"id":"SE-0408","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0408-pack-iteration.md","title":"Pack Iteration"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"func allEqual\u003ceach T: Equatable>(_ lhs: repeat each T, to rhs: repeat each T) -> Bool {\n    for (left, right) in repeat (each lhs, each rhs) {\n        guard left == right else { return false }\n    }\n    return true\n}\n\nprint(allEqual(1, \"a\", 2.5, to: 1, \"a\", 2.5))   // 三个参数，类型各不相同\nprint(allEqual(true, to: false))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true\nfalse","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"注意参数包之后的参数必须带标签（这里是 \u003ccode>to:\u003c/code>），否则编译器无法区分两个包的边界。"}]},{"id":"retroactive","release":"6.0","since":"6.0","title":"\u003ccode>@retroactive\u003c/code>：“别人的类型 + 别人的协议”要打个招呼","plainTitle":"@retroactive：“别人的类型 + 别人的协议”要打个招呼","en":"Warning for retroactive conformances","line":3,"level":"brief","short":"@retroactive","tags":"retroactive conformance extension 一致性 追溯","tldr":"给一个\u003cstrong>别的模块\u003c/strong>的类型添加对\u003cstrong>别的模块\u003c/strong>协议的遵循，以后对方自己也加上时就会冲突。Swift 6 会对此发出警告，要求你用 \u003ccode>@retroactive\u003c/code> 表明“我知道风险”。","flag":"","se":[{"id":"SE-0364","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0364-retroactive-conformance-warning.md","title":"Warning for Retroactive Conformances of External Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"给标准库的 Int 加上标准库的 Identifiable","code":"extension Int: Identifiable {\n    public var id: Int { self }\n}","hl":"","check":"warning","flags":"-swift-version 6","result":{"status":"warning","diagnostics":"main.swift:1:1: warning: extension declares a conformance of imported type 'Int' to imported protocol 'Identifiable'; this will not behave correctly if the owners of 'Swift' introduce this conformance in the future\n1 | extension Int: Identifiable {\n  | |- warning: extension declares a conformance of imported type 'Int' to imported protocol 'Identifiable'; this will not behave correctly if the owners of 'Swift' introduce this conformance in the future\n  | `- note: add '@retroactive' to silence this warning\n2 |     public var id: Int { self }\n3 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"明确表示这是有意为之","code":"extension Int: @retroactive Identifiable {\n    public var id: Int { self }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"import-access","release":"6.0","since":"6.0","title":"\u003ccode>import\u003c/code> 也能写访问级别","plainTitle":"import 也能写访问级别","en":"Access-level modifiers on import declarations","line":3,"level":"brief","short":"internal import","tags":"import access level internal public private 依赖 模块","tldr":"\u003ccode>internal import Foo\u003c/code> 表示 Foo 只是本模块的实现细节，不会泄露给使用者；如果 public API 用到了它的类型，编译器会报错提醒。","flag":"InternalImportsByDefault","se":[{"id":"SE-0409","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0409-access-level-on-imports.md","title":"Access-level modifiers on import declarations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"内部导入的类型不能出现在 public API 里","code":"internal import Foundation\n\npublic func today() -> Date {\n    Date()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:3:13: error: function cannot be declared public because its result uses an internal type\n1 | internal import Foundation\n  |          `- note: struct 'Date' imported as 'internal' from 'Foundation' here\n2 | \n3 | public func today() -> Date {\n  |             |- error: function cannot be declared public because its result uses an internal type\n  |             `- note: struct 'Date' is imported by this file as 'internal' from 'Foundation'\n4 |     Date()\n5 | }\n\nFoundation.Date:2:15: note: type declared here\n 1 | @available(macOS 10.10, iOS 8.0, watchOS 2.0, tvOS 9.0, *)\n 2 | public struct Date : Comparable, Hashable, Equatable, Sendable {\n   |               `- note: type declared here\n 3 |     public static let timeIntervalBetween1970AndReferenceDate: Double\n 4 |     public static var timeIntervalSinceReferenceDate: TimeInterval { get }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"在 Swift 6 模式下，\u003ccode>import\u003c/code> 默认仍然相当于 \u003ccode>public import\u003c/code>。开启 upcoming feature \u003ccode>InternalImportsByDefault\u003c/code> 后，默认会变成 \u003ccode>internal\u003c/code>，这是未来语言模式的方向。"}]},{"id":"swift-testing","release":"6.0","since":"6.0","title":"Swift Testing：新一代测试框架","plainTitle":"Swift Testing：新一代测试框架","en":"Swift Testing","line":6,"level":"key","short":"Swift Testing","tags":"Swift Testing @Test #expect #require 单元测试 unit test 参数化 parameterized XCTest","tldr":"随 Swift 6 工具链发布的开源测试框架：用 \u003ccode>@Test\u003c/code> 标记测试、用 \u003ccode>#expect\u003c/code> 断言，原生支持参数化测试、并行执行和标签，可以和 XCTest 在同一个 target 里共存。","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"@Test、#expect 与参数化测试","code":"import Testing\n\nstruct Calculator {\n    func add(_ a: Int, _ b: Int) -> Int { a + b }\n}\n\n@Suite(\"计算器\")\nstruct CalculatorTests {\n    let calc = Calculator()\n\n    @Test(\"两个正数相加\")\n    func addPositive() {\n        #expect(calc.add(2, 3) == 5)\n    }\n\n    @Test(\"加法满足交换律\", arguments: [(1, 2), (10, -3), (0, 0)])\n    func commutative(a: Int, b: Int) {\n        #expect(calc.add(a, b) == calc.add(b, a))\n    }\n\n    @Test func parse() throws {\n        let n = try #require(Int(\"42\"))     // 失败就立即结束这个测试\n        #expect(n == 42)\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 （链接 Swift Testing） main.swift"}},{"type":"list","items":["\u003ccode>#expect\u003c/code> 失败时，会展示表达式里每个子表达式的值，比 \u003ccode>XCTAssertEqual\u003c/code> 直观得多。","参数化测试的每组参数都是独立的测试用例，可以单独重跑。","后续版本一路增强：\u003ca href=\"#f-testing-61\">6.1\u003c/a> 的作用域特性、\u003ca href=\"#f-testing-62\">6.2\u003c/a> 的退出测试与附件、\u003ca href=\"#f-testing-63\">6.3\u003c/a> 的警告和取消、\u003ca href=\"#f-testing-64\">6.4\u003c/a> 与 XCTest 互通。"]}]},{"id":"debug-description","release":"6.0","since":"6.0","title":"\u003ccode>@DebugDescription\u003c/code>：让调试器显示你想看的摘要","plainTitle":"@DebugDescription：让调试器显示你想看的摘要","en":"DebugDescription macro","line":6,"level":"brief","short":"@DebugD
