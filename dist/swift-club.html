)\nprint(cache.size(for: \"avatar.png\") ?? 0)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1024","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Atomic: a lock-free counter","code":"import Synchronization\n\nfinal class Stats: Sendable {\n    let visits = Atomic\u003cInt>(0)\n}\n\nlet stats = Stats()\nawait withTaskGroup { group in\n    for _ in 0..\u003c100 {\n        group.addTask { stats.visits.add(1, ordering: .relaxed) }\n    }\n}\nprint(stats.visits.load(ordering: .relaxed))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"100","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>Mutex\u003c/code> and \u003ccode>Atomic\u003c/code> are both \u003ccode>~Copyable\u003c/code> (noncopyable) types: store them in \u003ccode>let\u003c/code> properties and access them by borrowing, so you can't accidentally copy out a second lock.","They need the runtime that ships with macOS 15, iOS 18, and so on.","Actors are still the first thing to consider in most cases; \u003ccode>Mutex\u003c/code> fits better in synchronous code, in performance-sensitive paths, or where you don't want to introduce an \u003ccode>await\u003c/code>."]}]},{"id":"isolation-inherit","release":"6.0","since":"6.0","title":"\u003ccode>#isolation\u003c/code>: let a function inherit the caller's isolation","plainTitle":"#isolation: let a function inherit the caller's isolation","en":"","line":1,"level":"brief","short":"#isolation","tags":"isolation isolated parameter inherit actor isolated(any)","tldr":"Add an \u003ccode>isolated (any Actor)? = #isolation\u003c/code> parameter to an async function and it runs on the caller's actor, so it can safely work with the caller's non-\u003ccode>Sendable\u003c/code> state.","flag":"","se":[{"id":"SE-0420","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0420-inheritance-of-actor-isolation.md","title":"Inheritance of actor isolation"},{"id":"SE-0431","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0431-isolated-any-functions.md","title":"`@isolated(any)` Function Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"A timing helper that “follows the caller”","code":"func measure\u003cT>(\n    _ label: String,\n    isolation: isolated (any Actor)? = #isolation,\n    _ body: () async throws -> T\n) async rethrows -> T {\n    let start = ContinuousClock.now\n    defer { print(label, ContinuousClock.now - start) }\n    return try await body()\n}\n\n@MainActor\nfinal class Feed {\n    var items: [String] = []\n\n    func reload() async {\n        await measure(\"reload\") {\n            items = [\"News A\", \"News B\"]   // measure and the closure both run on the main actor\n        }\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"This spelling is a bit verbose. In Swift 6.2, \u003ca href=\"#f-nonsending\">\u003ccode>nonisolated(nonsending)\u003c/code>\u003c/a> makes “async functions inherit the caller's isolation” the default behavior, so most of the time you no longer need to write this parameter by hand. The same release also adds the \u003ccode>@isolated(any)\u003c/code> function type, which lets whoever holds a closure query its isolation (the \u003ccode>Task\u003c/code> initializers use it)."}]},{"id":"typed-throws","release":"6.0","since":"6.0","title":"Typed throws: \u003ccode>throws(E)\u003c/code>","plainTitle":"Typed throws: throws(E)","en":"","line":3,"level":"core","short":"Typed throws","tags":"typed throws error handling catch Never rethrows","tldr":"A function can declare that it only throws one kind of error: \u003ccode>throws(ParseError)\u003c/code>. The caller's \u003ccode>catch\u003c/code> receives a \u003ccode>ParseError\u003c/code> directly, can \u003ccode>switch\u003c/code> over it exhaustively, and no longer has to guess the type with \u003ccode>as?\u003c/code>.","flag":"","se":[{"id":"SE-0413","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0413-typed-throws.md","title":"Typed throws"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Before: the catch only sees any Error","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws -> Int {\n    guard !text.isEmpty else { throw ParseError.empty }\n    guard let n = Int(text) else { throw ParseError.notANumber(text) }\n    return n\n}\n\ndo {\n    _ = try parseAge(\"eighteen\")\n} catch let error as ParseError {     // you have to cast the type yourself\n    print(\"Parse failed:\", error)\n} catch {\n    print(\"Can't happen, but the compiler requires a fallback:\", error)\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Parse failed: notANumber(\"eighteen\")","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Now: throws(ParseError)","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws(ParseError) -> Int {\n    guard !text.isEmpty else { throw .empty }        // the type name can be omitted\n    guard let n = Int(text) else { throw .notANumber(text) }\n    return n\n}\n\ndo throws(ParseError) {                              // state the error type this do block throws\n    _ = try parseAge(\"eighteen\")\n} catch {\n    switch error {                                   // error's type is ParseError\n    case .empty: print(\"Please enter an age\")\n    case .notANumber(let s): print(\"“\\(s)” is not a number\")\n    }\n}","hl":"6,12-13,15-18","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"“eighteen” is not a number","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Note \u003ccode>do throws(ParseError)\u003c/code>: it tells the compiler directly that this \u003ccode>do\u003c/code> block throws \u003ccode>ParseError\u003c/code>. In ordinary functions and top-level code you can omit this annotation as long as the only error thrown inside the \u003ccode>do\u003c/code> is \u003ccode>ParseError\u003c/code>; the compiler infers it. \u003cstrong>In closures it doesn't\u003c/strong>: the braces of \u003ccode>Task { }\u003c/code> are a closure, and so are the braces of \u003ccode>#Playground { }\u003c/code> in an Xcode Playground. If you leave it out there, the \u003ccode>error\u003c/code> in the \u003ccode>catch\u003c/code> falls back to \u003ccode>any Error\u003c/code>:"},{"type":"code","lang":"swift","title":"Leaving out throws(ParseError) inside a closure","code":"enum ParseError: Error {\n    case empty\n    case notANumber(String)\n}\n\nfunc parseAge(_ text: String) throws(ParseError) -> Int {\n    guard !text.isEmpty else { throw .empty }\n    guard let n = Int(text) else { throw .notANumber(text) }\n    return n\n}\n\nTask {\n    do {                                             // throws(ParseError) is missing\n        _ = try parseAge(\"eighteen\")\n    } catch {\n        switch error {                               // error here is any Error\n        case .empty: print(\"Please enter an age\")\n        case .notANumber(let s): print(\"“\\(s)” is not a number\")\n        }\n    }\n}","hl":"13,16","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:17:15: error: type 'any Error' has no member 'empty'\n15 |     } catch {\n16 |         switch error {                               // error here is any Error\n17 |         case .empty: print(\"Please enter an age\")\n   |               `- error: type 'any Error' has no member 'empty'\n18 |         case .notANumber(let s): print(\"“\\(s)” is not a number\")\n19 |         }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"So the safest style is to always write \u003ccode>do throws(ParseError)\u003c/code>: it compiles inside functions, closures, and Playgrounds alike."},{"type":"p","html":"Typed throws is especially handy with generics: the error type can be passed along as a generic parameter, which is more precise than \u003ccode>rethrows\u003c/code>. When you pass a closure that doesn't throw, \u003ccode>E\u003c/code> is inferred as \u003ccode>Never\u003c/code>, and the caller doesn't even need to write \u003ccode>try\u003c/code>:"},{"type":"code","lang":"swift","title":"Passing the error type through generics","code":"extension Sequence {\n    func myMap\u003cT, E: Error>(_ transform: (Element) throws(E) -> T) throws(E) -> [T] {\n        var result: [T] = []\n        for x in self { result.append(try transform(x)) }\n        return result\n    }\n}\n\nlet doubled = [1, 2, 3].myMap { $0 * 2 }   // E == Never: no try needed\nprint(doubled)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[2, 4, 6]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>throws\u003c/code> is equivalent to \u003ccode>throws(any Error)\u003c/code>; \u003ccode>throws(Never)\u003c/code> is equivalent to not throwing.","Good for: code inside a module, embedded environments (avoiding the cost of existentials), and cases where the set of errors really is closed.","Use it carefully in public APIs: the error type becomes part of the API contract, so adding a new kind of error later is a breaking change. The proposal itself also recommends plain \u003ccode>throws\u003c/code> in most cases."]},{"type":"quiz","question":"Which declaration is \u003ccode>func load() throws(Never) -&gt; Data\u003c/code> equivalent to?","options":["\u003ccode>func load() throws -&gt; Data\u003c/code>","\u003ccode>func load() -&gt; Data\u003c/code>","\u003ccode>func load() rethrows -&gt; Data\u003c/code>"],"answer":1,"explain":"\u003ccode>Never\u003c/code> has no values, so the function can never throw. It is just an ordinary non-throwing function, and callers don't need \u003ccode>try\u003c/code> either."}]},{"id":"noncopyable-generics","release":"6.0","since":"6.0","title":"Noncopyable types meet generics: \u003ccode>~Copyable\u003c/code>","plainTitle":"Noncopyable types meet generics: ~Copyable","en":"","line":2,"level":"core","short":"~Copyable generics","tags":"noncopyable move-only ~Copyable consuming borrowing ownership deinit Optional","tldr":"Swift 5.9 already had noncopyable structs, but they could barely be used with generics, protocols, or \u003ccode>Optional\u003c/code>. Swift 6 lets generic parameters, protocols, and extensions drop the “copyable by default” assumption, and the standard library's \u003ccode>Optional\u003c/code>, \u003ccode>Result\u003c/code>, and pointer types support noncopyable types too.","flag":"","se":[{"id":"SE-0427","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0427-noncopyable-generics.md","title":"Noncopyable Generics"},{"id":"SE-0429","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0429-partial-consumption.md","title":"Partial consumption of noncopyable values"},{"id":"SE-0432","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0432-noncopyable-switch.md","title":"Borrowing and consuming pattern matching for noncopyable types"},{"id":"SE-0437","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0437-noncopyable-stdlib-primitives.md","title":"Noncopyable Standard Library Primitives"}],"links":[],"blocks":[{"type":"p","html":"Every type in Swift is \u003ccode>Copyable\u003c/code> by default: you can copy it freely when you assign or pass it. Writing \u003ccode>~Copyable\u003c/code> means “don't assume I can be copied”. That is ideal for expressing a \u003cstrong>unique resource\u003c/strong>: a ticket can be punched only once, and a file handle can be closed only once."},{"type":"code","lang":"swift","title":"A ticket that can't be photocopied","code":"struct Ticket: ~Copyable {\n    let id: Int\n\n    consuming func punch() {          // consuming: after the call, this ticket is “used up”\n        print(\"Ticket #\\(id) punched\")\n    }\n\n    deinit { print(\"Ticket #\\(id) recycled\") }\n}\n\nfunc ride() {\n    let ticket = Ticket(id: 7)\n    ticket.punch()\n}\nride()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Ticket #7 punched\nTicket #7 recycled","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Want to use it twice? The compiler says no","code":"struct Ticket: ~Copyable {\n    let id: Int\n    consuming func punch() {\n        print(\"Ticket #\\(id) punched\")\n    }\n}\n\nfunc ride() {\n    let ticket = Ticket(id: 7)\n    ticket.punch()\n    ticket.punch()\n}","hl":"10,11","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:9: error: 'ticket' consumed more than once\n 7 | \n 8 | func ride() {\n 9 |     let ticket = Ticket(id: 7)\n   |         `- error: 'ticket' consumed more than once\n10 |     ticket.punch()\n   |     `- note: consumed here\n11 |     ticket.punch()\n   |     `- note: consumed again here\n12 | }\n13 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"The key advance in Swift 6: generics can accept noncopyable types now. The \u003ccode>Wallet\u003c/code> below can hold ordinary values as well as a \u003ccode>Ticket\u003c/code>:"},{"type":"code","lang":"swift","title":"A generic container holding a noncopyable value","code":"struct Ticket: ~Copyable {\n    let id: Int\n}\n\nstruct Wallet\u003cItem: ~Copyable>: ~Copyable {\n    var item: Item?\n\n    mutating func take() -> Item? {\n        item.take()                      // Optional now supports noncopyable Wrapped types too\n    }\n}\n\nextension Wallet: Copyable where Item: Copyable {}   // when it holds something copyable, the wallet can be copied too\n\nvar wallet = Wallet(item: Ticket(id: 42))\nif let t = wallet.take() {\n    print(\"Took out ticket #\\(t.id)\")\n}\nprint(wallet.item == nil)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Took out ticket #42\ntrue","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"list","items":["\u003ccode>~Copyable\u003c/code> means “\u003cstrong>not guaranteed\u003c/strong> to be copyable”, not “guaranteed not copyable”: \u003ccode>Wallet&lt;Int&gt;\u003c/code> can still be copied.","Parameter ownership modifiers: \u003ccode>borrowing\u003c/code> (read-only borrow), \u003ccode>consuming\u003c/code> (take ownership), and \u003ccode>inout\u003c/code> (exclusive mutation).","The same release also supports partial consumption (taking just one field out of a struct) and borrowing \u003ccode>switch\u003c/code> matches on noncopyable enums.","This is the foundation for \u003ccode>Span\u003c/code>, \u003ccode>InlineArray\u003c/code>, \u003ccode>UniqueArray\u003c/code>, \u003ccode>Continuation\u003c/code>, and other features that follow. Try it hands-on: \u003ca href=\"#lab-ownership\">Ownership Sandbox\u003c/a>."]},{"type":"quiz","question":"Which statement about \u003ccode>struct Box&lt;T: ~Copyable&gt;: ~Copyable\u003c/code> is correct?","options":["\u003ccode>Box&lt;Int&gt;\u003c/code> must also be noncopyable","\u003ccode>T\u003c/code> can be a copyable type or a noncopyable type","\u003ccode>T\u003c/code> must be a noncopyable type"],"answer":1,"explain":"\u003ccode>~Copyable\u003c/code> removes the “must be copyable by default” constraint; it doesn't require the type to be noncopyable. Combined with \u003ccode>extension Box: Copyable where T: Copyable {}\u003c/code>, \u003ccode>Box&lt;Int&gt;\u003c/code> can be copied."}]},{"id":"count-where","release":"6.0","since":"6.0","title":"\u003ccode>count(where:)\u003c/code>","plainTitle":"count(where:)","en":"","line":4,"level":"brief","short":"count(where:)","tags":"count where filter counting sequence","tldr":"Count the elements that satisfy a condition, without first \u003ccode>filter\u003c/code>ing into a temporary array and taking its \u003ccode>count\u003c/code>.","flag":"","se":[{"id":"SE-0220","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0220-count-where.md","title":"`count(where:)`"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let scores = [88, 92, 59, 73, 100, 45]\n\nprint(scores.filter { $0 >= 60 }.count)     // before: creates a temporary array\nprint(scores.count(where: { $0 >= 60 }))    // now: a single pass, no allocation","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"4\n4","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"This proposal (\u003ca class=\"se-link\" href=\"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0220-count-where.md\" target=\"_blank\" rel=\"noopener\">SE-0220\u003c/a>) was accepted back in 2018, but it was shelved over type-checker performance problems and only actually landed in Swift 6.0."}]},{"id":"rangeset","release":"6.0","since":"6.0","title":"\u003ccode>RangeSet\u003c/code>: operate on a non-contiguous set of elements","plainTitle":"RangeSet: operate on a non-contiguous set of elements","en":"","line":4,"level":"brief","short":"RangeSet","tags":"RangeSet indices subranges non-contiguous batch move remove","tldr":"\u003ccode>indices(where:)\u003c/code> returns a \u003ccode>RangeSet\u003c/code>, which represents a set of non-contiguous indices. You can use it to read, move, or remove those elements in one go.","flag":"","se":[{"id":"SE-0270","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0270-rangeset-and-collection-operations.md","title":"Add Collection Operations on Noncontiguous Elements"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"var todo = [\"Write weekly report\", \"Fix bug\", \"Meeting\", \"Code review\", \"Coffee\", \"Fix crash\"]\n\nlet urgent = todo.indices(where: { $0.hasPrefix(\"Fix\") })\nprint(todo[urgent].map { $0 })              // a non-contiguous “slice”\n\n_ = todo.moveSubranges(urgent, to: 0)       // move them all to the front\nprint(todo)\n\ntodo.removeSubranges(todo.indices(where: { $0 == \"Coffee\" }))\nprint(todo)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"[\"Fix bug\", \"Fix crash\"]\n[\"Fix bug\", \"Fix crash\", \"Write weekly report\", \"Meeting\", \"Code review\", \"Coffee\"]\n[\"Fix bug\", \"Fix crash\", \"Write weekly report\", \"Meeting\", \"Code review\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"int128","release":"6.0","since":"6.0","title":"\u003ccode>Int128\u003c/code> and \u003ccode>UInt128\u003c/code>","plainTitle":"Int128 and UInt128","en":"","line":4,"level":"brief","short":"Int128","tags":"Int128 UInt128 integer big number 128-bit","tldr":"The standard library adds 128-bit integer types with full arithmetic, bitwise operations, and \u003ccode>Codable\u003c/code>, suited to high-precision timing, hashing, and financial calculations.","flag":"","se":[{"id":"SE-0425","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0425-int128.md","title":"128-bit Integer Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let nanosPerYear = Int128(365 * 24 * 3600) * 1_000_000_000\nprint(nanosPerYear * 10_000)          // nanoseconds in ten thousand years; doesn't fit in Int64\nprint(UInt128.max)\nprint(MemoryLayout\u003cInt128>.size)      // 16 bytes","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"315360000000000000000\n340282366920938463463374607431768211455\n16","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"pack-iteration","release":"6.0","since":"6.0","title":"Parameter pack iteration: \u003ccode>for … in repeat each\u003c/code>","plainTitle":"Parameter pack iteration: for … in repeat each","en":"","line":3,"level":"brief","short":"Pack iteration","tags":"parameter pack variadic generics repeat each","tldr":"Swift 5.9 introduced parameter packs (a variable number of generic parameters), but they could only be “expanded” in expressions. Swift 6.0 lets you iterate over a pack directly with \u003ccode>for-in\u003c/code>.","flag":"","se":[{"id":"SE-0408","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0408-pack-iteration.md","title":"Pack Iteration"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"func allEqual\u003ceach T: Equatable>(_ lhs: repeat each T, to rhs: repeat each T) -> Bool {\n    for (left, right) in repeat (each lhs, each rhs) {\n        guard left == right else { return false }\n    }\n    return true\n}\n\nprint(allEqual(1, \"a\", 2.5, to: 1, \"a\", 2.5))   // three arguments, each of a different type\nprint(allEqual(true, to: false))","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"true\nfalse","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Note that parameters after a parameter pack must have labels (\u003ccode>to:\u003c/code> here); otherwise the compiler can't tell where one pack ends and the next begins."}]},{"id":"retroactive","release":"6.0","since":"6.0","title":"\u003ccode>@retroactive\u003c/code>: “someone else's type + someone else's protocol” deserves a heads-up","plainTitle":"@retroactive: “someone else's type + someone else's protocol” deserves a heads-up","en":"","line":3,"level":"brief","short":"@retroactive","tags":"retroactive conformance extension retroactive conformance warning","tldr":"Adding a conformance of a type from \u003cstrong>another module\u003c/strong> to a protocol from \u003cstrong>another module\u003c/strong> will clash when its owners later add it themselves. Swift 6 warns about this and asks you to write \u003ccode>@retroactive\u003c/code> to say “I know the risk”.","flag":"","se":[{"id":"SE-0364","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0364-retroactive-conformance-warning.md","title":"Warning for Retroactive Conformances of External Types"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Adding the standard library's Identifiable to the standard library's Int","code":"extension Int: Identifiable {\n    public var id: Int { self }\n}","hl":"","check":"warning","flags":"-swift-version 6","result":{"status":"warning","diagnostics":"main.swift:1:1: warning: extension declares a conformance of imported type 'Int' to imported protocol 'Identifiable'; this will not behave correctly if the owners of 'Swift' introduce this conformance in the future\n1 | extension Int: Identifiable {\n  | |- warning: extension declares a conformance of imported type 'Int' to imported protocol 'Identifiable'; this will not behave correctly if the owners of 'Swift' introduce this conformance in the future\n  | `- note: add '@retroactive' to silence this warning\n2 |     public var id: Int { self }\n3 | }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Making it explicit that this is intentional","code":"extension Int: @retroactive Identifiable {\n    public var id: Int { self }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"import-access","release":"6.0","since":"6.0","title":"\u003ccode>import\u003c/code> can carry an access level too","plainTitle":"import can carry an access level too","en":"","line":3,"level":"brief","short":"internal import","tags":"import access level internal public private dependency module","tldr":"\u003ccode>internal import Foo\u003c/code> says that Foo is just an implementation detail of this module and won't leak to its clients; if a public API uses its types, the compiler reports an error.","flag":"InternalImportsByDefault","se":[{"id":"SE-0409","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0409-access-level-on-imports.md","title":"Access-level modifiers on import declarations"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"A type from an internal import can't appear in a public API","code":"internal import Foundation\n\npublic func today() -> Date {\n    Date()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:3:13: error: function cannot be declared public because its result uses an internal type\n1 | internal import Foundation\n  |          `- note: struct 'Date' imported as 'internal' from 'Foundation' here\n2 | \n3 | public func today() -> Date {\n  |             |- error: function cannot be declared public because its result uses an internal type\n  |             `- note: struct 'Date' is imported by this file as 'internal' from 'Foundation'\n4 |     Date()\n5 | }\n\nFoundation.Date:2:15: note: type declared here\n 1 | @available(macOS 10.10, iOS 8.0, watchOS 2.0, tvOS 9.0, *)\n 2 | public struct Date : Comparable, Hashable, Equatable, Sendable {\n   |               `- note: type declared here\n 3 |     public static let timeIntervalBetween1970AndReferenceDate: Double\n 4 |     public static var timeIntervalSinceReferenceDate: TimeInterval { get }","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"In Swift 6 mode, \u003ccode>import\u003c/code> still means \u003ccode>public import\u003c/code> by default. With the upcoming feature \u003ccode>InternalImportsByDefault\u003c/code> turned on, the default becomes \u003ccode>internal\u003c/code>, which is the direction of future language modes."}]},{"id":"swift-testing","release":"6.0","since":"6.0","title":"Swift Testing: the next-generation test framework","plainTitle":"Swift Testing: the next-generation test framework","en":"","line":6,"level":"key","short":"Swift Testing","tags":"Swift Testing @Test #expect #require unit test parameterized XCTest","tldr":"An open-source test framework shipped with the Swift 6 toolchain. Mark tests with \u003ccode>@Test\u003c/code> and assert with \u003ccode>#expect\u003c/code>; it supports parameterized tests, parallel execution, and tags natively, and can live alongside XCTest in the same target.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"@Test, #expect, and parameterized tests","code":"import Testing\n\nstruct Calculator {\n    func add(_ a: Int, _ b: Int) -> Int { a + b }\n}\n\n@Suite(\"Calculator\")\nstruct CalculatorTests {\n    let calc = Calculator()\n\n    @Test(\"Adding two positive numbers\")\n    func addPositive() {\n        #expect(calc.add(2, 3) == 5)\n    }\n\n    @Test(\"Addition is commutative\", arguments: [(1, 2), (10, -3), (0, 0)])\n    func commutative(a: Int, b: Int) {\n        #expect(calc.add(a, b) == calc.add(b, a))\n    }\n\n    @Test func parse() throws {\n        let n = try #require(Int(\"42\"))     // if this fails, the test ends immediately\n        #expect(n == 42)\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}},{"type":"list","items":["When \u003ccode>#expect\u003c/code> fails, it shows the value of every sub-expression, which is far more informative than \u003ccode>XCTAssertEqual\u003c/code>.","Each set of arguments in a parameterized test is an independent test case that can be rerun on its own.","It kept improving release after release: \u003ca href=\"#f-testing-61\">6.1\u003c/a>'s scoping traits, \u003ca href=\"#f-testing-62\">6.2\u003c/a>'s exit tests and attachments, \u003ca href=\"#f-testing-63\">6.3\u003c/a>'s warnings and cancellation, and \u003ca href=\"#f-testing-64\">6.4\u003c/a>'s interoperability with XCTest."]}]},{"id":"debug-description","release":"6.0","since":"6.0","title":"\u003ccode>@DebugDescription\u003c/code>: make the debugger show the summary you want","plainTitle":"@DebugDescription: make the debugger show the summary you want","en":"","line":6,"level":"brief","short":"@DebugDescription","tags":"debug LLDB debugging debugDescription macro","tldr":"Add the \u003ccode>@DebugDescription\u003c/code> macro to a type and LLDB shows your summary directly in the variables view and in crash reports, without running any code.","flag":"","se":[{"id":"SE-0440","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0440-debug-description-macro.md","title":"DebugDescription Macro"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"@DebugDescription\nstruct Order: CustomDebugStringConvertible {\n    var id: Int\n    var total: Double\n\n    var debugDescription: String { \"Order #\\(id): $\\(total)\" }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"The macro compiles \u003ccode>debugDescription\u003c/code> into an LLDB summary format and embeds it in the binary, so it can only use simple string interpolation (of stored properties), not arbitrary function calls."}]},{"id":"platform-60","release":"6.0","since":"6.0","title":"Unified Foundation, the static Linux SDK, and Embedded Swift","plainTitle":"Unified Foundation, the static Linux SDK, and Embedded Swift","en":"","line":5,"level":"brief","short":"Cross-platform base","tags":"Foundation Linux static Embedded embedded cross-platform musl","tldr":"Starting with Swift 6, all platforms share one Foundation, rewritten in Swift. The new static Linux SDK can build fully statically linked executables with no dependencies, and the experimental Embedded Swift can produce very small binaries for microcontrollers.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# build an executable that depends on no system libraries, using the static Linux SDK\nswift build --swift-sdk x86_64-swift-linux-musl","hl":"","check":"none"},{"type":"p","html":"These three things look unrelated, but they laid the groundwork for “Swift runs everywhere” over the next two years: WebAssembly in 6.2, the official Android SDK in 6.3, and existential support for embedded in 6.4."}]},{"id":"nonisolated-types","release":"6.1","since":"6.1","title":"\u003ccode>nonisolated\u003c/code> can modify types and extensions","plainTitle":"nonisolated can modify types and extensions","en":"","line":1,"level":"key","short":"nonisolated types","tags":"nonisolated extension MainActor inference protocol conformance prevent global actor inference","tldr":"Until now \u003ccode>nonisolated\u003c/code> could only go on a single property or method. Now it can go on a whole \u003ccode>extension\u003c/code>, freeing every member inside it from actor isolation at once; on a type, it also stops the compiler from inferring a global actor automatically.","flag":"","se":[{"id":"SE-0449","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0449-nonisolated-for-global-actor-cutoff.md","title":"Allow `nonisolated` to prevent global actor inference"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Before: every member needs its own nonisolated","code":"@MainActor\nstruct Product {\n    var name: String\n    var price: Double\n}\n\nextension Product: CustomStringConvertible, Equatable {\n    nonisolated var description: String { \"\\(name) $\\(price)\" }\n    nonisolated static func == (a: Product, b: Product) -> Bool { a.name == b.name }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.1: one nonisolated extension does it","code":"@MainActor\nstruct Product {\n    var name: String\n    var price: Double\n}\n\nnonisolated extension Product: CustomStringConvertible, Equatable {\n    var description: String { \"\\(name) $\\(price)\" }\n    static func == (a: Product, b: Product) -> Bool { a.name == b.name }\n}","hl":"7","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"Another use is blocking “isolation inference”. A type that conforms to a \u003ccode>@MainActor\u003c/code> protocol is automatically inferred to be \u003ccode>@MainActor\u003c/code>, so using it anywhere else needs \u003ccode>await\u003c/code>:"},{"type":"code","lang":"swift","title":"Conforming to a @MainActor protocol: the type is quietly inferred as main-actor isolated","code":"@MainActor protocol Screen {}\n\nstruct Settings: Screen {\n    var theme = \"dark\"\n    func export() -> String { theme }\n}\n\nfunc backup(_ s: Settings) -> String {\n    s.export()\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:7: error: call to main actor-isolated instance method 'export()' in a synchronous nonisolated context [#ActorIsolatedCall]\n 3 | struct Settings: Screen {\n 4 |     var theme = \"dark\"\n 5 |     func export() -> String { theme }\n   |          |- note: calls to instance method 'export()' from outside of its actor context are implicitly asynchronous\n   |          `- note: main actor isolation inferred from conformance to protocol 'Screen'\n 6 | }\n 7 | \n 8 | func backup(_ s: Settings) -> String {\n   |      `- note: add '@MainActor' to make global function 'backup' part of global actor 'MainActor'\n 9 |     s.export()\n   |       `- error: call to main actor-isolated instance method 'export()' in a synchronous nonisolated context [#ActorIsolatedCall]\n10 | }\n11 | \n\n[#ActorIsolatedCall]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/actor-isolated-call>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Refusing the inference explicitly with a nonisolated struct","code":"@MainActor protocol Screen {}\n\nnonisolated struct Settings: Screen {\n    var theme = \"dark\"\n    func export() -> String { theme }\n}\n\nfunc backup(_ s: Settings) -> String {\n    s.export()\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"taskgroup-infer","release":"6.1","since":"6.1","title":"Task groups infer their result type","plainTitle":"Task groups infer their result type","en":"","line":1,"level":"brief","short":"TaskGroup inference","tags":"withTaskGroup TaskGroup inference of: child task","tldr":"The \u003ccode>of:\u003c/code> in \u003ccode>withTaskGroup(of: Int.self)\u003c/code> can now be omitted; the compiler infers the child tasks' result type from the closure passed to \u003ccode>addTask\u003c/code>.","flag":"","se":[{"id":"SE-0442","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0442-allow-taskgroup-childtaskresult-type-to-be-inferred.md","title":"Allow TaskGroup's ChildTaskResult Type To Be Inferred"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Before: of: is required","code":"let total = await withTaskGroup(of: Int.self) { group in\n    for n in 1...5 { group.addTask { n * n } }\n    var sum = 0\n    for await square in group { sum += square }\n    return sum\n}\nprint(total)","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"55","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Now: omit of:","code":"let total = await withTaskGroup { group in\n    for n in 1...5 { group.addTask { n * n } }\n    var sum = 0\n    for await square in group { sum += square }\n    return sum\n}\nprint(total)","hl":"1","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"55","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"By the way, this uses \u003ccode>for await\u003c/code> instead of \u003ccode>group.reduce(0, +)\u003c/code>. Calling a \u003ccode>nonisolated async\u003c/code> method like \u003ccode>reduce\u003c/code> directly on the main actor “sends” the task group to another thread, and in Swift 6 mode that reports \u003ccode>sending 'group' risks causing data races\u003c/code>. That is exactly the problem \u003ca href=\"#f-nonsending\">6.2's nonsending\u003c/a> solves."}]},{"id":"trailing-commas","release":"6.1","since":"6.1","title":"Trailing commas almost everywhere","plainTitle":"Trailing commas almost everywhere","en":"","line":3,"level":"key","short":"Trailing commas","tags":"trailing comma comma parameter list tuple generic capture list diff","tldr":"Array and dictionary literals have always allowed an extra comma after the last element. Swift 6.1 extends that to parameter lists, argument lists, tuples, generic parameter lists, closure capture lists, and string interpolations.","flag":"","se":[{"id":"SE-0439","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0439-trailing-comma-lists.md","title":"Allow trailing comma in comma-separated lists"}],"links":[],"blocks":[{"type":"p","html":"The biggest benefit is cleaner diffs: adding or removing the last parameter changes only one line. Code generators (macros, plugins) also no longer need to treat the last item specially."},{"type":"code","lang":"swift","title":"","code":"func makeLabel(\n    text: String,\n    size: Double,\n    bold: Bool,          // ← parameter list\n) -> String {\n    \"\\(text)·\\(size)·\\(bold)\"\n}\n\nlet label = makeLabel(\n    text: \"Swift\",\n    size: 17,\n    bold: true,          // ← argument list\n)\n\nlet point = (\n    x: 1,\n    y: 2,                // ← tuple\n)\n\nstruct Pair\u003c\n    First,\n    Second,              // ← generic parameter list\n> {}\n\nlet show = { [label, point,] in    // ← capture list\n    print(label, point)\n}\nshow()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Swift·17.0·true (x: 1, y: 2)","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"Condition lists are the exception: \u003ccode>if a, b, { }\u003c/code> is still not allowed, because the trailing comma would make \u003ccode>{\u003c/code> ambiguous."},{"type":"code","lang":"swift","title":"An if condition list can't have a trailing comma","code":"let a = true, b = false\nif a, b, {\n    print(\"not allowed\")\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:4:2: error: expected '{' after 'if' condition\n2 | if a, b, {\n3 |     print(\"not allowed\")\n4 | }\n  |  `- error: expected '{' after 'if' condition\n5 | \n\nmain.swift:2:10: error: function produces expected type 'Bool'; did you mean to call it with '()'?\n1 | let a = true, b = false\n2 | if a, b, {\n  |          `- error: function produces expected type 'Bool'; did you mean to call it with '()'?\n3 |     print(\"not allowed\")\n4 | }\n\nmain.swift:3:5: error: cannot convert value of type '()' to closure result type 'Bool'\n1 | let a = true, b = false\n2 | if a, b, {\n3 |     print(\"not allowed\")\n  |     `- error: cannot convert value of type '()' to closure result type 'Bool'\n4 | }\n5 |","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"metatype-keypaths","release":"6.1","since":"6.1","title":"Metatype key paths: key paths can point at static properties","plainTitle":"Metatype key paths: key paths can point at static properties","en":"","line":3,"level":"brief","short":"Static key paths","tags":"keypath key path static static property metatype","tldr":"Write \u003ccode>\\Theme.Type.accent\u003c/code> to get a key path to a static property, used exactly like a key path to an instance property.","flag":"","se":[{"id":"SE-0438","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0438-metatype-keypath.md","title":"Metatype Keypaths"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Theme {\n    static let accent = \"orange\"\n    static let font = \"SF Pro\"\n}\n\nlet accentPath = \\Theme.Type.accent\nprint(Theme.self[keyPath: accentPath])\n\nlet all: [KeyPath\u003cTheme.Type, String>] = [\\.accent, \\.font]\nprint(all.map { Theme.self[keyPath: $0] })","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"orange\n[\"orange\", \"SF Pro\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"objc-implementation","release":"6.1","since":"6.1","title":"\u003ccode>@objc @implementation\u003c/code>: implement Objective-C classes in Swift","plainTitle":"@objc @implementation: implement Objective-C classes in Swift","en":"","line":5,"level":"key","short":"@implementation","tags":"Objective-C objc implementation mixed-language migration header category","tldr":"Keep the header as it is, and replace the \u003ccode>@implementation\u003c/code> in the \u003ccode>.m\u003c/code> file with a Swift extension marked \u003ccode>@objc @implementation\u003c/code>. A legacy codebase can migrate to Swift one class, one category at a time.","flag":"","se":[{"id":"SE-0436","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0436-objc-implementation.md","title":"Objective-C implementations in Swift"}],"links":[],"blocks":[{"type":"code","lang":"objc","title":"","code":"// the header is unchanged; Objective-C and Swift callers keep working as before\n@interface MyView : NSView\n- (void)reload;\n@end","hl":"","file":"MyView.h","check":"none"},{"type":"code","lang":"swift","title":"MyView.swift: write the implementation in Swift","code":"@objc @implementation\nextension MyView {\n    func reload() {\n        print(\"reload, implemented in Swift\")\n    }\n}","hl":"","check":"none"},{"type":"p","html":"The compiler checks that the Swift implementation matches the declarations in the header one to one: a missing implementation, an extra one, or a mismatched signature is an error. To implement a category, write \u003ccode>@objc(CategoryName) @implementation extension MyView\u003c/code>."}]},{"id":"member-import","release":"6.1","since":"6.1","title":"Member import visibility","plainTitle":"Member import visibility","en":"","line":3,"level":"brief","short":"Member imports","tags":"import visibility extension MemberImportVisibility","tldr":"Until now, if \u003cstrong>any one file\u003c/strong> in a module imported another module, the methods that module adds through extensions were available in \u003cstrong>all files\u003c/strong>. With \u003ccode>MemberImportVisibility\u003c/code> on, only files that actually write the \u003ccode>import\u003c/code> can see those members.","flag":"MemberImportVisibility","se":[{"id":"SE-0444","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0444-member-import-visibility.md","title":"Member import visibility"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"// Another file, A.swift, has import FancyStrings (which extends String with shout())\n\n// Report.swift does not import FancyStrings:\nlet title = \"hello\".shout()\n// before: compiles (quietly depends on another file's import)\n// with MemberImportVisibility on: an error, with a hint to add import FancyStrings","hl":"","file":"Report.swift","check":"none"},{"type":"p","html":"This makes dependencies honest: deleting one file no longer makes another file fail to compile for no obvious reason, and it avoids ambiguity between same-named extension methods from different modules."}]},{"id":"warning-flags","release":"6.1","since":"6.1","title":"Precise control over warnings: \u003ccode>-Werror\u003c/code> and diagnostic groups","plainTitle":"Precise control over warnings: -Werror and diagnostic groups","en":"","line":6,"level":"brief","short":"Warning groups","tags":"warnings -Werror -Wwarning warnings-as-errors diagnostic group","tldr":"It used to be “treat all warnings as errors” or none. Now you can control them \u003cstrong>per diagnostic group\u003c/strong>, for example upgrading every warning to an error except “deprecated API”, which stays a warning.","flag":"","se":[{"id":"SE-0443","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0443-warning-control-flags.md","title":"Precise Control Flags over Compiler Warnings"}],"links":[],"blocks":[{"type":"code","lang":"shell","title":"","code":"# treat all warnings as errors, except “use of a deprecated API”, which stays a warning\nswiftc -warnings-as-errors -Wwarning DeprecatedDeclaration main.swift\n\n# upgrade just one group of warnings to errors\nswiftc -Werror DeprecatedDeclaration main.swift","hl":"","check":"none"},{"type":"p","html":"A group's name is the name in square brackets at the end of a compiler diagnostic. You can see them all over the real compiler output on this site, such as \u003ccode>[#DeprecatedDeclaration]\u003c/code> and \u003ccode>[#RegionIsolation]\u003c/code>, and each group has an official documentation page. From 6.2 SwiftPM can set them too (see \u003ca href=\"#f-swiftpm-62\">6.2\u003c/a>), and 6.4 lets you control them right in source code with \u003ca href=\"#f-diagnose\">\u003ccode>@diagnose\u003c/code>\u003c/a>."}]},{"id":"package-traits","release":"6.1","since":"6.1","title":"SwiftPM package traits","plainTitle":"SwiftPM package traits","en":"","line":6,"level":"key","short":"Package traits","tags":"SwiftPM package traits conditional compilation optional dependencies Embedded WebAssembly","tldr":"A package can declare a number of “traits” that its users turn on or off as needed. Traits control conditional compilation and optional dependencies, so one package can offer different capabilities on servers, embedded devices, WebAssembly, and so on.","flag":"","se":[{"id":"SE-0450","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0450-swiftpm-package-traits.md","title":"Package traits"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"// swift-tools-version: 6.1\nimport PackageDescription\n\nlet package = Package(\n    name: \"Logging\",\n    traits: [\n        .trait(name: \"JSON\", description: \"Log in JSON format\"),\n        .trait(name: \"Embedded\", description: \"Trim features for embedded environments\"),\n        .default(enabledTraits: [\"JSON\"]),       // JSON is on by default\n    ],\n    targets: [\n        .target(name: \"Logging\"),\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"code","lang":"swift","title":"Client side: turn on only the traits you need","code":".package(url: \"https://github.com/example/logging\", from: \"1.0.0\", traits: [\"Embedded\"])","hl":"","check":"none"},{"type":"code","lang":"swift","title":"Inside the package: a trait is a compilation condition","code":"#if JSON\nfunc format(_ message: String) -> String { #\"{\"msg\": \"\\#(message)\"}\"# }\n#else\nfunc format(_ message: String) -> String { message }\n#endif","hl":"","check":"none"}]},{"id":"testing-61","release":"6.1","since":"6.1","title":"Swift Testing: scoping traits and inspectable errors","plainTitle":"Swift Testing: scoping traits and inspectable errors","en":"","line":6,"level":"brief","short":"Test scoping","tags":"Swift Testing TestScoping trait #expect throws error setUp tearDown","tldr":"\u003ccode>#expect(throws:)\u003c/code> and \u003ccode>#require(throws:)\u003c/code> now return the error they caught, so you can inspect it further; custom traits conforming to \u003ccode>TestScoping\u003c/code> can run setup and cleanup logic before and after a test.","flag":"","se":[],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"import Testing\n\nenum LoginError: Error, Equatable {\n    case wrongPassword(attemptsLeft: Int)\n}\n\nfunc login(_ password: String) throws(LoginError) {\n    throw .wrongPassword(attemptsLeft: 2)\n}\n\n@Test func reportsAttemptsLeft() {\n    let error = #expect(throws: LoginError.self) {\n        try login(\"123456\")\n    }\n    #expect(error == .wrongPassword(attemptsLeft: 2))   // the return value is the error itself\n}\n\nstruct MockServer: TestTrait, TestScoping {\n    func provideScope(\n        for test: Test,\n        testCase: Test.Case?,\n        performing function: @Sendable () async throws -> Void\n    ) async throws {\n        print(\"Starting mock server\")\n        try await function()\n        print(\"Stopping mock server\")\n    }\n}\n\nextension Trait where Self == MockServer {\n    static var mockServer: Self { Self() }\n}\n\n@Test(.mockServer) func fetchProfile() async {\n    #expect(true)\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 {testing} main.swift"}}]},{"id":"default-isolation","release":"6.2","since":"6.2","title":"Default isolation to the main actor","plainTitle":"Default isolation to the main actor","en":"","line":1,"level":"core","short":"Default MainActor","tags":"default isolation MainActor main thread single-threaded app script -default-isolation defaultIsolation Approachable Concurrency","tldr":"A compiler setting that infers \u003ccode>@MainActor\u003c/code> by default for everything in the module that doesn't state its isolation. For apps and scripts, most code is naturally single-threaded, so you no longer need to sprinkle \u003ccode>@MainActor\u003c/code> everywhere.","flag":"","se":[{"id":"SE-0466","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0466-control-default-actor-isolation.md","title":"Control default actor isolation inference"}],"links":[],"blocks":[{"type":"p","html":"One pain point of Swift 6 mode is that UI-related types mostly need \u003ccode>@MainActor\u003c/code>, and forgetting one makes errors spread along the call chain. The \u003ccode>ProfilePresenter\u003c/code> below simply forgot its annotation:"},{"type":"code","lang":"swift","title":"No annotation: the compiler doesn't know where the Presenter runs","code":"@MainActor\nfinal class ProfileView {\n    func show(_ text: String) { print(\"Showing:\", text) }\n}\n\nfinal class ProfilePresenter {\n    let view = ProfileView()\n    func present(name: String) {\n        view.show(\"Hello, \\(name)\")\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:9:14: error: call to main actor-isolated instance method 'show' in a synchronous nonisolated context [#ActorIsolatedCall]\n 1 | @MainActor\n 2 | final class ProfileView {\n 3 |     func show(_ text: String) { print(\"Showing:\", text) }\n   |          `- note: calls to instance method 'show' from outside of its actor context are implicitly asynchronous\n 4 | }\n 5 | \n 6 | final class ProfilePresenter {\n 7 |     let view = ProfileView()\n 8 |     func present(name: String) {\n   |          `- note: add '@MainActor' to make instance method 'present(name:)' part of global actor 'MainActor'\n 9 |         view.show(\"Hello, \\(name)\")\n   |              `- error: call to main actor-isolated instance method 'show' in a synchronous nonisolated context [#ActorIsolatedCall]\n10 |     }\n11 | }\n\n[#ActorIsolatedCall]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/actor-isolated-call>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"With -default-isolation MainActor, the same code passes as is","code":"@MainActor\nfinal class ProfileView {\n    func show(_ text: String) { print(\"Showing:\", text) }\n}\n\nfinal class ProfilePresenter {\n    let view = ProfileView()\n    func present(name: String) {\n        view.show(\"Hello, \\(name)\")\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6 -default-isolation MainActor","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -default-isolation MainActor main.swift"}},{"type":"code","lang":"swift","title":"","code":".executableTarget(\n    name: \"MyApp\",\n    swiftSettings: [\n        .defaultIsolation(MainActor.self),\n        .enableUpcomingFeature(\"NonisolatedNonsendingByDefault\"),\n        .enableUpcomingFeature(\"InferIsolatedConformances\"),\n    ]\n)","hl":"","file":"Package.swift","check":"none"},{"type":"list","items":["It only affects declarations that \u003cstrong>don't state an isolation explicitly\u003c/strong>; code that explicitly says \u003ccode>nonisolated\u003c/code>, \u003ccode>@concurrent\u003c/code>, or another actor is untouched.","It suits targets centered on the main flow: apps, command-line tools, and scripts. Libraries that many people reuse usually keep the default \u003ccode>nonisolated\u003c/code>.","New app projects in Xcode 26 turn on \u003cstrong>Default Actor Isolation = MainActor\u003c/strong> and \u003cstrong>Approachable Concurrency\u003c/strong> by default; the latter includes this release's \u003ccode>NonisolatedNonsendingByDefault\u003c/code> and \u003ccode>InferIsolatedConformances\u003c/code>.","When you need background work, mark it explicitly with \u003ca href=\"#f-concurrent\">\u003ccode>@concurrent\u003c/code>\u003c/a>."]},{"type":"quiz","question":"With \u003ccode>-default-isolation MainActor\u003c/code> on, what happens to a function that explicitly says \u003ccode>nonisolated\u003c/code>?","options":["It is changed to \u003ccode>@MainActor\u003c/code> too","It stays \u003ccode>nonisolated\u003c/code>; the default only applies to declarations that don't state an isolation","A compile error: the two conflict"],"answer":1,"explain":"Default isolation is just a “default when you write nothing”. Explicitly written isolation (\u003ccode>nonisolated\u003c/code>, \u003ccode>@concurrent\u003c/code>, \u003ccode>@SomeActor\u003c/code>) always wins."}]},{"id":"nonsending","release":"6.2","since":"6.2","title":"\u003ccode>nonisolated(nonsending)\u003c/code>: async functions stay with their caller by default","plainTitle":"nonisolated(nonsending): async functions stay with their caller by default","en":"","line":1,"level":"core","short":"nonsending","tags":"nonisolated nonsending async caller actor executor global concurrent thread pool hop","tldr":"Until now a \u003ccode>nonisolated\u003c/code> \u003ccode>async\u003c/code> function always jumped to the global concurrent pool, “crossing threads” the moment you called it, which is why \u003ccode>Sendable\u003c/code> errors were everywhere. Now it runs on \u003cstrong>the caller's actor\u003c/strong> by default, matching the intuition you have for synchronous functions.","flag":"NonisolatedNonsendingByDefault","se":[{"id":"SE-0461","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md","title":"Run nonisolated async functions on the caller's actor by default"}],"links":[],"blocks":[{"type":"p","html":"Since Swift 5.7 there has been a confusing rule: an \u003ccode>async\u003c/code> function that belongs to no actor leaves its caller when called and runs on the global concurrent executor (the thread pool). So the perfectly ordinary code below is an error in Swift 6 mode. \u003ccode>Model\u003c/code> is not \u003ccode>Sendable\u003c/code>, and calling \u003ccode>load()\u003c/code> “carries” it to another thread:"},{"type":"code","lang":"swift","title":"Old rule: a nonisolated async function leaves the main actor","code":"final class Model {\n    var items: [String] = []\n    func load() async { items.append(\"new data\") }\n}\n\n@MainActor\nfinal class ViewModel {\n    let model = Model()\n    func refresh() async {\n        await model.load()\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:10:21: error: sending 'self.model' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n 8 |     let model = Model()\n 9 |     func refresh() async {\n10 |         await model.load()\n   |                     |- error: sending 'self.model' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |                     `- note: sending main actor-isolated 'self.model' to @concurrent instance method 'load()' risks causing data races between @concurrent and main actor-isolated uses\n11 |     }\n12 | }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"Look at the wording in the compiler diagnostic: it already calls the old behavior \u003ccode>@concurrent\u003c/code>. With the upcoming feature on, the same code compiles, because \u003ccode>load()\u003c/code> now runs on the main actor and nothing crosses a thread:"},{"type":"code","lang":"swift","title":"With NonisolatedNonsendingByDefault on","code":"final class Model {\n    var items: [String] = []\n    func load() async { items.append(\"new data\") }\n}\n\n@MainActor\nfinal class ViewModel {\n    let model = Model()\n    func refresh() async {\n        await model.load()\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"}},{"type":"p","html":"If you don't want to turn it on for everything, you can spell out the new behavior function by function:"},{"type":"code","lang":"swift","title":"Without the upcoming feature, write nonisolated(nonsending) per function","code":"final class Model {\n    var items: [String] = []\n    nonisolated(nonsending) func load() async { items.append(\"new data\") }\n}\n\n@MainActor\nfinal class ViewModel {\n    let model = Model()\n    func refresh() async {\n        await model.load()\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["Synchronous functions have always “run on the caller's thread”. Now async functions do too, and the mental model of the two is finally unified.","When an \u003ccode>await\u003c/code> suspends, the main thread is still free and isn't “stuck”; it's only the \u003cstrong>synchronous part\u003c/strong> of the function that runs on the caller's actor.","Migration: \u003ccode>swift package migrate --to-feature NonisolatedNonsendingByDefault\u003c/code> automatically adds \u003ccode>@concurrent\u003c/code> to functions that need to keep the old behavior.","See the difference between the two rules animated: the \u003ca href=\"#lab-concurrency\">Concurrency Trace lab\u003c/a>."]},{"type":"quiz","question":"With \u003ccode>NonisolatedNonsendingByDefault\u003c/code> on, you \u003ccode>await\u003c/code> an ordinary \u003ccode>nonisolated async\u003c/code> function from a \u003ccode>@MainActor\u003c/code> method. Where does its synchronous code run?","options":["The global concurrent pool","The main actor, that is, the caller's isolation domain","A newly created thread"],"answer":1,"explain":"nonsending means “don't hand the call to another isolation domain”: the function inherits the caller's isolation. If you want the background, write \u003ccode>@concurrent\u003c/code> explicitly."}]},{"id":"concurrent","release":"6.2","since":"6.2","title":"\u003ccode>@concurrent\u003c/code>: say so explicitly when you want parallelism","plainTitle":"@concurrent: say so explicitly when you want parallelism","en":"","line":1,"level":"core","short":"@concurrent","tags":"concurrent parallel background thread pool expensive decode main thread","tldr":"Want expensive work on the background thread pool? Add \u003ccode>@concurrent\u003c/code> to an \u003ccode>async\u003c/code> function. It always runs on the global concurrent executor and keeps the main actor free.","flag":"","se":[{"id":"SE-0461","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0461-async-function-isolation.md","title":"Run nonisolated async functions on the caller's actor by default"}],"links":[],"blocks":[{"type":"p","html":"The new rule in one sentence: \u003cstrong>stay put by default (nonsending), ask for parallelism explicitly (@concurrent)\u003c/strong>."},{"type":"code","lang":"swift","title":"Hand heavy work like decoding to the background","code":"struct Photo: Sendable {\n    let pixels: [UInt8]\n}\n\nenum PhotoDecoder {\n    @concurrent\n    static func decode(_ data: [UInt8]) async -> Photo {\n        // imagine an expensive decode here\n        Photo(pixels: data.map { 255 - $0 })\n    }\n}\n\n@MainActor\nfinal class PhotoViewModel {\n    var photo: Photo?\n\n    func load(_ data: [UInt8]) async {\n        photo = await PhotoDecoder.decode(data)    // decoding happens in the background; the main thread isn't blocked\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"}},{"type":"p","html":"Since a \u003ccode>@concurrent\u003c/code> function really does switch to another thread, the arguments you pass must be able to cross the isolation boundary safely:"},{"type":"code","lang":"swift","title":"@concurrent crosses an isolation boundary, so arguments must be safe to pass","code":"final class Draft {               // not Sendable\n    var text = \"\"\n}\n\n@concurrent\nfunc save(_ draft: Draft) async {\n    print(draft.text)\n}\n\n@MainActor\nfinal class Editor {\n    let draft = Draft()\n    func autosave() async {\n        await save(draft)\n    }\n}","hl":"","check":"error","flags":"-swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault","result":{"status":"error","diagnostics":"main.swift:14:15: error: sending 'self.draft' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n12 |     let draft = Draft()\n13 |     func autosave() async {\n14 |         await save(draft)\n   |               |- error: sending 'self.draft' risks causing data races [#RegionIsolation::SendingRisksDataRace]\n   |               `- note: sending main actor-isolated 'self.draft' to @concurrent global function 'save' risks causing data races between @concurrent and main actor-isolated uses\n15 |     }\n16 | }\n\n[#RegionIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/region-isolation>\n[#SendingRisksDataRace]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/sending-risks-data-race>","output":"","command":"swiftc -swift-version 6 -enable-upcoming-feature NonisolatedNonsendingByDefault main.swift"}},{"type":"list","items":["\u003ccode>@concurrent\u003c/code> can only be used on \u003ccode>async\u003c/code> functions, and implies \u003ccode>nonisolated\u003c/code>.","Don't mark every function \u003ccode>@concurrent\u003c/code>: switching threads has a cost of its own and brings \u003ccode>Sendable\u003c/code> requirements. Add it only to genuinely expensive computation."]}]},{"id":"isolated-conformances","release":"6.2","since":"6.2","title":"Isolated conformances: main-actor types can conform to ordinary protocols","plainTitle":"Isolated conformances: main-actor types can conform to ordinary protocols","en":"","line":1,"level":"key","short":"Isolated conformances","tags":"isolated conformance protocol Equatable MainActor protocol conform global actor","tldr":"Writing \u003ccode>@MainActor Equatable\u003c/code> means “this conformance is only valid on the main actor”. \u003ccode>@MainActor\u003c/code> types can finally implement ordinary protocols such as \u003ccode>Equatable\u003c/code> and \u003ccode>Hashable\u003c/code>, and the compiler guarantees it won't be called from another thread.","flag":"InferIsolatedConformances","se":[{"id":"SE-0470","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0470-isolated-conformances.md","title":"Global-actor isolated conformances"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Before: a main-actor type implementing Equatable is an error","code":"@MainActor\nfinal class Contact: Equatable {\n    var name = \"\"\n\n    static func == (a: Contact, b: Contact) -> Bool {\n        a.name == b.name\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:2:22: error: conformance of 'Contact' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n1 | @MainActor\n2 | final class Contact: Equatable {\n  |                      |- error: conformance of 'Contact' to protocol 'Equatable' crosses into main actor-isolated code and can cause data races [#ConformanceIsolation]\n  |                      |- note: isolate this conformance to the main actor with '@MainActor'\n  |                      `- note: turn data races into runtime errors with '@preconcurrency'\n3 |     var name = \"\"\n4 | \n5 |     static func == (a: Contact, b: Contact) -> Bool {\n  |                 |- note: main actor-isolated operator function '==' cannot satisfy nonisolated requirement\n  |                 `- note: mark operator function '==' 'nonisolated'\n6 |         a.name == b.name\n7 |     }\n\n[#ConformanceIsolation]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/conformance-isolation>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"Swift 6.2: @MainActor Equatable","code":"@MainActor\nfinal class Contact: @MainActor Equatable {\n    var name = \"\"\n\n    static func == (a: Contact, b: Contact) -> Bool {\n        a.name == b.name\n    }\n}","hl":"2","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"With \u003ccode>InferIsolatedConformances\u003c/code> on, protocol conformances of main-actor types are inferred to be isolated automatically, so you don't even need to write \u003ccode>@MainActor\u003c/code>. The compiler guarantees safety: if you try to use the conformance outside the main actor, you get an error right away."},{"type":"code","lang":"swift","title":"The compiler guarantees an isolated conformance isn't carried to the background","code":"protocol Describable {\n    func describe() -> String\n}\n\n@MainActor\nfinal class Label: @MainActor Describable {\n    var text = \"Hello\"\n    func describe() -> String { text }\n}\n\n@concurrent\nfunc log\u003cT: Describable>(_ value: T) async {\n    print(value.describe())\n}\n\n@MainActor\nfunc run() async {\n    await log(Label())\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:18:11: error: main actor-isolated conformance of 'Label' to 'Describable' cannot be used in @concurrent context [#IsolatedConformances]\n16 | @MainActor\n17 | func run() async {\n18 |     await log(Label())\n   |           `- error: main actor-isolated conformance of 'Label' to 'Describable' cannot be used in @concurrent context [#IsolatedConformances]\n19 | }\n20 | \n\n[#IsolatedConformances]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/isolated-conformances>","output":"","command":"swiftc -swift-version 6 main.swift"}}]},{"id":"task-immediate","release":"6.2","since":"6.2","title":"\u003ccode>Task.immediate\u003c/code>: start running right now, in the current context","plainTitle":"Task.immediate: start running right now, in the current context","en":"","line":1,"level":"key","short":"Task.immediate","tags":"Task immediate synchronous start scheduling order UI event","tldr":"An ordinary \u003ccode>Task { }\u003c/code> just puts the task in a queue to run later. \u003ccode>Task.immediate { }\u003c/code> runs \u003cstrong>immediately\u003c/strong> and synchronously on the current thread, up to the first real suspension point.","flag":"","se":[{"id":"SE-0472","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0472-task-start-synchronously-on-caller-context.md","title":"Starting tasks synchronously from caller context"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"Comparing the execution order","code":"@MainActor\nfunc demo() async {\n    print(\"1. start\")\n    Task {\n        print(\"4. ordinary Task: runs only after the current code yields the main thread\")\n    }\n    Task.immediate {\n        print(\"2. Task.immediate: runs right now, synchronously\")\n    }\n    print(\"3. back in the caller\")\n    try? await Task.sleep(for: .milliseconds(50))\n}\n\nawait demo()","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"1. start\n2. Task.immediate: runs right now, synchronously\n3. back in the caller\n4. ordinary Task: runs only after the current code yields the main thread","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"It suits UI event handling: after a button tap you want to update UI state immediately (say, show a loading indicator) and then go do async work. With an ordinary \u003ccode>Task\u003c/code>, the UI may render one frame of the old state first."}]},{"id":"task-naming","release":"6.2","since":"6.2","title":"Give a task a name","plainTitle":"Give a task a name","en":"","line":1,"level":"brief","short":"Task naming","tags":"Task name debug debugging Instruments LLDB task group","tldr":"When you create a task you can pass \u003ccode>name:\u003c/code>. The name shows up in LLDB, Instruments, and logs, so when debugging concurrent code you finally know “which task is this”.","flag":"","se":[{"id":"SE-0469","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0469-task-names.md","title":"Task Naming"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"let task = Task(name: \"Sync contacts\") {\n    print(\"Current task:\", Task.name ?? \"unnamed\")\n}\nawait task.value\n\nlet names = await withTaskGroup { group in\n    for id in 1...3 {\n        group.addTask(name: \"Download image-\\(id)\") {\n            Task.name ?? \"\"\n        }\n    }\n    var collected: [String] = []\n    for await name in group { collected.append(name) }\n    return collected\n}\nprint(names.sorted())","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"Current task: Sync contacts\n[\"Download image-1\", \"Download image-2\", \"Download image-3\"]","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}}]},{"id":"isolated-deinit","release":"6.2","since":"6.2","title":"\u003ccode>isolated deinit\u003c/code>: run deinitializers on the actor","plainTitle":"isolated deinit: run deinitializers on the actor","en":"","line":1,"level":"brief","short":"isolated deinit","tags":"deinit deinitializer isolated MainActor cleanup","tldr":"The \u003ccode>deinit\u003c/code> of a \u003ccode>@MainActor\u003c/code> class is nonisolated by default and can't call main-actor methods. Write \u003ccode>isolated deinit\u003c/code> and the deinitializer runs on the main actor.","flag":"","se":[{"id":"SE-0371","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0371-isolated-synchronous-deinit.md","title":"Isolated synchronous deinit"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"An ordinary deinit can't call main-actor methods","code":"@MainActor\nfinal class SessionController {\n    func stopTimers() { print(\"Stopping timers\") }\n\n    deinit {\n        stopTimers()\n    }\n}","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:6:9: error: call to main actor-isolated instance method 'stopTimers()' in a synchronous nonisolated context [#ActorIsolatedCall]\n1 | @MainActor\n2 | final class SessionController {\n3 |     func stopTimers() { print(\"Stopping timers\") }\n  |          `- note: calls to instance method 'stopTimers()' from outside of its actor context are implicitly asynchronous\n4 | \n5 |     deinit {\n  |     `- note: add 'isolated' to run isolated to 'MainActor', which may be later than 'nonisolated deinit'\n6 |         stopTimers()\n  |         `- error: call to main actor-isolated instance method 'stopTimers()' in a synchronous nonisolated context [#ActorIsolatedCall]\n7 |     }\n8 | }\n\n[#ActorIsolatedCall]: \u003chttps://docs.swift.org/compiler/documentation/diagnostics/actor-isolated-call>","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"code","lang":"swift","title":"isolated deinit","code":"@MainActor\nfinal class SessionController {\n    func stopTimers() { print(\"Stopping timers\") }\n\n    isolated deinit {\n        stopTimers()\n    }\n}","hl":"","check":"ok","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"p","html":"If the last release of the object happens on another thread, the runtime schedules the deinitializer onto the main actor, so deinitialization may run slightly later."}]},{"id":"inlinearray","release":"6.2","since":"6.2","title":"\u003ccode>InlineArray\u003c/code> and \u003ccode>[N of T]\u003c/code>: fixed-length arrays that stay off the heap","plainTitle":"InlineArray and [N of T]: fixed-length arrays that stay off the heap","en":"","line":2,"level":"core","short":"InlineArray","tags":"InlineArray fixed-size array stack heap allocation performance [N of T]","tldr":"\u003ccode>InlineArray&lt;4, Int&gt;\u003c/code> (shorthand \u003ccode>[4 of Int]\u003c/code>) is an array whose length is written into its type: the elements live inline, on the stack or inside the owning struct, with no heap allocation, no reference counting, and no copy-on-write.","flag":"","se":[{"id":"SE-0453","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0453-vector.md","title":"InlineArray, a fixed-size array"},{"id":"SE-0483","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0483-inline-array-sugar.md","title":"`InlineArray` Type Sugar"}],"links":[],"blocks":[{"type":"p","html":"\u003ccode>Array\u003c/code> itself is just a pointer; the real elements live on the heap, with reference counting and copy-on-write attached. For data whose length is always 4, that overhead is wasteful:"},{"type":"code","lang":"swift","title":"Comparing the memory layout with Array","code":"let dynamic: [Int] = [1, 2, 3, 4]\nlet fixed: [4 of Int] = [1, 2, 3, 4]          // shorthand for InlineArray\u003c4, Int>\n\nprint(MemoryLayout.size(ofValue: dynamic))     // just a pointer to the heap\nprint(MemoryLayout.size(ofValue: fixed))       // four Ints stored in place","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"8\n32","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"code","lang":"swift","title":"Basic usage","code":"var rgb: [3 of UInt8] = [255, 128, 0]\nrgb[1] = 200                                   // elements can be modified\nprint(rgb.count, rgb[1])\n\nlet board = [9 of Character](repeating: \"·\")  // initialize with a repeated value\nprint(board.count)\n\nfor i in rgb.indices {                         // in 6.2 it isn't a Sequence; iterate with indices\n    print(i, rgb[i])\n}","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"3 200\n9\n0 255\n1 200\n2 0","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"The length is part of the type, so you can't \u003ccode>append\u003c/code> or \u003ccode>remove\u003c/code>, and a literal must have exactly the right number of elements:"},{"type":"code","lang":"swift","title":"The number of elements must match the type","code":"let rgb: [3 of UInt8] = [255, 128]","hl":"","check":"error","flags":"-swift-version 6","result":{"status":"error","diagnostics":"main.swift:1:25: error: expected '3' elements in inline array literal, but got '2'\n1 | let rgb: [3 of UInt8] = [255, 128]\n  |                         `- error: expected '3' elements in inline array literal, but got '2'\n2 |","output":"","command":"swiftc -swift-version 6 main.swift"}},{"type":"list","items":["Good for: small fixed buffers, coordinates/colors/matrices, embedded development, and performance hot spots.","Not for: collections whose length changes, or large N (it takes a lot of stack space and is expensive to copy).","When the elements are copyable, \u003ccode>InlineArray\u003c/code> is copyable too, and copying \u003cstrong>really copies every element\u003c/strong>, unlike \u003ccode>Array\u003c/code>'s copy-on-write.","After Swift 6.4 introduced \u003ca href=\"#f-iterable\">\u003ccode>Iterable\u003c/code>\u003c/a>, \u003ccode>InlineArray\u003c/code> can be iterated with \u003ccode>for-in\u003c/code> directly.","See the layout of different element types: the \u003ca href=\"#lab-memory\">Memory Layout lab\u003c/a>."]},{"type":"quiz","question":"What is \u003ccode>MemoryLayout&lt;[5 of Int]&gt;.size\u003c/code> on a 64-bit platform?","options":["8, just a pointer like \u003ccode>Array\u003c/code>","40, all five \u003ccode>Int\u003c/code>s stored inline","48, because it also needs a length field"],"answer":1,"explain":"The length is in the type and needn't be stored at runtime, so an \u003ccode>InlineArray\u003c/code>'s size is just N × the element's stride: 5 × 8 = 40."}]},{"id":"integer-generics","release":"6.2","since":"6.2","title":"Integer generic parameters: \u003ccode>&lt;let N: Int&gt;\u003c/code>","plainTitle":"Integer generic parameters: \u003clet N: Int>","en":"","line":2,"level":"key","short":"Integer generics","tags":"integer generic let N value generics matrix compile-time","tldr":"Generic parameters can be integers as well as types: \u003ccode>struct Matrix&lt;let rows: Int, let columns: Int&gt;\u003c/code>. This is how \u003ccode>InlineArray\u003c/code>'s length parameter is implemented.","flag":"","se":[{"id":"SE-0452","url":"https://github.com/swiftlang/swift-evolution/blob/main/proposals/0452-integer-generic-parameters.md","title":"Integer Generic Parameters"}],"links":[],"blocks":[{"type":"code","lang":"swift","title":"","code":"struct Matrix\u003clet rows: Int, let columns: Int> {\n    var storage: [rows of [columns of Double]]\n\n    init(repeating value: Double) {\n        storage = .init(repeating: .init(repeating: value))\n    }\n\n    var shape: String { \"\\(rows)×\\(columns)\" }    // in code it can be read like a value\n}\n\nlet m = Matrix\u003c2, 3>(repeating: 0)\nprint(m.shape)\nprint(MemoryLayout\u003cMatrix\u003c2, 3>>.size)    // 6 Doubles, all stored inline","hl":"","check":"run","flags":"-swift-version 6","result":{"status":"ok","diagnostics":"","output":"2×3\n48","exit":0,"command":"swiftc -swift-version 6 main.swift && ./main"}},{"type":"p","html":"\u003ccode>Matrix&lt;2, 3&gt;\u003c/code> and \u003ccode>Matrix&lt;3, 2&gt;\u003c/code> are two different types, so “shape mismatch” errors can be caught at compile time. For now an integer generic argument can only be an \u003ccode>Int\u003c/code> literal or another integer generic parameter; computations such as \u003ccode>N + 1\u003c/code> aren't supported yet."}]},{"id":"span","release":"6.2","since":"6.2","title":"\u003ccode>Span\u003c/code>: safe, zero-overhead access to contiguous memory","plainTitle":"Span: safe, zero-overhead access to
